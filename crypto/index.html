<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Crypto — Realm of Outer Gods</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Literata:ital,wght@0,400;1,400&display=swap">
<style>
  :root{--desk:#2b1f24;--paper:#fbf8ef;--ink:#3a2a1c;--soft:#7b6a58;--line:#6a5560;--mark:#b4532a}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--desk);color:var(--paper);font-family:'Literata',Georgia,serif;font-size:17px;line-height:1.5;min-height:100vh;padding:40px 16px 80px}
  .wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
  h1{font-family:'Kalam',cursive;font-weight:700;font-size:clamp(36px,7vw,56px);line-height:1}
  .sub{color:#cdbfb5;font-style:italic;margin-top:6px}
  .grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
  a.card{display:block;text-decoration:none;color:var(--ink);background:var(--paper);border-radius:4px 10px 10px 4px;padding:18px 20px 20px;
    box-shadow:0 8px 24px rgba(0,0,0,.35);border-left:6px solid var(--mark);transition:transform .15s}
  a.card:hover,a.card:focus-visible{transform:translateY(-3px);outline:none}
  a.card b{font-family:'Kalam',cursive;font-size:26px;display:block;line-height:1.1}
  a.card span{color:var(--soft);font-size:15px}
  @media (prefers-reduced-motion:reduce){a.card{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Crypto</h1>
    <p class="sub">Scripts, ciphers, and pages nobody was meant to read. Your DM will send you the codes.</p>
  </header>
  <div class="grid">
    <a class="card" href="scrawlish.html"><b>Scrawlish</b><span>A phonetic hand of twelve marks and a few bars of ink. Open a page your DM sends you and work out the sounds.</span></a>
  </div>
</div>
</body>
</html>
