<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aysu Harika · Wanderer Trained</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;900&family=Spectral:ital,wght@0,300;0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#05090d;--panel:#0d1822;--panel2:#0a141c;--line:#20353f;--line2:#2f4b58;
  --paper:#e8eff3;--dim:#8ba6b3;--dimmer:#5d7884;
  --turq:#3fcad6;--tide:#4fb0d6;--moon:#ecdcae;--wendigo:#cf4763;--shaman:#46c9b0;--copper:#c98a5e;--amber:#e0b24a;
  --ac:#3fcad6;--ac-soft:#3fcad622;--ac-line:#3fcad666;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;background:#05090d;}
body{background:radial-gradient(1100px 560px at 82% -12%,rgba(63,202,214,.10),transparent 60%),radial-gradient(900px 500px at -10% 108%,rgba(79,176,214,.07),transparent 60%),linear-gradient(180deg,#06101a,#040a10 60%),var(--ink);
  color:var(--paper);font-family:'Spectral',Georgia,serif;font-size:16.5px;line-height:1.55;padding:0 0 90px;-webkit-font-smoothing:antialiased;min-height:100vh;}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px;position:relative;z-index:1;}
@media(min-width:1120px){.wrap{margin-left:280px;max-width:1100px;}}
h1,h2,h3,h4,.cz{font-family:'Cinzel',serif;font-weight:600;letter-spacing:.02em;}
.mono{font-family:'IBM Plex Mono',monospace;}
button{font:inherit;}

/* rail */
.rail{position:fixed;left:0;top:0;bottom:0;width:262px;z-index:70;overflow-y:auto;background:linear-gradient(180deg,#0c1822,#070f16);border-right:1px solid var(--line);}
.rail-brand{padding:22px 18px 14px;border-bottom:1px solid var(--line);border-top:3px solid var(--ac);}
.rail-brand .eb{font-family:'Cinzel';font-size:10px;letter-spacing:.3em;color:var(--ac);text-transform:uppercase;}
.rail-brand .nm{font-family:'Cinzel';font-weight:900;font-size:27px;line-height:1.02;margin:8px 0 6px;color:#fff;text-shadow:0 0 28px var(--ac-soft);}
.rail-brand .lv{font-family:'IBM Plex Mono';font-size:10.5px;color:var(--dim);line-height:1.5;}
.rail-search{margin:13px 14px 6px;display:flex;align-items:center;gap:9px;padding:9px 11px;cursor:pointer;background:#0a1620;border:1px solid var(--line);border-radius:9px;color:var(--dim);font-family:'Cinzel';font-size:12.5px;}
.rail-search:hover{border-color:var(--ac);}
.rail-search .kbd{margin-left:auto;font-family:'IBM Plex Mono';font-size:9.5px;color:var(--dimmer);border:1px solid var(--line);padding:1px 4px;border-radius:4px;}
.rail-nav{padding:8px 10px 26px;}
.rail-grp{font-family:'IBM Plex Mono';font-size:9.5px;letter-spacing:.2em;color:var(--dimmer);text-transform:uppercase;margin:14px 8px 6px;}
.rail-btn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 11px;margin-bottom:2px;background:none;border:1px solid transparent;border-radius:8px;color:var(--dim);cursor:pointer;font-family:'Cinzel';font-size:13.5px;font-weight:500;}
.rail-btn .gl{width:7px;height:7px;background:var(--c,var(--ac));flex:none;transform:rotate(45deg);opacity:.55;}
.rail-btn .ct{margin-left:auto;font-family:'IBM Plex Mono';font-size:10px;color:var(--dimmer);}
.rail-btn:hover{color:var(--paper);background:#0e1c27;}
.rail-btn.on{color:#fff;background:#10212d;border-color:var(--line2);}
.rail-btn.on .gl{opacity:1;box-shadow:0 0 9px var(--c,var(--ac));}
@media(max-width:1119px){
  .rail{position:static;width:auto;display:flex;flex-wrap:wrap;gap:6px;padding:12px;border-right:none;border-bottom:1px solid var(--line);}
  .rail-brand{width:100%;padding:4px 6px 12px;border:none;}
  .rail-search{margin:0;flex:1 1 170px;}
  .rail-nav{display:flex;flex-wrap:wrap;gap:5px;padding:6px 0 0;width:100%;}
  .rail-grp{display:none;} .rail-btn{width:auto;padding:7px 12px;font-size:12.5px;border:1px solid var(--line);margin:0;}
}

/* tracker bar */
.bar{position:sticky;top:0;z-index:60;display:flex;gap:10px;flex-wrap:wrap;background:linear-gradient(180deg,rgba(10,22,30,.97),rgba(6,13,19,.97));backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);border:1px solid var(--line);border-top:3px solid var(--ac);border-radius:0 0 14px 14px;padding:12px 14px;margin-bottom:12px;box-shadow:0 14px 30px #000a;transition:border-color .3s;}
.tk{background:linear-gradient(180deg,#0e1b25,#0a151d);border:1px solid var(--line);border-radius:11px;padding:9px 11px;min-width:190px;flex:1 1 200px;}
.tk-h{font-family:'Cinzel';font-size:11px;letter-spacing:.1em;color:var(--ac);display:flex;align-items:center;gap:7px;margin-bottom:7px;text-transform:uppercase;}
.tk-h .d{width:7px;height:7px;background:currentColor;transform:rotate(45deg);flex:none;}
.tk-h .chipx{margin-left:auto;}
.tk .big{width:62px!important;font-size:19px!important;color:#fff;}
.row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.btn{font-family:'Cinzel';min-width:28px;height:28px;border-radius:7px;border:1px solid var(--line);background:#0c1a24;color:var(--paper);font-size:14px;cursor:pointer;line-height:1;padding:0 8px;transition:.14s;}
.btn:hover{border-color:var(--ac);color:#fff;background:#10242f;}
.btn:disabled{opacity:.35;cursor:not-allowed;}
.btn.sm{height:23px;font-size:11px;min-width:24px;padding:0 7px;}
.btn.lg{height:36px;padding:0 15px;font-size:14px;}
.btn.pri{border-color:var(--ac);color:#fff;background:var(--ac-soft);}
.btn.dgr:hover{border-color:var(--wendigo);color:#ffb3ba;}
.cur{font-family:'Cinzel';font-weight:700;font-size:22px;color:#fff;min-width:36px;text-align:center;}
.sl{color:var(--dimmer);}
.num{font-family:'Cinzel';font-weight:600;font-size:15px;width:62px;text-align:center;color:var(--moon);background:#081118;border:1px solid var(--line);border-radius:6px;padding:3px 2px;-moz-appearance:textfield;}
.num.w44{width:46px;} .num.w80{width:80px;}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.meter{height:7px;background:#08121a;border-radius:4px;margin-top:7px;overflow:hidden;border:1px solid #1a2c36;position:relative;}
.meter i{display:block;height:100%;transition:width .3s,background .3s;}
.meter .mk{position:absolute;top:0;bottom:0;width:1px;background:#ffffff40;}
.sub{font-family:'IBM Plex Mono';font-size:10.5px;color:var(--dim);margin-top:6px;}
.bar-tools{display:flex;gap:8px;align-items:center;width:100%;padding-top:6px;border-top:1px solid var(--line);flex-wrap:wrap;}
.bar-tools button{font-family:'IBM Plex Mono';font-size:10.5px;color:var(--dim);background:#0a1620;border:1px solid var(--line);border-radius:6px;padding:5px 9px;cursor:pointer;}
.bar-tools button:hover{color:var(--ac);border-color:var(--ac);}
.savehint{font-family:'IBM Plex Mono';font-size:10px;color:var(--dimmer);margin-left:auto;}
.savehint.flash{color:var(--ac);}
.roundrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;width:100%;padding:8px 2px 2px;border-top:1px solid var(--line);}
.bar.fold .tk{display:none;}
.minibar{display:none;width:100%;gap:14px;flex-wrap:wrap;align-items:center;font-family:'IBM Plex Mono';font-size:12px;color:var(--dim);}
.minibar b{font-family:'Cinzel';font-size:16px;color:#fff;margin-left:5px;}
.bar.fold .minibar{display:flex;}

/* combo strip */
.cbar{position:relative;height:16px;border-radius:9px;background:#08121a;border:1px solid var(--line);overflow:hidden;margin-top:4px;}
.cbar i{display:block;height:100%;border-radius:9px 0 0 9px;transition:width .3s,background .3s,box-shadow .3s;}
.cbar .mk{position:absolute;top:0;bottom:0;width:1px;background:#ffffff26;}
.cnum{font-family:'Cinzel';font-weight:900;font-size:22px;color:#fff;line-height:1;}
.ctier{font-family:'IBM Plex Mono';font-size:10.5px;color:var(--ac);text-transform:uppercase;letter-spacing:.04em;}

/* chips & tags */
.chip{font-family:'IBM Plex Mono';font-size:10.5px;letter-spacing:.04em;border:1px solid var(--line);border-radius:20px;padding:3px 10px;color:var(--dim);background:#0a1620;display:inline-block;white-space:nowrap;}
button.chip{cursor:pointer;}
button.chip:hover{border-color:var(--ac);color:var(--paper);}
.chip.on{color:#fff;border-color:var(--ac);background:var(--ac-soft);}
.chip.ok{color:#bff3ea;border-color:var(--shaman);background:#46c9b01c;}
.chip.warn{color:#ffe0a0;border-color:var(--amber);background:#e0b24a1c;}
.chip.bad{color:#ffb3ba;border-color:var(--wendigo);background:#cf476322;}
.chip.moon{color:#1a1408;border-color:var(--moon);background:var(--moon);}
.chip .x{opacity:.6;margin-left:4px;}
.tag{font-family:'IBM Plex Mono';font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ac);border:1px solid var(--ac-line);border-radius:4px;padding:1px 6px;font-weight:400;white-space:nowrap;}
.tag.gold{color:var(--moon);border-color:#ecdcae55;} .tag.blood{color:#ff9aa4;border-color:#cf476366;} .tag.veil{color:var(--shaman);border-color:#46c9b055;}
.k-attack{color:#ff9aa4!important;border-color:#cf476366!important;}
.k-action{color:#f2d58a!important;border-color:#ecdcae66!important;}
.k-bonus{color:#9fe8dc!important;border-color:#46c9b066!important;}
.k-reaction{color:#9fd6f2!important;border-color:#4fb0d666!important;}
.k-free{color:#cfe6b0!important;border-color:#9fbf7866!important;}
.k-passive{color:var(--dim)!important;border-color:var(--line2)!important;}
.amber{color:var(--amber);}

/* panes */
.pane{display:none;} .pane.on{display:block;}
.pane-head{padding:22px 0 2px;}
.pane-head .eb{font-family:'Cinzel';font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--ac);}
.pane-head h1{font-family:'Cinzel';font-weight:900;font-size:clamp(28px,5.5vw,42px);color:#fff;line-height:1.05;margin-top:6px;}
.pane-head .bl{color:var(--dim);font-size:15.5px;max-width:68ch;margin-top:7px;}
.jump{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 0;}
.jump button{font-family:'IBM Plex Mono';font-size:10.5px;color:var(--dim);background:#0a1620;border:1px solid var(--line);border-radius:20px;padding:4px 11px;cursor:pointer;}
.jump button:hover{color:#fff;border-color:var(--ac);}
section{margin:26px 0;scroll-margin-top:190px;}
section>h2{font-size:21px;color:#fff;display:flex;align-items:baseline;gap:11px;margin-bottom:6px;flex-wrap:wrap;}
section>h2::before{content:"";width:9px;height:9px;transform:rotate(45deg) translateY(-2px);background:var(--ac);box-shadow:0 0 10px var(--ac);flex:none;align-self:center;}
section>h2 .sub2{font-family:'IBM Plex Mono';font-size:10.5px;letter-spacing:.12em;color:var(--dimmer);text-transform:uppercase;}
.note{color:var(--dim);font-size:14.5px;max-width:74ch;margin-top:8px;}
.flag{border-left:3px solid var(--amber);background:#221a08aa;padding:10px 14px;margin:12px 0;border-radius:0 8px 8px 0;font-size:14.5px;}
.flag b{font-family:'Cinzel';color:var(--amber);font-weight:600;}
.card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin:10px 0;}
.card h3{font-size:16.5px;color:#fff;margin-bottom:3px;display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;}
.card p{font-size:15px;} .card p+p{margin-top:6px;}
@media(max-width:700px){.bar{position:relative;}.tk{flex:1 1 100%;}}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(268px,1fr));gap:10px;}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;}
table{width:100%;border-collapse:collapse;margin:10px 0;font-size:14.5px;}
th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:top;}
th{font-family:'Cinzel';font-weight:600;font-size:11.5px;letter-spacing:.07em;color:var(--ac);}
td.n,th.n{font-family:'IBM Plex Mono';font-size:12.5px;white-space:nowrap;}
tr.hl td{background:var(--ac-soft);}
tr.past td{color:var(--dim);}
ul{margin:8px 0 8px 20px;} li{margin-bottom:4px;}
input[type=text],textarea,select.sel{font-family:'Spectral';background:#081118;border:1px solid var(--line);color:var(--paper);border-radius:7px;padding:6px 9px;font-size:15px;}
input[type=text]{width:100%;}
select.sel{font-family:'Cinzel';font-size:13px;padding:5px 7px;}
textarea{width:100%;min-height:100px;resize:vertical;line-height:1.55;}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--ac);}
.empty{color:var(--dimmer);font-style:italic;font-size:14.5px;padding:8px 0;}
.lbl{font-family:'IBM Plex Mono';font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dimmer);display:block;margin-bottom:3px;}
.fld{display:flex;flex-direction:column;min-width:0;}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px;align-items:end;}
.form .wide{grid-column:1/-1;}

/* consoles (stance, combo) */
.tx{border:1px solid var(--line);border-top:3px solid var(--ac);border-radius:14px;padding:16px;background:linear-gradient(180deg,#0c1a24,#081119);}
.tx-top{display:flex;gap:14px;flex-wrap:wrap;align-items:center;justify-content:space-between;}
.tx-name{font-family:'Cinzel';font-weight:900;font-size:26px;color:var(--ac);line-height:1;}
.tx-sub{font-family:'IBM Plex Mono';font-size:11px;color:var(--dim);letter-spacing:.06em;margin-top:5px;}
.modes{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
.mode{flex:1 1 150px;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#0a1620;cursor:pointer;text-align:left;color:var(--paper);}
.mode .mn{font-family:'Cinzel';font-weight:700;font-size:15px;color:var(--fc);}
.mode .mi{font-family:'IBM Plex Mono';font-size:10px;color:var(--dim);}
.mode:hover{border-color:var(--fc);}
.mode.on{border-color:var(--fc);box-shadow:inset 0 0 0 1px var(--fc),0 0 22px -8px var(--fc);background:#0e1d28;}
.ladder{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:12px;}
.lad{background:#0a141c;display:grid;grid-template-columns:62px 1fr;gap:12px;padding:8px 12px;align-items:baseline;}
.lad .nm{font-family:'Cinzel';font-weight:900;font-size:17px;color:var(--dimmer);}
.lad .tx2{font-size:14.5px;color:var(--dim);}
.lad.done .nm{color:var(--ac);} .lad.done .tx2{color:var(--paper);}
.lad.now{background:linear-gradient(90deg,var(--ac-soft),#0a141c);}
.lad.now .nm{color:#fff;text-shadow:0 0 12px var(--ac);}
.pending{border:2px solid var(--amber);border-radius:12px;padding:12px 14px;margin-top:12px;background:#221a08;}
.pending h3{color:var(--amber);font-size:16px;}
.bar .pending{padding:7px 12px;margin-top:4px!important;border-width:1px;}
.bar .pending h3{font-size:13.5px;}
.bar .pending .note{font-size:13px;}
.bar .pending .row{margin-top:5px!important;}
.log{font-family:'IBM Plex Mono';font-size:11px;color:var(--dim);margin-top:10px;max-height:130px;overflow-y:auto;}
.log div{padding:2px 0;border-bottom:1px dotted #1a2c36;}

/* resources, pips */
.res{background:#0a1620;border:1px solid var(--line);border-radius:10px;padding:9px 11px;}
.res .rn{font-family:'Cinzel';font-size:13px;color:#fff;display:flex;gap:6px;align-items:baseline;}
.res .rn small{font-family:'IBM Plex Mono';font-size:10px;color:var(--dimmer);margin-left:auto;text-align:right;}
.pips{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-top:6px;}
.pip{width:21px;height:21px;border-radius:6px;border:1.5px solid var(--line2);background:#081118;cursor:pointer;padding:0;}
.pip.live{background:var(--ac);border-color:var(--ac);box-shadow:0 0 8px var(--ac-line);}
.pip.red.live{background:var(--wendigo);border-color:var(--wendigo);box-shadow:0 0 8px #cf476366;}
.pip.moon.live{background:var(--moon);border-color:var(--moon);box-shadow:0 0 8px #ecdcae55;}

/* loadout */
.loadout{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;}
.lo-col{background:#0a141c;border:1px solid var(--line);border-radius:11px;padding:9px 10px;}
.lo-col h4{font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px;}
.lo-col details{border-bottom:1px dotted #1a2c36;padding:4px 0;}
.lo-col summary{cursor:pointer;font-size:14.5px;list-style:none;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;}
.lo-col summary::-webkit-details-marker{display:none;}
.lo-col details p{font-size:13.5px;color:var(--dim);margin:4px 0 2px;}

/* kit cards (collapsible) */
details.kc{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-left:3px solid var(--kc,var(--line2));border-radius:11px;margin:8px 0;}
details.kc>summary{list-style:none;cursor:pointer;padding:10px 13px;display:flex;flex-wrap:wrap;gap:7px;align-items:center;}
details.kc>summary::-webkit-details-marker{display:none;}
details.kc .kn{font-family:'Cinzel';font-weight:600;font-size:15.5px;color:#fff;}
details.kc .lead{flex:1 1 100%;font-size:13.5px;color:var(--dim);line-height:1.4;}
details.kc[open] .lead{display:none;}
details.kc .kb{padding:0 13px 12px;font-size:14.5px;}
details.kc .kb p+p{margin-top:6px;}
details.kc .kb ul{margin:6px 0 4px 18px;font-size:14px;}
details.kc .acts{margin-left:auto;display:flex;gap:5px;align-items:center;}
details.kc:hover{border-color:var(--line2);}
details.kc.lock{opacity:.55;}
.star{width:26px;height:26px;border-radius:6px;border:1px solid var(--line);background:#081118;color:var(--dimmer);cursor:pointer;padding:0;}
.star.on{color:var(--moon);border-color:var(--moon);background:#ecdcae18;}

/* stats & skills */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:9px;margin:10px 0;}
.stat{background:#0a1620;border:1px solid var(--line);border-radius:10px;padding:9px;text-align:center;position:relative;}
.stat.chg{border-color:var(--ac);box-shadow:0 0 14px var(--ac-soft);}
.stat .lb{font-family:'IBM Plex Mono';font-size:10px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;}
.stat .mo{font-family:'Cinzel';font-size:27px;font-weight:700;color:#fff;line-height:1.1;}
.stat.chg .mo{color:var(--ac);}
.stat .sc{font-family:'IBM Plex Mono';font-size:11px;color:var(--moon);}
.stat .sv{font-family:'IBM Plex Mono';font-size:10.5px;color:var(--dim);margin-top:5px;}
.vitals{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:9px;margin:10px 0;}
.vit{background:#0a1620;border:1px solid var(--line);border-radius:10px;padding:9px;text-align:center;}
.vit .lb{font-family:'IBM Plex Mono';font-size:9.5px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase;}
.vit .v{font-family:'Cinzel';font-size:22px;font-weight:700;color:#fff;}
.vit .s{font-family:'IBM Plex Mono';font-size:9.5px;color:var(--dimmer);}
.vit.hi{border-color:var(--ac-line);} .vit.hi .v{color:var(--ac);}
.skl{display:grid;grid-template-columns:repeat(auto-fit,minmax(238px,1fr));gap:1px 16px;}
.sk{display:flex;align-items:center;gap:9px;padding:5px 2px;border-bottom:1px solid #12212b;font-size:14.5px;}
.sk .pp{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--line2);background:#081118;cursor:pointer;flex:none;font-family:'IBM Plex Mono';font-size:8.5px;color:var(--ink);text-align:center;line-height:12px;padding:0;}
.sk .pp.p{background:var(--ac);border-color:var(--ac);} .sk .pp.e{background:var(--moon);border-color:var(--moon);}
.sk .nm{flex:1;} .sk .ab{font-family:'IBM Plex Mono';font-size:10px;color:var(--dimmer);}
.sk .vl{font-family:'Cinzel';font-size:16px;color:#fff;min-width:38px;text-align:right;}

/* targets */
.tg{display:grid;grid-template-columns:minmax(130px,1.3fr) minmax(170px,1.6fr) auto;gap:10px;align-items:center;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:#0a141c;margin-top:7px;}
.tg.sel{border-color:var(--ac);box-shadow:inset 0 0 0 1px var(--ac);}
.tg.down{opacity:.5;}
.tg .tn{font-family:'Cinzel';font-size:15px;color:#fff;cursor:pointer;}

.pal{position:fixed;top:10vh;left:50%;transform:translateX(-50%);width:min(640px,94vw);z-index:91;display:none;background:#0c1822;border:1px solid var(--line2);border-radius:14px;box-shadow:0 30px 70px #000c;overflow:hidden;}

:focus-visible{outline:2px solid var(--ac);outline-offset:2px;}

/* ---------- kit helper: A(name, kind, cost, text, extra) ---------- */
(function(){var K=window.CHAR.kit;
function S(id,title,pane,sub,opts){var s={id:id,title:title,pane:pane,sub:sub||"",items:[]};for(var k in (opts||{}))s[k]=opts[k];K.push(s);return s;}
function A(sec,n,k,cost,text,x){var a={n:n,k:k,cost:cost||"",text:text};for(var q in (x||{}))a[q]=x[q];sec.items.push(a);return a;}
var s;

/* ===== TECHNIQUES ===== */
s=S("found","Foundation","tech","always on · the frame everything hangs on");
A(s,"Wanderer's Sight","passive","",`<p>Aysu sees through magical darkness (60 ft), the ethereal realm (10 ft), and regular darkness (120 ft). He sees the flow of Ki in living creatures, including their vital points. Hits to vital points create Ki explosions: nearby enemies take damage equal to twice his Martial Arts die. He may use Wisdom in place of Charisma for any check.</p><ul><li><b>Sub Zero.</b> Aysu may freely convert any of his damage to cold damage as a free action, before any damage roll resolves.</li><li><b>The River's Course.</b> Aysu senses any creature within 120 ft that spends Ki, mana, spell slots, or comparable mystic resources. He knows their direction, approximate power, and the moment they spend. Ignores walls and elevation. Blocked by antimagic, sanctified ground, and the Hollow status.</li></ul>`);
A(s,"Environmental Mastery","passive","",`<p>The battlefield is his weapon. Improvised attacks utilize his monk weapons and gain advantage. Stunning an enemy with the environment creates a 20 ft shockwave: enemies in it lose a reaction for the round, and their reactions are made with disadvantage. The DM tells him what is interactive on request.</p><p>Aysu may pick up weapons from the environment as if he were proficient in them. Weapons gained get a boost equal to his Dexterity and utilize any of his monk weapons (Fist, Knee, Elbow, Kick). Weapons will have random modifiers on them. (Example: Aysu picks up a frying pan; it will burn the target.)</p>`);
A(s,"Mist Form","free","Free action",`<p>Aysu may turn to mist as a free action. Flight equal to movement, advantage on Stealth, may pass through small openings, and damage taken is halved. He cannot attack while in mist.</p><ul><li><b>Smoke Step.</b> While in Mist Form, Aysu may reform adjacent to any creature within his movement as part of his next attack. The reforming strike counts as a weapon switch for Ripping Rapids.</li></ul>`,{fx:{name:"Mist Form",rounds:0,note:"damage taken halved · cannot attack"}});
A(s,"Vanishing Smoke","free","3 Ki · 1/round",`<p>Once per round, spend 3 Ki to vanish entirely until the start of his next turn. He cannot be targeted, repositions up to 30 ft, and his next strike on reappearing is a guaranteed critical hit and counts as a weapon switch. The combo meter does not drop while he is vanished.</p>`,{pay:{ki:3},fx:{name:"Vanished",rounds:1,note:"next strike on reappearing: guaranteed crit + switch"}});
A(s,"The Edge of Pain","passive","auto in calculator",`<p>He is dangerous when he is hurt, when he is precise, and when he has just killed something.</p><ul><li>His bludgeoning, piercing, and slashing damage ignores Resistance.</li><li>On a natural 20, deal additional damage equal to his highest ability score modifier.</li><li>For every 20% HP missing, his damage increases by 25% (max +125%). Resets on any healing.</li><li>On a kill, his next attack deals 1.75x damage and he gains 1.5x movement until the start of his next turn.</li></ul>`);
A(s,"Wandering Fist","reaction","Reaction",`<p>When two or more hostiles team-attack Aysu, they suffer disadvantage on the rolls. If they miss, Aysu may use a reaction to strike both, triggering <b>Winter Solstice</b> on the first hit: the target is thrown back at twice the knockback distance, and Aysu may follow at 1.8x damage and use two maneuvers in the follow-up, immune to opportunity attacks during the dash.</p>`);
A(s,"Forgotten Text","free","3 Ki",`<p>Spend 3 Ki on any attack to make it Undodgeable, Unparryable, or Unblockable (choose one).</p>`,{pay:{ki:3}});
A(s,"Prideful","passive","",`<p>Aysu can never be forced into an Athletics check by any source, under any circumstance. Whenever a feature, effect, creature, or environment would require him to make or contest an Athletics check, he uses <b>Acrobatics</b> instead. This is absolute.</p>`);
A(s,"Three-Step Resonance","passive","tracked on Turn",`<p>If Aysu has used at least one ability from each of his three stances in a single encounter, he becomes <b>Resonant</b>. While Resonant: +2 to all Wisdom saves and checks; once per round, shifting stance does not reset his Combo Meter; and at the start of each of his turns he regains 1 Ki. Resonance ends at 0 HP or on a long rest. Praxis auto-grants Resonance on activation.</p>`);
A(s,"Student of Two Masters","passive","",`<p>When Aysu observes a creature use a distinctive technique, maneuver, spell, or ability (DM's ruling), he may attempt to learn it. At the end of the encounter, he makes a Wisdom check (DC 10 plus the technique's level or tier). On success, he may emulate that technique once per long rest at half its normal effect or duration.</p>`);

s=S("rapids","Ripping Rapids","tech","the combo engine · full console on the Combo tab");
A(s,"Frustration Save · Animation Cancel","free","1 Frustration · 1/round",`<p>When the Combo Meter would drop for any reason, Aysu may spend 1 Frustration as a free reaction to keep it. Once per round.</p>`,{pay:{fr:1}});
A(s,"Erosion","passive","auto from targets",`<p>When Aysu hits the same target twice in a row with monk weapons, that target loses 1 AC. Improves at intervals 10 and 36 (to 2 AC, then 3 AC per pair).</p>`);
A(s,"Final Wave","free","when Beatdown ends",`<p>When Beatdown ends, Aysu may immediately make one final attack at advantage against any target within 30 ft, using his choice of monk weapon. If it hits, it counts as a Critical Takedown regardless of the target's current state.</p>`);

s=S("ki","Ki Investments","tech","each spend creates a route");
A(s,"Surging Step","bonus","3 Ki · Bonus Action",`<p>Dash 15 ft without provoking. +2 Combo Meter. If ending adjacent to a target, +2 again.</p>`,{pay:{ki:3},combo:2});
A(s,"Combo Acceleration","free","4 Ki · 1/round",`<p>+3 Combo Meter immediately. This counts as a weapon switch for the next attack: the next hit gains the +2 switch bonus on top of its hit bonus, regardless of weapon used.</p>`,{pay:{ki:4},combo:3,armSwitch:true});
A(s,"Reroute","reaction","4 Ki · Reaction",`<p>When Aysu misses or his chain breaks, the missed attack does not count toward breaking the combo, and his next attack this round has advantage. Stacks with the Frustration Save.</p>`,{pay:{ki:4},unmiss:true});
A(s,"Tidalbreaker (Kick)","attack","5 Ki · replaces an attack",`<p>Ki-Infused Strike: also triggers its weapon's Trait Infusion regardless of current meter. Blocking enemies are knocked Prone. Knockback +30 ft. Momentum +3 stages. No Vulnerable on miss. Environmental damage doubled. −5 AC on hit or miss.</p>`,{ov:{limb:"kick",ki:5,kis:true,inf:true}});
A(s,"Wavecrash (Fist)","attack","5 Ki · replaces an attack",`<p>Ki-Infused Strike. Unblockable. Weakens special-and-below enemies. Weakened targets take +20% from attacks and takedowns.</p>`,{ov:{limb:"fist",ki:5,kis:true,inf:true}});
A(s,"Wildhunt (Elbow)","attack","5 Ki · replaces an attack",`<p>Ki-Infused Strike. Undodgeable and Unparryable. −2 to target's Dynamic Reactions on hit. On crit, target auto-fails next dodge.</p>`,{ov:{limb:"elbow",ki:5,kis:true,inf:true}});
A(s,"Sundering Knee (Knee)","attack","5 Ki · replaces an attack",`<p>Ki-Infused Strike. Removes 1 Dynamic Reaction on hit. Target cannot use disable-reactions for 1 round. On crit, all Dynamic Reactions are disabled.</p>`,{ov:{limb:"knee",ki:5,kis:true,inf:true}});
A(s,"Ironbloom (Any)","attack","5 Ki · replaces an attack",`<p>Ki-Infused Strike. Against bleeding, broken, or eroded targets: +2 damage die, 50% chance to disarm or disable (DM coin flip).</p>`,{ov:{ki:5,kis:true,inf:true,iron:true}});
A(s,"Rising Tide","free","Ki spend modifier · calculator on Monk tab",`<p><i>"The first wave is just to wake them up."</i></p><p>When Aysu spends Ki on a base Monk feature (Flurry of Blows, Patient Defense, Step of the Wind, Stunning Strike, or any Ki-Infused Strike), he may chain additional spends to extend it. Each extension grants another instance of the feature's primary effect. The cost doubles each time (1, then 2, 4, 8, 16; or 4, then 8, 16 for a base-4 strike). All Ki is declared and paid before the feature resolves. A single feature may be extended a number of times equal to proficiency bonus. He cannot run two cascades at once.</p><ul><li><b>Flurry of Blows.</b> Each extension grants 2 additional unarmed strikes in the same bonus action, each feeding Ripping Rapids and Erosion normally.</li><li><b>Patient Defense.</b> 1st: resistance to nonmagical damage. 2nd: resistance to magical damage. 3rd: advantage on Dexterity saves. 4th and beyond: he has stopped fighting and started being a wall.</li><li><b>Step of the Wind.</b> Each extension adds 15 ft of movement and ignores one movement-impairing effect of his choice.</li><li><b>Stunning Strike.</b> Each extension grants another Stunning Strike attempt during the same attack action, each save rolled separately.</li><li><b>Ki-Infused Strikes.</b> Each extension reapplies the secondary effect, splashes it to a creature within 5 ft, or triggers the crit-only clause once per cascade.</li></ul>`);
A(s,"Filter","reaction","7 Ki · Reaction, 1/round",`<p>Removes all eligible debuffs from Aysu. His next successful strike applies the cleansed effects to the target with original DCs and durations intact. If he fails to hit before the end of his next turn, the effects dissipate and he gains 1 Frustration.</p>`,{pay:{ki:7}});
A(s,"Echo of the Hunter","free","Free · uses = PB per long rest",`<p>Mark a creature. After 3 consecutive hits on the marked creature, gain Foe Insight. Choose one:</p><ul><li><b>Predict Reaction.</b> Aysu knows their next Dynamic Reaction.</li><li><b>Exploit Form.</b> His next strike reduces their movement by 10 ft.</li><li><b>Ki Theft.</b> Aysu regains 1 Ki as he disrupts their rhythm.</li><li><b>Flow Breaker.</b> His next takedown deals +10% damage.</li></ul>`,{pay:{echo:1},mark:"mark"});

s=S("tank","Tankbreaker Toolkit","tech","when the health bar is the wall");
A(s,"Damage Style Toggle · Vital Damage","free","Free · in calculator",`<p>When Aysu would deal damage, he may choose between <b>Regular Damage</b> (his rolled total) or <b>Vital Damage</b>: 12% of the target's maximum HP, ignoring Resistance. On a critical hit, 18%. On an Erosion Broken or Weakened target, 20%.</p><p>Vital Damage cannot be used twice on the same target in the same round. It does not trigger Weapon Trait Infusions unless Aysu also spends 1 Ki. He may compare and take the higher. At Overflow combo tiers (50 and above) Vital Damage may be used more than once per round on the same target, and its floor climbs.</p>`);
A(s,"Deep Freeze","attack","5 Ki · replaces an attack",`<p>Constitution save against his Monk DC. On failure, the target is Frozen Solid: Restrained, Incapacitated, and unable to take reactions until the end of their next turn. The next attack that hits a Frozen Solid target shatters the ice: the attack is an automatic critical hit, and it deals additional Vital Damage equal to 15% of the target's maximum HP, ignoring Resistance and Immunity. Large and larger creatures, and bosses, save at advantage but take the shatter all the same if they fall.</p>`,{pay:{ki:5},status:"frozen"});
A(s,"Krushing Blow","passive","calculator chip",`<p>When Aysu meets any of these, his next hit is a Krushing Blow: an automatic critical hit dealing maximized weapon dice plus his Vital Damage value as bonus true damage. Once per condition per target per encounter.</p><ul><li>The target has taken Erosion to −6 AC or lower from Aysu.</li><li>The target is Frozen Solid, Erosion Broken, or has been Weakened twice.</li><li>Aysu strikes a target that has not yet acted in the encounter (a true first strike).</li><li>Aysu lands a hit while below 25% of his own HP.</li></ul>`);
A(s,"Obliteration Technique","action","4 Ki · Action",`<p>Against a creature at or below 25% of its maximum HP. The target makes a Constitution save against his Monk DC. On failure, a grunt or special-tier enemy is destroyed outright; a boss-tier enemy instead takes Vital Damage equal to 25% of its maximum HP and is Stunned for one round. On success, the target still takes a full Ki-Infused Strike of Aysu's choice.</p>`,{pay:{ki:4}});
A(s,"Fatal Blow","free","1/encounter · ≤ 30% HP",`<p><i>"You let me get this low. That was the mistake."</i></p><p>Once per encounter, while at or below 30% of his maximum HP, Aysu may unleash a Fatal Blow as part of his Attack action. He makes a single strike that cannot be dodged, parried, or blocked. It deals quadruple weapon dice plus his highest ability modifier, ignores Resistance and Immunity, and adds Vital Damage equal to 20% of the target's maximum HP. If this strike reduces the target below 25% HP, it chains immediately into a free Obliteration Technique at no Ki cost.</p>`,{pay:{fatal:1}});

s=S("sig","Signature Techniques","tech","the named moves");
A(s,"Shinobi's Opening","free","Ninja tool · free Beatdown on fail",`<p>When Aysu lands a ninja tool and the target fails the tool's save, he may immediately perform a free Beatdown against that single creature (as Combo Meter 36 Beatdown, locked to the one pinned target). The first interruption each Beatdown is answered with a free reaction strike that pushes the interrupter 15 ft; later ones cost a Reaction. Once per round.</p>`);
A(s,"Vault","free","Part of movement · Acrobatics",`<p>As part of his movement, Aysu may vault over a Large or smaller creature with an Acrobatics check against the creature's Athletics or Acrobatics. On a success, he lands behind them without provoking; his next strike this turn is a Crossup, counting toward Erosion and the Krushing Blow first-strike condition. On a failure, his movement ends in front of the creature, but he does not fall Prone.</p>`);
A(s,"Izuna Drop","action","4 Ki · Action · airborne or grappled target",`<p>The target takes 6d12 plus his Dexterity modifier bludgeoning, lands Prone, and is Stunned until the end of their next turn (Constitution save against his Monk DC to reduce the stun to Dazed). The impact creates a 10 ft shockwave dealing half damage to nearby enemies.</p>`,{pay:{ki:4},dmg:"6d12+DEX",t:"bludgeoning",limb:"special:izuna"});
A(s,"Flying Swallow","action","3 Ki · Action · from height or Mist Form",`<p>From elevation, mist, or any airborne state, Aysu dives up to 40 ft to a target. Creatures that have already spent their reaction cannot react to it. On hit: 4d10 plus Dexterity slashing, Prone, and he may continue his combo from the landing point. Counts as a weapon switch. On a Krushing Blow condition, it passes through and strikes a second enemy behind them.</p>`,{pay:{ki:3},dmg:"4d10+DEX",t:"slashing",limb:"special:swallow"});
A(s,"Ultimate Technique","action","Charge · movement + bonus action",`<p>He spends his movement and bonus action to Charge. If he is not hit before his next turn, his next Attack action becomes an Ultimate Technique: 8d12 plus twice his highest modifier, ignoring Resistance, that cannot be dodged or blocked. With Combo Meter 25+ while Charging, it hits every enemy within 15 ft. Getting hit cancels it (the Frustration Save preserves his meter).</p>`,{dmg:"8d12",hm:2,t:"force",limb:"special:ultimate",fx:{name:"Charging Ultimate",rounds:1,note:"cancelled if hit"}});
A(s,"Fear Takedown","action","Combo 30+ · 1/encounter",`<p>Aysu strikes up to five enemies in a single uninterrupted sequence: one attack at advantage against each dealing 5d10 force; grunts are taken down outright, special-tier enemies are knocked Prone and lose their next reaction. Resets the Combo Meter to 15 when it concludes.</p>`,{pay:{fear:1},dmg:"5d10",t:"force",limb:"special:fear",req:"combo 30",comboSet:15});
A(s,"Moonlock Slam","reaction","2 Ki reaction · or 1 Ki special",`<p>Reactive: when a flying enemy enters 15 ft, spend 2 Ki as a reaction to drag them down. Special: after an air combo takedown, spend 1 Ki to finish with the slam. The creature is bound, takes 2d6 plus Dexterity damage (scaled by momentum and height), and Aysu gains 2 additional attacks against them on his next turn.</p>`,{pay:{ki:2},dmg:"2d6+DEX",t:"bludgeoning",limb:"special:moonlock"});

s=S("special","Special Moves","tech","replace one attack · +3× highest mod · count as a weapon switch",{blurb:"Each replaces one attack, builds Ripping Rapids on hit (+1 hit, +2 switch), and deals bonus damage equal to three times his highest ability modifier. VULNERABLE moves leave him open until his next turn if they miss; Tidefall Anchor converts the whiff. In the calculator, pick the limb first, then the move."});
function SM(n,cost,text,x){x=x||{};x.ov=x.ov||{sm:true};if(x.ki)x.ov.ki=x.ki;if(x.ki)x.pay={ki:x.ki};return A(s,n,"attack",cost,text,x);}
SM("Rising Fang","Launcher · Vulnerable",`<p>A rising elbow-into-fist that throws the target 15 ft into the air, Airborne until the start of his next turn. Aysu cannot be struck by reactions during the rise. Against an airborne or charging target this strike has advantage and +1 die. The opener for every air route: Flying Swallow, Moonlock Slam, Izuna Drop.</p>`,{vuln:true,status:"air"});
SM("Tidal Spin","Multi-hit · Vulnerable",`<p>A spinning kick striking every creature within 5 ft, a separate hit against each, each building the meter on its own; the spin counts as one weapon switch. He may slide 10 ft through enemy spaces without provoking.</p>`,{vuln:true});
SM("Flash Knee","Double anti-air · Vulnerable",`<p>A snapping upward knee that connects twice and counts as two hits for Ripping Rapids. If the first lands, the second is automatic. A Medium or smaller target is knocked 10 ft up.</p>`,{vuln:true,hits:2});
SM("Low Tide Sweep","Low · Vulnerable",`<p>A sweeping low kick that cannot be blocked high or turned by a standing guard. Dexterity save or the target is knocked Prone, open to a launcher or a takedown.</p>`,{vuln:true});
SM("Wind God Step","Crossup · Vulnerable",`<p>A dashing strike that passes through the target to the space behind. On hit it is a Crossup: the Checkmate positional bonus applies, it counts as a weapon switch, and it satisfies the Krushing Blow first-strike condition. No opportunity attacks.</p>`,{vuln:true});
SM("Mikiri Heel","Counter",`<p>Usable only when the target commits to a thrust, lunge, charge, or telegraphed forward strike this round. The strike auto-hits, cancels the target's telegraphed attack outright, and Staggers them (they lose their next reaction).</p>`);
SM("Buster Palm","Wall-bounce · Vulnerable",`<p>A point-blank palm hurls the target 20 ft. On collision with terrain they wall-bounce back into his reach, Prone. With no wall, they land Prone at the end of the knockback.</p>`,{vuln:true});
SM("Demon's Descent","Reposition · Vulnerable",`<p>A hopping vault that lands Aysu adjacent to any target within 20 ft. The landing strike counts as airborne (enabling Flying Swallow and air finishers); on landing he may strike, sweep to Prone, or throw for 5 ft.</p>`,{vuln:true});
SM("Tremor Stomp","Mass juggle · Vulnerable",`<p>A two-fisted slam: every grounded enemy within 10 ft is jolted 5 ft into the air and Staggered (Dexterity save negates the lift).</p>`,{vuln:true});
SM("Gatling Rhythm","Double hit",`<p>Two rapid strikes with different limbs inside one attack's window. If the first hits, the second is guaranteed; each counts as its own hit and the pair counts as a weapon switch.</p>`,{hits:2});
SM("Spirit Lariat","Carry · Vulnerable",`<p>A running forearm that bowls a Medium or smaller enemy up to 15 ft along his path. Collisions deal two Martial Arts dice to both. He may stop adjacent to a new target to continue the chain.</p>`,{vuln:true});
SM("New Moon Cut","Air launcher · Vulnerable",`<p>A vertical rising slash that launches both Aysu and the target into the air together. He is Airborne alongside them until the start of his next turn.</p>`,{vuln:true,status:"air"});
SM("Undertow","3 Ki · Vulnerable",`<p><i>"The sea keeps what leans too far over it."</i> A barbed tether of hardened blood hurled up to 40 ft. On hit, the target is dragged into his reach, Grappled for a beat and Vulnerable, and his next strike against them is free.</p>`,{ki:3,vuln:true});
SM("Coldfire Reprisal","4 Ki · Vulnerable",`<p>Aysu vanishes in cold blue fire and reappears behind any target within 30 ft, striking on arrival. A Crossup that ignores opportunity attacks and satisfies the Krushing Blow first-strike condition.</p>`,{ki:4,vuln:true});
SM("Razor Halo","3 Ki · Vulnerable",`<p>A crescent of bladed moonlight ricochets between up to three targets and returns. Each bounce is a separate hit that builds the meter. Vulnerable on miss on the initial throw.</p>`,{ki:3,vuln:true});
SM("Whirlwind Guard","4 Ki",`<p>A spinning column of trident and limb striking every creature within 10 ft, deflecting incoming projectiles for the round, and lifting Medium-or-smaller enemies 5 ft into a juggle.</p>`,{ki:4});
SM("Dragon Flight Kick","3 Ki · Vulnerable",`<p>A flying kick that carries Aysu up to 30 ft into a target's chest, knockback 15 ft, and lets him continue the chain on landing. On miss he sails past and is open until his next turn.</p>`,{ki:3,vuln:true});
A(s,"Will of the Departed","attack","5 Ki · Vulnerable",`<p>He seizes a Large-or-smaller creature in telekinetic blood-force, lifts it, and slams it down: Prone, 8d12, and a 10 ft shock dealing half to nearby grounded enemies.</p>`,{pay:{ki:5},dmg:"8d12",t:"force",sm:true,limb:"special:will",vuln:true});
SM("Corrosive Tide","3 Ki",`<p>A spray of acidic brine. The target's armor sloughs: −3 AC for the encounter (stacks with Erosion) and it is Weakened. Stacks toward the Krushing Blow armor condition.</p>`,{ki:3,status:"weak",ero:3});
SM("Shadow Double","4 Ki",`<p>A duplicate of shadow and mist strikes alongside him, counting as a separate weapon switch. On hit, the double pins the target, Restrained until the end of its next turn.</p>`,{ki:4,hits:2});
SM("Soul Devour","5 Ki",`<p>Against a Weakened, bleeding, or sub-25% creature: he heals for the damage dealt, regains 2 Ki, and for 1 minute borrows one of the target's abilities (DM's choice).</p>`,{ki:5,drain:true});
SM("Thunder Charge","4 Ki · Vulnerable",`<p>He becomes a bolt and hurls himself in a 30 ft line, dealing lightning to everything in the path and emerging behind the last target. With Raijin active it cannot be reacted to.</p>`,{ki:4,vuln:true});
A(s,"Around the World","attack","4 Ki · Vulnerable",`<p><i>"Go on. Take the long way back."</i> A rising spinning kick hurls the target into a vast orbital arc. They come crashing down at a point of his choice within 30 ft at the start of his next turn, taking 10d12 on impact, landing Prone and ready for a fresh juggle.</p>`,{pay:{ki:4},dmg:"10d12",t:"bludgeoning",sm:true,limb:"special:atw",vuln:true});

s=S("tools","Ninja Tools","tech","Ulysses' arsenal");
A(s,"Kunai","attack","Part of attack action · 60 ft",`<p>An inexhaustible supply. Thrown as part of his attack action, 2d6 piercing. Each kunai that hits keeps the combo alive at range and adds +1 to the meter.</p>`);
A(s,"Blood Wire","bonus","Bonus Action · 60 ft",`<p>His own blood, hardened into wire. He may pull himself to a point or enemy, or pull a Medium or smaller enemy to him. Closes distance instantly and maintains the combo. Costs 1 toward the Hunger.</p>`,{hunger:1});
A(s,"Smoke of the Forgotten","reaction","Reaction or Bonus Action",`<p>Aysu vanishes into a 15 ft cloud, breaks line of sight, and repositions within the cloud or its edge. The combo does not break.</p>`);
A(s,"Pinning Needles","bonus","Bonus Action · 30 ft",`<p>Dexterity save or the target is Restrained until the end of their next turn. Sets up Deep Freeze, the air launchers, Obliteration.</p>`);
A(s,"Flash Seal","action","Thrown · 30 ft",`<p>Blinds all enemies in a 15 ft radius for 1 round (Constitution save negates). Aysu and his allies are unaffected.</p>`);
A(s,"The Mentor's Caltrops","action","Scatter · 10 ft square",`<p>Enemies entering or starting their turn there take 2d6 piercing and have their speed halved.</p>`,{dmg:"2d6",t:"piercing",limb:"tool",noCombo:true});

s=S("react","Dynamic Reactions","tech","three per round · four in Shaman");
A(s,"Improved Deflect","reaction","Dynamic Reaction",`<p>Deflects melee attacks and spells targeting him. Dexterity check against the attack roll or spell save DC. On success, return the attack to its source, or, if physical, attack as if it were his turn. Cannot deflect AoE.</p>`);
A(s,"Hidden Dragon","reaction","Dynamic Reaction",`<p>Stand from prone by attacking. The attack moves him 20 ft in any direction. Enemies within 5 ft are tripped Prone on hit.</p>`);
A(s,"Vengeful Parry","reaction","Dynamic Reaction",`<p>A successful parry deals 1.5x damage and applies Hemorrhage. In Desecration, this reaction is free once per round.</p>`);
A(s,"Flow of Water","passive","Passive modifier",`<p>Once per round, during any reaction, Aysu may shift stance as part of the reaction. No action cost. No Ki cost.</p>`);
A(s,"Wanderer's Port","bonus","Bonus Action",`<p>Aysu teleports to a valid anchor he can see without provoking. Crashing Tide: any water, mist, ice, or the trident. Desecration: any bleeding creature, blood pool, or his effigy. Shaman: any willing ally within 60 ft. In Praxis, all three anchor types are available.</p>`);

s=S("frust","Frustration Spends","tech","gained when the rhythm is denied",{blurb:"Gain 1 Frustration (once per source per round) when a creature dodges your attack, forces a miss, when you successfully Dodge, use a defensive reaction, reduce damage from an attack, or are forcibly moved, restrained, or knocked prone. Max = PB. Resets at end of encounter."});
A(s,"Combo Save","free","1 Frustration · 1/round",`<p>Keep your Combo Meter when it would drop.</p>`,{pay:{fr:1}});
A(s,"Burst","free","1 Frustration + 1 Ki · 1/round",`<p>+10 to a missed or upcoming attack roll.</p>`,{pay:{fr:1,ki:1}});
A(s,"Reroll","free","2 Frustration",`<p>Reroll a save or check.</p>`,{pay:{fr:2}});
A(s,"Monsoon Madness","reaction","1 Frustration · Reaction",`<p>When grappled, restrained, swallowed, mounted, or pinned, the attacker makes a Strength save. Failure: thrown 30 ft, prone, takes Martial Arts die per PB damage, loses concentration, and cannot repeat the control effect until end of next turn. Success: pushed 10 ft, half damage. Against Large and larger creatures, Aysu launches himself 40 ft away with no opportunity attacks.</p>`,{pay:{fr:1}});
A(s,"Boiling Point","free","3 Frustration · 1/encounter",`<p>For 1 round: all his attacks gain advantage; every hit triggers Weapon Trait Infusion regardless of meter; his crit range expands by 2; and he cannot use defensive Dynamic Reactions. At the end of the round, his Frustration drops to 0 and his Combo Meter resets to 8 if it was higher.</p>`,{pay:{fr:3,boil:1},fx:{name:"Boiling Point",rounds:1,note:"advantage · infusion every hit · crit range +2 · no defensive reactions"}});
A(s,"Tidefall Anchor","reaction","1 Frustration · Reaction, 1/round",`<p><i>"You wanted the opening. You got it. Come take it."</i> When a Vulnerable-on-miss attack whiffs, he cancels the Vulnerable and enters Anchor Stance until the start of his next turn: he cannot be moved, pushed, pulled, knocked Prone, or launched short of a Tier-IV effect, and gains +2 AC. Unarmed strikes only.</p><p><b>The Bite</b> (once per stance): when any creature attacks him during Anchor Stance, he makes one trident attack. On hit: Impale (Grappled, 4d10+DEX piercing), Drag (15 ft arc, 2d6 bludgeoning, Dex save or Prone to others), Kick Off (launched 20 ft, 3d10+STR, Prone). Counts as one weapon hit for Ripping Rapids.</p>`,{pay:{fr:1},fx:{name:"Anchor Stance",rounds:1,note:"+2 AC · immovable · The Bite ready"},dmg:"4d10+DEX+2d6+3d10+STR",t:"piercing",limb:"trident"});

s=S("learned","Learned Techniques","tech","");
A(s,"Reverse the Flow","reaction","Reaction",`<p>When a creature within 60 ft spends a limited combat resource, Aysu siphons ambient force. Gain one: recover Ki equal to Wisdom modifier, gain 1 Frustration, gain temporary HP equal to Monk level plus Wisdom, or shift stance for free.</p>`);
A(s,"Why Target the Body?","passive","",`<p>Stunning Strike: roll 1d6. 1 Str, 2 Dex, 3 Con, 4 Int, 5 Wis, 6 Cha. The target saves with that ability instead of Con. Non-Con saves grant additional effects at DM discretion.</p>`);

/* ===== STANCES ===== */
s=S("st-tide","Crashing Tide","stances","default stance · the trident, the moon, the cold water",{stance:"tide",color:"#4fb0d6"});
A(s,"Tideborne Trident","passive","auto in calculator",`<p>While wielding the trident in Crashing Tide:</p><ul><li>Trident damage is 1.5x. Flurry of Blows is replaced with trident attacks that apply Bleed at base damage.</li><li>+1 reach and +1 AC.</li><li>Each hit leaves a Moonlight Echo (25% after-image). Stacks to 3. Bonus Action: detonate them into a crescent arc dealing cold plus force damage equal to half Wisdom per stack.</li><li>Every two trident hits form an Ebb/Flow cycle. Ebb: −10 ft target movement, +2d8 cold. Flow: heal 1d6 plus Wisdom or restore 1 Ki, target gains 1 Lunaris Stillness. A miss resets the cycle.</li></ul>`);
A(s,"Sickle of the Silver Sea","action","Combo 8+ · 3 Ki",`<p>Against a bleeding or frozen target, a sweeping lunar slash. 10 ft radius, 4d10 cold plus slashing. Leaves a reflective frost film: allies inside gain +10 ft movement and +1 AC until the end of their next turn.</p>`,{pay:{ki:3},dmg:"4d10",t:"cold",limb:"special:sickle",req:"combo 8"});
A(s,"Frost Clone","reaction","2 Ki · Reaction to Dodge or Disengage",`<p>Leaves an Ice Clone in his old space (AC 15, HP 10 plus Wisdom). Terrain 5 ft around it becomes frozen difficult terrain. Destroying a clone triggers a 10 ft shatter: 2d8 cold plus 1 Lunaris Stillness or Erosion. Aysu gains +1 AC per shattered clone.</p>`,{pay:{ki:2},clone:1});
A(s,"Geyser","attack","3 Ki · replaces an attack",`<p>A column of water erupts beneath a target. Dexterity save against his Monk DC or be launched 30 ft straight up and held Airborne until the start of Aysu's next turn. The setup for Flying Swallow, Moonlock Slam, or Izuna Drop.</p>`,{pay:{ki:3},status:"air"});
A(s,"Water Bubble","action","4 Ki · Action",`<p>Strength save against his Monk DC. On failure, the target floats Restrained and Incapacitated for up to 3 rounds, unable to act or be targeted by his allies. Repeats the save at the end of each turn. While bubbled, the target's regeneration and resistances are suppressed.</p>`,{pay:{ki:4}});
A(s,"Lunar Phases · Equinox","bonus","Bonus Action · WIS mod per long rest · console on Turn",`<p>Choose a phase. Each also offers a <b>Stat Reflection</b> (one ability score becomes equal to his highest) or <b>Stat Rotation</b> (swap two ability scores). Duration 1 minute or until changed. A phase change heals 1d8 per Monk level.</p>`);
A(s,"Tideturn","action","Capstone · 10 Ki · Action",`<p>For 1 minute or 5 rounds, the area within 30 ft floods with tidewater: +2 to all his attack rolls, he ignores difficult terrain; enemies treat it as difficult terrain with disadvantage on Strength saves. Tidal Harmony Flow heals 2d8+WIS. Once per round, on a trident hit, shift the zone 15 ft. When it ends: 30 ft burst, 6d10 cold (Dex half), enemies pushed 20 ft.</p>`,{pay:{ki:10},fx:{name:"Tideturn",rounds:5,note:"+2 attack · ends in a 6d10 cold burst"},dmg:"6d10",t:"cold",limb:"special:tideturn",noCombo:true});
A(s,"Violent Effigy","action","Action · shift to Desecration",`<p>Impale an enemy on the trident. Within 20 ft of the effigy, Aysu heals and gains an extra attack. Shifts to Desecration.</p>`,{to:"wendigo"});
A(s,"Sutra of Heart and Soul","bonus","5 Ki · Bonus · shift to Shaman",`<p>Sheathes the trident. Shifts to Shaman.</p>`,{pay:{ki:5},to:"shaman"});

s=S("st-wendigo","Desecration · Half Wendigo","stances","the hunger let loose",{stance:"wendigo",color:"#cf4763"});
A(s,"Half Wendigo Form","passive","stats apply automatically",`<p>Dex +6, Str +5, Con +10. Speed quadrupled. Gains burrow equal to movement and the all-fours movement bonuses (momentum damage 1.5x, +1 momentum capacity). Advantage on attack rolls against creatures. Cannot use the trident or weapons. Gains claw attacks.</p>`);
A(s,"Sanity Pressure · Hunger","passive","tracked on Turn",`<p>At the start of each of his turns in this stance, he gains 1 Hunger stack. At 5 stacks, he must make a Wisdom save (DC 22 plus stacks beyond 5) or lose control and attack the nearest creature. Hunger resets when he leaves the stance. He may spend 2 Hunger to fuel Revolt Against the Flesh instead of HP.</p>`);
A(s,"Revolt Against the Flesh","free","Free · 2 Hunger or claw-damage of HP",`<p>2.5x damage on the next attack. Causes Hemorrhage.</p>`,{revolt:true});
A(s,"Scourge Against Flesh","passive","",`<p>Cannot heal through normal means. Heals 1d12 per bleeding target struck. Double movement speed. Hits inflict Hemorrhage and Corruption.</p>`);
A(s,"Civility's Weakness","passive","",`<p>No disadvantage from Hemorrhage. Creatures suffering any negative status make saves against his features with disadvantage. Claws inflict Weakening on hit: 50% baseline, 100% against creatures already suffering a negative status or bleeding.</p>`);
A(s,"Glutton","passive","",`<p>Killing a creature with a Wendigo attack lets Aysu consume it, gaining a temporary trait from the eaten for 10 minutes (DM's choice).</p>`);
A(s,"Spirit of Deception","passive","calculator chip",`<p>May appear as an inanimate object while still or on a successful Stealth check. Enemies have disadvantage on Perception to find him. The first attack from this state deals +50% damage and takedowns gain +10%.</p>`);
A(s,"Flash Freeze","reaction","Reaction · 3 per encounter",`<p>Block an attack with his fur. The attacker makes a Constitution save at disadvantage. On failure, their attacking arm is frozen.</p>`,{pay:{flash:1}});
A(s,"Adaptable","reaction","Reaction · tracked on Turn",`<p>When hit by an attack that is not his vulnerability, Aysu makes a Constitution save (DC equal to the attack roll). Success: damage goes through but he gains resistance to that type. Second success: heavy resistance. Third: immunity.</p>`);
A(s,"Corruption of Heaven","passive","+2 dice chip",`<p>Ki-Infused Strikes and Stunning Strike deal +2 damage die. On a successful save against them, the target gains a Curse of his choice (one per target); it may attempt a Wisdom save at the end of its turn against the Monk DC to end it.</p><ul><li><b>Reverse Causality.</b> Successes and failures invert for one round.</li><li><b>Brittle Bones.</b> Limb AC modifier decreases by 1 per limb hit for 2 rounds. Aysu deals +25% to limbs.</li><li><b>Borrowed Flesh.</b> Aysu disguises as the target for one round; the target is seen as Aysu. Int vs Monk DC to see through.</li><li><b>Silence.</b> The mouth seals over. No speech or verbal spells.</li><li><b>Kinslaying.</b> Compelled to attack the nearest blood relative within 60 ft.</li><li><b>Famine.</b> Physical stats drop 2 per turn without food. Death at 0.</li><li><b>Desecrated Flesh.</b> Speed drops 10 ft per turn, Dex saves at disadvantage. At 0 speed: prone, death saves or burst.</li><li><b>Corrupted Sympathy.</b> Random save per turn (1d6) vs Monk DC; failure loses the turn and deals damage equal to pain inflicted.</li></ul>`);
A(s,"Predatory Lunge","action","Action",`<p>Acrobatics contest; Aysu chooses if the target rolls Athletics or Acrobatics. Win: target Prone and open to takedown. This takedown instakills lesser enemies and deals 20% to boss-level creatures.</p>`);
A(s,"Early Burial","action","From burrow",`<p>Pounce gains a 5 ft AoE that takedowns all ground creatures within. Bosses save with Dex.</p>`);
A(s,"Wendigo's Pact","free","Capstone · 6 Ki · Free Action",`<p>Until the start of his next turn, every hit applies the Curse he chooses, no save. He gains 5 Hunger at the start of his next turn.</p>`,{pay:{ki:6},fx:{name:"Wendigo's Pact",rounds:1,note:"every hit applies a Curse, no save · +5 Hunger next turn"},hunger:5});
A(s,"Crashing Tide (shift back)","action","Action · shift to Crashing Tide",`<p>Slams the impaled enemy into the ground. A 20 ft radius shrapnel burst deals trident damage (or claw damage if used here). Shifts back to Crashing Tide.</p>`,{to:"tide"});

s=S("st-shaman","Shaman · The Lost Brother","stances","spirit techniques only",{stance:"shaman",color:"#46c9b0"});
A(s,"Guardian of the Natural World","passive","",`<ul><li>No physical attacks or trident. Spirit techniques only.</li><li>Cannot be hit by physical projectiles. +1 Dynamic Reaction (4 total).</li><li>Can only Block and Dodge (no Parry). Blocking takes half knockback and no damage; blocked damage refracts back to the attacker.</li><li>Immune to Blinded and Corrupted. +20 HP from outside healing. 4 attacks per turn.</li></ul>`);
A(s,"Spirit Strikes","passive","Combo engine bridge",`<p>Spirit techniques count as monk weapon attacks for Ripping Rapids and Erosion. Each counts as a weapon switch if it differs in type from the previous (Offense / Control / Support).</p><ul><li>Offense: Ki Wave, Ki Flare, Ki Slam, Ki Siphon.</li><li>Control: Wisdom of the Ages, Serenity in Chaos, Sight of the Shaman.</li><li>Support: Wanderer's Port, Defender of the Innocent, Shoulder the Burden, Return to Emptiness.</li></ul>`);
A(s,"Sight of the Shaman","passive","requires > ½ Ki",`<p>See through walls, sense Ki presence, sense mood and hostility, see through illusions.</p>`);
A(s,"Wisdom of the Ages","passive","",`<p>Meditate to see the past. Vulnerable (2x damage) while doing this. Cannot cancel except by taking damage.</p>`);
A(s,"Serenity in Chaos","passive","",`<p>Dodging moves Aysu forward through the dodged opponent's space, leaving them Vulnerable. Dodged or avoided enemies are auto-Marked, but only Predict Reaction is available from the mark. Lasts until hit.</p>`);
A(s,"Ki Siphon","action","Action",`<p>Drain a creature. Grunts: 100% HP drain into a death-like state. Stronger enemies: Stunned. Aysu restores Ki from the drain.</p>`,{limb:"spirit:offense"});
A(s,"Ki Flare","action","3 Ki · Action",`<p>20 ft cone. Frightened and Blinded. Enemies hit are Vulnerable.</p>`,{pay:{ki:3}});
A(s,"Ki Wave","action","3 Ki · Action",`<p>30 ft line. Knockback and Prone. Maximum 3 enemies.</p>`,{pay:{ki:3}});
A(s,"Ki Slam","action","4 Ki · Action",`<p>Launches up to 6 visible enemies high into the air. Pairs with the air-finishers in Crashing Tide if he shifts.</p>`,{pay:{ki:4},status:"air"});
A(s,"Return to Emptiness","reaction","Dynamic Reaction",`<p>End any conditions plaguing Aysu.</p>`);
A(s,"Defender of the Innocent","reaction","Dynamic Reaction · 2 Ki",`<p>Teleport to an ally failing a save and help with the check, with advantage.</p>`,{pay:{ki:2}});
A(s,"Shoulder the Burden","reaction","Dynamic Reaction · 15 ft",`<p>Take an ally's negative status onto yourself. The ally is cured and immune to that effect for one round.</p>`);
A(s,"Sutra of Communion","action","Capstone · 10 Ki · Action",`<p>For 1 minute or 5 rounds: all allies within 30 ft heal 2d8 plus Wisdom at the start of each of his turns; advantage on all Wisdom checks and saves; one ally per round may use his Dynamic Reactions. When it ends, he gains 2 Frustration and his Combo Meter is set to 15.</p>`,{pay:{ki:10},fx:{name:"Sutra of Communion",rounds:5,note:"allies within 30 ft heal 2d8+WIS each turn · ends: +2 Frustration, Combo → 15"}});
A(s,"Wrathful Awakening","action","Action + Bonus · shift to Crashing Tide",`<p>Takedown a vulnerable enemy. Shifts back to Crashing Tide.</p>`,{to:"tide"});

s=S("st-praxis","Pilgrim's Praxis · The New Moon","stances","the convergence · 28 Ki or Combo 40 · 5 rounds · 1/long rest",{stance:"praxis",color:"#ecdcae"});
A(s,"Perfect Equilibrium","passive","",`<p>Simultaneously in Crashing Tide, Desecration, and Shaman. Every passive from each. No restrictions from any. Hunger does not accumulate. Stance-exclusive ability Ki cost halved (min 1). Three-Step Resonance is granted automatically.</p>`);
A(s,"Stillness of the New Moon","passive","",`<p>A 60 ft radius domain. Every hostile creature has its highest ability score reduced by Aysu's Wisdom modifier. Every ally has their highest increased by the same. Adjustments propagate to all derived numbers.</p>`);
A(s,"Balance of the Tides","passive","",`<p>Whenever an enemy or ally in the domain gains or loses HP, Aysu regains HP equal to half the amount changed.</p>`);
A(s,"Phase Harmony","passive","",`<ul><li>Crashing Tide ability spawns an Ice Clone.</li><li>Desecration ability makes existing clones drip blood, terrain radius +5 ft, and Blood Port may target them.</li><li>Shaman ability sanctifies the terrain, healing allies 1d8 per round.</li></ul>`);
A(s,"The Creed Made Flesh","free","Start of each turn · choose on Turn",`<ul><li><b>Ebb.</b> Enemies within 30 ft pushed 15 ft, take 2 Martial Arts dice cold plus force.</li><li><b>Flow.</b> Allies within 30 ft regain 10 HP and may move 15 ft without provoking.</li></ul>`);

/* ===== TRAITS ===== */
s=S("genetic","Genetic Traits","traits","what he was born as · always on, never spent");
[["Dhampir Heritage","The blood of the line that raised him runs in him already. Aysu does not age and needs no food or sleep beyond the occasional draught of blood. He has darkvision out to 120 ft, resistance to necrotic damage, and advantage on saving throws against being charmed, put to sleep, or frightened. He senses the blood of living creatures within 60 ft, reading their relative health at a glance, and a creature already bleeding cannot hide from him by any mundane or magical means."],
 ["Cold Blood","Aysu has resistance to cold damage and is never slowed, tripped, or hindered by ice, snow, water, or mist; such terrain is never difficult for him. Any creature that grapples, swallows, or restrains him takes cold damage equal to his Wisdom modifier at the start of each of its turns."],
 ["The Wendigo Strain","Even outside Half Wendigo Form, Aysu heals half as much from any source while above half HP and twice as much while below it. Once per long rest, when he reduces a creature to 0 HP with a melee strike, he may feed for a moment, regaining HP equal to his Monk level and gaining one Hunger stack carried into his next entry into Half Wendigo Form."],
 ["Wanderer's Constitution","Advantage on saves against disease and poison, ignores the first level of exhaustion he would ever take, and recovers from rest at twice the normal rate. He can hold his breath, climb, swim, and travel for stretches that would break an ordinary fighter."],
 ["Water's Welcome","While in physical contact with water (fresh, salt, mist, rain, ice), he regains HP equal to his proficiency bonus at the start of each of his turns. While fully submerged, twice that. Desecration's healing limits still apply."],
 ["Tide-Borne","Aysu may walk on the surface of any body of water as if it were solid ground, and may choose to sink at any time. Half Wendigo Form retains this; Shaman Stance enhances it (no ripples)."],
 ["Lunar Wakefulness","Aysu requires only 4 hours of rest to gain the benefits of a long rest, provided some part of those hours occurs under moonlight. Denied moonlight for more than 3 nights, he gains one level of Exhaustion until he sees the moon again."],
 ["The Sky Knows Him","He knows the current lunar phase, predicts weather 24 hours ahead, and always knows north, even underground or in the Ethereal."],
 ["Trident-Bond","He may recall the trident as a free action within 120 ft and senses its direction beyond. It cannot be wielded by anyone hostile to him."],
 ["Wanderer's Step","He cannot become lost in any natural environment. Advantage on Survival checks and Wisdom checks to navigate, track, or remember a path he has walked once."],
 ["Master's Hands","Even in Half Wendigo Form, he keeps a monk's fine motor control: locks, writing, fire, needles, no disadvantage despite claws."],
 ["Hunter's Quiet","He leaves no tracks unless he chooses to and moves silently at normal speed. Mundane animals do not flee unless they see him strike first."],
 ["Listen to the Current","One full minute listening to flowing water: at the DM's discretion it tells him recent news carried by the water, the mood of a settlement upstream, or whether his quarry crossed it recently."],
 ["Patient Mist","He can stay perfectly still for hours with no rolls during meditation, ambush, or vigil."],
 ["Salt and Cold","Immune to Tier I and II environmental cold. Drinks seawater and eats raw or poisoned food without harm. Ingested curses and diseases roll their initial save at disadvantage against him."],
 ["Drift Sleep","He can sleep standing, moving slowly, or submerged, keeping his senses, and wakes the moment he is observed, touched, or addressed. Recovers 1 Exhaustion per 4 hours."]].forEach(function(t){A(s,t[0],"passive","",'<p>'+t[1]+'</p>');});

s=S("race","Water Genasi · Feats · Gear","traits","from the character sheet");
A(s,"Acid Resistance","passive","Water Genasi",`<p>Resistance to acid damage.</p>`);
A(s,"Amphibious","passive","Water Genasi",`<p>Breathes air and water.</p>`);
A(s,"Call to the Wave","passive","Water Genasi",`<p>Acid Splash, Shape Water, Create or Destroy Water, Water Walk.</p>`);
A(s,"Alert","passive","Feat",`<p>Add PB to initiative. May swap initiative with another. Cannot be surprised.</p>`);
A(s,"Savage Attacker","free","Feat · once per turn · calculator chip",`<p>Once per turn, on hit, double the damage on target.</p>`);
A(s,"Wanderer Trained","passive","Feat",`<p>Primordial Darkvision. Aggressive: upon a kill, grants 1.5x movement and 1.75x damage on the next hit.</p>`);
A(s,"Fighting Style · Impale","free","Special attack",`<p>Athletics check (Acrobatics, via Prideful) at the end of an attack. On hit deals an extra d12 and heavy bleed. On miss leaves him heavily vulnerable.</p>`);
A(s,"Collectibles","passive","",`<p>Augustus: CHA +1. Jason: INT +1. Jason (MC): CHA +1, 10% to favor gain.</p>`);
A(s,"Bank of Blood","free","1/Arc · Sudden Wealth 1/LR",`<p>Sacrifice 10 Favors to retroactively fund a failed facility, mission, or military effort. <b>Sudden Wealth</b> (1/LR): gain 3d4 Favors; you or 1 ally take an additional full action as if Hasted. <b>Economy of Motion:</b> gold or favors as spell components, bribes, or weapons. Spend favors for an additional bonus action once per turn.</p>`);
A(s,"Cuffs of the Depth Walker","passive","Item",`<p>When you block, the attacks are now 1/20th.</p>`);
A(s,"Craven Cloak","passive","Item · light",`<p>Worn on the body.</p>`);

s=S("res-nat","Resonant · Natalie Bellator","traits","The Algorithm Crowned");
A(s,"Royal Parry","passive","",`<p>A successful parry has a 25% chance to make the creature drop a weapon. If it carries no physical weapon, that chance instead disables a random limb.</p>`);
A(s,"Inherited Knowledge","passive","",`<p>+10 to Intelligence. Aysu constantly knows Natalie's mental state, emotions, health, and physical condition, as if he were reading her sheet.</p>`);
A(s,"Raijin","passive","",`<p>30% damage reduction against lightning. His weapon attacks gain lightning damage. He may travel through electricity, gaining momentum every 5 ft he moves; at maximum momentum he may spend 5 Ki to make his attacks unreactable.</p>`,{pay:{ki:5}});
A(s,"Thunderclap Technique","passive","Weapon Resonance",`<p>Targets struck by his ranged attacks are teleported toward him, take the trident's damage again, and are Shocked. Striking a Shocked target makes it explode, dealing trident damage in a 10 ft radius and spreading Shock. He is immune to his own explosions. Erosion now also applies Shocked.</p>`);
A(s,"Arch Magi","passive","5 flexible slots on Druid tab",`<p>When Aysu casts a spell, he upcasts it for free. He gains 5 additional spell slots assignable to any level, and one Tier I Epic Spell: Hideous Mandate.</p>`);
A(s,"Dhampir (Awakening)","passive","",`<p>The vampire half of the bond, still unfolding. Its shape is carried in his Genetic Traits.</p>`);
s=S("res-cel","Resonant · Celeste Alvecios","traits","The Inevitable Mercy");
A(s,"The Light Arrives First","passive","",`<p>While he can see a creature making a ranged, projectile, thrown, beam, or line attack against him, he automatically dodges it (no Ki, no reaction), then may move 5 ft without provoking (10 ft on water, ice, mist, or moonlit terrain). Praxis: once per round, an ally in his light does the same.</p>`);
A(s,"Moon Over Water","passive","",`<p>Bright light 30 ft, dim 30 ft more. Allies in the bright light gain advantage on Dexterity and Constitution saves. On water, mist, rain, snow, ice, or reflective surfaces, both ranges +20 ft. In Praxis, 60 ft bright and 60 ft dim.</p>`);
A(s,"Radiant Tide Regeneration","passive","start-of-turn toggle on Turn",`<p>At the start of his turn, standing in bright light, moonlight, or his own resonant light, he regains HP equal to his Wisdom modifier plus proficiency bonus; doubled if also touching water, ice, mist, rain, or snow. In Praxis, allies in his bright light regain half this. Suppressed in magical darkness.</p>`);
A(s,"Heaven Beneath the Eyelid","passive","+15 Perception (included)",`<p>When Aysu studies a creature, he glimpses the direction of its life: what it is likely to become, the emotional truth shaping its future, the wound or desire steering its next choice, and whether his intervention could change that path. Momentum, not destiny.</p>`);

/* ===== CLASS FEATURES (paraphrased) ===== */
s=S("monk-rev","Revised Monk · J.T.'s changes","monk","house rules on top of the 2024 monk");
A(s,"Ki Surge","passive","",`<p>Ki pool doubled compared to a baseline monk, +5 Ki at levels 10, 20, 30, 40, 50.</p>`);
A(s,"Athletic Flow","free","Free action",`<p>After any successful attack in a chain, attempt a grapple or shove as a free action, using Acrobatics instead of Athletics.</p>`);
A(s,"Parry","reaction","Exclusive Dynamic Reaction · 1 token",`<p>When a melee attack hits him, spend a token to attack the creature. If his roll beats theirs, the attack is cancelled. If not, it lands with +20% damage; the token is spent either way.</p>`);
A(s,"Martial Arts Die Increase","passive","levels 5, 10, 17",`<p>Fists, legs, elbows and knees each gain a damage die at 5, 10 and 17. Sifu Limb Dice add 5 more dice to each limb (DM ruling): Fists 10d6, Elbow 9d12, Knees 13d6, Kicks 8d20. All reflected in his weapon strings.</p>`);
A(s,"Stillness of Mind","passive","Level 6",`<p>Proficiency in all saving throws and resistance to psychic damage.</p>`);
A(s,"Ki Siphon (weapon)","action","Level 14",`<p>Touch a magical weapon to siphon its enchantment into his limbs: its effects (flaming, vampiric, etc.) apply to unarmed strikes, charges carry over, until the end of combat or the next siphon.</p>`);
A(s,"Enlightenment","passive","Level 20",`<p>Flurry of Blows, Patient Defense and Step of the Wind cost 0 Ki. One Ki ability per turn even at 0 Ki. Advantage on Dexterity and Wisdom saves. +4 Dexterity and +4 Wisdom (can exceed 20).</p>`);
s=S("monk-base","Monk · core features","monk","2024 monk at level 26, using Ki");
A(s,"Flurry of Blows","bonus","Bonus · 0 Ki (Enlightenment)",`<p>Make extra unarmed strikes as a bonus action (three from Heightened Focus). Extend with Rising Tide.</p>`);
A(s,"Patient Defense","bonus","Bonus · 0 Ki",`<p>Disengage and Dodge as a bonus action; with Heightened Focus also gain temp HP equal to two Martial Arts rolls. Extend with Rising Tide.</p>`,{fx:{name:"Patient Defense",rounds:1,note:"Dodge · Disengage"}});
A(s,"Step of the Wind","bonus","Bonus · 0 Ki",`<p>Dash and Disengage as a bonus action, jump distance doubled; may carry a willing ally. Extend with Rising Tide.</p>`);
A(s,"Stunning Strike → Paralyzing Strike","free","evolved at Sifu 21",`<p>From Sifu 21 your Stunning Strike is <b>Paralyzing Strike</b> (5 Ki, once per turn, paralyzed instead of stunned). See Essence into Qi under Sifu prestige.</p>`);
A(s,"Deflect Attacks","reaction","Reaction · reduce 1d10+DEX+monk level",`<p>Reduce damage from a bludgeoning, piercing or slashing attack by 1d10 + DEX + monk level (max 57; the HP tracker has a button). If reduced to 0, spend 1 Ki to redirect it at a creature within range. Deflect Energy (13) extends this to any damage type.</p>`);
A(s,"Uncanny Metabolism","free","1/long rest · on initiative",`<p>When you roll initiative, regain all Ki and heal one Martial Arts die + monk level.</p>`,{pay:{meta:1}});
A(s,"Evasion","passive","",`<p>DEX save for half: take none on a success, half on a failure.</p>`);
A(s,"Self-Restoration","free","end of turn",`<p>End one Charmed, Frightened or Poisoned effect on yourself at the end of each turn. No exhaustion from skipping food and drink.</p>`);
A(s,"Disciplined Survivor","free","1 Ki · reroll a failed save",`<p>Proficiency in all saves; spend 1 Ki to reroll a failed save.</p>`,{pay:{ki:1}});
A(s,"Perfect Focus","passive","on initiative",`<p>If you have 3 or fewer Ki when you roll initiative, regain up to 4 (unless Uncanny Metabolism was used).</p>`);
A(s,"Superior Defense","free","3 Ki · 1 minute",`<p>Resistance to all damage except force for 1 minute.</p>`,{pay:{ki:3},fx:{name:"Superior Defense",rounds:10,note:"resist all but force"}});
A(s,"Slow Fall · Acrobatic Movement · Unarmored Movement","passive","",`<p>Reduce falling damage; move along vertical surfaces and across liquids; bonus speed while unarmored (included in 60 ft).</p>`);
s=S("monk-ld","Way of the Long Death","monk","subclass");
A(s,"Touch of Death → Last Breath","passive","evolved at 21",`<p>Replaced by <b>Last Breath</b> in the Gate of the Long Dusk: inhale a dying creature for temp HP, Coils and Ki. The roster offers it when a target drops.</p>`);
A(s,"Hour of Reaping → Hour of the Long Dusk","bonus","evolved at 24",`<p>Replaced by <b>Hour of the Long Dusk</b>: 5 Ki bonus action, WIS save or paralyzed. Tracker on the Long Dusk tab.</p>`);
A(s,"Mastery of Death","free","1 Ki · at 0 HP",`<p>When reduced to 0 HP, spend 1 Ki to drop to 1 HP instead. The HP tracker offers this automatically.</p>`);
A(s,"Touch of the Long Death → The Ledger","free","evolved at 21",`<p>Now rides any unarmed hit for up to 20 Ki (2d10 necrotic per Ki) and counts as Deducted Years. Set it in the damage calculator.</p>`);

s=S("druid","Circle of the Moon","druid","druid 18");
A(s,"Wild Shape","bonus","Bonus · 2 uses per short rest",`<p>Combat Wild Shape lets you transform as a bonus action. Beast forms up to CR 6 (druid level ÷ 3). You keep your mind and mental scores; damage hits the form's HP first and overflows to you when it drops.</p>`);
A(s,"Combat Wild Shape","bonus","Bonus · spend a slot",`<p>While transformed, spend a spell slot as a bonus action to heal 1d8 per slot level.</p>`);
A(s,"Primal Strike","passive","",`<p>Attacks in beast form count as magical.</p>`);
A(s,"Elemental Wild Shape","bonus","2 Wild Shape uses",`<p>Spend two uses at once to become an air, earth, fire or water elemental.</p>`);
A(s,"Thousand Forms","action","At will",`<p>Cast Alter Self at will.</p>`);
A(s,"Timeless Body","passive","",`<p>Ages 1 year for every 10.</p>`);
A(s,"Beast Spells","passive","",`<p>Cast druid spells in beast form (no material components that cost money).</p>`);

s=S("rogue","Rogue · Inquisitive","rogue","rogue 8");
A(s,"Sneak Attack","free","4d6 · once per turn · calculator rider",`<p>Once per turn, deal +4d6 to a finesse or ranged hit with advantage, or with an ally adjacent to the target. Insightful Fighting removes the need for either.</p>`);
A(s,"Cunning Action","bonus","Bonus Action",`<p>Dash, Disengage or Hide as a bonus action.</p>`);
A(s,"Uncanny Dodge","reaction","Reaction · halve damage",`<p>When an attacker you can see hits you, halve the damage. The HP tracker has a ½ button.</p>`);
A(s,"Evasion (Rogue)","passive","",`<p>Same as the monk's; it doesn't stack.</p>`);
A(s,"Expertise · Thieves' Cant","passive","",`<p>Double proficiency on chosen skills (Acrobatics, Insight, Perception, Stealth on this sheet). Speaks thieves' cant.</p>`);
A(s,"Ear for Deceit","passive","",`<p>On Insight checks to tell if someone is lying, treat a d20 roll of 7 or lower as 8.</p>`);
A(s,"Eye for Detail","bonus","Bonus Action",`<p>Use a bonus action for a Perception check to spot a hidden creature or object, or an Investigation check to uncover clues.</p>`);
A(s,"Insightful Fighting","bonus","Bonus · Insight vs Deception",`<p>Insight (+34) against the target's Deception. On a success, you can Sneak Attack that target without advantage (but not with disadvantage) for 1 minute or until you use this on another target. Mark it from the Rogue tab.</p>`);
})();
</script>
<script>
/* ================== PRESTIGE · SIFU 21–26 · GATE OF THE LONG DUSK · KÖS SPIRIT MODULE ==================
   Wording follows the DM's docs (Sifu, Gate of the Long Dusk, KÖS Spirit Module), lightly trimmed.
   Trackers for all of this live on the Sifu, Long Dusk and KÖS tabs. */
(function(){var C=window.CHAR,K=C.kit;
function S(id,title,pane,sub,opts){var s={id:id,title:title,pane:pane,sub:sub||"",items:[]};for(var k in (opts||{}))s[k]=opts[k];K.push(s);return s;}
function A(sec,n,k,cost,text,x){var a={n:n,k:k,cost:cost||"",text:text};for(var q in (x||{}))a[q]=x[q];sec.items.push(a);return a;}
var s;

/* ---------- resources the prestige adds ---------- */
C.resources.push(
 {id:"coil",name:"Coils",max:20,rest:"encEmpty",color:"#9fd8ff",note:"Sifu 26 · combat only · Slack empties it"},
 {id:"swell",name:"Swell",max:10,rest:"restEmpty",color:"#5aa9e6",note:"KÖS · empties on a short or long rest"});

/* ---------- the hammer as a weapon ---------- */
C.weapons.push({n:"KÖS · mounted maul",e:"4d12+6d12+DEX",t:"piercing + bludgeoning",limb:"kos",hit:"+29",kos:true,
 note:"reach 15 ft · every creature in a 90-ft arc · 2 attacks per swing · + Displacement · Shockwave on hit"});

/* ---------- presets for the effect tracker ---------- */
C.effectPresets.push({name:"Paralyzed (meridian)",rounds:1,note:"Paralyzing Strike · ends early if someone other than you or a disciple damages it"},
 {name:"Paralyzed (Hour of the Long Dusk)",rounds:1,note:"can't regain HP while paralyzed this way"},
 {name:"Desecrated",rounds:0,note:"until combat ends · counts as undead · no healing or temp HP"},
 {name:"Impaled (The Narrows)",rounds:0,note:"speed 0 · vulnerable · AC −5 · restrained + prone for attacks"},
 {name:"Mehter",rounds:10,note:"concentration · allies +2 per tempo step"});

/* =============== SIFU · PRESTIGE MONK =============== */
s=S("sifu-silk","Silk-Reeling Jin 纏絲勁","sifu","Sifu 21 · Coils · Fa Jin · Hua Jin",{src:"prestige",color:"#9fd8ff",
 blurb:"Coil max 20 at Sifu 26. Wound force exists only in combat."});
A(s,"Coils","passive","max 20",`<p>A pool of wound force that exists only in combat. <b>Winding:</b> +1 when you hit with an unarmed strike; +1 when a creature hits you with a melee attack; +2 when your Parry succeeds.</p>
<p><b>Slack.</b> You lose all your Coils when combat ends, when you are incapacitated, or when a full round passes in which you didn't hit, weren't hit and didn't Parry.</p>`);
