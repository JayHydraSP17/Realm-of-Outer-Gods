A(s,"Fa Jin 發勁 · Issuing Force","free","once per turn · on an unarmed hit",`<p>When you hit with an unarmed strike, release any number of Coils. The strike deals its limb damage dice one more time for each Coil released, and you can hurl the target up to 5 feet straight away from you per Coil.</p><p><i>Rules tip:</i> roll the limb dice once and multiply by Coils released + 1. The calculator does this for you.</p>`);
A(s,"Hua Jin 化勁 · Neutralizing Force","reaction","Reaction (shared with Parry)",`<p>When you take damage, use your reaction to release any number of Coils; each Coil reduces the damage by your Wisdom modifier. It uses the same reaction as Parry, so every incoming blow forces a choice between soaking it and sending it back. The HP tracker has a Hua Jin button.</p>`);

s=S("sifu-phase","Five Phase Fists 五行拳","sifu","Sifu 21 · Generation · Great Circulation",{src:"prestige",color:"#9fd8ff",
 blurb:"Phase effects stack with the limb's own trait. Saves use your Ki save DC."});
A(s,"Wood · Beng (Crushing)","passive","like an arrow · Liver",`<p>The force runs on through the target. Every creature in a 30-foot line beyond it takes half the strike's damage, including any Fa Jin.</p>`);
A(s,"Fire · Pao (Pounding)","passive","like a cannon · Heart",`<p>The heart stutters. The target can't take reactions until the start of its next turn (Constitution save negates).</p>`);
A(s,"Earth · Heng (Crossing)","passive","like a pellet · Spleen",`<p>The limbs fail. The target's speed is 0 until the start of its next turn, and you can't be moved against your will until then (Strength save negates).</p>`);
A(s,"Metal · Pi (Splitting)","passive","like an axe · Lungs",`<p>The breath splits. The target can't speak, cast spells with verbal components or use a breath weapon until the start of its next turn (Constitution save negates).</p>`);
A(s,"Water · Zuan (Drilling)","passive","like lightning · Kidneys",`<p>You drain 2 Ki from the target, or regain 2 Ki if it has none. (Gate of the Long Dusk: a Water hit also Deducts Days.)</p>`);
A(s,"Generation 相生","passive","Wood → Fire → Earth → Metal → Water → Wood",`<p>A strike is <i>Generated</i> when its Phase follows your previous unarmed strike's Phase in the cycle. A Generated strike grants 1 extra Coil, and its Phase effect applies with no saving throw. The chain carries across turns but breaks when you miss, strike out of order, or strike without a Phase.</p>`);
A(s,"Great Circulation 大周天","passive","once per turn",`<p>When you land the fifth strike of an unbroken run through all five Phases, your Coils double (up to your maximum), and you can release Fa Jin on that same strike even if you already released it this turn.</p>`);

s=S("sifu-ref1","Essence into Qi 煉精化氣","sifu","Sifu 21 · First Refinement",{src:"prestige",color:"#9fd8ff"});
A(s,"Paralyzing Strike 點穴","free","5 Ki · once per turn",`<p>Your Stunning Strike now seals the meridians it strikes. A creature that fails the save is <b>paralyzed</b> instead of stunned until the end of your next turn. The paralysis ends early if the creature takes damage from anyone other than you or your disciples, and once it ends, the creature can't be paralyzed this way again until it has taken a turn without being paralyzed.</p>`,{pay:{ki:5},once:"turn",status:"para"});
A(s,"Burning the Capital","passive","when Ki runs out",`<p>When you would spend Ki you don't have, pay with your own essence instead. Each Hit Die you expend counts as 2 Ki, or reduce your hit point maximum by 10 for each Ki. The reduction lasts until you finish a long rest and nothing else can restore it. Tracker on the Sifu tab.</p>`);

s=S("sifu-baishi","Bai Shi: The Tea of the Lineage 拜師","sifu","Sifu 22 · disciples",{src:"prestige",color:"#9fd8ff"});
A(s,"Disciples","passive","up to 5 · one per Phase · −3 Ki max each",`<p>At the end of a long rest, accept a willing creature as your disciple. Up to five, one for each Phase, no two sharing one. Either of you can end the bond as an action by returning the cup. Your Ki maximum drops by 3 for each disciple. When a disciple drops to 0 hit points, you lose all your Coils and your chain breaks.</p>`);
A(s,"Their Phase · The Carried Chain","passive","disciples",`<p>Once per turn, a disciple can add their Phase's effect to a weapon or unarmed hit, using your Ki save DC. When a disciple's Phase strike follows your last Phase in the cycle, it continues your chain as a Generated strike and you gain 2 Coils. A disciple's miss never breaks your chain.</p>`);
A(s,"The Thread","passive","1 mile",`<p>You know the location, hit points and conditions of each disciple within 1 mile.</p>`);
A(s,"Watch Closely","reaction","Reaction",`<p>When an attack targets a disciple within 60 feet, move up to your speed to their side without provoking opportunity attacks, and Parry the attack for them as part of the same reaction.</p>`);
A(s,"Borrowed Force 借力","free","once per turn · no action",`<p>Hand any number of Coils to a disciple within 60 feet. Before the end of their next turn, they can release those Coils as Fa Jin on a hit, rolling their own weapon's damage dice once per Coil.</p>`,{once:"turn"});

s=S("sifu-four","Four Ounces, a Thousand Pounds 四兩撥千斤","sifu","Sifu 23 · Parry anything",{src:"prestige",color:"#9fd8ff"});
A(s,"Any Blow","reaction","Parry · 1 token",`<p>You can Parry any attack roll (melee, ranged or spell) and any effect that calls for a Dexterity saving throw. Against a saving-throw effect, compare your Parry roll to the save DC. A failed Parry against a spell still lands with the extra 20%, and the reversed force strips away every Coil you hold.</p>`);
A(s,"Lead into Emptiness 引進落空","passive","on a successful Parry",`<p>Redirect what you caught. An attack strikes any creature within your reach, including the attacker, with its full damage and riders. An area effect re-centers on a point within 60 feet and keeps its original DC.</p>`);
A(s,"A Thousand Pounds","passive","release Coils on a redirect",`<p>Each Coil released adds 10% of the redirected damage.</p>`);
A(s,"Swallow the Spell","passive","instead of redirecting a spell",`<p>Absorb it through Ki Siphon. Until the end of your next turn, your unarmed strikes deal its damage type and add half its damage dice to each hit.</p>`);

s=S("sifu-listen","Qi into Spirit: Listening Jin 煉氣化神 · 聽勁","sifu","Sifu 24 · Second Refinement",{src:"prestige",color:"#9fd8ff"});
A(s,"Blindsight 120 ft","passive","",`<p>You have blindsight out to 120 feet, and you can't be surprised.</p>`);
A(s,"Listening","passive","up to 3 creatures",`<p>When you hit a creature with an unarmed strike, you listen to it until the end of your next turn. Before a creature you Listen to takes an action, bonus action or reaction, the DM tells you what it intends and whom it is targeting, and you have advantage on Parry rolls against it. Each creature you Listen to also learns the general shape of your next action, and the connection breaks if you don't touch it again before the end of your next turn.</p>`);
A(s,"Adhere and Follow 粘連黏隨","free","no movement · no reaction",`<p>When a creature you Listen to moves, you can move with it and stay adjacent, up to your speed.</p>`);

s=S("sifu-ox","Cook Ding's Ox 庖丁解牛","sifu","Sifu 25",{src:"prestige",color:"#9fd8ff"});
A(s,"The Unblunted Edge","passive","",`<p>Your unarmed strikes ignore resistance; immunity to bludgeoning or piercing damage is treated as resistance instead, and no damage-reduction feature can lower your limb damage.</p>`);
A(s,"The Seams","passive","per target",`<p>Each time you release Fa Jin against a creature, your critical range against it widens by 1 for the rest of the combat, to a maximum of 15–20.</p>`);
A(s,"Unjointing","free","15 Coils",`<p>When you hit a creature at or below a quarter of its hit point maximum, and you have hit it this combat with all four limbs (Fist, Elbow, Knee and Kick), release 15 Coils. It must succeed on a Constitution saving throw or drop to 0 hit points. On a success, or if it spends a legendary resistance, it takes the Fa Jin damage of those 15 Coils instead. The Coils are spent either way.</p>`);

s=S("sifu-mover","Before the Mover 彼微動，己先動","sifu","Sifu 26",{src:"prestige",color:"#9fd8ff"});
A(s,"I Move First","free","10 Ki · once per round",`<p>When a creature you are Listening to begins an action, spend 10 Ki to take your Attack action immediately, before that action resolves. This uses neither your reaction nor your turn. If your strikes kill or incapacitate it, or hurl it out of the action's range, its action is lost.</p>`,{pay:{ki:10},once:"round"});
A(s,"If He Does Not Move, I Do Not Move","passive","end of turn",`<p>If you end your turn without spending any movement, you gain 3 Coils, and your Coils can't go slack that round. Tick "didn't move" on the Sifu tab before End turn.</p>`);

s=S("sifu-ahead","Sifu · ahead","sifu","levels 27–30 · not yet",{src:"prestige",color:"#5d7884"});
A(s,"27 · The Empty Vessel 煉神還虛","passive","locked",`<p>A single release of 10+ Coils that brings you to 0 makes you <b>Empty</b> until the end of your next turn: resistance to all damage, immune to charmed, frightened, grappled, restrained, paralyzed and stunned, attacks against you have disadvantage, and you can't gain Coils. <b>Wu Wei:</b> once per turn, use a bonus-action Ki feature without any action.</p>`,{lock:true});
A(s,"28 · Ten Thousand Kicks 萬腿","action","locked",`<p><b>Repetition</b> builds with consecutive hits from the same limb. <b>One Kick, Ten Thousand Times:</b> 15 Ki, one strike that deals the limb's full damage once per Repetition plus Fa Jin; you can't Parry and attacks against you have advantage until your next turn.</p>`,{lock:true});
A(s,"29 · Stealing the Art 偷師","free","locked",`<p>10 Ki to steal a technique a Listened creature uses (or one you Parry). Hold 1 + disciples; each use costs 5 Ki. The Curriculum assigns stolen techniques to Phases.</p>`,{lock:true});
A(s,"30 · Merging with the Dao 煉虛合道","passive","locked",`<p>Start of turn: +10 Ki and +5 Coils; Fa Jin any number of times; missing no longer breaks the chain. Every Fist Is My Fist, The Way Begets One, Robe and Bowl.</p>`,{lock:true});

/* =============== GATE OF THE LONG DUSK =============== */
s=S("dusk-21","Gate of the Long Dusk · 21st","dusk","evolves Touch of Death and Touch of the Long Death",{src:"prestige",color:"#a98bd6",
 blurb:"Water is your Phase. You attack the hit point maximum, so what you take can't be healed back."});
A(s,"Last Breath 嚥氣","free","no action · once per creature",`<p>When a creature within 30 feet drops to 0 hit points from any source, inhale its last breath:</p><ul><li>temporary hit points equal to your Wisdom modifier + 10% of the creature's hit point maximum;</li><li>3 Coils;</li><li>5 Ki, if your Water strike killed it.</li></ul><p><b>Exhaled to the Student.</b> Give the temporary hit points to a disciple within 60 feet instead. A borrowed breath fades at the end of your next turn. You can never inhale the same creature twice. <i>(Replaces Touch of Death.)</i></p>`);
A(s,"Deduct Days 奪算","passive","Water hit",`<p>When you hit with a Water strike, the target's hit point maximum is reduced by your Wisdom modifier. Your Water disciple deducts days too, using your modifier.</p>`);
A(s,"Deduct Years 奪紀","passive","Long Death release",`<p>When you release Fa Jin, you can make it a Long Death release. The Fa Jin damage becomes necrotic, and the target's hit point maximum is reduced by the same amount. A Long Death release can't hurl the target.</p>`);
A(s,"Touch of the Long Death","free","up to 20 Ki · any unarmed hit",`<p>Now works through any unarmed hit instead of taking an action. Spend up to 20 Ki on it (2d10 necrotic per Ki), and its damage also counts as Deducted Years. <i>DM ruling: no CON save; it rides the unarmed hit.</i> Set the Ki in the calculator when the strike is unarmed.</p>`);
A(s,"The Register","passive","until the creature's long rest",`<p>Deductions last until the creature finishes a long rest. A creature whose hit point maximum reaches 0 dies, and nothing short of a god can return it. Every entry is written in two columns: each time you Deduct Years, your own hit point maximum drops by 10% of the amount deducted until you finish a long rest.</p>`);

s=S("dusk-24","Gate of the Long Dusk · 24th","dusk","evolves Hour of Reaping",{src:"prestige",color:"#a98bd6"});
A(s,"Hour of the Long Dusk 長暮之時","bonus","5 Ki · free once per turn on a Great Circulation",`<p>Each creature you choose within 120 feet that can see or hear you makes a Wisdom save or is <b>paralyzed</b> until the end of your next turn, and can't regain hit points while paralyzed this way. A creature that succeeds is immune to the Hour for 24 hours and has advantage on its next attack roll against you. A creature paralyzed by the Hour can't be paralyzed by it again until it has taken a turn without being paralyzed. <i>(Replaces Hour of Reaping.)</i></p>`,{pay:{ki:5}});
A(s,"Seven Po 七魄","passive","Listened creatures",`<p>Each time you land a Generated strike on a creature you are Listening to (including a strike a disciple carries for you), one of its Po comes loose in order, each giving a cumulative −2 to its attack rolls and saving throws. Whenever a full round passes with no Generated strike on it, one loose Po settles back; all settle when combat ends.</p>
<p>1 Corpse Dog 尸狗 −2 · 2 Hidden Arrow 伏矢 −4 · 3 Sparrow Yin 雀陰 −6 · 4 Swallowing Thief 吞賊 −8 · 5 Not-Poison 非毒 −10 · 6 Remover of Filth 除穢 −12 · 7 Stinking Lungs 臭肺 −14 and <b>Desecrated</b>.</p>`);
A(s,"Desecration 褻瀆","passive","status · until combat ends",`<p>When the seventh Po comes loose the creature is Desecrated and its Po no longer return. Against it: it automatically fails the Hour's save; it counts as at or below a quarter of its hit points for Unjointing; at 30th level its hun can be severed. While a creature you Desecrated is alive, you count as undead too, and you can't Listen to any other creature.</p>
<p><b>Unhallowed Flesh:</b> counts as undead, loses necrotic resistance and immunity. <b>Rites Reversed:</b> can't regain HP or gain temp HP; its maximum drops by that amount instead. <b>The Body Lies Down:</b> CON save at the start of each of its turns or fall prone. <b>Open Grave:</b> soul effects can reach it. Ended early only by <i>greater restoration</i>, <i>hallow</i> or a similar rite performed by another creature.</p>`);

s=S("dusk-ahead","Gate of the Long Dusk · ahead","dusk","levels 27 and 30 · not yet",{src:"prestige",color:"#5d7884"});
A(s,"27 · Corpse Liberation 尸解","free","locked",`<p>At 0 HP, spend 10 / 20 / 30 Ki (escalating, resets on a long rest) to shed a husk and reappear within 120 feet at half your maximum, Empty and invisible. Each husk costs 10% of your maximum until a long rest.</p>`,{lock:true});
A(s,"30 · A Thousand Years Without Waking 千載永不寤","free","locked",`<p>Sever the three hun of a Desecrated creature with 10 Coils each: Shuangling, Youjing, Taiguang. Struck from the Register.</p>`,{lock:true});

/* =============== KÖS · SPIRIT MODULE =============== */
s=S("kos","KÖS · Spirit Module","kos","the hammer module for the Tempest Trident",{src:"equip",color:"#5aa9e6",
 blurb:"The DM noted more is coming for this module. Turning Year is referenced under Strain but not defined yet."});
A(s,"Mounting the Module","bonus","Bonus action",`<p>Seat or remove the hammer module on your trident. While mounted, the trident becomes a two-handed maul with 15-foot reach that deals an additional 6d12 bludgeoning on a hit, and each swing resolves against every creature in a 90-foot arc within that reach. Each swing expends two attacks from your Attack action, hit or miss. <i>DM rulings: every creature hit adds to Ripping Rapids, and swapping between trident, unarmed strikes and the hammer counts as a weapon switch.</i></p>`);
A(s,"Swapping","free","Free · after one swing",`<p>Seat or remove the module at any time after one swing, any number of times per turn, including between two attacks of the same Attack action and while airborne.</p>`);
A(s,"Displacement","passive","8% + 1% per 2 Swell · max 13%",`<p>Each creature struck by the Kös takes damage equal to 8% of its hit point maximum in addition to the weapon's dice, +1% for every 2 Swell, to a maximum of 13%. Bludgeoning, not reduced by resistance or immunity, and applied separately to each creature in the arc. <i>DM ruling: damage multipliers scale it.</i></p>`);
A(s,"Swell","passive","max 10 · empties on a rest",`<p>Gain 1 Swell for every 15 feet you move, 1 whenever you take damage and aren't reduced to 0, 1 whenever a Shockwave you created damages a creature, and 2 whenever two of your Shockwaves interfere.</p>`);
A(s,"Shockwave","passive","on every Kös hit",`<p>A wall of compressed water and air 20 feet wide that travels in a direction you choose, moving 30 feet at the start of each of your turns, for 3 rounds. The first time on a turn it moves through a creature's space, the creature makes a Strength save (Ki save DC): 6d12 bludgeoning + 4% of its maximum and pushed 10 feet on a failure, half and no push on a success. Any number can be active.</p>`);
A(s,"Interference","passive","",`<p>When two of your Shockwaves occupy the same space they combine into one that deals the total of both, doubled, continuing along the bisector. A creature in that space takes it with no save and is stunned until the end of its next turn. Three combining deal the total of all three, tripled, then doubled.</p>`);
A(s,"Water Hammer","passive","",`<p>Kös and Shockwave damage ignores cover, armor, shields and interposed creatures. Nonmagical barriers, and spell barriers of 7th level or lower, are destroyed on contact; higher ones and Praxis barriers are suppressed until the end of your next turn and take the damage. A Shockwave suppresses hostile auras and zones along its path. A creature made mostly of water takes one extra damage die and makes a CON save or is stunned until the end of its next turn.</p>`);
A(s,"Cavitation","passive","end of turn",`<p>Each Kös hit and each Shockwave that damages a creature resolves a second time at the end of that turn for half the damage dice and half the Displacement. It isn't an attack and can't be dodged, blocked, parried, countered, reduced or reacted to. A creature that perceives mainly through tremorsense, blindsight or hearing makes a CON save or is blinded and deafened until the end of its next turn. The sheet queues these and applies them at End turn.</p>`);
A(s,"Ground and Sky","passive","",`<p>While mounted and touching the ground: speed halved, no Dash, disadvantage on Stealth. Airborne: none of these. You take no falling damage, falling doesn't use movement, you can fall up to 200 feet a turn at up to 45° from vertical.</p>`);
A(s,"The Set","passive","willing allies in the arc",`<p>An ally caught in the arc takes no damage; move them up to 60 feet in any direction without provoking, ignoring terrain and barriers. They gain 3 Momentum and advantage on their first attack before the end of their next turn. Moved upward, they are airborne under their own control and take no landing damage. Still costs two attacks.</p>`);
A(s,"Cloudbreak","bonus","Bonus · airborne · free after Launch",`<p>Each creature within 20 feet of your impact makes a DEX save: 10d12 bludgeoning + 10% of its maximum, half on a success. Create four Shockwaves. The ground within 20 feet becomes difficult terrain and standing water, where Shockwaves move at double speed. For each of the four that damages a creature, you're thrown 30 feet back into the air.</p>`);
A(s,"The Rain","passive","first Cloudbreak of a combat",`<p>Rain for the rest of the combat: every surface counts as water for Crashing Tide, Shockwaves move at double speed, water features have no range limit. As a bonus action, ascend into the cloud and descend anywhere. Allies in the rain regain HP equal to your Swell at the start of their turns; hostile creatures take 2% of their maximum at the start of theirs, have disadvantage on Perception, and can't use fire, smoke, gas, dust or spore effects. Each further Cloudbreak advances it to <b>downpour</b>, then <b>flooding</b> (all ground standing water, non-aquatic hostiles at half speed). Each stage beyond the first gives you a level of Strain until a long rest, and at flooding you take 5% of your maximum at the start of each of your turns.</p>`);
A(s,"Strain","passive","−1 attacks and saves per level",`<p>Each level gives a cumulative −1 to attack rolls and saving throws. Strain from the Kös ends on a short rest; Strain from the rain and from the Turning Year ends only on a long rest.</p>`);
A(s,"The Narrows","action","6 Swell · Action",`<p>Melee attack with the trident against one creature. On a hit it is impaled: speed 0, no teleport or plane travel, can't be moved. The head launches up to 60 feet beyond it. While In The Narrows it takes 8d12 + 10% of its maximum at the start of each of its turns (no save), +1d12 and +2% each round; it is vulnerable to all damage, AC −5, attacked as though restrained and prone, can't be healed or helped, and every Shockwave you create routes through it first. You can't use other techniques and make a concentration check (Ki save DC) each time you're hit.</p>`,{pay:{swell:6}});
A(s,"The Closing","action","Action · ends The Narrows",`<p>CON save: 30d12 + 25% of its maximum, half on a success. If that leaves it below a quarter of its maximum, it drops to 0. Create eight Shockwaves radiating outward, which interfere normally. Each ally who can hear it can immediately take one action.</p>`);
A(s,"The Anchor","bonus","2 Swell · Bonus",`<p>Throw the head up to 90 feet to set in a surface, object or creature, then pull yourself to it or it to you. Creatures in its path make a STR save or are dragged along and knocked prone.</p>`,{pay:{swell:2}});
A(s,"Breakwater","reaction","1 Swell · Reaction",`<p>When you or an ally within 10 feet would be targeted, plant the head: you and each ally in a 10-foot line behind you have total cover against it unless it comes from a Praxis or a Transcendence. The blocked attack becomes a Shockwave travelling back along its path.</p>`,{pay:{swell:1},hook:"breakwater"});
A(s,"Mehter","bonus","3 Swell · Bonus · concentration",`<p>Keep time with the haft for up to 1 minute. Allies who hear it gain +2 to attack rolls and saves and can't be frightened. The tempo advances one step at the start of each of your turns, adding +2 per step. On the fourth step, each ally can take one additional action on its next turn, and you take 8d20 untyped damage. <i>DM ruling: Mehter stops after the fourth step.</i></p>`,{pay:{swell:3},hook:"mehter"});

/* ===================== CONSTANTS ===================== */

var STANCE={};(C.stances||[]).forEach(function(s){STANCE[s.id]=s;});

/* ===================== STATE ===================== */
function defaults(){
 var s={schema:4,seq:500,stats:clone(C.stats),pb:C.pb||8,kiMax:C.kiMax||46,ident:clone(C.identity||{}),
  skills:{},skillMisc:clone(C.skillMisc||{}),initMisc:C.initMisc||0,speed:C.speed||60,
  hp:{cur:-1,temp:0},death:{s:0,f:0},exh:0,cond:{},sit:{ac:0,speed:0},
  res:{},stance:"tide",phase:"",phaseRounds:0,eq:{mode:"base",reflect:"",rotate:[]},
  combo:{v:0,miss:0,last:"",lastT:"",streak:0,inf:{},beat:false,beatMiss:0,turnHit:false,saveUsed:false,armSwitch:false},

  flags:{killReady:false,revolt:false,ebb:false,savageUsed:false,sneakUsed:false,water:false,submerged:false,light:false,pactHunger:0,drown:false},
  eco:{},targets:[],effects:[],kitPin:{},round:1,log:[],notes:{fight:"",char:""},
  wild:{on:false,form:"",hp:0,hpMax:0,ac:0,speed:"",atk:[],note:""},
  spells:{slots:{},list:(C.spells||[]).map(function(x,i){var o=clone(x);o.id="sp"+i;return o;})},
  rt:{feat:"flurry",ext:0},ld:{ki:5},
  status:[],monkFl:{left:0,max:0},dmg:{src:"w:Fists",ov:"",grp:"weapons",tgt:"",n:1,xd:0,flat:0,tog:{},off:{},riders:{},custRiders:[],style:"regular",build:true,pay:true,apply:true,lines:[]},
  sf:sfDefaults(),dusk:{self:0,breathFade:0,breathTemp:0},kos:kosDefaults(),kitCustom:[],turnOn:false,
  ui:{pane:"turn",fold:false,kitKind:"all",kitSrc:"all",kxCompact:false,kitQ:"",phaseHeal:false,stQ:"",stCat:"all",stPick:false,stOpen:""}};
 SKILLS.forEach(function(k){s.skills[k[0]]=(C.skills&&C.skills[k[0]]!=null)?C.skills[k[0]]:0;});
 for(var L in (C.spellSlots||{}))s.spells.slots[L]={max:C.spellSlots[L],left:C.spellSlots[L]};
 return s;}
function deep(t,src){for(var k in src){if(!src.hasOwnProperty(k))continue;var v=src[k];
 if(v&&typeof v==="object"&&!Array.isArray(v)&&t[k]&&typeof t[k]==="object"&&!Array.isArray(t[k]))deep(t[k],v);else t[k]=v;}return t;}
var S=defaults();
var store={get:function(k){try{return window.localStorage.getItem(k);}catch(e){return null;}},set:function(k,v){try{window.localStorage.setItem(k,v);}catch(e){}}};

 if(S.pend&&S.pend.drop&&S.pend.drop.why==="stance shift")S.pend.drop=null;
 if(!Array.isArray(S.status))S.status=[];if(!S.monkFl)S.monkFl={left:0,max:0};if(!S.flags.frGain)S.flags.frGain={};
 if(!Array.isArray(S.targets))S.targets=[];if(!Array.isArray(S.effects))S.effects=[];if(!Array.isArray(S.log))S.log=[];
 if(!S.dmg||!Array.isArray(S.dmg.lines))S.dmg=defaults().dmg;["tog","off","riders"].forEach(function(k){if(!S.dmg[k])S.dmg[k]={};});if(!Array.isArray(S.dmg.custRiders))S.dmg.custRiders=[];
 if(!Array.isArray(S.eq.rotate))S.eq.rotate=[];if(!S.st.adapt)S.st.adapt={};
 (C.resources||[]).forEach(function(r){if(typeof S.res[r.id]!=="number")S.res[r.id]=-1;});
 S.targets.forEach(function(t){if(!t.st)t.st={};if(t.vit==null)t.vit=0;if(t.markHits==null)t.markHits=0;});
 if(!STANCE[S.stance])S.stance="tide";sfSanitize();}
var hintT=null;
function save(){S.schema=4;store.set(KEY,JSON.stringify(S));
 var h=$("saveHint");if(h){h.textContent="Saved";h.classList.add("flash");clearTimeout(hintT);hintT=setTimeout(function(){h.textContent="Saved to this device";h.classList.remove("flash");},900);}}
function uid(p){S.seq=(S.seq||500)+1;return (p||"x")+S.seq;}
function logline(t){S.log.push("R"+S.round+"  "+t);if(S.log.length>80)S.log=S.log.slice(-80);}
function toast(msg){var h=$("saveHint");if(!h)return;h.textContent=msg;h.classList.add("flash");clearTimeout(hintT);hintT=setTimeout(function(){h.textContent="Saved to this device";h.classList.remove("flash");},2800);}
function flash(msg){var b=$("bar");if(b){b.style.borderTopColor="#cf4763";setTimeout(function(){b.style.borderTopColor="";},450);}if(msg)toast(msg);}

/* ===================== DERIVED ===================== */
function highestKey(o){var hk="str",hv=-Infinity;STATS.forEach(function(s){if(num(o[s[0]])>hv){hv=num(o[s[0]]);hk=s[0];}});return hk;}
function inStance(id){return S.stance===id||S.stance==="praxis";}
function effStats(){var b=S.stats,e={};STATS.forEach(function(s){e[s[0]]=num(b[s[0]]);});
 if(S.eq.mode==="reflection"&&S.eq.reflect)e[S.eq.reflect]=num(b[highestKey(b)]);
 else if(S.eq.mode==="rotation"&&S.eq.rotate.length===2){var a=S.eq.rotate[0],c=S.eq.rotate[1];e[a]=num(b[c]);e[c]=num(b[a]);}
 if(inStance("wendigo"))for(var k in WEN_ADD)e[k]+=WEN_ADD[k];
 return e;}
function resMax(r,d){if(typeof r.max==="number")return r.max;if(r.max==="kiMax")return d&&d.kiMax!=null?d.kiMax:num(S.kiMax);if(r.max==="pb")return d.pb;if(r.max==="wisMod")return Math.max(1,d.mod.wis);return 0;}
function resDef(id){return (C.resources||[]).filter(function(r){return r.id===id;})[0];}
function compute(){
 var d={mod:{},save:{},skill:{},bmod:{}};d.stat=statusAgg();d.stats=effStats();
 STATS.forEach(function(s){d.mod[s[0]]=mod(d.stats[s[0]]);d.bmod[s[0]]=mod(S.stats[s[0]]);});
 d.pb=num(S.pb,8);d.hm=-99;STATS.forEach(function(s){if(d.mod[s[0]]>d.hm)d.hm=d.mod[s[0]];});
 d.level=0;d.dieSum=0;(C.classes||[]).forEach(function(c){d.level+=c.level;var pr=c.prestige,pl=pr?Math.max(0,c.level-pr.from+1):0;d.dieSum+=(c.level-pl)*c.die+pl*(pr?pr.die:0);});
 d.monk=(C.classes[0]||{}).level||0;
 d.hpMax=d.dieSum+d.level*d.mod.con;if(S.exh>=4)d.hpMax=Math.floor(d.hpMax/2);d.hpStatCut=d.stat.hpPct?Math.floor(d.hpMax*d.stat.hpPct/100):0;d.hpMax-=d.hpStatCut;d.hpCut=num(S.sf.burnHP)+num(S.dusk.self);d.hpMax=Math.max(1,d.hpMax-d.hpCut);
 d.strain=num(S.kos.strainK)+num(S.kos.strainR)+num(S.kos.strainY);
 STATS.forEach(function(s){d.save[s[0]]=d.mod[s[0]]+d.pb+(s[0]==="wis"&&S.reso.on?2:0)+d.stat.sv+(d.stat.svStat[s[0]]||0)-d.strain;});
 SKILLS.forEach(function(k){var l=S.skills[k[0]]||0;d.skill[k[0]]=d.mod[k[1]]+(l===1?d.pb:l===2?d.pb*2:0)+num(S.skillMisc[k[0]]);});
 d.passive=10+d.skill.Perception;d.dc=8+d.pb+d.mod.wis;d.spellAtk=d.pb+d.mod.wis;d.atk=d.pb+d.mod.dex-d.strain;
 d.init=d.mod.dex+d.pb+num(S.initMisc)+d.stat.init;
 var acB=[];d.ac=10+d.mod.dex+d.mod.wis;acB.push("10 + DEX "+sgn(d.mod.dex)+" + WIS "+sgn(d.mod.wis));
 if(inStance("tide")){d.ac+=1;acB.push("trident +1");}
 if(num(S.st.shattered)){d.ac+=num(S.st.shattered);acB.push("clones +"+S.st.shattered);}
 if(S.combo.beat){d.ac+=3;acB.push("Beatdown +3");}
 if(hasFx("Anchor Stance")){d.ac+=2;acB.push("Anchor +2");}
 if(num(S.sit.ac)){d.ac+=num(S.sit.ac);acB.push("sit "+sgn(num(S.sit.ac)));}
 if(d.stat.ac){d.ac=Math.max(0,d.ac+d.stat.ac);acB.push("status "+sgn(d.stat.ac));}if(d.stat.acSet!=null&&d.ac>d.stat.acSet){d.ac=d.stat.acSet;acB.push("status cap "+d.stat.acSet);}
 d.acBits=acB.join(" · ");
 d.speed=num(S.speed)+num(S.sit.speed);if(inStance("wendigo"))d.speed*=4;if(S.flags.killReady)d.speed=Math.floor(d.speed*1.5);if(S.exh>=5)d.speed=0;else if(S.exh>=2)d.speed=Math.floor(d.speed/2);
 d.kosGround=!!(S.kos.mounted&&!S.kos.air);if(d.kosGround)d.speed=Math.floor(d.speed/2/5)*5;
 var G=d.stat;d.speed+=G.spd;if(G.spdSet!=null)d.speed=Math.min(d.speed,G.spdSet);if(G.spdHalf)d.speed=Math.floor(d.speed/2/5)*5;if(G.spd0)d.speed=0;d.speed=Math.max(0,d.speed);
 d.disc=(S.sf.disc||[]).filter(function(x){return x&&x.on;}).length;d.kiMax=Math.max(0,num(S.kiMax)-3*d.disc);d.deflect=10+d.mod.dex+d.monk;
 var hp=num(S.hp.cur);d.hpPct=d.hpMax?hp/d.hpMax:1;d.eop=Math.min(5,Math.floor(Math.max(0,(1-d.hpPct))*100/20+1e-9));
 d.fatalOk=d.hpPct<=0.30||S.flags.drown;d.low25=d.hpPct<0.25;
 var v=S.combo.v;d.chain=(v>=10?1:0)+(v>=20?2:0);
 d.eco=[{id:"act",n:"Action",max:1},{id:"bon",n:"Bonus action",max:d.stat.noBonus?0:1+(S.phase==="first"?1:0)},
  {id:"atk",n:"Attacks",max:(inStance("shaman")&&S.stance==="shaman"?4:2)+d.chain+(S.phase==="full"?1:0),note:"Extra Attack 2"+(d.chain?" · chain +"+d.chain:"")+(S.phase==="full"?" · Full Moon +1":"")},
  {id:"rx",n:"Dynamic Reactions",max:d.stat.noRx?0:Math.max(0,3+(inStance("shaman")?1:0)+(S.phase==="new"?1:0)+d.stat.dr)},
  {id:"leg",n:"Legendary Reaction",max:v>=15?1:0,note:"Combo 15+"}];
 d.vitCap=S.flags.drown?99:v>=80?3:v>=50?2:1;
 return d;}
function hasFx(name){return S.effects.some(function(e){return e.name===name;});}
function resVal(id){return num(S.res[id]);}
function resSet(id,v){var r=resDef(id);if(!r)return;var mx=resMax(r,compute());S.res[id]=clamp(Math.round(num(v)),0,mx);}
function ensureRes(d){(C.resources||[]).forEach(function(r){if(num(S.res[r.id],-1)<0)S.res[r.id]=(r.rest==="encEmpty"||r.rest==="restEmpty")?0:resMax(r,d);else S.res[r.id]=Math.min(S.res[r.id],resMax(r,d));});
 d.eco.forEach(function(e){var o=S.eco[e.id];if(!o)o=S.eco[e.id]={left:e.max,adj:0};var mx=Math.max(0,e.max+num(o.adj));if(o.left>mx||o.left<0)o.left=mx;e.mx=mx;});}

/* ===================== COMBO ENGINE ===================== */
function tierOf(v){var t=null;(C.thresholds||[]).forEach(function(x){if(v>=x[0])t=x;});return t;}
function nextTier(v){var t=null;(C.thresholds||[]).some(function(x){if(x[0]>v){t=x;return true;}return false;});return t;}
function comboSet(nv,why){var old=S.combo.v;nv=clamp(Math.round(nv),0,100);S.combo.v=nv;
 if(nv>old){
  if(old<40&&nv>=40&&S.stance!=="praxis"){
   if(resVal("praxis")>0){S.res.praxis--;praxisStart(true);logline("Combo 40: Pilgrim's Praxis auto-triggers, no Ki");}
   else logline("Combo 40 reached, Praxis already used this long rest");}
  if(old<100&&nv>=100){var d=compute();S.res.ki=d.kiMax;S.flags.drown=true;S.pend.drown=true;logline("THE DROWNED MOON: Ki refilled, Vital uncapped this round, free maximized Fatal Blow");}}
 if(why)logline("Combo "+sgn(nv-old)+" ("+why+") → "+nv);}
function comboReset(){S.combo.v=0;S.combo.miss=0;S.combo.last="";S.combo.lastT="";S.combo.streak=0;S.combo.inf={};S.combo.beat=false;S.combo.beatMiss=0;S.combo.armSwitch=false;S.pend.drop=null;}
function comboWouldDrop(why){if(S.combo.v<=0)return;S.pend.drop={why:why,from:S.combo.v};}
function eroAmount(){return S.combo.beat||S.combo.v>=36?3:S.combo.v>=10?2:1;}
/* returns {gain, ki, ero, sw} */
function comboHits(o){var d=compute(),gain=0,ki=0,ero=0,sw=false,t=o.tid?tById(o.tid):null,n=Math.max(1,num(o.hits,1)),start=S.combo.v;
 for(var i=0;i<n;i++){var g=1;
  if(i===0&&(o.special||S.combo.armSwitch||(o.limb&&S.combo.last&&o.limb!==S.combo.last))){g+=2;sw=true;S.combo.armSwitch=false;}
  gain+=g;S.combo.v=clamp(S.combo.v+g,0,100);
  var kh=S.combo.v>=90?3:S.combo.v>=50?2:S.combo.v>=25?1:0;ki+=kh;
  if(t){if(S.combo.lastT===t.id)S.combo.streak++;else S.combo.streak=1;S.combo.lastT=t.id;
   var e=0;if(S.combo.beat)e=3;else if(S.combo.streak>=2&&S.combo.streak%2===0)e=eroAmount();
   if(e){t.ero=num(t.ero)+e;ero+=e;}
   if(t.st.mark){t.markHits=num(t.markHits)+1;if(t.markHits===3)logline("Echo of the Hunter: Foe Insight ready on "+t.name);}}
 }
 var fin=S.combo.v;S.combo.v=start;comboSet(fin,null);gain=fin-start;
 if(ki){var mx=d.kiMax;S.res.ki=Math.min(mx,resVal("ki")+ki);}
 S.combo.last=o.limb||S.combo.last;S.combo.miss=0;S.combo.turnHit=true;
 if(inStance("tide")&&o.limb==="trident"){S.st.echo=Math.min(3,num(S.st.echo)+n);S.st.tideHits=num(S.st.tideHits)+n;}
 return {gain:gain,ki:ki,ero:ero,sw:sw};}
function comboMiss(){S.combo.miss++;S.st.tideHits=0;if(S.sf&&S.sf.chain.length){S.sf.chain=[];logline("Miss breaks the Phase chain");}
 if(S.combo.beat){S.combo.beatMiss++;if(S.combo.beatMiss>=3){S.combo.beat=false;S.pend.final=true;logline("Beatdown ends after 3 misses. Final Wave available");}}
 if(S.combo.miss>=3)comboWouldDrop("three misses in a row");logline("Miss ("+S.combo.miss+"/3)");}

/* ===================== TARGETS ===================== */
function tById(id){for(var i=0;i<S.targets.length;i++)if(S.targets[i].id===id)return S.targets[i];return null;}
/* Players don't know a target's max HP or AC. Targets keep counts instead: damage dealt, % of max HP dealt, AC reduction, max HP deducted. The DM keeps the real numbers. */
function tACred(t){return num(t.ero)+(S.kos&&S.kos.narrows&&S.kos.narrows.tid===t.id?5:0);}
function tAC(t){return "−"+tACred(t);}
function tPct(p){return Math.round(num(p)*100)/100;}
function tTally(t){return num(t.dealt)+" dealt"+(num(t.dpct)?" + "+tPct(t.dpct)+"% max HP":"");}
function krushReasons(t,d){var r=[];if(!t)return r;if(num(t.ero)>=6)r.push("Erosion −"+t.ero);if(t.st.frozen)r.push("Frozen Solid");if(t.st.broken)r.push("Erosion Broken");if(t.st.weak2)r.push("Weakened twice");if(!t.st.acted)r.push("first strike");if(d.low25)r.push("you below 25%");return r;}
function killTarget(t){t.down=true;S.flags.killReady=true;
 if(S.kos&&S.kos.narrows&&S.kos.narrows.tid===t.id){S.kos.narrows={tid:"",r:0};}
 if(!t.inhaled)S.pend.breath=t.id;

function sfAct(a,el,d){var id=el.getAttribute("data-id"),n=num(el.getAttribute("data-n")),t=id?tById(id):null,parts=[],v;

  v=Math.floor(rd*(1+0.1*rc));S.res.coil=resVal("coil")-rc;S.sf.act.parry=true;t=tById(S.dmg.tgt);
  if(t)hitTarget(t,v);dmgLine("Lead into Emptiness"+(rc?" · "+rc+" Coils":""),t,v,rd+" × (1 + "+rc+" × 10%) = "+v,"redirected Parry");logline("Redirected "+v+(t?" into "+t.name:""));S.sf.redDmg=0;S.sf.redC=0;return true;

 /* calculator */
 case "dgrp":S.dmg.grp=id;var first=dmgSources(d).filter(function(s){return s.g===id;})[0];if(first&&(!srcByKey(d,S.dmg.src)||srcByKey(d,S.dmg.src).g!==id))S.dmg.src=first.key;break;

  toCalc("k:"+id);return;

/* ===================== SEARCH PALETTE ===================== */
var IDX=[],palSel=0,palHits=[];
function buildIndex(){IDX=[];document.querySelectorAll(".pane").forEach(function(p){var pid=p.id.replace("pane-",""),pn=p.getAttribute("data-name");
 p.querySelectorAll("section").forEach(function(sec){var h=sec.querySelector("h2");if(!h)return;IDX.push({p:pid,pn:pn,el:sec,t:(h.childNodes[0].nodeValue||h.textContent).trim(),x:sec.textContent.replace(/\s+/g," ").slice(0,240)});
  sec.querySelectorAll(".kx-ab").forEach(function(ab){var nm=ab.querySelector(".kx-n");if(nm)IDX.push({p:pid,pn:pn,el:ab,t:nm.textContent.trim(),x:ab.textContent.replace(/\s+/g," ").slice(0,300)});});
  sec.querySelectorAll("details.kc").forEach(function(dt){var nm=dt.querySelector(".kn");if(!nm)return;IDX.push({p:pid,pn:pn,el:dt,t:nm.textContent.trim(),x:dt.textContent.replace(/\s+/g," ").slice(0,300)});});});});}
function palOpen(){buildIndex();$("palBack").classList.add("on");$("pal").classList.add("on");$("palIn").value="";palSearch("");$("palIn").focus();}
function palClose(){$("palBack").classList.remove("on");$("pal").classList.remove("on");}
function palSearch(q){q=q.trim().toLowerCase();palHits=[];var seen={};
 IDX.forEach(function(e){if(palHits.length>=40)return;if(!q||e.t.toLowerCase().indexOf(q)>-1){palHits.push(e);seen[IDX.indexOf(e)]=1;}});
 if(q)IDX.forEach(function(e,i){if(palHits.length>=40||seen[i])return;if(e.x.toLowerCase().indexOf(q)>-1)palHits.push(e);});palSel=0;drawPal();}
function drawPal(){var res=$("palRes");res.innerHTML="";if(!palHits.length){res.innerHTML='<button disabled style="color:var(--dimmer)">Nothing on the sheet matches that.</button>';return;}
 palHits.forEach(function(e,i){var b=document.createElement("button");if(i===palSel)b.className="sel";b.innerHTML='<span class="k">'+esc(e.pn)+'</span><b>'+esc(e.t)+'</b><br><span style="color:var(--dim);font-size:13px">'+esc(e.x.slice(0,110))+'</span>';b.addEventListener("click",function(){jump(e);});res.appendChild(b);});}
function jump(e){palClose();showPane(e.p);S.ui.pane=e.p;save();setTimeout(function(){if(e.el.tagName==="DETAILS")e.el.open=true;var b=$("bar"),off=(b&&getComputedStyle(b).position==="sticky"?b.offsetHeight:0)+14;window.scrollTo({top:e.el.getBoundingClientRect().top+window.pageYOffset-off,behavior:"smooth"});e.el.classList.remove("hit");void e.el.offsetWidth;e.el.classList.add("hit");},40);}
function wirePal(){$("palBack").addEventListener("click",palClose);$("palIn").addEventListener("input",function(){palSearch(this.value);});
 $("palIn").addEventListener("keydown",function(e){if(e.key==="ArrowDown"){e.preventDefault();palSel=Math.min(palHits.length-1,palSel+1);drawPal();}else if(e.key==="ArrowUp"){e.preventDefault();palSel=Math.max(0,palSel-1);drawPal();}else if(e.key==="Enter"&&palHits[palSel]){e.preventDefault();jump(palHits[palSel]);}});}

if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot);else boot();
window.__sheet={get S(){return S;},compute:compute,act:act,renderAll:renderAll,strike:strike,dmgOpts:dmgOpts,endTurn:endTurn,startTurn:startTurn,endRound:endRound};
})();
