<title>Sealed</title>
<style>
:root{--void:#070608;--line:#2e2638;--bone:#ece6d8;--dim:#a9a0b2;--ac:#c2abff;--blood:#d8434f}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(900px 500px at 50% -10%,rgba(194,171,255,.08),transparent 60%),var(--void);color:var(--bone);font-family:Georgia,'Cormorant Garamond',serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.box{width:min(380px,100%);border:1px solid var(--line);border-top:3px solid var(--ac);border-radius:14px;padding:22px;background:#130f19}
h1{font-size:20px;letter-spacing:.08em;margin-bottom:6px}
p{color:var(--dim);font-size:14px;margin-bottom:14px}
input[type=password]{width:100%;font-size:16px;padding:9px 11px;border-radius:8px;border:1px solid var(--line);background:#0f0b14;color:var(--bone)}
input[type=password]:focus{outline:none;border-color:var(--ac)}
label{display:flex;gap:7px;align-items:center;font-size:13px;color:var(--dim);margin:10px 0 14px}
button{width:100%;font-size:15px;padding:9px;border-radius:8px;border:1px solid var(--ac);background:#c2abff22;color:#fff;cursor:pointer}
.err{color:#ffb3ba;font-size:13px;min-height:18px;margin-top:10px}
</style>

  <button type="submit">Open</button>

</form>

function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
function open(pass){
  var enc=new TextEncoder();
  return crypto.subtle.importKey("raw",enc.encode(pass),"PBKDF2",false,["deriveKey"]).then(function(k){
    return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(P.salt),iterations:P.iter,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["decrypt"]);

  .then(function(buf){return new TextDecoder().decode(buf);});
}
function show(html){document.open();document.write(html);document.close();}
