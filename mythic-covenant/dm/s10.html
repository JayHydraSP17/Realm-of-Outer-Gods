function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
function open(pass){
  var enc=new TextEncoder();
  return crypto.subtle.importKey("raw",enc.encode(pass),"PBKDF2",false,["deriveKey"]).then(function(k){
    return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(P.salt),iterations:P.iter,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["decrypt"]);
  }).then(function(key){return crypto.subtle.decrypt({name:"AES-GCM",iv:b64(P.iv)},key,b64(P.ct));})
  .then(function(buf){return new TextDecoder().decode(buf);});
}
function show(html){document.open();document.write(html);document.close();}
var err=document.getElementById("err"),f=document.getElementById("f");
if(!window.crypto||!crypto.subtle){err.textContent="This browser can't open sealed pages (it needs https or localhost).";}
var saved=null;try{saved=localStorage.getItem(KEY);}catch(e){}
if(saved){open(saved).then(show).catch(function(){try{localStorage.removeItem(KEY);}catch(e){}});}
f.addEventListener("submit",function(e){e.preventDefault();var pw=document.getElementById("pw").value;if(!pw)return;err.textContent="Opening…";
  var rem=document.getElementById("rem").checked;
  open(pw).then(function(html){if(rem){try{localStorage.setItem(KEY,pw);}catch(x){}}show(html);},function(){err.textContent="That passphrase didn't work.";});});
})();
</script>
