<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yohan · The Diamond in the Rough </title>
<link rel="preconnect" href="https://fonts.googleapis.com/">
<link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --void:#070608;--panel:#17131e;--line:#2e2638;--line2:#453a52;
  --bone:#ece6d8;--dim:#a9a0b2;--dimmer:#7a7288;
  --blood:#d8434f;--gold:#d9b154;--veil:#5fd2c0;--soul:#c2abff;--amber:#e8b04a;
  --ac:#c2abff;--ac-soft:#c2abff22;--ac-line:#c2abff66;--brand:#c2abff;
  --rib:linear-gradient(90deg,#5fd2c0,#c2abff,#d9b154,#e0506b);
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{background:radial-gradient(1100px 560px at 82% -12%,rgba(194,171,255,.08),transparent 60%),radial-gradient(900px 500px at -10% 108%,rgba(216,67,79,.07),transparent 60%),var(--void);
  color:var(--bone);font-family:'Cormorant Garamond',Georgia,serif;font-size:18px;line-height:1.55;padding:0 0 90px;}
.wrap{max-width:980px;margin:0 auto;padding:0 18px;position:relative;z-index:1;}
@media(min-width:1120px){.wrap{margin-left:288px;max-width:1090px;}}
h1,h2,h3,h4,.cz{font-family:'Cinzel',serif;font-weight:600;letter-spacing:.02em;}
.mono{font-family:'IBM Plex Mono',monospace;}
button{font:inherit;}

/* rail */
.rail{position:fixed;left:0;top:0;bottom:0;width:268px;z-index:70;overflow-y:auto;background:linear-gradient(180deg,#120f17,#08070a);border-right:1px solid var(--line);}
.rail-brand{padding:22px 18px 14px;border-bottom:1px solid var(--line);}
.rail-brand .eb{font-family:'Cinzel';font-size:10px;letter-spacing:.26em;color:var(--brand);text-transform:uppercase;}
.rail-brand .nm{font-family:'Cinzel Decorative';font-weight:900;font-size:30px;line-height:1.05;margin:8px 0 5px;color:#fff;}
.rail-brand .lv{font-family:'IBM Plex Mono';font-size:11px;color:var(--dim);}
.rail-search{margin:13px 14px 6px;display:flex;align-items:center;gap:9px;padding:9px 11px;cursor:pointer;background:#150f1c;border:1px solid var(--line);border-radius:9px;color:var(--dim);font-family:'Cinzel';font-size:12.5px;}
.rail-search:hover{border-color:var(--ac);}
.rail-search .kbd{margin-left:auto;font-family:'IBM Plex Mono';font-size:9.5px;color:var(--dimmer);border:1px solid var(--line);padding:1px 4px;border-radius:4px;}
.rail-nav{padding:8px 10px 26px;}
.rail-grp{font-family:'IBM Plex Mono';font-size:9.5px;letter-spacing:.2em;color:var(--dimmer);text-transform:uppercase;margin:14px 8px 6px;}
.rail-btn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 11px;margin-bottom:2px;background:none;border:1px solid transparent;border-radius:8px;color:var(--dim);cursor:pointer;font-family:'Cinzel';font-size:14px;font-weight:500;}
.rail-btn .gl{width:7px;height:7px;background:var(--c,var(--ac));flex:none;transform:rotate(45deg);opacity:.6;}
.rail-btn .ct{margin-left:auto;font-family:'IBM Plex Mono';font-size:10px;color:var(--dimmer);}
.rail-btn:hover{color:var(--bone);background:#17111f;}
.rail-btn.on{color:#fff;background:#1d1527;border-color:var(--line2);}
.rail-btn.on .gl{opacity:1;box-shadow:0 0 9px var(--c,var(--ac));}
@media(max-width:1119px){
  .rail{position:static;width:auto;display:flex;flex-wrap:wrap;gap:6px;padding:12px;border-right:none;border-bottom:1px solid var(--line);}
  .rail-brand{width:100%;padding:4px 6px 12px;border:none;}
  .rail-search{margin:0;flex:1 1 170px;}
  .rail-nav{display:flex;flex-wrap:wrap;gap:5px;padding:6px 0 0;width:100%;}
  .rail-grp{display:none;} .rail-btn{width:auto;padding:7px 12px;font-size:13px;border:1px solid var(--line);}
}

/* tracker bar */
.bar{position:sticky;top:0;z-index:60;display:flex;gap:10px;flex-wrap:wrap;background:linear-gradient(180deg,rgba(18,15,23,.97),rgba(8,7,10,.97));backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);border:1px solid var(--line);border-top:3px solid var(--ac);border-radius:0 0 14px 14px;padding:12px 14px;margin-bottom:12px;box-shadow:0 14px 30px #000a;}
.tk{background:linear-gradient(180deg,#1a1522,#141019);border:1px solid var(--line);border-radius:11px;padding:9px 11px;min-width:180px;flex:1 1 180px;}
.tk .num.w44{width:40px;}
.tk .sl{font-size:13px;}
.tk .row{gap:4px;}
.tk .big{width:58px!important;font-size:19px!important;color:#fff;}
.tk-h{font-family:'Cinzel';font-size:11px;letter-spacing:.1em;color:var(--ac);display:flex;align-items:center;gap:7px;margin-bottom:7px;text-transform:uppercase;}
.tk-h .d{width:7px;height:7px;background:currentColor;transform:rotate(45deg);flex:none;}
.tk-h .chipx{margin-left:auto;}
.row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.btn{font-family:'Cinzel';min-width:28px;height:28px;border-radius:7px;border:1px solid var(--line);background:#171120;color:var(--bone);font-size:14px;cursor:pointer;line-height:1;padding:0 8px;transition:.14s;}
.btn:hover{border-color:var(--ac);color:#fff;background:#1e1629;}
.btn:disabled{opacity:.35;cursor:not-allowed;}
.btn.sm{height:23px;font-size:11px;min-width:24px;padding:0 7px;}
.btn.lg{height:36px;padding:0 15px;font-size:14px;}
.btn.pri{border-color:var(--ac);color:#fff;background:var(--ac-soft);}
.btn.dgr:hover{border-color:var(--blood);color:#ffb3ba;}
.cur{font-family:'Cinzel';font-weight:700;font-size:22px;color:#fff;min-width:40px;text-align:center;}
.sl{color:var(--dimmer);}
.num{font-family:'Cinzel';font-weight:600;font-size:15px;width:62px;text-align:center;color:var(--gold);background:#100c15;border:1px solid var(--line);border-radius:6px;padding:3px 2px;-moz-appearance:textfield;}
.num.w44{width:44px;} .num.w80{width:80px;}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.meter{height:6px;background:#0d0a11;border-radius:3px;margin-top:7px;overflow:hidden;border:1px solid #241d2c;position:relative;}
.meter i{display:block;height:100%;transition:width .3s;}
.meter .mk{position:absolute;top:0;bottom:0;width:1px;background:#ffffff55;}
.sub{font-family:'IBM Plex Mono';font-size:10.5px;color:var(--dim);margin-top:6px;}
.bar-tools{display:flex;gap:8px;align-items:center;width:100%;padding-top:6px;border-top:1px solid var(--line);flex-wrap:wrap;}
.bar-tools button{font-family:'IBM Plex Mono';font-size:10.5px;color:var(--dim);background:#150f1c;border:1px solid var(--line);border-radius:6px;padding:5px 9px;cursor:pointer;}
.bar-tools button:hover{color:var(--ac);border-color:var(--ac);}
.savehint{font-family:'IBM Plex Mono';font-size:10px;color:var(--dimmer);margin-left:auto;}
.savehint.flash{color:var(--ac);}
.roundrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;width:100%;padding:8px 2px 2px;border-top:1px solid var(--line);}
.bar.fold .tk{display:none;}
.minibar{display:none;width:100%;gap:14px;flex-wrap:wrap;align-items:center;font-family:'IBM Plex Mono';font-size:12px;color:var(--dim);}
.minibar b{font-family:'Cinzel';font-size:16px;color:#fff;margin-left:5px;}
.bar.fold .minibar{display:flex;}

/* chips & tags */
.chip{font-family:'IBM Plex Mono';font-size:10.5px;letter-spacing:.05em;border:1px solid var(--line);border-radius:20px;padding:3px 10px;color:var(--dim);background:#150f1c;display:inline-block;white-space:nowrap;}
button.chip{cursor:pointer;}
.chip.on{color:#fff;border-color:var(--ac);background:var(--ac-soft);}
.chip.ok{color:#bff3ea;border-color:var(--veil);background:#5fd2c01c;}
.chip.warn{color:#ffd79a;border-color:var(--amber);background:#e8b04a1c;}
.chip.bad{color:#ffb3ba;border-color:var(--blood);background:#d8434f22;}
.tag{font-family:'IBM Plex Mono';font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ac);border:1px solid var(--ac-line);border-radius:4px;padding:1px 6px;font-weight:400;}
.tag.gold{color:var(--gold);border-color:#d9b15455;} .tag.blood{color:var(--blood);border-color:#d8434f55;} .tag.veil{color:var(--veil);border-color:#5fd2c055;}
.k-attack{color:#ff9aa4!important;border-color:#d8434f66!important;}
.k-action{color:#f2d58a!important;border-color:#d9b15466!important;}
.k-bonus{color:#9fe8dc!important;border-color:#5fd2c066!important;}
.k-reaction{color:#d3c3ff!important;border-color:#c2abff66!important;}
.k-free{color:#cfe6b0!important;border-color:#9fbf7866!important;}
.k-passive{color:var(--dim)!important;border-color:var(--line2)!important;}
.tbd{font-family:'Cinzel';font-size:9.5px;letter-spacing:.1em;background:#3a2c0c;color:var(--amber);border:1px solid var(--amber);padding:1px 7px;border-radius:10px;margin-left:5px;vertical-align:middle;font-weight:700;text-transform:uppercase;white-space:nowrap;}
.amber{color:var(--amber);}

/* panes */
.pane{display:none;} .pane.on{display:block;}
.pane-head{padding:24px 0 4px;}
.pane-head .eb{font-family:'Cinzel';font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--ac);}
.pane-head h1{font-family:'Cinzel Decorative';font-weight:900;font-size:clamp(28px,5.5vw,44px);color:#fff;line-height:1.05;margin-top:7px;}
.pane-head .bl{color:var(--dim);font-size:16px;max-width:66ch;margin-top:8px;}
section{margin:28px 0;scroll-margin-top:170px;}
section>h2{font-size:22px;color:#fff;display:flex;align-items:baseline;gap:11px;margin-bottom:6px;flex-wrap:wrap;}
section>h2 .sub2{font-family:'IBM Plex Mono';font-size:10.5px;letter-spacing:.12em;color:var(--dimmer);text-transform:uppercase;}
.note{color:var(--dim);font-size:15px;max-width:72ch;margin-top:8px;}
.gm{border-left:3px solid var(--blood);background:#1a0d11aa;padding:10px 14px;margin:12px 0;border-radius:0 8px 8px 0;font-size:15.5px;}
.gm b{font-family:'Cinzel';color:var(--blood);font-weight:600;}
.flag{border-left:3px solid var(--amber);background:#221a08aa;padding:10px 14px;margin:12px 0;border-radius:0 8px 8px 0;font-size:15px;}
.flag b{font-family:'Cinzel';color:var(--amber);font-weight:600;}
.card{background:linear-gradient(180deg,#1a1522,#141019);border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin:10px 0;}
.card h3{font-size:17px;color:#fff;margin-bottom:3px;display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;}
.card p{font-size:16px;} .card p+p{margin-top:6px;}
.cost{font-family:'IBM Plex Mono';font-size:11.5px;color:var(--dim);margin-bottom:5px;}
@media(max-width:700px){.bar{position:relative;}.tk{flex:1 1 100%;}}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(268px,1fr));gap:10px;}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;}
table{width:100%;border-collapse:collapse;margin:10px 0;font-size:15.5px;}
th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:top;}
th{font-family:'Cinzel';font-weight:600;font-size:12px;letter-spacing:.07em;color:var(--ac);}
td.n,th.n{font-family:'IBM Plex Mono';font-size:13px;white-space:nowrap;}
tr.hl td{background:var(--ac-soft);}
ul{margin:8px 0 8px 20px;} li{margin-bottom:4px;}
.dl{margin:10px 0;} .dl div{display:flex;gap:12px;padding:6px 0;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.dl dt{font-family:'Cinzel';font-size:14.5px;color:var(--gold);min-width:170px;flex:none;}
.dl dd{color:var(--bone);font-size:15.5px;flex:1;min-width:220px;}
input[type=text],textarea,select.sel{font-family:'Cormorant Garamond';background:#0f0b14;border:1px solid var(--line);color:var(--bone);border-radius:7px;padding:6px 9px;font-size:15.5px;}
input[type=text]{width:100%;}
select.sel{font-family:'Cinzel';font-size:13px;padding:5px 7px;}
textarea{width:100%;min-height:100px;resize:vertical;line-height:1.55;}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--ac);}
.empty{color:var(--dimmer);font-style:italic;font-size:15px;padding:8px 0;}
.lbl{font-family:'IBM Plex Mono';font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dimmer);display:block;margin-bottom:3px;}
.fld{display:flex;flex-direction:column;min-width:0;}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px;align-items:end;}
.form .wide{grid-column:1/-1;}

/* transformation console */
.tx{border:1px solid var(--line);border-top:3px solid var(--ac);border-radius:14px;padding:16px;background:linear-gradient(180deg,#1b1524,#100c16);}
.tx-top{display:flex;gap:14px;flex-wrap:wrap;align-items:center;justify-content:space-between;}
.tx-name{font-family:'Cinzel Decorative';font-weight:900;font-size:28px;color:var(--ac);line-height:1;}
.tx-sub{font-family:'IBM Plex Mono';font-size:11px;color:var(--dim);letter-spacing:.08em;margin-top:5px;}
.ladder{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:12px;}
.lad{background:#130f19;display:grid;grid-template-columns:130px 1fr;gap:12px;padding:9px 12px;}
.lad .nm{font-family:'Cinzel';font-size:14px;color:var(--dim);}
.lad .nm small{display:block;font-family:'IBM Plex Mono';font-size:10px;color:var(--dimmer);letter-spacing:.06em;}
.lad ul{margin:0 0 0 16px;font-size:15px;color:var(--dim);}
.lad.on{background:linear-gradient(90deg,#3a2a0c66,#130f19);} .lad.on .nm{color:var(--amber);} .lad.on ul{color:var(--bone);}
.lad.on.frac{background:linear-gradient(90deg,#4a121b77,#130f19);} .lad.on.frac .nm{color:#ff8f9a;}
.lad.on.col{background:linear-gradient(90deg,#5a0f1a,#130f19);} .lad.on.col .nm{color:#fff;}
.collapse{border:2px solid var(--blood);border-radius:12px;padding:14px;margin-top:12px;background:#210a0f;}
.collapse h3{color:#ffb3ba;}
.modes{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
.mode{flex:1 1 150px;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#140f1b;cursor:pointer;text-align:left;color:var(--bone);}
.mode .mn{font-family:'Cinzel';font-weight:700;font-size:16px;color:var(--fc);}
.mode .mi{font-family:'IBM Plex Mono';font-size:10.5px;color:var(--dim);}
.mode.on{border-color:var(--fc);box-shadow:inset 0 0 0 1px var(--fc),0 0 20px -8px var(--fc);}
.log{font-family:'IBM Plex Mono';font-size:11px;color:var(--dim);margin-top:10px;max-height:110px;overflow-y:auto;}
.log div{padding:2px 0;border-bottom:1px dotted #241d2c;}

/* resources, pips */
.res{background:#150f1c;border:1px solid var(--line);border-radius:10px;padding:9px 11px;}
.res .rn{font-family:'Cinzel';font-size:13px;color:#fff;display:flex;gap:6px;align-items:baseline;}
.res .rn small{font-family:'IBM Plex Mono';font-size:10px;color:var(--dimmer);margin-left:auto;}
.pips{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-top:6px;}
.pip{width:21px;height:21px;border-radius:6px;border:1.5px solid var(--line2);background:#100c15;cursor:pointer;padding:0;}
.pip.live{background:var(--ac);border-color:var(--ac);box-shadow:0 0 8px var(--ac-line);}

/* loadout */
.loadout{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;}
.lo-col{background:#130f19;border:1px solid var(--line);border-radius:11px;padding:9px 10px;}
.lo-col h4{font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px;}
.lo-col details{border-bottom:1px dotted #2a2233;padding:4px 0;}
.lo-col summary{cursor:pointer;font-size:15.5px;list-style:none;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;}
.lo-col summary::-webkit-details-marker{display:none;}
.lo-col summary .src{font-family:'IBM Plex Mono';font-size:9.5px;color:var(--dimmer);}
.lo-col details p{font-size:14.5px;color:var(--dim);margin:4px 0 2px;}

/* equipment */
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;}
.slot{border:1px solid var(--line);border-radius:11px;padding:11px 13px;background:#130f19;cursor:pointer;text-align:left;color:var(--bone);position:relative;min-height:78px;}
.slot:hover{border-color:var(--ac);}
.slot .sn{font-family:'IBM Plex Mono';font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dimmer);}
.slot .it{font-family:'Cinzel';font-size:16px;color:#fff;margin-top:3px;line-height:1.2;}
.slot .mt{font-family:'IBM Plex Mono';font-size:10px;color:var(--dim);margin-top:4px;}
.slot.empty .it{color:var(--dimmer);font-style:italic;font-family:'Cormorant Garamond';}
.slot.held{opacity:.6;border-style:dashed;}
.slot.open{border-color:var(--ac);box-shadow:inset 0 0 0 1px var(--ac);}
.detail{border:1px solid var(--ac-line);border-radius:12px;padding:14px;margin-top:10px;background:#120e18;}
.dur{display:flex;gap:3px;flex-wrap:wrap;margin-top:5px;}
.dur i{width:9px;height:14px;border-radius:2px;background:var(--gold);display:block;}
.dur i.x{background:#2a2233;}
.ab-row{border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin-top:7px;background:#140f1b;}
.islots{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:9px;}
.islot{border:1px dashed var(--line2);border-radius:10px;padding:9px 11px;background:#110d16;min-height:70px;}
.islot.full{border-style:solid;border-color:var(--line);}
.rank{font-family:'Cinzel';font-weight:900;font-size:20px;width:36px;height:36px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;background:#100c15;border:1px solid var(--line);}
.r-F{color:#d8434f;} .r-D{color:#c9a15a;} .r-C{color:#c2abff;} .r-B{color:#d9b154;} .r-A{color:#5fd2c0;} .r-S{color:#fff;background:#2a2233;}
.inf{border:1px solid var(--line);border-left:3px solid var(--line2);border-radius:10px;padding:9px 12px;margin-top:8px;background:#140f1b;}
.inf.eq{border-left-color:var(--ac);background:linear-gradient(90deg,var(--ac-soft),#140f1b);}

/* stats & skills */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:9px;margin:10px 0;}
.stat{background:#150f1c;border:1px solid var(--line);border-radius:10px;padding:9px;text-align:center;}
.stat .lb{font-family:'IBM Plex Mono';font-size:10px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;}
.stat .mo{font-family:'Cinzel';font-size:27px;font-weight:700;color:#fff;line-height:1.1;}
.stat .sv{font-family:'IBM Plex Mono';font-size:10.5px;color:var(--dim);margin-top:5px;cursor:pointer;}
.stat .sv.p{color:var(--ac);}
.vitals{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:9px;margin:10px 0;}
.vit{background:#150f1c;border:1px solid var(--line);border-radius:10px;padding:9px;text-align:center;}
.vit .lb{font-family:'IBM Plex Mono';font-size:9.5px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase;}
.vit .v{font-family:'Cinzel';font-size:23px;font-weight:700;color:#fff;}
.vit .s{font-family:'IBM Plex Mono';font-size:9.5px;color:var(--dimmer);}
.vit.hi{border-color:var(--ac-line);} .vit.hi .v{color:var(--ac);}
.skl{display:grid;grid-template-columns:repeat(auto-fit,minmax(238px,1fr));gap:1px 16px;}
.sk{display:flex;align-items:center;gap:9px;padding:5px 2px;border-bottom:1px solid #1f1927;font-size:15px;}
.sk .pp{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--line2);background:#0f0b14;cursor:pointer;flex:none;font-family:'IBM Plex Mono';font-size:8.5px;color:var(--void);text-align:center;line-height:12px;padding:0;}
.sk .pp.p{background:var(--ac);border-color:var(--ac);} .sk .pp.e{background:var(--gold);border-color:var(--gold);}
.sk .nm{flex:1;} .sk .ab{font-family:'IBM Plex Mono';font-size:10px;color:var(--dimmer);}
.sk .vl{font-family:'Cinzel';font-size:16px;color:#fff;min-width:38px;text-align:right;}

/* relationships */
.rel{display:grid;grid-template-columns:28px minmax(120px,1.2fr) 40px minmax(150px,1.6fr) auto;gap:10px;align-items:center;padding:8px 6px;border-bottom:1px solid #1f1927;}
.rel.party{background:linear-gradient(90deg,var(--ac-soft),transparent);border-radius:6px;}
.rel .rn{font-size:16.5px;}
.rel .rn small{display:block;font-family:'IBM Plex Mono';font-size:10px;color:var(--dimmer);}
.tierb{font-family:'Cinzel';font-weight:900;font-size:17px;width:34px;height:30px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:#100c15;}
.pipbar{display:flex;gap:2px;flex-wrap:wrap;}
.pipbar i{flex:1 1 6px;min-width:5px;max-width:14px;height:12px;border-radius:2px;background:#221b2b;display:block;}
.pipbar i.f{background:var(--ac);} .pipbar.full i.f{background:var(--gold);}
.pipmeta{font-family:'IBM Plex Mono';font-size:10.5px;color:var(--dim);margin-top:3px;}
.star{width:26px;height:26px;border-radius:6px;border:1px solid var(--line);background:#100c15;color:var(--dimmer);cursor:pointer;padding:0;}
.star.on{color:var(--gold);border-color:var(--gold);background:#d9b15418;}
@media(max-width:700px){.rel{grid-template-columns:28px 1fr 40px;}.rel .rp,.rel .ra{grid-column:1/-1;}}

/* storage */
.st-row{display:grid;grid-template-columns:minmax(140px,2fr) 100px 110px auto;gap:10px;align-items:center;padding:8px 6px;border-bottom:1px solid #1f1927;}
.st-row .nm{font-family:'Cinzel';font-size:15px;color:#fff;}
.st-row .nm small{display:block;font-family:'Cormorant Garamond';font-size:14px;color:var(--dim);}
@media(max-width:700px){.st-row{grid-template-columns:1fr auto;}}

/* palette */
.pal-back{position:fixed;inset:0;background:#000b;backdrop-filter:blur(3px);z-index:90;display:none;}
.pal-back.on{display:block;}
.pal{position:fixed;top:10vh;left:50%;transform:translateX(-50%);width:min(640px,94vw);z-index:91;display:none;background:#150f1c;border:1px solid var(--line2);border-radius:14px;box-shadow:0 30px 70px #000c;overflow:hidden;}
.pal.on{display:block;}
.pal input{border:none;border-bottom:1px solid var(--line);border-radius:0;font-family:'Cinzel';font-size:18px;padding:14px 18px;}
.pal-res{max-height:56vh;overflow-y:auto;}
.pal-res button{display:block;width:100%;text-align:left;padding:10px 18px;background:none;border:none;border-bottom:1px solid #1d1725;color:var(--bone);cursor:pointer;font-size:15.5px;}
.pal-res button:hover,.pal-res button.sel{background:#1d1627;}
.pal-res .k{font-family:'IBM Plex Mono';font-size:9.5px;letter-spacing:.12em;color:var(--ac);text-transform:uppercase;display:block;}
.hit{animation:hit 1.6s ease;}
@keyframes hit{0%,100%{background:transparent}20%{background:var(--ac-soft)}}
.syncpill{position:fixed;bottom:10px;right:12px;z-index:99;font:600 11px/1 'IBM Plex Mono',monospace;padding:5px 9px;border-radius:20px;background:rgba(0,0,0,.6);color:#bbb;pointer-events:none;}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px;}
.foot{color:var(--dimmer);font-size:13px;text-align:center;margin-top:40px;font-family:'IBM Plex Mono';}
</style>
</head>

<script>
/* ================== CHARACTER CONFIG ==================
   Everything character-specific lives in this block.
   The engine below is identical on every sheet. */
window.CHAR=(function(){
"use strict";
/* ---------- small helpers (config side only) ---------- */
function n(v,d){var x=parseFloat(v);return isNaN(x)?(d||0):x;}
function E(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function A(){return window.SheetAPI;}
function St(){return A().S();}
function K(){return St().kit;}
function clsLv(re,S){S=S||St();var t=0;(S.classes||[]).forEach(function(c){if(re.test(String(c.name||"")))t+=n(c.level);});return t;}
function barbLv(S){return clsLv(/barbarian/i,S);}
function ssLv(S){return clsLv(/sword\s*saint/i,S);}
function rowAt(tbl,lv){var v=tbl[0][1];tbl.forEach(function(r){if(lv>=r[0])v=r[1];});return v;}

/* ---------- Alternate Barbarian tables (laserllama v2.3.1) ---------- */
var RAGES=[[1,2],[4,3],[8,4],[12,5],[17,6],[20,99]];
var EX_DIE=[[2,4],[5,6],[11,8],[17,10]];
var EX_DICE=[[2,2],[5,3],[11,4],[17,5]];
var EX_KNOWN=[[2,2],[5,3],[7,4],[9,5],[11,6],[13,7],[17,8]];
function exDie(S){var b=barbLv(S);return b<2?0:rowAt(EX_DIE,b);}
function exDieNow(S){var d=exDie(S);if(!d)return 0;var k=(S||St()).kit||{};return (k.raging&&barbLv(S)>=3)?Math.min(12,d+2):d;} /* Martial Training: +1 size while raging */
function exDiceMax(S){var b=barbLv(S);if(b<2)return 0;var k=(S||St()).kit||{};return rowAt(EX_DICE,b)+(b>=3?1:0)+n(k.exAdj);}
function rageMax(S){var b=barbLv(S);return b<1?0:rowAt(RAGES,b);}
function critRange(S){var b=barbLv(S);return b>=17?17:b>=13?18:b>=9?19:20;}
/* ---------- Sword Saint ---------- */
function focusMax(S){var s=ssLv(S);return s<1?0:5+s;}
function focusCap(S){var s=ssLv(S);return s>=14?Infinity:Math.ceil(s/2)+2;}
function mdDie(d){return d.level>=17?10:8;}

/* ---------- exploit catalogue: [id, name, degree, source, prereq{st:[[stat,min]...] any-of, sk:[skills] any-of}, kind, multi(up to PB), text] ---------- */
var EX=[
 ["arresting_strike","Arresting Strike",1,"Core",{},"free",0,"When you hit a target with a weapon attack, you can expend one Exploit Die and force it to make a Dexterity saving throw. On a failure, add your Exploit Die to the damage roll, and the target's speed is halved until the start of your next turn."],
 ["bonebreaking_critical","Bonebreaking Critical",1,"Core",{st:[["str",11]]},"free",0,"When you score a critical hit with a weapon attack, you can expend an Exploit Die to cripple the target. For 1 minute, it deals half damage with all weapon attacks. It can make a Constitution saving throw at the end of each of its turns, ending this effect on a success."],
 ["brace_up","Brace Up",1,"Core",{st:[["con",11]]},"bonus",0,"As a bonus action, you can expend one Exploit Die to gain temporary hit points equal to your Exploit Die + your Constitution modifier. These temporary hit points last for 1 minute."],
 ["crushing_grip","Crushing Grip",1,"Core",{st:[["str",11]],sk:["Athletics"]},"free",0,"When you Grapple a target, you can expend one Exploit Die to enhance your grip. When you use this Exploit, and again at the end of each of the Grappled creature's turns, it takes bludgeoning damage equal to your Exploit Die."],
 ["destructive_strike","Destructive Strike",1,"Core",{st:[["str",11]]},"free",0,"When you hit a non-magical object with a melee weapon attack, you can expend an Exploit Die, add it to the damage, and that attack deals maximum damage in place of rolling."],
 ["feat_of_strength","Feat of Strength",1,"Core",{st:[["str",11],["con",11]]},"free",1,"When you make a Strength or Constitution ability check you can expend Exploit Dice (up to your Proficiency Bonus) and add them to your roll. You can do so after you roll, but before you know the outcome."],
 ["disarm","Disarm",1,"Core",{},"free",0,"When you hit a target with a weapon attack, you can expend an Exploit Die and force it to make a Strength saving throw. On a failure, add your Exploit Die to the damage roll, and it drops one object of your choice in its space."],
 ["heroic_fortitude","Heroic Fortitude",1,"Core",{},"free",0,"When you make a Strength, Dexterity, or Constitution saving throw, you can expend an Exploit Die and add it to your roll. You can do so after you roll, but before you know if you fail."],
 ["hurl","Hurl",1,"Core",{st:[["str",11]],sk:["Athletics"]},"attack",0,"In place of an attack, expend an Exploit Die to throw one object you are holding at a target you can see within 60 feet (120 feet at 11th level). It must succeed on a Dexterity saving throw, or both the object and target take bludgeoning damage equal to two Exploit Dice + your Strength modifier."],
 ["imposing_presence","Imposing Presence",1,"Core",{st:[["str",11]]},"free",0,"You can use Strength in place of Charisma for Intimidation or Persuasion checks. When you do, you can spend an Exploit Die to treat a d20 roll of 7 or lower as an 8."],
 ["lunge","Lunge",1,"Core",{},"free",0,"When you make a melee attack on your turn, you can spend one Exploit Die and move up to 10 feet immediately before making that attack, even if this exceeds your speed. On hit, add your Exploit Die to the damage roll."],
 ["mighty_leap","Mighty Leap",1,"Core",{st:[["str",11]],sk:["Athletics"]},"bonus",0,"After you run 10 feet in a line, you can use your bonus action to expend an Exploit Die to long jump up to 30 feet in a line, even if this distance would exceed your speed for that turn."],
 ["mighty_thrust","Mighty Thrust",1,"Core",{st:[["str",11]],sk:["Athletics"]},"attack",0,"In place of an attack, expend an Exploit Die to force one target you touch to make a Strength saving throw. On a failure, it is knocked back in a line 5 × your Strength modifier feet (minimum 5). Halved for every size category it is larger than you."],
 ["ruthless_strike","Ruthless Strike",1,"Core",{st:[["str",11]]},"free",1,"Whenever you hit a target with a melee weapon attack, you can expend Exploit Dice (up to your Proficiency Bonus) and add them to the damage roll of your attack."],
 ["savage_rebuke","Savage Rebuke",1,"Core",{},"reaction",0,"When a creature hits you with a melee attack, you can use a reaction to expend an Exploit Die to make a melee weapon attack against it. On hit, add your Exploit Die to the damage."],
 ["sweeping_strike","Sweeping Strike",1,"Core",{},"free",0,"If you hit a creature with a melee weapon attack, you expend an Exploit Die and force it to make its choice of a Strength or Dexterity saving throw. On a failure, add your Exploit Die to the damage roll and it is knocked prone."],
 ["trampling_rush","Trampling Rush",1,"Core",{st:[["str",11]]},"free",0,"If you move at least 20 feet toward a target and hit it with a melee weapon attack, you can expend an Exploit Die to force a Strength saving throw. On a failure, add your Exploit Die to the damage roll and it is knocked Prone."],
 ["breathless_critical","Breathless Critical",1,"Expanded",{st:[["str",11]]},"free",0,"When you score a critical hit with a weapon attack, expend an Exploit Die to knock the air from its lungs. It cannot speak and its speed is halved for 1 minute. Constitution save at the end of each of its turns ends it."],
 ["skilled_rider","Skilled Rider",1,"Expanded",{sk:["Animal Handling"]},"free",0,"When a trained mount you are riding makes an attack roll, damage roll, ability check, or saving throw, you expend an Exploit Die and add it to your mount's roll, after it rolls but before you know if it succeeds."],
 ["taunting_strike","Taunting Strike",1,"Expanded",{st:[["cha",11]]},"free",0,"When you hit a creature within 15 feet with a weapon attack, you can expend one Exploit Die to taunt it. Add your Exploit Die to the damage roll, and until the start of your next turn it has disadvantage on attacks against targets other than you."],

 ["arresting_critical","Arresting Critical",2,"Core",{st:[["str",13]]},"free",0,"When you score a critical hit with a weapon attack, you can expend an Exploit Die to disable your target. For 1 minute, its speed is reduced to 0. Constitution save at the start of each of its turns ends it."],
 ["bloodthirsty_critical","Bloodthirsty Critical",2,"Core",{st:[["str",13]]},"free",0,"When you score a critical hit with a weapon attack, you can expend an Exploit Die to make another weapon attack against it. On hit, add your Exploit Die to the damage. Once per turn."],
 ["concussive_blow","Concussive Blow",2,"Core",{st:[["str",13]]},"free",0,"When you hit with a melee weapon attack, expend an Exploit Die. It must succeed on a Constitution save or until the start of your next turn its speed is 0, it can't speak, it has disadvantage on Dexterity saves, and attacks against it have advantage."],
 ["glancing_blow","Glancing Blow",2,"Core",{},"free",0,"When you miss with a melee weapon attack, you can expend an Exploit Die to repeat your attack against another target in range, adding your Exploit Die to the damage roll."],
 ["honor_duel","Honor Duel",2,"Core",{st:[["cha",13]]},"bonus",0,"As a bonus action, expend an Exploit Die and challenge a creature within 15 feet that can hear and understand you. For 1 minute, it has disadvantage on attacks against targets other than you. Ends if you target another creature with an attack, check, or save. Wisdom save at the end of each of its turns ends it."],
 ["immovable_stance","Immovable Stance",2,"Core",{st:[["str",13],["con",13]]},"bonus",0,"As a bonus action, expend an Exploit Die to enter an immovable stance that lasts until you move from your space. When a creature attempts to Grapple you, move you, or move through you, it first makes a Strength save. On a failure, you Grapple it or knock it Prone."],
 ["menacing_shout","Menacing Shout",2,"Core",{st:[["con",13],["cha",13]]},"bonus",0,"As a bonus action, expend an Exploit Die to force a creature within 30 feet that can hear you to make a Wisdom save. On a failure, it is Frightened of you until the end of your next turn, or until you are Incapacitated."],
 ["mighty_blow","Mighty Blow",2,"Core",{st:[["str",13]]},"free",0,"When you hit with a melee weapon attack, expend an Exploit Die to deal bonus damage equal to your Exploit Die; the target must succeed on a Strength save or be knocked back in a line 5 × your Strength modifier feet. Targets larger than you have advantage."],
 ["mighty_hurl","Mighty Hurl",2,"Core",{st:[["str",13]],sk:["Athletics"]},"attack",0,"In place of an attack, expend an Exploit Die to touch a target at least one size smaller than you; Strength save or you throw it to a space within 30 feet (two free hands: equal size). Unwilling creatures land Prone. Thrown into another creature: Dexterity save or both take Exploit Die + Strength modifier bludgeoning."],
 ["shattering_slam","Shattering Slam",2,"Core",{st:[["str",13]]},"attack",1,"In place of an attack, strike the ground and expend Exploit Dice (up to your Proficiency Bonus), turning the area within 5 feet into difficult terrain. Creatures there make a Strength save: on a failure they take bludgeoning damage equal to the dice spent + your Strength modifier and fall Prone; on a success, half damage and no Prone."],
 ["intimidating_command","Intimidating Command",2,"Expanded",{st:[["cha",13]]},"bonus",0,"As a bonus action, expend an Exploit Die to shout a one-word command at a creature within 30 feet. Wisdom save or it obeys on its next turn unless the action is directly harmful to it."],
 ["primal_senses","Primal Senses",2,"Expanded",{sk:["Perception"]},"action",0,"As an action, expend an Exploit Die. For 10 minutes, add your Exploit Die to sight- or smell-based Insight, Perception, and Survival checks, and smell poisons, poisonous creatures, and diseases within 30 feet."],
 ["rending_strike","Rending Strike",2,"Expanded",{st:[["str",13]]},"free",0,"When you hit with a melee weapon attack, expend an Exploit Die and force a Dexterity save. On a failure, add your Exploit Die to the damage and its Armor Class is reduced by 1 until repaired. Cumulative."],
 ["ringing_critical","Ringing Critical",2,"Expanded",{st:[["str",13]]},"free",0,"When you score a critical hit, expend an Exploit Die to daze the target. For 1 minute it subtracts a d4 from every attack roll and saving throw. Wisdom save at the end of each of its turns ends it."],
 ["whirlwind_strike","Whirlwind Strike",2,"Expanded",{st:[["str",13],["dex",13]]},"attack",0,"In place of an attack, expend an Exploit Die to force targets of your choice within your reach to make a Dexterity save. They take damage as if hit by one attack with your weapon on a failure, half on a success."],

 ["confounding_critical","Confounding Critical",3,"Core",{st:[["str",15]]},"free",0,"When you score a critical hit, expend an Exploit Die to strike its head. For 1 minute it subtracts a d6 from every attack roll, ability check, or concentration save. Intelligence save at the end of each of its turns ends it."],
 ["destructive_slam","Destructive Slam",3,"Core",{st:[["str",15]]},"attack",1,"In place of an attack, strike the ground and expend Exploit Dice (up to PB), destroying an adjacent 20-foot cube into difficult terrain. Strength save: failure takes two Exploit Dice per die spent + Strength modifier bludgeoning and falls Prone; success half. Objects take maximum damage."],
 ["mighty_shot","Mighty Shot",3,"Core",{st:[["str",15],["dex",15]]},"attack",1,"In place of an attack, expend Exploit Dice (up to PB) and make a single ranged or thrown attack, forcing creatures in a line out to normal range to make a Dexterity save. Failure: damage as if hit + two Exploit Dice per die spent, and Large or smaller fall Prone. Success: half."],
 ["mythic_resilience","Mythic Resilience",3,"Core",{st:[["con",15]]},"bonus",1,"When you take damage from a source you can see, you can expend Exploit Dice (up to your Proficiency Bonus) to reduce the damage by three Exploit Dice per Exploit Die spent. If the total exceeds the damage, you gain temporary hit points equal to the remainder."],
 ["primal_terror","Primal Terror",3,"Core",{sk:["Intimidation"]},"action",0,"As an action, spend an Exploit Die to drive a creature within 5 feet into primal fear. Wisdom save or it regards all creatures as Hostile for 1 minute, choosing targets at random and taking all opportunity attacks. It repeats the save each time it takes damage."],
 ["roar_of_triumph","Roar of Triumph",3,"Core",{},"free",0,"When you score a critical hit, expend an Exploit Die to let out a cry heard 300 feet away. You and a number of creatures of your choice who can hear you equal to your Constitution modifier (minimum 1) gain temporary hit points equal to your level + your Constitution modifier."],
 ["savage_defiance","Savage Defiance",3,"Core",{},"action",0,"As an action, expend an Exploit Die to issue a primal challenge. Creatures of your choice within 60 feet that can hear you have disadvantage on attacks against targets other than you for 1 minute, or until they hit you."],
 ["war_cry","War Cry",3,"Core",{st:[["con",15],["cha",15]]},"action",0,"As an action, expend an Exploit Die; creatures of your choice in an adjacent 30-foot cone make a Wisdom save. On a failure they drop what they are holding and are Frightened of you for 1 minute."],
 ["adrenaline_rush","Adrenaline Rush",3,"Expanded",{st:[["con",15]]},"bonus",0,"As a bonus action, expend an Exploit Die. For 1 minute you can Dash as a bonus action on each of your turns, including this one."],
 ["bewildering_blow","Bewildering Blow",3,"Expanded",{st:[["str",15],["dex",15]]},"free",0,"When you hit with a melee weapon attack, expend an Exploit Die to deal two extra Exploit Dice of damage and force a Wisdom save. On a failure, for 1 minute it can't take reactions and must move in a random direction then attack a random creature in reach each turn."],
 ["disorienting_blow","Disorienting Blow",3,"Expanded",{st:[["str",15]]},"free",0,"When you hit with a melee weapon attack, expend an Exploit Die to deal bonus damage equal to twice your Exploit Die and force a Wisdom save. On a failure, for 1 minute: speed halved and no reactions, AC −2 (minimum 10), disadvantage on Dexterity saves, action <i>or</i> bonus action only, and one attack per turn. Save at the end of each of its turns ends it. Doesn't stack with <i>slow</i>."],
 ["mythic_athleticism","Mythic Athleticism",3,"Expanded",{st:[["con",15],["str",15]]},"bonus",0,"As a bonus action (concentration, 10 minutes): treat Strength/Constitution check d20 rolls of 9 or lower as 10, double walking/climbing/swimming speed, count as one size larger for carrying and grappling, and double jump distances."],
 ["pack_tactics","Pack Tactics",3,"Expanded",{st:[["wis",15]]},"bonus",0,"As a bonus action, expend an Exploit Die: you and chosen creatures within 30 feet have advantage on attacks while another pack member is within 5 feet of the target, until the end of your next turn. Extend each turn with a bonus action, up to 1 minute."],
 ["survey_wilderness","Survey Wilderness",3,"Expanded",{st:[["str",15],["wis",15]]},"action",0,"Expend an Exploit Die and spend 1 hour surveying 1 square mile of wilderness to learn three facts: settlements, landmarks, ecology, powerful creatures within 24 hours, or secret trails and lairs."],

 ["befuddling_critical","Befuddling Critical",4,"Core",{st:[["str",17]]},"free",0,"On a critical hit, expend an Exploit Die to shatter its focus: concentration breaks, and for 1 minute it has disadvantage on Intelligence, Wisdom, and Charisma saves and cannot concentrate. Intelligence save at the end of each of its turns ends it."],
 ["colossal_strength","Colossal Strength",4,"Core",{st:[["str",17]]},"bonus",1,"As a bonus action (concentration, 10 minutes), expend Exploit Dice (up to PB): your push/drag/lift becomes 50 × Strength per die (1 die), up to 300 × at 6 dice. Doubles for each size above Medium."],
 ["staggering_blow","Staggering Blow",4,"Core",{st:[["str",17]]},"free",0,"When you hit with a melee weapon attack, expend an Exploit Die to deal three extra Exploit Dice of damage. Wisdom save or for 1 minute it has disadvantage on attacks and checks and can't take reactions. Save at the start of each of its turns ends it."],
 ["sundering_strike","Sundering Strike",4,"Core",{st:[["str",17]]},"attack",0,"In place of an attack, expend an Exploit Die to strike a creation of magical force. 3rd level or lower is destroyed; higher needs a Strength check against 10 + slot level."],
 ["unbreakable","Unbreakable",4,"Core",{st:[["con",17]]},"free",1,"If damage would reduce you to 0 HP, even killing you outright, expend Exploit Dice (up to PB) to fall to 1 HP instead and gain temporary HP equal to two Exploit Dice per die spent."],
 ["subjugate_beast","Subjugate Beast",4,"Expanded",{sk:["Animal Handling","Intimidation"]},"action",0,"As an action, expend an Exploit Die to dominate one Beast within 30 feet: Wisdom save or Charmed for 1 minute, taking your bonus-action commands. It repeats the save whenever it takes damage."],
 ["fluid_movements","Fluid Movements",4,"Expanded",{st:[["dex",17]]},"bonus",0,"As a bonus action (concentration, 1 minute): immune to Grappled, Paralyzed, and Restrained, your speed can't be reduced, and opportunity attacks against you have disadvantage."],

 ["cataclysmic_slam","Cataclysmic Slam",5,"Core",{st:[["str",19]]},"action",1,"As an action, expend Exploit Dice (up to PB): a 30-foot-radius shockwave becomes difficult terrain. Strength save: failure takes two Exploit Dice per die spent + Strength modifier bludgeoning and falls Prone; success half. Objects take maximum damage."],
 ["vorpal_critical","Vorpal Critical",5,"Core",{st:[["str",19]]},"free",0,"On a critical hit, spend an Exploit Die to deal three extra Exploit Dice. If this leaves it at 50 HP or fewer, you cut off one of its heads. Legendary Resistance avoids the beheading."],
 ["banishing_strike","Banishing Strike",5,"Expanded",{st:[["str",19]]},"free",0,"When you hit with a melee weapon attack, expend an Exploit Die to deal four extra Exploit Dice of force damage. Charisma save or it is shunted to a harmless demiplane, Incapacitated, until the start of your next turn."]
];
var DEG_LV={1:2,2:5,3:9,4:13,5:17};
var PATH_EX={feat_of_strength:3,mighty_leap:3,honor_duel:5,mighty_blow:5,mythic_resilience:9}; /* Champion Exploits */
var YOHAN_KNOWN=["bloodthirsty_critical","roar_of_triumph","disorienting_blow","glancing_blow","taunting_strike","shattering_slam"];
var STN={str:"STR",dex:"DEX",con:"CON",int:"INT",wis:"WIS",cha:"CHA"};

/* ---------- class feature progressions ---------- */
var BARB=[
 [1,"Rage","Bonus action, not in heavy armor. Advantage on Strength saves and Strength/Constitution checks; Strength weapon hits deal bonus damage equal to your Exploit Die; resistance to bludgeoning, piercing, and slashing; no spells or concentration. Lasts to the end of your next turn, extended by attacking a hostile creature, taking damage, making a Strength check, or a bonus action. Up to 10 minutes. One use back on a short rest, all on a long rest."],
 [1,"Unarmored Defense","With no armor, AC = 10 + DEX + CON. A shield still works."],
 [2,"Reckless Attack","When you attack on your turn with Strength, you can gain advantage on Strength attacks until your next turn; attacks against you have advantage until then too."],
 [2,"Savage Exploits","Exploit Dice fuel your Exploits; one Exploit per attack, check, or save; all dice return on a short or long rest. Exploit save DC = 8 + PB + STR. <b>Savage Skill:</b> add an Exploit Die to a check with a Barbarian skill, after rolling."],
 [3,"Primal Path: Champion","Champion Exploits (learned free): <i>feat of strength, mighty leap</i> (3rd) · <i>honor duel, mighty blow</i> (5th) · <i>mythic resilience</i> (9th)."],
 [3,"Fighting Style (Champion)","Learn one Fighting Style from the Alternate Fighter list. <span class=\"tbd\">which style?</span>"],
 [3,"Martial Training (Champion)","Total Exploit Dice +1. While Raging, every Exploit Die is one size larger (max d12)."],

function takeDamage(n,useAdr){var d=compute();n=Math.max(0,Math.floor(num(n)));var parts=[],orig=n;
 if(useAdr&&d.adrNow){var r=Math.min(n,d.adrNow);n-=r;if(r)parts.push(r+" ADR");}
 if(S.hp.temp>0&&n>0){var a=Math.min(S.hp.temp,n);S.hp.temp-=a;n-=a;parts.push(a+" temp");}
 if(C.hooks&&C.hooks.absorb&&n>0){var b=C.hooks.absorb(n,api,parts);if(typeof b==="number")n=b;}
 if(n>0){S.hp.cur=Math.max(0,num(S.hp.cur)-n);parts.push(n+" health");}
 if(C.hooks&&C.hooks.afterDamage)C.hooks.afterDamage(orig,api,parts);
 logline("Took "+orig+": "+parts.join(", "));}
function heal(n){var d=compute();S.hp.cur=Math.min(d.hpCeil,num(S.hp.cur)+Math.max(0,num(n)));logline("Healed "+n);}
function moraleChange(delta,fromOthers){var m=S.mor,before=m.cur,v=m.cur+delta,note="";
 if(delta<0&&fromOthers){var room=Math.max(0,30-m.lost);if(-delta>room){v=m.cur-room;note=" (swing cap)";}
  var st=moraleTier(m.start),floor=st>0?MORALE[st-1].lo:0;if(v<floor){v=floor;note+=" (tier lock)";}
  m.lost+=before-Math.max(0,v);}
 m.cur=clamp(v,0,200);logline("Morale "+sgn(m.cur-before)+note+" → "+m.cur);}
function moraleEndRound(parts){var m=S.mor;
 if(m.cur===m.start&&m.cur!==100){var dir=m.cur<100?1:-1;m.cur=m.cur+dir*Math.min(10,Math.abs(100-m.cur));parts.push("morale drifts to "+m.cur);}
 m.shaken=moraleTier(m.cur)===1?Math.min(10,m.shaken+1):0;m.start=m.cur;m.lost=0;}

function endTurn(){var parts=[],d=compute();
 if(C.tx&&S.tx.on){var u=upkeep(d);
  if(u.gain){S.tl.cur=Math.min(d.tlMax,num(S.tl.cur)+u.gain);parts.push("+"+u.gain+" TL");}
  if(S.tx.burning){S.hp.burn=num(S.hp.burn)+u.cost;parts.push(u.cost+" max HP burned");var d2=compute();S.hp.cur=Math.min(num(S.hp.cur),d2.hpCeil);
   if(d2.hpMax<=0){S.dead=true;parts.push("max HP reached 0. She dies");}}
  else if(u.cost){S.tl.cur=Math.max(0,num(S.tl.cur)-u.cost);parts.push("−"+u.cost+" TL upkeep");}
  afterTL();}
 if(C.hooks&&C.hooks.endTurn)C.hooks.endTurn(api,parts);
 var keep=[];S.effects.forEach(function(e){if(num(e.rounds)>0){e.rounds--;if(e.rounds<=0){parts.push(e.name+(e.target&&e.target!=="self"?" on "+e.target:"")+" ended");return;}}keep.push(e);});S.effects=keep;
 moraleEndRound(parts);
 for(var k in S.eco)S.eco[k].left=S.eco[k].max;S.infUsed=0;
 S.round++;logline(parts.length?parts.join(", "):"Next round");}

function itemById(id){for(var i=0;i<S.items.length;i++)if(S.items[i].id===id)return S.items[i];return null;}
function splitOne(it){if(num(it.qty,1)<=1)return it;it.qty=num(it.qty)-1;var n=mkItem(clone(it));n.id=uid("i");n.qty=1;S.items.push(n);return n;}
function toStorage(it){if(!it)return;var same=S.items.filter(function(x){return x!==it&&x.loc==="storage"&&x.name===it.name&&x.cat===it.cat&&(x.cat==="consumable"||x.cat==="material"||x.cat==="resource");})[0];
 if(same){same.qty=num(same.qty,1)+num(it.qty,1);S.items.splice(S.items.indexOf(it),1);}else it.loc="storage";}
function equip(id,slot){var it=itemById(id);if(!it)return;var cat=it.cat;
 if(!slot){slot=SLOTS.filter(function(s){return s[2]===cat&&!slotItem(s[0]);}).map(function(s){return s[0];})[0]||SLOTS.filter(function(s){return s[2]===cat;}).map(function(s){return s[0];})[0];}
 if(!slot||SLOTCAT[slot]!==cat){flash("No "+(CATN[cat]||cat)+" slot for that item");return;}
 it=splitOne(it);
 if(it.twoSlot){slot="w1";["w1","w2"].forEach(function(k){var o=slotItem(k);if(o&&o!==it)toStorage(o);});}
 else{var o=slotItem(slot);if(o&&o!==it)toStorage(o);if(slot==="w2"){var w=slotItem("w1");if(w&&w.twoSlot)toStorage(w);}}
 it.loc=slot;logline("Equipped "+it.name);}
function toItemSlot(id){var it=itemById(id),d=compute();if(!it)return;
 for(var i=0;i<d.itemSlots;i++){if(!S.items.some(function(x){return x.loc==="is"+i;})){var one=num(it.qty,1)>1?splitOne(it):it;one.loc="is"+i;logline("Slotted "+one.name);return;}}
 flash("Item slots are full");}

var COIN={cp:1,sp:10,gp:100,pp:1000},CDESC=["pp","gp","sp","cp"];
function parseCoins(t){var o={cp:0,sp:0,gp:0,pp:0},m,re=/(\d+(?:\.\d+)?)\s*(pp|gp|sp|cp)\b/gi,any=false;t=String(t||"");
 while((m=re.exec(t))){o[m[2].toLowerCase()]+=+m[1];any=true;}
 if(!any&&/^\s*\d+(\.\d+)?\s*$/.test(t)){o.gp=+t;any=true;}return any?o:null;}
function coinsCp(o){return Math.round(CDESC.reduce(function(a,k){return a+num(o[k])*COIN[k];},0));}
function fmtCoins(cp){cp=Math.round(cp);var neg=cp<0,p=[];cp=Math.abs(cp);CDESC.forEach(function(k){var n=Math.floor(cp/COIN[k]);cp-=n*COIN[k];if(n)p.push(n+" "+k);});return (neg?"−":"")+(p.join(" ")||"0 gp");}
/* Spend: pay in the entry's own coins first, then any coins that fit, then break the smallest larger coin and take change. */
function spendCoins(o){var W=S.wealth,need=coinsCp(o);if(need<=0)return true;var had=coinsCp(W)>=need;
 CDESC.filter(function(k){return num(o[k])>0;}).forEach(function(k){var u=Math.min(Math.max(0,num(W[k])),Math.floor(need/COIN[k]));W[k]=num(W[k])-u;need-=u*COIN[k];});
 CDESC.forEach(function(k){var u=Math.min(Math.max(0,num(W[k])),Math.floor(need/COIN[k]));W[k]=num(W[k])-u;need-=u*COIN[k];});
 if(need>0){for(var i=CDESC.length-1;i>=0;i--){var k=CDESC[i];if(num(W[k])>0&&COIN[k]>need){W[k]=num(W[k])-1;var ch=COIN[k]-need;need=0;
   CDESC.forEach(function(c){if(COIN[c]<COIN[k]){var n=Math.floor(ch/COIN[c]);W[c]=num(W[c])+n;ch-=n*COIN[c];}});break;}}}
 if(need>0){var pk=CDESC.filter(function(k){return num(o[k])>0;})[0]||"gp";W[pk]=num(W[pk])-Math.ceil(need/COIN[pk]);var over=Math.ceil(need/COIN[pk])*COIN[pk]-need;if(over)W.cp=num(W.cp)+over;}
 normDebt();return had;}
function normDebt(){var t=coinsCp(S.wealth);if(t>=0)return;t=-t;CDESC.forEach(function(k){var n=Math.floor(t/COIN[k]);S.wealth[k]=n?-n:0;t-=n*COIN[k];});}
function gainCoins(o){var W=S.wealth;if(coinsCp(W)<0){var t=coinsCp(W)+coinsCp(o);CDESC.forEach(function(k){W[k]=0;});if(t<0){W.cp=t;normDebt();}else{CDESC.forEach(function(k){var n=Math.floor(t/COIN[k]);W[k]=n;t-=n*COIN[k];});}return;}CDESC.forEach(function(k){if(num(o[k]))W[k]=num(W[k])+num(o[k]);});}
function wlog(t){S.wlog.push(t);if(S.wlog.length>30)S.wlog=S.wlog.slice(-30);logline(t);}
function applySub(sub){var o=parseCoins(sub.amt);if(!o){flash("Couldn't read the amount for "+sub.name);return false;}
 if(sub.type==="income"){gainCoins(o);wlog("+"+fmtCoins(coinsCp(o))+" "+sub.name);return true;}
 var ok=spendCoins(o);wlog("−"+fmtCoins(coinsCp(o))+" "+sub.name+(ok?"":" (went into debt)"));return true;}
function subNet(){var n=0;S.subs.forEach(function(x){if(!x.on)return;var o=parseCoins(x.amt);if(o)n+=(x.type==="income"?1:-1)*coinsCp(o);});return n;}

 return h+'<p class="note">Amounts take any mix of coins ("49 pp 6 gp"); a bare number is gold. Paying uses the listed coins first, then whatever fits, then breaks a larger coin and keeps the change. Unticked lines are skipped when processing.</p></div></section>';}

/* ===================== DAMAGE CALCULATOR =====================
   Max-damage system: every die resolves at its maximum. No rolling.
   Order per strike: weapon dice (+extra dice, doubled on a crit) + flat + riders
   → effective ×1.5 (round down) → vulnerable ×2 → half (round down) → − target ADR (attack rolls only). */
var STATTOK={STR:"str",DEX:"dex",CON:"con",INT:"int",WIS:"wis",CHA:"cha"};
function parseExpr(s,d){var out={dice:[],flat:0,ok:false};s=String(s||"").toUpperCase().replace(/\s+/g,"");if(!s)return out;
 var re=/([+\-]?)(\d*D\d+|\d+|STR|DEX|CON|INT|WIS|CHA|PB)/g,m,pos=0;
 while((m=re.exec(s))){if(m.index!==pos)return out;pos=re.lastIndex;var sg=m[1]==="-"?-1:1,t=m[2];
  if(t.indexOf("D")>-1){var p=t.split("D");out.dice.push({n:(p[0]===""?1:+p[0])*sg,m:+p[1]});}
  else if(/^\d+$/.test(t))out.flat+=sg*(+t);else if(t==="PB")out.flat+=sg*d.pb;else out.flat+=sg*d.mod[STATTOK[t]];}
 out.ok=pos===s.length;return out;}
function exprFrom(str){var m=/(\d+d\d+(?:\s*[+\-]\s*(?:\d+d\d+|\d+(?!d)|str|dex|con|int|wis|cha|pb)\b)*)/i.exec(String(str||""));return m?m[1].replace(/\s+/g,""):"";}
function dmgType(str){var m=/\b(slashing|piercing|bludgeoning|psychic|necrotic|radiant|cold|fire|lightning|thunder|acid|poison|force|true|soul erosion|vile)\b/i.exec(String(str||""));return m?m[1].toLowerCase():"";}
function dmgSources(){var out=[];
 equipped().forEach(function(it){if(it.cat==="weapon"&&exprFrom(it.dmg))out.push({g:"Weapons",n:it.name,e:exprFrom(it.dmg),t:dmgType(it.dmg)});
  (it.abilities||[]).forEach(function(a){var e=exprFrom(a.dmg)||exprFrom(a.cost);if(e)out.push({g:it.name,n:a.name,e:e,t:dmgType(a.dmg||a.text)});});});
 allKit().forEach(function(k){var e=exprFrom(k.a.dmg)||exprFrom(k.a.cost);if(e)out.push({g:"Kit · "+k.sec.title,n:k.a.n,e:e,t:dmgType(k.a.dmg||k.a.text)});});
 (S.comps||[]).forEach(function(c){(c.attacks||[]).forEach(function(a){var e=exprFrom(a.dmg);if(e)out.push({g:"Companion · "+c.name,n:c.name+": "+a.name,e:e,t:dmgType(a.dmg)});});});
 ((S.spells||{}).list||[]).forEach(function(x){var e=exprFrom(x.dmg);if(e)out.push({g:"Spells",n:x.name,e:e,t:dmgType(x.dmg)});});
 (S.bats||[]).forEach(function(b){(b.gambits||[]).forEach(function(g){var e=exprFrom(g.dmg);if(e)out.push({g:"Battalion · "+b.name,n:b.name+": "+g.name,e:e,t:dmgType(g.dmg)});});});
 return out;}
function riderDefs(){return (C.riders||[]).concat(S.dmg.custRiders||[]);}
function strike(d,o){var p=parseExpr(o.expr,d);
 if(!p.ok&&!(num(o.flat)||(o.riders||[]).length))return {ok:false,msg:"Couldn't read \""+o.expr+"\". Use dice and numbers, e.g. 3d11+18 or 2d8+WIS."};
 var how=[],dice=0,die0=p.dice.length?p.dice[0].m:0;
 p.dice.forEach(function(x){dice+=x.n*x.m;});
 var xd=num(o.xd);if(xd&&die0){dice+=xd*die0;}
 var dTxt=p.dice.map(function(x){return x.n+"d"+x.m;}).join("+")+(xd&&die0?"+"+xd+"d"+die0:"");
 if(o.crit){dice*=2;how.push(dTxt+" crit = "+dice);}else if(dTxt)how.push(dTxt+" = "+dice);
 var v=dice+p.flat+num(o.flat);if(p.flat)how.push(sgn(p.flat));if(num(o.flat))how.push(sgn(num(o.flat))+" bonus");
 (o.riders||[]).forEach(function(r){var rp=parseExpr(r.e,d),rv=rp.flat;rp.dice.forEach(function(x){rv+=x.n*x.m;});v+=rv;how.push("+"+rv+" "+r.n);});
 var line=how.join(" ")+" → "+v;
 if(o.eff){v=Math.floor(v*1.5);line+=" · effective ×1.5 → "+v;}
 if(o.vuln){v*=2;line+=" · vulnerable ×2 → "+v;}
 if(o.half){v=Math.floor(v/2);line+=" · half → "+v;}
 if(o.atk&&num(o.adr)>0){var adr=Math.max(0,num(o.adr)-(o.sunder?d.pb:0));v=Math.max(0,v-adr);line+=" · −"+adr+" ADR"+(o.sunder?" (Sundering −PB)":"")+" → "+v;}
 return {ok:true,each:v,how:line};}

 case "hd":if(S.hd.cur<1){flash("No hit dice left");return;}S.hd.cur--;break;
 case "death":S.death[id]=S.death[id]>n?n:n+1;break;
 case "tough":S.hp.temp=Math.max(num(S.hp.temp),d.def.tough);logline("Overflow Toughness: "+d.def.tough+" temp HP");break;
 case "combatstart":S.round=1;S.infUsed=0;for(var ek in S.eco)S.eco[ek].left=S.eco[ek].max;(S.bats||[]).forEach(function(b){b.ch=num(b.chMax);});
  S.mor.start=S.mor.cur;S.mor.lost=0;S.combat={on:true,tough:d.def.tough};
  if(d.def.tough){S.hp.temp=Math.max(num(S.hp.temp),d.def.tough);}logline("Combat started"+(d.def.tough?": Overflow Toughness "+d.def.tough+" temp HP":""));break;
 case "udDie":S.udDie=n;break;
 case "apropadd":it=itemById(id);v=val("apSel-"+id);if(!v)return;var kk=it.armor.kind;
  if(it.props.some(function(p){return p.toLowerCase()===v.toLowerCase();})){flash("A property can't be taken twice");return;}
  if(it.props.length>=ARMOR_PICKS[kk]){flash(kk.charAt(0).toUpperCase()+kk.slice(1)+" armor takes "+ARMOR_PICKS[kk]+" properties");return;}
  it.props.push(v);logline(it.name+": "+v);break;
 case "apropdel":it=itemById(id);it.props.splice(n,1);break;
 case "alegset":it=itemById(id);v=val("alSel-"+id);if(v==="__custom"){var cn=window.prompt("Legendary property name","");if(!cn)return;var ct=window.prompt("What it does","")||"";it.legendary=cn;it.legendaryText=ct;}else{it.legendary=v;it.legendaryText="";}break;
 case "tagadd":v=val("tagIn").trim();if(v&&S.tags.indexOf(v)<0)S.tags.push(v);break;
 case "tagdel":S.tags.splice(n,1);break;
 case "savetog":S.saves[id]=!S.saves[id];break;
 case "skill":S.skills[id]=((S.skills[id]||0)+1)%3;break;
 case "kitkind":S.ui.kitKind=id;break;
 case "pin":S.kitPin[id]=!S.kitPin[id];if(!S.kitPin[id])delete S.kitPin[id];break;
 case "kitown":S.kitOwn[id]=!S.kitOwn[id];if(C.hooks&&C.hooks.own)C.hooks.own(id,S.kitOwn[id],api);break;
 case "pay":pay(id);break;
 case "kitadd":if(!val("kcN").trim())return;S.kitCustom.push({id:uid("k"),n:val("kcN").trim(),k:val("kcK"),cost:val("kcC"),dmg:val("kcD"),text:esc(val("kcT"))});break;
 case "kitdel":S.kitCustom=S.kitCustom.filter(function(x){return x.id!==id;});break;
 case "slot":S.ui.slot=S.ui.slot===id?"":id;break;
 case "closeitem":S.ui.slot="";S.ui.item="";break;
 case "equip":equip(id,el.getAttribute("data-slot"));S.ui.item="";break;
 case "unequip":it=itemById(id);if(it){toStorage(it);logline("Unequipped "+it.name);}S.ui.slot="";break;
 case "useitem":it=itemById(id);if(!it)return;it.qty=num(it.qty,1)-1;logline("Used "+it.name+" (bonus action)");if(it.qty<=0)S.items.splice(S.items.indexOf(it),1);
  if(S.eco.bon&&S.eco.bon.left>0)S.eco.bon.left--;break;
 case "unslot":it=itemById(id);if(it)toStorage(it);break;
 case "unslotover":S.items.slice().forEach(function(y){var m=/^is(\d+)$/.exec(y.loc);if(m&&num(m[1])>=d.itemSlots)toStorage(y);});break;
 case "toslot":toItemSlot(id);break;
 case "wexp":r=S.prof[n];r.wexp=num(r.wexp)+num(el.getAttribute("data-v"))*(r.unprof?2:1);logline(r.type+" WEXP → "+r.wexp);break;
 case "wexpgym":v=window.prompt("WEXP from the gym (duel 2–6, tournament 2–5):","2");if(v===null)return;r=S.prof[n];r.wexp=num(r.wexp)+num(v)*(r.unprof?2:1);break;
 case "profadd":v=val("profNew").trim();if(v)S.prof.push({type:v,start:"F",wexp:0,unprof:false});break;
 case "profdel":if(window.confirm("Remove "+S.prof[n].type+" and its WEXP?"))S.prof.splice(n,1);break;
 case "unarmed":S.unarmed.cur=clamp(S.unarmed.cur+n,0,num(S.unarmed.max));break;
 case "infeq":var f=S.inf.filter(function(x){return x.id===id;})[0];if(!f)return;if(!f.eq&&S.inf.filter(function(x){return x.eq;}).length>=d.infCap){flash("Only "+d.infCap+" infusions can be equipped");return;}f.eq=!f.eq;break;
 case "infuse":declareInf(id);break;
 case "infdel":S.inf=S.inf.filter(function(x){return x.id!==id;});break;
 case "inflearn":v=val("infPool");if(v==="")return;p=INF_POOL[num(v)];S.inf.push({id:uid("f"),name:p[0],weapon:p[1],dur:p[2],text:p[3],eq:false});break;
 case "infcustom":if(!val("infN").trim())return;S.inf.push({id:uid("f"),name:val("infN").trim(),weapon:val("infW"),dur:num(val("infD"),1),text:val("infT"),eq:false});break;
 case "dur":it=itemById(id);it.dur=clamp(num(it.dur)+n,0,durMax(it));break;
 case "refine":it=itemById(id);logline("Refined "+it.name+" ("+(durMax(it)-num(it.dur))*50+" gp)");it.dur=durMax(it);break;
 case "propadd":it=itemById(id);v=(val("propTxt-"+id).trim()||val("propSel-"+id));if(!v)return;
  if(it.props.some(function(p){return p.toLowerCase()===v.toLowerCase();})){flash("A weapon can't hold the same property twice");return;}
  if(it.props.length>=3&&it.cat==="weapon"){flash("Weapons hold at most 3 properties");return;}
  if(!window.confirm("Imbue "+v+" on "+it.name+"? Properties are permanent."))return;it.props.push(v);break;
 case "propdel":it=itemById(id);if(window.confirm("Properties are permanent in play. Remove this one anyway (data correction)?"))it.props.splice(n,1);break;
 case "abadd":it=itemById(id);it.abilities.push({id:uid("a"),name:"New ability",kind:"action",cost:"",text:""});break;
 case "abdel":it=itemById(id);it.abilities=it.abilities.filter(function(a){return a.id!==el.getAttribute("data-n");});break;
 case "itemadd":if(!val("niN").trim())return;it=mkItem({id:uid("i"),name:val("niN").trim(),cat:val("niC"),qty:Math.max(1,num(val("niQ"),1)),rarity:val("niR"),desc:val("niD")});
  it.dur=rarityDur(it.rarity);S.items.push(it);toStorage(it);if(S.items.indexOf(it)<0)return commit();it.loc="storage";break;
 case "storecat":S.ui.storeCat=id;break;
 case "qty":it=itemById(id);it.qty=Math.max(0,num(it.qty,1)+n);if(it.qty===0&&window.confirm("Quantity is 0. Remove "+it.name+"?"))S.items.splice(S.items.indexOf(it),1);else if(it.qty===0)it.qty=1;break;
 case "edititem":S.ui.item=S.ui.item===id?"":id;break;
 case "itemdel":it=itemById(id);if(it&&window.confirm("Delete "+it.name+"?"))S.items.splice(S.items.indexOf(it),1);break;
 case "relf":S.ui.relFilter=id;break;
 case "relparty":r=relById(id);r.party=!r.party;break;
 case "pip":r=relById(id);var th=REL_TH[r.tier];if(n>0&&(r.tier+1>num(r.cap)||r.tier>=5))return;r.pips=clamp(r.pips+n,0,th);break;
 case "support":r=relById(id);if(r.tier+1===5&&S.rels.some(function(x){return x.tier===5&&x!==r;})){flash("Only one S bond at a time");return;}
  r.tier++;r.pips=0;logline("Support Conversation with "+r.name+": now "+TIERS[r.tier]);break;
 case "relnote":r=relById(id);v=window.prompt("Note for "+r.name,r.note||"");if(v!==null)r.note=v;break;
 case "reldel":r=relById(id);if(window.confirm("Remove "+r.name+"?"))S.rels=S.rels.filter(function(x){return x.id!==id;});break;
 case "reladd":v=val("relN").trim();if(!v)return;if(S.rels.some(function(x){return x.name.toLowerCase()===v.toLowerCase();})){flash("Already listed");return;}
  S.rels.push({id:uid("r"),name:v,tier:num(val("relT")),pips:0,cap:Math.max(num(val("relCap")),num(val("relT"))),party:false,note:""});break;
 case "tladjclear":S.tl.adj=0;afterTL();break;
 case "sitclear":S.sit={ac:0,speed:0,adr:0};break;
 case "resfull":r=(C.resources||[]).filter(function(x){return x.id===id;})[0];if(r){var mf=resMax(r,d);if(mf!=null)S.res[id]=mf;}break;
 case "dmgtog":S.dmg[id]=!S.dmg[id];if(id==="half"&&S.dmg.half)S.dmg.atk=false;break;
 case "dmgrider":S.dmg.riders[id]=!S.dmg.riders[id];if(!S.dmg.riders[id])delete S.dmg.riders[id];break;
 case "rideradd":v=val("riderE").trim();if(!v)return;if(!parseExpr(v,d).ok){flash("Couldn't read that rider");return;}S.dmg.custRiders.push({n:v,e:v});S.dmg.riders[v]=true;break;
 case "dmgadd":if(!dmgAdd())return;break;
 case "dmgdel":S.dmg.lines=S.dmg.lines.filter(function(l){return l.id!==id;});break;
 case "dmgundo":S.dmg.lines.pop();break;
 case "dmgclear":if(S.dmg.lines.length){var tt=0;S.dmg.lines.forEach(function(l){tt+=l.total;});logline("Dealt "+tt+" over "+S.dmg.lines.length+" strike"+(S.dmg.lines.length>1?"s":""));}S.dmg.lines=[];break;
 case "dmgcopy":var txt=dmgSummary();try{navigator.clipboard.writeText(txt).then(function(){toast("Copied");},function(){window.prompt("Copy:",txt);});}catch(err){window.prompt("Copy:",txt);}return;
 case "wspend":case "wgain":var oc=parseCoins(val("wOne"));if(!oc){flash("Try an amount like 150 gp or 2 pp 5 gp");return;}var why=val("wWhy").trim();
  if(a==="wgain"){gainCoins(oc);wlog("+"+fmtCoins(coinsCp(oc))+(why?" "+why:" received"));}else{var okc=spendCoins(oc);wlog("−"+fmtCoins(coinsCp(oc))+(why?" "+why:" spent")+(okc?"":" (went into debt)"));}break;
 case "subadd":if(!val("subN").trim()||!parseCoins(val("subA"))){flash("Needs a name and an amount like 30 pp");return;}S.subs.push({id:uid("sub"),name:val("subN").trim(),amt:val("subA").trim(),type:val("subT"),on:true});break;
 case "subdel":S.subs=S.subs.filter(function(x){return x.id!==id;});break;
 case "subone":var so=S.subs.filter(function(x){return x.id===id;})[0];if(!so||!applySub(so))return;break;
 case "subrun":var act1=S.subs.filter(function(x){return x.on;});if(!act1.length){flash("Nothing ticked");return;}
  var after=coinsCp(S.wealth)+subNet();if(after<0&&!window.confirm("This leaves her "+fmtCoins(after)+" in debt. Process anyway?"))return;
  S.subs.filter(function(x){return x.on&&x.type==="income";}).concat(act1.filter(function(x){return x.type!=="income";})).forEach(applySub);wlog("— "+(S.cycle||"Week")+" processed: net "+(subNet()>0?"+":"")+fmtCoins(subNet()));break;
 case "export":var blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});var ae=document.createElement("a");ae.href=URL.createObjectURL(blob);ae.download=(C.id||"sheet")+"-v3.json";ae.click();return;
 case "import":var fi=document.createElement("input");fi.type="file";fi.accept="application/json";fi.addEventListener("change",function(){var file=fi.files[0];if(!file)return;var rd=new FileReader();
  rd.onload=function(){try{var dd=JSON.parse(rd.result);if(dd.schema!==3&&C.migrate){S=defaults();C.migrate(dd,S,api);}else{S=defaults();deep(S,dd);}sanitize();commit();}catch(err){window.alert("That file did not parse.");}};rd.readAsText(file);});fi.click();return;
 case "wipe":if(!window.confirm("Reset every tracker, item and relationship on this sheet to its defaults?"))return;S=defaults();break;
 default:var br=batAct(a,el,d);if(br===true)break;if(br===false)return;var xr=extAct(a,el,d);if(xr===true)break;if(xr===false)return;if(C.hooks&&C.hooks.act&&C.hooks.act(a,el,api)!==false)break;return;}
 commit();}

/* ===================== PALETTE ===================== */
var IDX=[],palSel=0,palHits=[];
function buildIndex(){IDX=[];document.querySelectorAll(".pane").forEach(function(p){var pid=p.id.replace("pane-",""),pn=p.getAttribute("data-name");
 p.querySelectorAll("section").forEach(function(sec){var h=sec.querySelector("h2");if(!h)return;if(!sec.id)sec.id="s"+Math.random().toString(36).slice(2,8);
  IDX.push({p:pid,pn:pn,el:sec,t:(h.childNodes[0].nodeValue||h.textContent).trim(),x:sec.textContent.replace(/\s+/g," ").slice(0,300)});
  sec.querySelectorAll(".card h3,.dl dt,.slot .it,.rel .rn,.st-row .nm,.inf b,.lo-col summary span:first-child").forEach(function(el){var t=(el.childNodes[0]&&el.childNodes[0].nodeValue||el.textContent||"").trim();if(!t||t.length>60)return;
   IDX.push({p:pid,pn:pn,el:el.closest(".card,.dl div,.slot,.rel,.st-row,.inf,details")||el,t:t,x:(el.parentNode.textContent||"").replace(/\s+/g," ").slice(0,200)});});});});}
function palOpen(){buildIndex();$("palBack").classList.add("on");$("pal").classList.add("on");$("palIn").value="";palSearch("");$("palIn").focus();}
function palClose(){$("palBack").classList.remove("on");$("pal").classList.remove("on");}
function palSearch(q){q=q.trim().toLowerCase();palHits=[];
 IDX.forEach(function(e){if(palHits.length>=40)return;if(!q||e.t.toLowerCase().indexOf(q)>-1)palHits.push(e);});
 if(q)IDX.forEach(function(e){if(palHits.length>=40||palHits.indexOf(e)>-1)return;if(e.x.toLowerCase().indexOf(q)>-1)palHits.push(e);});
 palSel=0;drawPal();}
function drawPal(){var res=$("palRes");res.innerHTML="";if(!palHits.length){res.innerHTML='<button disabled style="color:var(--dimmer)">Nothing on the sheet matches that.</button>';return;}
 palHits.forEach(function(e,i){var b=document.createElement("button");if(i===palSel)b.className="sel";
  b.innerHTML='<span class="k">'+esc(e.pn)+'</span><b>'+esc(e.t)+'</b><br><span style="color:var(--dim);font-size:13px">'+esc(e.x.slice(0,110))+'</span>';
  b.addEventListener("click",function(){jump(e);});res.appendChild(b);});}
function jump(e){palClose();showPane(e.p);S.ui.pane=e.p;save();setTimeout(function(){if(e.el.tagName==="DETAILS")e.el.open=true;e.el.scrollIntoView({behavior:"smooth",block:"center"});e.el.classList.remove("hit");void e.el.offsetWidth;e.el.classList.add("hit");},40);}
function wirePal(){$("palBack").addEventListener("click",palClose);$("palIn").addEventListener("input",function(){palSearch(this.value);});
 $("palIn").addEventListener("keydown",function(e){if(e.key==="ArrowDown"){e.preventDefault();palSel=Math.min(palHits.length-1,palSel+1);drawPal();}
  else if(e.key==="ArrowUp"){e.preventDefault();palSel=Math.max(0,palSel-1);drawPal();}else if(e.key==="Enter"&&palHits[palSel]){e.preventDefault();jump(palHits[palSel]);}});}

/* ===================== CLOUD SYNC ===================== */
function initSync(){var CFG=window.FIREBASE_CONFIG||{},pill=$("syncPill");
 function setPill(t,c){pill.textContent=t;pill.style.color=c;}
 var ok=CFG&&CFG.apiKey&&String(CFG.apiKey).indexOf("PASTE")!==0&&window.firebase;
 if(!ok){setPill("○ local only","#bbb");return;}
 var docRef,applying=false,pushT=null,db=null,backedUp=false;
 try{if(!firebase.apps.length)firebase.initializeApp(CFG);db=firebase.firestore();db.enablePersistence({synchronizeTabs:true}).catch(function(){});
  docRef=db.collection("campaigns").doc(window.CAMPAIGN_ID||"astrology-club").collection("characters").doc(C.id);}catch(e){setPill("○ sync error","#e08");return;}
 function push(){docRef.set(JSON.parse(JSON.stringify(S))).then(function(){setPill("● synced","#7c7");}).catch(function(){setPill("○ offline","#c96");});}
 remoteSave=function(){if(applying)return;clearTimeout(pushT);pushT=setTimeout(push,400);};
 docRef.onSnapshot(function(snap){if(snap.metadata.hasPendingWrites)return;
  if(!snap.exists){push();return;}var data=snap.data();if(!data)return;
  applying=true;try{if(data.schema===3){var ui=S.ui;S=defaults();deep(S,data);S.ui=ui;}
   else if(C.migrate&&!S.migratedRemote){C.migrate(data,S,api);S.migratedRemote=true;logline("Imported the v2 cloud save");}
   sanitize();store.set(KEY,JSON.stringify(S));renderAll();}catch(e){}applying=false;
  if(data.schema!==3){if(backedUp)push();else{backedUp=true;var bk=db.collection("campaigns").doc(window.CAMPAIGN_ID||"astrology-club").collection("characters").doc(C.id+"__backup_"+Date.now());
   bk.set({backupOf:C.id,savedAt:new Date().toISOString(),data:JSON.parse(JSON.stringify(data))}).then(push,function(){setPill("○ backup failed · not overwriting","#e08");});logline("Older cloud save backed up before upgrading");}}
  setPill("● synced","#7c7");},function(){setPill("○ offline","#c96");});}

/* ===================== BOOT ===================== */
function boot(){panes();renderRail();buildPanes();wirePal();load();
 if(C.hooks&&C.hooks.init)C.hooks.init(api);renderAll();
 $("foot").textContent=(C.name||"")+" · Covenant engine 1.6 · saves to this device"+(C.footNote?" · "+C.footNote:"");initSync();}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot);else boot();
window.__sheet={get S(){return S;},compute:compute,endTurn:endTurn,act:act,renderAll:renderAll,takeDamage:takeDamage,moraleChange:moraleChange,equip:equip,declareInf:declareInf};
})();
