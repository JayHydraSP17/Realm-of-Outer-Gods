<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hasani Eldesteen · The Scythe of Necrolien</title>
<link rel="preconnect" href="https://fonts.googleapis.com/">
<link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --void:#070608;--panel:#18131e;--line:#2e213d;--line2:#453a52;
  --bone:#ece6d8;--dim:#a89bb7;--dimmer:#7c6892;
  --blood:#d8434f;--gold:#d9b154;--veil:#5fd2c0;--soul:#c2abff;--amber:#e8b04a;
  --ac:#c2abff;--ac-soft:#c2abff22;--ac-line:#c2abff66;--brand:#c2abff;
  --rib:linear-gradient(90deg,#5fd2c0,#c2abff,#d9b154,#e0506b);
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{background:radial-gradient(1100px 560px at 82% -12%,rgba(194,171,255,.08),transparent 60%),radial-gradient(900px 500px at -10% 108%,rgba(216,67,79,.07),transparent 60%),var(--void);
  color:var(--bone);font-family:'Cormorant Garamond',Georgia,serif;font-size:18px;line-height:1.55;padding:0 0 90px;}
.wrap{max-width:980px;margin:0 auto;padding:0 18px;position:relative;z-index:1;}
@media(min-width:1120px){.wrap{margin-left:288px;max-width:1090px;}}
h1,h2,h3,h4,.cz{font-family:'Cinzel',serif;font-weight:600;letter-spacing:.02em;}
.mono{font-family:'IBM Plex Mono',monospace;}
button{font:inherit;}

/* rail */
.rail{position:fixed;left:0;top:0;bottom:0;width:268px;z-index:70;overflow-y:auto;background:linear-gradient(180deg,#130f17,#08070a);border-right:1px solid var(--line);}
.rail-brand{padding:22px 18px 14px;border-bottom:1px solid var(--line);}
.rail-brand .eb{font-family:'Cinzel';font-size:10px;letter-spacing:.26em;color:var(--brand);text-transform:uppercase;}
.rail-brand .nm{font-family:'Cinzel Decorative';font-weight:900;font-size:30px;line-height:1.05;margin:8px 0 5px;color:#fff;}
.rail-brand .lv{font-family:'IBM Plex Mono';font-size:11px;color:var(--dim);}
.rail-search{margin:13px 14px 6px;display:flex;align-items:center;gap:9px;padding:9px 11px;cursor:pointer;background:#15111a;border:1px solid var(--line);border-radius:9px;color:var(--dim);font-family:'Cinzel';font-size:12.5px;}
.rail-search:hover{border-color:var(--ac);}
.rail-search .kbd{margin-left:auto;font-family:'IBM Plex Mono';font-size:9.5px;color:var(--dimmer);border:1px solid var(--line);padding:1px 4px;border-radius:4px;}
.rail-nav{padding:8px 10px 26px;}
.rail-grp{font-family:'IBM Plex Mono';font-size:9.5px;letter-spacing:.2em;color:var(--dimmer);text-transform:uppercase;margin:14px 8px 6px;}
.rail-btn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 11px;margin-bottom:2px;background:none;border:1px solid transparent;border-radius:8px;color:var(--dim);cursor:pointer;font-family:'Cinzel';font-size:14px;font-weight:500;}
.rail-btn .gl{width:7px;height:7px;background:var(--c,var(--ac));flex:none;transform:rotate(45deg);opacity:.6;}
.rail-btn .ct{margin-left:auto;font-family:'IBM Plex Mono';font-size:10px;color:var(--dimmer);}
.rail-btn:hover{color:var(--bone);background:#18121e;}
.rail-btn.on{color:#fff;background:#1d1626;border-color:var(--line2);}
.rail-btn.on .gl{opacity:1;box-shadow:0 0 9px var(--c,var(--ac));}
@media(max-width:1119px){
  .rail{position:static;width:auto;display:flex;flex-wrap:wrap;gap:6px;padding:12px;border-right:none;border-bottom:1px solid var(--line);}
  .rail-brand{width:100%;padding:4px 6px 12px;border:none;}
  .rail-search{margin:0;flex:1 1 170px;}
  .rail-nav{display:flex;flex-wrap:wrap;gap:5px;padding:6px 0 0;width:100%;}
  .rail-grp{display:none;} .rail-btn{width:auto;padding:7px 12px;font-size:13px;border:1px solid var(--line);}
}

/* tracker bar */
.bar{position:sticky;top:0;z-index:60;display:flex;gap:10px;flex-wrap:wrap;background:linear-gradient(180deg,rgba(19,15,23,.97),rgba(8,7,10,.97));backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);border:1px solid var(--line);border-top:3px solid var(--ac);border-radius:0 0 14px 14px;padding:12px 14px;margin-bottom:12px;box-shadow:0 14px 30px #000a;}
.tk{background:linear-gradient(180deg,#1b1522,#141019);border:1px solid var(--line);border-radius:11px;padding:9px 11px;min-width:180px;flex:1 1 180px;}
.tk .num.w44{width:40px;}
.tk .sl{font-size:13px;}
.tk .row{gap:4px;}
.tk .big{width:58px!important;font-size:19px!important;color:#fff;}
.tk-h{font-family:'Cinzel';font-size:11px;letter-spacing:.1em;color:var(--ac);display:flex;align-items:center;gap:7px;margin-bottom:7px;text-transform:uppercase;}
.tk-h .d{width:7px;height:7px;background:currentColor;transform:rotate(45deg);flex:none;}
.tk-h .chipx{margin-left:auto;}
.row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.btn{font-family:'Cinzel';min-width:28px;height:28px;border-radius:7px;border:1px solid var(--line);background:#18131e;color:var(--bone);font-size:14px;cursor:pointer;line-height:1;padding:0 8px;transition:.14s;}
.btn:hover{border-color:var(--ac);color:#fff;background:#1f1728;}
.btn:disabled{opacity:.35;cursor:not-allowed;}
.btn.sm{height:23px;font-size:11px;min-width:24px;padding:0 7px;}
.btn.lg{height:36px;padding:0 15px;font-size:14px;}
.btn.pri{border-color:var(--ac);color:#fff;background:var(--ac-soft);}
.btn.dgr:hover{border-color:var(--blood);color:#ffb3ba;}
.cur{font-family:'Cinzel';font-weight:700;font-size:22px;color:#fff;min-width:40px;text-align:center;}
.sl{color:var(--dimmer);}
.num{font-family:'Cinzel';font-weight:600;font-size:15px;width:62px;text-align:center;color:var(--gold);background:#100d14;border:1px solid var(--line);border-radius:6px;padding:3px 2px;-moz-appearance:textfield;}
.num.w44{width:44px;} .num.w80{width:80px;}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.meter{height:6px;background:#0d0b10;border-radius:3px;margin-top:7px;overflow:hidden;border:1px solid #241b2e;position:relative;}
.meter i{display:block;height:100%;transition:width .3s;}
.meter .mk{position:absolute;top:0;bottom:0;width:1px;background:#ffffff55;}
.sub{font-family:'IBM Plex Mono';font-size:10.5px;color:var(--dim);margin-top:6px;}
.bar-tools{display:flex;gap:8px;align-items:center;width:100%;padding-top:6px;border-top:1px solid var(--line);flex-wrap:wrap;}
.bar-tools button{font-family:'IBM Plex Mono';font-size:10.5px;color:var(--dim);background:#15111a;border:1px solid var(--line);border-radius:6px;padding:5px 9px;cursor:pointer;}
.bar-tools button:hover{color:var(--ac);border-color:var(--ac);}
.savehint{font-family:'IBM Plex Mono';font-size:10px;color:var(--dimmer);margin-left:auto;}
.savehint.flash{color:var(--ac);}
.roundrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;width:100%;padding:8px 2px 2px;border-top:1px solid var(--line);}
.bar.fold .tk{display:none;}
.minibar{display:none;width:100%;gap:14px;flex-wrap:wrap;align-items:center;font-family:'IBM Plex Mono';font-size:12px;color:var(--dim);}
.minibar b{font-family:'Cinzel';font-size:16px;color:#fff;margin-left:5px;}
.bar.fold .minibar{display:flex;}

/* chips & tags */
.chip{font-family:'IBM Plex Mono';font-size:10.5px;letter-spacing:.05em;border:1px solid var(--line);border-radius:20px;padding:3px 10px;color:var(--dim);background:#15111a;display:inline-block;white-space:nowrap;}
button.chip{cursor:pointer;}
.chip.on{color:#fff;border-color:var(--ac);background:var(--ac-soft);}
.chip.ok{color:#bff3ea;border-color:var(--veil);background:#5fd2c01c;}
.chip.warn{color:#ffd79a;border-color:var(--amber);background:#e8b04a1c;}
.chip.bad{color:#ffb3ba;border-color:var(--blood);background:#d8434f22;}
.tag{font-family:'IBM Plex Mono';font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ac);border:1px solid var(--ac-line);border-radius:4px;padding:1px 6px;font-weight:400;}
.tag.gold{color:var(--gold);border-color:#d9b15455;} .tag.blood{color:var(--blood);border-color:#d8434f55;} .tag.veil{color:var(--veil);border-color:#5fd2c055;}
.k-attack{color:#ff9aa4!important;border-color:#d8434f66!important;}
.k-action{color:#f2d58a!important;border-color:#d9b15466!important;}
.k-bonus{color:#9fe8dc!important;border-color:#5fd2c066!important;}
.k-reaction{color:#d3c3ff!important;border-color:#c2abff66!important;}
.k-free{color:#cfe6b0!important;border-color:#9fbf7866!important;}
.k-passive{color:var(--dim)!important;border-color:var(--line2)!important;}
.tbd{font-family:'Cinzel';font-size:9.5px;letter-spacing:.1em;background:#3a2c0c;color:var(--amber);border:1px solid var(--amber);padding:1px 7px;border-radius:10px;margin-left:5px;vertical-align:middle;font-weight:700;text-transform:uppercase;white-space:nowrap;}
.amber{color:var(--amber);}

/* panes */
.pane{display:none;} .pane.on{display:block;}
.pane-head{padding:24px 0 4px;}
.pane-head .eb{font-family:'Cinzel';font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--ac);}
.pane-head h1{font-family:'Cinzel Decorative';font-weight:900;font-size:clamp(28px,5.5vw,44px);color:#fff;line-height:1.05;margin-top:7px;}
.pane-head .bl{color:var(--dim);font-size:16px;max-width:66ch;margin-top:8px;}
section{margin:28px 0;scroll-margin-top:170px;}
section>h2{font-size:22px;color:#fff;display:flex;align-items:baseline;gap:11px;margin-bottom:6px;flex-wrap:wrap;}
section>h2 .sub2{font-family:'IBM Plex Mono';font-size:10.5px;letter-spacing:.12em;color:var(--dimmer);text-transform:uppercase;}
.note{color:var(--dim);font-size:15px;max-width:72ch;margin-top:8px;}
.gm{border-left:3px solid var(--blood);background:#1a0d11aa;padding:10px 14px;margin:12px 0;border-radius:0 8px 8px 0;font-size:15.5px;}
.gm b{font-family:'Cinzel';color:var(--blood);font-weight:600;}
.flag{border-left:3px solid var(--amber);background:#221a08aa;padding:10px 14px;margin:12px 0;border-radius:0 8px 8px 0;font-size:15px;}
.flag b{font-family:'Cinzel';color:var(--amber);font-weight:600;}
.card{background:linear-gradient(180deg,#1b1522,#141019);border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin:10px 0;}
.card h3{font-size:17px;color:#fff;margin-bottom:3px;display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;}
.card p{font-size:16px;} .card p+p{margin-top:6px;}
.cost{font-family:'IBM Plex Mono';font-size:11.5px;color:var(--dim);margin-bottom:5px;}
@media(max-width:700px){.bar{position:relative;}.tk{flex:1 1 100%;}}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(268px,1fr));gap:10px;}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;}
table{width:100%;border-collapse:collapse;margin:10px 0;font-size:15.5px;}
th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:top;}
th{font-family:'Cinzel';font-weight:600;font-size:12px;letter-spacing:.07em;color:var(--ac);}
td.n,th.n{font-family:'IBM Plex Mono';font-size:13px;white-space:nowrap;}
tr.hl td{background:var(--ac-soft);}
ul{margin:8px 0 8px 20px;} li{margin-bottom:4px;}
.dl{margin:10px 0;} .dl div{display:flex;gap:12px;padding:6px 0;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.dl dt{font-family:'Cinzel';font-size:14.5px;color:var(--gold);min-width:170px;flex:none;}
.dl dd{color:var(--bone);font-size:15.5px;flex:1;min-width:220px;}
input[type=text],textarea,select.sel{font-family:'Cormorant Garamond';background:#0f0c13;border:1px solid var(--line);color:var(--bone);border-radius:7px;padding:6px 9px;font-size:15.5px;}
input[type=text]{width:100%;}
select.sel{font-family:'Cinzel';font-size:13px;padding:5px 7px;}
textarea{width:100%;min-height:100px;resize:vertical;line-height:1.55;}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--ac);}
.empty{color:var(--dimmer);font-style:italic;font-size:15px;padding:8px 0;}
.lbl{font-family:'IBM Plex Mono';font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dimmer);display:block;margin-bottom:3px;}
.fld{display:flex;flex-direction:column;min-width:0;}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px;align-items:end;}
.form .wide{grid-column:1/-1;}

/* transformation console */
.tx{border:1px solid var(--line);border-top:3px solid var(--ac);border-radius:14px;padding:16px;background:linear-gradient(180deg,#1c1524,#110d15);}
.tx-top{display:flex;gap:14px;flex-wrap:wrap;align-items:center;justify-content:space-between;}
.tx-name{font-family:'Cinzel Decorative';font-weight:900;font-size:28px;color:var(--ac);line-height:1;}
.tx-sub{font-family:'IBM Plex Mono';font-size:11px;color:var(--dim);letter-spacing:.08em;margin-top:5px;}
.ladder{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:12px;}
.lad{background:#140f19;display:grid;grid-template-columns:130px 1fr;gap:12px;padding:9px 12px;}
.lad .nm{font-family:'Cinzel';font-size:14px;color:var(--dim);}
.lad .nm small{display:block;font-family:'IBM Plex Mono';font-size:10px;color:var(--dimmer);letter-spacing:.06em;}
.lad ul{margin:0 0 0 16px;font-size:15px;color:var(--dim);}
.lad.on{background:linear-gradient(90deg,#3a2a0c66,#140f19);} .lad.on .nm{color:var(--amber);} .lad.on ul{color:var(--bone);}
.lad.on.frac{background:linear-gradient(90deg,#4a121b77,#140f19);} .lad.on.frac .nm{color:#ff8f9a;}
.lad.on.col{background:linear-gradient(90deg,#5a0f1a,#140f19);} .lad.on.col .nm{color:#fff;}
.collapse{border:2px solid var(--blood);border-radius:12px;padding:14px;margin-top:12px;background:#210a0f;}
.collapse h3{color:#ffb3ba;}
.modes{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
.mode{flex:1 1 150px;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#15101a;cursor:pointer;text-align:left;color:var(--bone);}
.mode .mn{font-family:'Cinzel';font-weight:700;font-size:16px;color:var(--fc);}
.mode .mi{font-family:'IBM Plex Mono';font-size:10.5px;color:var(--dim);}
.mode.on{border-color:var(--fc);box-shadow:inset 0 0 0 1px var(--fc),0 0 20px -8px var(--fc);}
.log{font-family:'IBM Plex Mono';font-size:11px;color:var(--dim);margin-top:10px;max-height:110px;overflow-y:auto;}
.log div{padding:2px 0;border-bottom:1px dotted #241b2e;}

/* resources, pips */
.res{background:#15111a;border:1px solid var(--line);border-radius:10px;padding:9px 11px;}
.res .rn{font-family:'Cinzel';font-size:13px;color:#fff;display:flex;gap:6px;align-items:baseline;}
.res .rn small{font-family:'IBM Plex Mono';font-size:10px;color:var(--dimmer);margin-left:auto;}
.pips{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-top:6px;}
.pip{width:21px;height:21px;border-radius:6px;border:1.5px solid var(--line2);background:#100d14;cursor:pointer;padding:0;}
.pip.live{background:var(--ac);border-color:var(--ac);box-shadow:0 0 8px var(--ac-line);}

/* loadout */
.loadout{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;}
.lo-col{background:#140f19;border:1px solid var(--line);border-radius:11px;padding:9px 10px;}
.lo-col h4{font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px;}
.lo-col details{border-bottom:1px dotted #2a1f36;padding:4px 0;}
.lo-col summary{cursor:pointer;font-size:15.5px;list-style:none;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;}
.lo-col summary::-webkit-details-marker{display:none;}
.lo-col summary .src{font-family:'IBM Plex Mono';font-size:9.5px;color:var(--dimmer);}
.lo-col details p{font-size:14.5px;color:var(--dim);margin:4px 0 2px;}

/* equipment */
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;}
.slot{border:1px solid var(--line);border-radius:11px;padding:11px 13px;background:#140f19;cursor:pointer;text-align:left;color:var(--bone);position:relative;min-height:78px;}
.slot:hover{border-color:var(--ac);}
.slot .sn{font-family:'IBM Plex Mono';font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dimmer);}
.slot .it{font-family:'Cinzel';font-size:16px;color:#fff;margin-top:3px;line-height:1.2;}
.slot .mt{font-family:'IBM Plex Mono';font-size:10px;color:var(--dim);margin-top:4px;}
.slot.empty .it{color:var(--dimmer);font-style:italic;font-family:'Cormorant Garamond';}
.slot.held{opacity:.6;border-style:dashed;}
.slot.open{border-color:var(--ac);box-shadow:inset 0 0 0 1px var(--ac);}
.detail{border:1px solid var(--ac-line);border-radius:12px;padding:14px;margin-top:10px;background:#130f17;}
.dur{display:flex;gap:3px;flex-wrap:wrap;margin-top:5px;}
.dur i{width:9px;height:14px;border-radius:2px;background:var(--gold);display:block;}
.dur i.x{background:#2a1f36;}
.ab-row{border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin-top:7px;background:#15101a;}
.islots{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:9px;}
.islot{border:1px dashed var(--line2);border-radius:10px;padding:9px 11px;background:#110e15;min-height:70px;}
.islot.full{border-style:solid;border-color:var(--line);}
.rank{font-family:'Cinzel';font-weight:900;font-size:20px;width:36px;height:36px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;background:#100d14;border:1px solid var(--line);}
.r-F{color:#d8434f;} .r-D{color:#c9a15a;} .r-C{color:#c2abff;} .r-B{color:#d9b154;} .r-A{color:#5fd2c0;} .r-S{color:#fff;background:#2a1f36;}
.inf{border:1px solid var(--line);border-left:3px solid var(--line2);border-radius:10px;padding:9px 12px;margin-top:8px;background:#15101a;}
.inf.eq{border-left-color:var(--ac);background:linear-gradient(90deg,var(--ac-soft),#15101a);}

/* stats & skills */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:9px;margin:10px 0;}
.stat{background:#15111a;border:1px solid var(--line);border-radius:10px;padding:9px;text-align:center;}
.stat .lb{font-family:'IBM Plex Mono';font-size:10px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;}
.stat .mo{font-family:'Cinzel';font-size:27px;font-weight:700;color:#fff;line-height:1.1;}
.stat .sv{font-family:'IBM Plex Mono';font-size:10.5px;color:var(--dim);margin-top:5px;cursor:pointer;}
.stat .sv.p{color:var(--ac);}
.vitals{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:9px;margin:10px 0;}
.vit{background:#15111a;border:1px solid var(--line);border-radius:10px;padding:9px;text-align:center;}
.vit .lb{font-family:'IBM Plex Mono';font-size:9.5px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase;}
.vit .v{font-family:'Cinzel';font-size:23px;font-weight:700;color:#fff;}
.vit .s{font-family:'IBM Plex Mono';font-size:9.5px;color:var(--dimmer);}
.vit.hi{border-color:var(--ac-line);} .vit.hi .v{color:var(--ac);}
.skl{display:grid;grid-template-columns:repeat(auto-fit,minmax(238px,1fr));gap:1px 16px;}
.sk{display:flex;align-items:center;gap:9px;padding:5px 2px;border-bottom:1px solid #1f1828;font-size:15px;}
.sk .pp{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--line2);background:#0f0c13;cursor:pointer;flex:none;font-family:'IBM Plex Mono';font-size:8.5px;color:var(--void);text-align:center;line-height:12px;padding:0;}
.sk .pp.p{background:var(--ac);border-color:var(--ac);} .sk .pp.e{background:var(--gold);border-color:var(--gold);}
.sk .nm{flex:1;} .sk .ab{font-family:'IBM Plex Mono';font-size:10px;color:var(--dimmer);}
.sk .vl{font-family:'Cinzel';font-size:16px;color:#fff;min-width:38px;text-align:right;}

/* relationships */
.rel{display:grid;grid-template-columns:28px minmax(120px,1.2fr) 40px minmax(150px,1.6fr) auto;gap:10px;align-items:center;padding:8px 6px;border-bottom:1px solid #1f1828;}
.rel.party{background:linear-gradient(90deg,var(--ac-soft),transparent);border-radius:6px;}
.rel .rn{font-size:16.5px;}
.rel .rn small{display:block;font-family:'IBM Plex Mono';font-size:10px;color:var(--dimmer);}
.tierb{font-family:'Cinzel';font-weight:900;font-size:17px;width:34px;height:30px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:#100d14;}
.pipbar{display:flex;gap:2px;flex-wrap:wrap;}
.pipbar i{flex:1 1 6px;min-width:5px;max-width:14px;height:12px;border-radius:2px;background:#221a2c;display:block;}
.pipbar i.f{background:var(--ac);} .pipbar.full i.f{background:var(--gold);}
.pipmeta{font-family:'IBM Plex Mono';font-size:10.5px;color:var(--dim);margin-top:3px;}
.star{width:26px;height:26px;border-radius:6px;border:1px solid var(--line);background:#100d14;color:var(--dimmer);cursor:pointer;padding:0;}
.star.on{color:var(--gold);border-color:var(--gold);background:#d9b15418;}
@media(max-width:700px){.rel{grid-template-columns:28px 1fr 40px;}.rel .rp,.rel .ra{grid-column:1/-1;}}

/* storage */
.st-row{display:grid;grid-template-columns:minmax(140px,2fr) 100px 110px auto;gap:10px;align-items:center;padding:8px 6px;border-bottom:1px solid #1f1828;}
.st-row .nm{font-family:'Cinzel';font-size:15px;color:#fff;}
.st-row .nm small{display:block;font-family:'Cormorant Garamond';font-size:14px;color:var(--dim);}
@media(max-width:700px){.st-row{grid-template-columns:1fr auto;}}

/* palette */
.pal-back{position:fixed;inset:0;background:#000b;backdrop-filter:blur(3px);z-index:90;display:none;}
.pal-back.on{display:block;}
.pal{position:fixed;top:10vh;left:50%;transform:translateX(-50%);width:min(640px,94vw);z-index:91;display:none;background:#15111a;border:1px solid var(--line2);border-radius:14px;box-shadow:0 30px 70px #000c;overflow:hidden;}
.pal.on{display:block;}
.pal input{border:none;border-bottom:1px solid var(--line);border-radius:0;font-family:'Cinzel';font-size:18px;padding:14px 18px;}
.pal-res{max-height:56vh;overflow-y:auto;}
.pal-res button{display:block;width:100%;text-align:left;padding:10px 18px;background:none;border:none;border-bottom:1px solid #1d1626;color:var(--bone);cursor:pointer;font-size:15.5px;}
.pal-res button:hover,.pal-res button.sel{background:#1e1726;}
.pal-res .k{font-family:'IBM Plex Mono';font-size:9.5px;letter-spacing:.12em;color:var(--ac);text-transform:uppercase;display:block;}
.hit{animation:hit 1.6s ease;}
@keyframes hit{0%,100%{background:transparent}20%{background:var(--ac-soft)}}
.syncpill{position:fixed;bottom:10px;right:12px;z-index:99;font:600 11px/1 'IBM Plex Mono',monospace;padding:5px 9px;border-radius:20px;background:rgba(0,0,0,.6);color:#bbb;pointer-events:none;}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px;}
.foot{color:var(--dimmer);font-size:13px;text-align:center;margin-top:40px;font-family:'IBM Plex Mono';}
</style>

<style id="char-theme">/* Character theme: Violet Necrolien */
:root{--void:#050407;--panel:#150f1c;--line:#30253c;--line2:#443653;--bone:#ece6f4;--dim:#a89fb1;--dimmer:#7f748b;--gold:#c9b2ff;--soul:#9b6bff;--veil:#5fe6b8;--ac:#9b6bff;--ac-soft:#9b6bff22;--ac-line:#9b6bff66;--brand:#9b6bff;--rib:linear-gradient(90deg,#08060c,#4b2a8a,#9b6bff,#d9c9ff);--th-ac2:#5fe6b8;--th-ac3:#5fe6b8;}
body{background:radial-gradient(1100px 560px at 82% -12%,rgba(155,107,255,.13),transparent 60%),radial-gradient(900px 500px at -10% 108%,rgba(20,10,30,.55),transparent 60%),var(--void)!important}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:-1;background:radial-gradient(circle at 50% 120%,rgba(155,107,255,.10),transparent 55%)}
.rail-brand .nm,.pane-head h1,.tx-name{font-family:'Cinzel Decorative','Cinzel Decorative',serif!important;letter-spacing:.01em}
.pane-head h1{background:linear-gradient(100deg,var(--bone) 15%,#9b6bff 70%,#5fe6b8);-webkit-background-clip:text;background-clip:text;color:transparent}
</style>

<script>
/* ================== CHARACTER CONFIG ==================
   Everything character-specific lives in this block.
   The engine below is identical on every sheet. */
/* Copy this file, rename it CharacterName_Reference__1.0_.html, and fill in the block below.
   Required: id (lowercase, becomes the save key and the cloud document id), name, classes, stats.
   Optional: tx (a transformation that uses TL), resources, economy, kit, items, prof, rels, panes, hooks. */
/* ================== HASANI · LIVE TRACKERS (hooks) ==================
   Interactive Soul Arsenal, Carnage / Hollowed / Tithe / Sand pips, Orion Decay spender,
   and the Grief cycle stepper. All state lives on S (saved + synced by the engine):
   resources (mp, sand, carn, hollow, tithe) via the api, everything else on S.hz. */
var HZ=(function(){
 var COL={red:["Red","#ff8b8b","#9e1b1b"],blue:["Blue","#9bd0ff","#1b4d8a"],green:["Green","#9bf0c9","#1b6e4d"],
  purple:["Purple","#d6b8ff","#5e438f"],cyan:["Cyan","#bff0ff","#2a8ba8"],yellow:["Yellow","#fff0a8","#a8881b"],
  pink:["Pink","#ffb3dc","#9c2d6b"],white:["White","#ffffff","#8c7aa0"],black:["Black","#b3a8c0","#000000"]};
 var ORDER=["red","blue","green","purple","cyan","yellow","pink","white","black"];
 var BASE={red:1,blue:1,green:1};
 var STAGES=["Denial","Anger","Bargaining","Depression","Acceptance"];
 var EMP=[[10,1],[20,2],[30,1],[40,2],[50,3]];          /* per-stage Enhanced cost: [TL, MP] from each stage's text */
 var HOLLOW=[["+1 damage die","−3 to MP & morale checks"],["+2 damage reduction","No Disengage"],
  ["+10 ft movement","Must move toward nearest enemy"],["Emptying Save ignores favorable Morale","Disadv. on WIS saves"],
  ["Enter Senseless State","Lose tactical reasoning"]];
 var DECAY=[["Combat-long → 3-round counter",3],["Multi-round · shave 1 round",1],["Round → Turn",2],["Turn → Instantaneous",1],
  ["Instantaneous → Nothing (negate)",3],["Barrier · one stage",2],["Instinctual Reaction (not targeting Hasani)",2],
  ["Transformation · 1/combat, full glass","all"]];
 function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
 function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
 function st(api){var S=api.S();if(!S.hz||typeof S.hz!=="object")S.hz={};var h=S.hz;
  if(!Array.isArray(h.souls)||h.souls.length!==5)h.souls=[null,null,null,null,null];
  if(h.prog==null)h.prog=10;if(h.grief==null)h.grief=-1;if(h.brk==null)h.brk=0;if(h.mad==null)h.mad=0;
  if(!h.mode)h.mode="decay";if(h.castTL==null)h.castTL=true;if(h.txd==null)h.txd=false;if(h.cycMP==null)h.cycMP=0;if(h.gUsed==null)h.gUsed=false;
  return h;}
 function C(){return window.CHAR;}
 function resMaxOf(api,id){var S=api.S();if(S.resMax&&S.resMax[id]!=null)return +S.resMax[id];
  var r=(C().resources||[]).filter(function(x){return x.id===id;})[0];return r?r.max:0;}
 function cha(api){var d=api.compute();return (d&&d.mod)?d.mod.cha:0;}
 function sgn(n){return (n>=0?"+":"")+n;}
 /* ---------- souls ---------- */
 function soulAbilities(){var out=[];(C().kit||[]).forEach(function(sec){if(sec.id!=="souls")return;
  sec.items.forEach(function(a){if(/^Artificial/.test(a.n))return;var need={},m,re=/(\d+)\s*(Red|Blue|Green|Purple|Cyan|Yellow)/gi;
   while((m=re.exec(a.cost||"")))need[m[2].toLowerCase()]=(need[m[2].toLowerCase()]||0)+(+m[1]);
   out.push({n:a.n,need:need,tl:(a.pay&&a.pay.tl)||0});});});return out;}
 function counts(h){var c={};for(var i=0;i<4;i++){var s=h.souls[i];if(s)c[s]=(c[s]||0)+1;}return c;}
 function afford(h,need){var c=counts(h),bdef=0,def=0;for(var k in need){var m=Math.max(0,need[k]-(c[k]||0));if(BASE[k])bdef+=m;else def+=m;}
  var pk=Math.min(bdef,c.pink||0);return (bdef-pk)+def<=(c.white||0);}
 function consume(h,need){var def=0,bdef=0;for(var k in need){var left=need[k];
   for(var i=0;i<4&&left>0;i++)if(h.souls[i]===k){h.souls[i]=null;left--;}if(BASE[k])bdef+=left;else def+=left;}
  for(var q=0;q<4&&bdef>0;q++)if(h.souls[q]==="pink"){h.souls[q]=null;bdef--;}def+=bdef;
  for(var j=0;j<4&&def>0;j++)if(h.souls[j]==="white"){h.souls[j]=null;def--;}}
 function needChips(need){return Object.keys(need).map(function(k){return '<span class="hz-chip" style="--sc:'+COL[k][1]+'">'+need[k]+' '+COL[k][0]+'</span>';}).join("");}
 function slotsHTML(h){var o='<div class="hz-slots">';
  for(var i=0;i<5;i++){var s=h.souls[i],perm=i===4,c=s?COL[s]:null;
   o+='<div class="hz-slot'+(s?' f':'')+(perm?' perm':'')+'" data-a="hz-cyc" data-n="'+i+'" role="button" tabindex="0" title="'+(perm?'Permanent core soul':'Temporary soul')+' — tap to cycle colour"'+
    (s?' style="--sc:'+c[1]+';background:radial-gradient(circle at 35% 30%,'+c[1]+','+c[2]+')"':'')+'>'+
    (s?'<span>'+c[0].toUpperCase()+'</span><button class="hz-x" data-a="hz-dis" data-n="'+i+'" title="Discard">×</button>':'')+
    '<small>'+(perm?'Permanent':'Temp '+(i+1))+'</small></div>';}
  return o+'</div>';}
 function harvHTML(){return '<div class="hz-harv"><span class="hz-lbl">Harvest</span>'+ORDER.map(function(k){
  return '<button class="hz-chip hz-btn" style="--sc:'+COL[k][1]+'" data-a="hz-harv" data-id="'+k+'">+ '+COL[k][0]+'</button>';}).join("")+'</div>';}
 function soulSummary(h){var c=counts(h),n=0;for(var k in c)n+=c[k];
  return '<div class="hz-sub">Temp '+n+'/4 · Permanent: '+(h.souls[4]?COL[h.souls[4]][0]:'—')+(n>=4?' · <b class="hz-amber">full — discard before harvesting</b>':'')+'</div>';}
 /* ---------- merging & core slot ---------- */
 var HIGH={"blue|red":"purple","blue|green":"cyan","green|red":"yellow"};
 var SHARE={"purple|yellow":"red","cyan|purple":"blue","cyan|yellow":"green"};
 var PINKTO={red:["purple","yellow"],blue:["purple","cyan"],green:["cyan","yellow"]};
 var CORE_OPT={red:[["str","dex"]],blue:[["int","wis"]],green:[["con"]],purple:[["str","dex"],["int","wis"]],cyan:[["int","wis"],["con"]],yellow:[["str","dex"],["con"]]};
 var STN={str:"STR",dex:"DEX",con:"CON",int:"INT",wis:"WIS",cha:"CHA"};
 function mergeOpts(h){var out=[],seen={};
  for(var i=0;i<4;i++)for(var j=i+1;j<4;j++){var a=h.souls[i],b=h.souls[j];if(!a||!b||a===b)continue;var k=[a,b].sort().join("|"),res=[];
   if(BASE[a]&&BASE[b])res.push({to:HIGH[k],two:false});
   else if(a==="pink"&&BASE[b])PINKTO[b].forEach(function(x){res.push({to:x,two:false});});
   else if(b==="pink"&&BASE[a])PINKTO[a].forEach(function(x){res.push({to:x,two:false});});
   else if(SHARE[k])res.push({to:SHARE[k],two:true});
   res.forEach(function(r){var lab=COL[a][0]+" + "+COL[b][0]+" → "+(r.two?"2 "+COL[r.to][0]:COL[r.to][0]);if(seen[lab])return;seen[lab]=1;out.push({i:i,j:j,to:r.to,two:r.two,lab:lab});});}
  return out;}
 function mergeHTML(h){var ops=mergeOpts(h),lock=h.mT&&!h.ooc;
  var o='<div class="card hz-card" style="--bd:#5fe6b8"><div class="hz-h">Merge souls <span class="hz-tag">'+(h.ooc?'outside combat · free':'free action · once per turn')+'</span>'+
   '<button class="chip'+(h.ooc?' on':'')+'" data-a="hz-ooc" style="margin-left:auto">'+(h.ooc?'outside combat':'in combat')+'</button></div>';
  if(lock)o+='<div class="hz-sub hz-amber">Already merged this turn — End Turn to merge again.</div>';
  o+='<div class="hz-row">'+(ops.length?ops.map(function(m,x){return '<button class="btn sm'+(lock?'':' pri')+'" data-a="hz-merge" data-n="'+x+'"'+(lock?' disabled':'')+'>'+esc(m.lab)+'</button>';}).join(""):'<span class="hz-cost">No valid merges in the temporary slots.</span>')+'</div>';
  return o+'<div class="hz-sub">Base + different base → higher · Pink + base → either higher that base belongs to · two different higher souls → 2 of their shared base. A merged soul can be spent the same turn but can never be split.</div></div>';}
 function coreBonusOf(h){var c=h.souls&&h.souls[4],b={};if(!c)return b;
  if(c==="pink"){b.cha=2;return b;}
  if(c==="white"||c==="black"){["str","dex","con","int","wis","cha"].forEach(function(k){b[k]=c==="black"?2:1;});return b;}
  (CORE_OPT[c]||[]).forEach(function(g,gi){var pick=(h.core||[])[gi];if(g.indexOf(pick)<0)pick=g[0];b[pick]=(b[pick]||0)+2;});return b;}
 function coreHTML(h){var c=h.souls[4],b=coreBonusOf(h),o='<div class="card hz-card" style="--bd:var(--gold)"><div class="hz-h">Core soul bonus <span class="hz-tag">permanent slot · applied to his ability scores</span></div>';
  if(!c)return o+'<div class="hz-sub">Empty — tap the gold Permanent slot to choose its colour.</div></div>';
  o+='<div class="hz-row"><span class="hz-chip" style="--sc:'+COL[c][1]+'">'+COL[c][0]+'</span><b class="hz-gold">'+Object.keys(b).map(function(k){return '+'+b[k]+' '+STN[k];}).join(" · ")+'</b></div>';
  (CORE_OPT[c]||[]).forEach(function(g,gi){if(g.length<2)return;var cur=(h.core||[])[gi];if(g.indexOf(cur)<0)cur=g[0];
   o+='<div class="hz-row"><span class="hz-lbl">'+(CORE_OPT[c].length>1?'Stat '+(gi+1):'Stat')+'</span>'+g.map(function(k){return '<button class="chip'+(k===cur?' on':'')+'" data-a="hz-core" data-n="'+gi+'" data-id="'+k+'">'+STN[k]+'</button>';}).join("")+'</div>';});
  return o+'<div class="hz-sub">Bonuses add to the ability <b>scores</b> (not the modifiers): base +2 to one of its stats · Pink +2 CHA · higher +2 to one stat from each parent colour · White +1 all · Black +2 all. Enter his <b>base</b> scores on the Character tab; the core bonus is added on top.</div></div>';}
 /* ---------- pip trackers ---------- */
 function pips(api,id,max,color){var v=api.res(id),o='<div class="pips hz-pips" style="--ac:'+color+';--ac-line:'+color+'66">';
  for(var n=1;n<=max;n++)o+='<button class="pip'+(n<=v?' live':'')+'" data-a="hz-pip" data-id="'+id+'" data-n="'+n+'" title="'+n+'"></button>';
  return o+'<button class="btn sm" data-a="hz-step" data-id="'+id+'" data-n="-1">−</button><b class="hz-val">'+v+'<span>/'+max+'</span></b><button class="btn sm" data-a="hz-step" data-id="'+id+'" data-n="1">+</button></div>';}
 function carnCard(api){var v=api.res("carn"),c=cha(api);
  return '<div class="card hz-card" style="--bd:#cf3a3a"><div class="hz-h">Carnage <span class="hz-tag">+1 when anything within 20 ft takes damage</span></div>'+pips(api,"carn",5,"#cf3a3a")+
   (v>=5?'<div class="hz-alert" style="--al:#cf3a3a"><b>BURST READY.</b> Next attack adds force + necrotic = CHA ('+sgn(c)+') × creatures within 10 ft (incl. self). <button class="btn sm" data-a="hz-reset" data-id="carn">Exploded · reset</button></div>'
    :'<div class="hz-sub">'+(5-v)+' more to burst</div>')+'</div>';}
 function hollowCard(api){var v=api.res("hollow"),pb=api.compute().pb,o='<div class="card hz-card" style="--bd:#9b7bd4"><div class="hz-h">Emptiness <span class="hz-tag">The Emptiness that Follows · +1 when a creature becomes Hollowed</span></div>'+pips(api,"hollow",5,"#9b7bd4");
  if(v>=5)o+='<div class="hz-alert" style="--al:#9b7bd4"><b>SENSELESS STATE · 1 round.</b> +CHA Hollow damage; every hit applies 1 Hollow stack directly (plus the Emptying Save); temp HP = CHA × creatures within 10 ft; +10 ft move; crits → Hellfire I. Must move to &amp; attack the nearest creature; no Defensive/Dodge/Disengage. <b>Fugue is Unbound.</b> <button class="btn sm" data-a="hz-reset" data-id="hollow">Senseless ends (−'+pb+' MP)</button></div>';
  else if(v>0){o+='<div class="hz-list">';for(var i=0;i<v;i++)o+='<div><b>'+(i+1)+'</b> '+HOLLOW[i][0]+' <span class="hz-cost">· '+HOLLOW[i][1]+'</span></div>';o+='</div>';}
  else o+='<div class="hz-sub">+1 each time a creature reaches Hollowed (Tier III) · Senseless at 5 · the Hollow Console adds it for you</div>';
  return o+'</div>';}
 function titheCard(api){var v=api.res("tithe"),c=cha(api);
  return '<div class="card hz-card" style="--bd:#d9b154"><div class="hz-h">Rayth · Tithes <span class="hz-tag">+1 when a creature becomes Hollowed · once per creature · max 3</span></div>'+pips(api,"tithe",3,"#d9b154")+
   '<div class="hz-sub">'+(v?'<b class="hz-gold">+'+(2*v)+' damage die</b> · <b class="hz-gold">Emptying DC +'+(2*v)+'</b> (Toll of the Tithe) · <b class="hz-blood">−'+(25*v)+'% healing</b>':'No Tithes · full healing')+'</div>'+
   '<div class="hz-row"><button class="btn sm" data-a="hz-reset" data-id="tithe">Hollowed Cleave · fire &amp; reset</button><span class="hz-cost">3d6 slashing + CHA ('+sgn(c)+') Hollow ×'+v+' Tithe'+(v===1?'':'s')+' · creatures with stacks rise a tier · resets on stun</span></div></div>';}
 function sandCard(api,compact){var mx=resMaxOf(api,"sand"),h=st(api);
  return '<div class="card hz-card" style="--bd:#e8b45a"><div class="hz-h">Hourglass · Sand <span class="hz-tag">Orion</span></div>'+pips(api,"sand",mx,"#e8b45a")+
   '<div class="hz-row"><span class="hz-cost">Sand does not refill.</span>'+
   (compact?'<button class="chip" data-a="pane" data-id="orion">Decay table →</button>':'')+'</div>'+
   (h.txd?'<div class="hz-sub hz-amber">Transformation Decay used this combat. <button class="btn sm" data-a="hz-txd">New combat</button></div>':'')+'</div>';}
 /* ---------- grief ---------- */
 function griefChips(h){return '<div class="hz-stages">'+STAGES.map(function(s,i){
  return '<button class="hz-stage'+(h.grief===i?' on':'')+(h.grief>i?' past':'')+'" data-a="hz-g" data-id="set" data-n="'+i+'"><small>'+["I","II","III","IV","V"][i]+'</small>'+s+'</button>';}).join("")+'</div>';}
 function griefCard(api,full){var h=st(api),g=h.grief,mp=api.res("mp"),o='<div class="card hz-card" style="--bd:#9b7bd4"><div class="hz-h">Ecstasy Beyond Grief <span class="hz-tag">'+(g<0?(h.gUsed?'dormant · used this rest':'dormant'):'stage '+(g+1)+' · '+STAGES[g])+'</span></div>'+griefChips(h);
  o+='<div class="hz-row">';
  if(g<0)o+='<button class="btn sm pri" data-a="hz-g" data-id="enter">Enter cycle · 2 MP</button>';
  else{if(g<4)o+='<button class="btn sm pri" data-a="hz-g" data-id="shift">Shift → '+STAGES[g+1]+' · 1 MP</button>';
   o+='<button class="btn sm" data-a="hz-g" data-id="extend">Extend +1 rd · 1 MP</button>';
   if(full){o+='<button class="btn sm" data-a="hz-g" data-id="empower">Empower '+STAGES[g]+' · '+EMP[g][0]+' TL + '+EMP[g][1]+' MP</button>';
    if(g===1)o+='<button class="btn sm" data-a="hz-g" data-id="anger">Anger attack · 2 MP</button>';
    if(g===3)o+='<button class="btn sm" data-a="hz-g" data-id="rest">No actions · +4 MP</button>';
    if(g<4)o+='<button class="btn sm" data-a="hz-g" data-id="restart">Restart · 2 MP</button>';}
   if(g===4)o+='<button class="btn sm pri" data-a="hz-g" data-id="accept">Resolve Acceptance</button>';}
  if(full)o+='<button class="btn sm" data-a="hz-g" data-id="reroll">Reroll WIS/CHA save · 2 MP</button>';

   {n:"Press the Attack",k:"reaction",req:"Wld 9",unlock:true,text:"<b>Boost Morale</b> — when Rallying Mark heals a creature, spend 1 die (reaction) so another creature within 30 ft regains the same HP · <b>Coordinated Movements</b> — Urgent Orders can target one creature per die spent · <b>Expert Instructions</b> — when a creature benefits from your Help, spend 1 die (reaction) and add it to their roll, even after seeing it."},
   {n:"Punish the Weak",k:"passive",req:"Wld 11",unlock:true,dmg:"1d8",text:"Creatures you target with your abilities within 60 ft are marked (no action) until they're more than 60 ft away. Once per turn a marked creature takes an extra <b>1d8</b> damage (<b>1d12</b> if it's Frightened of you)."},
   {n:"Warlord's Intuition",k:"free",req:"Wld 13",unlock:true,pay:{res:{intuition:1}},text:"Before rolling a proficient ability check, treat the d20 as your Warlord level (<b>13</b>). Once per long rest."},
   {n:"Shift the Field",k:"action",req:"Wld 14",unlock:true,text:"Spend 1 die: up to 5 friendly creatures that can see or hear you move up to half their speed without provoking opportunity attacks."},
   {n:"Instinctive Flinch",k:"passive",req:"Wld 15",unlock:true,text:"Creatures that fail a WIS save against your fear or flee effects still have disadvantage on their next attack before your next turn (unless immune to Frightened)."},
   {n:"Expanded Dominion",k:"passive",req:"Wld 15",unlock:true,text:"Demoralization Dice ranges double: 60 ft (Excruciating, Don't Touch That) and 10 ft (Are You Sure?)."},
   {n:"Unbreakable Will",k:"passive",req:"Wld 17",unlock:true,text:"Immune to the Charmed and Frightened conditions."},
   {n:"Dreadful Terror",k:"reaction",req:"Wld 18",unlock:true,text:"When a creature becomes Frightened of you, spend Demoralization Dice: <b>Panicked Terror</b> (it uses its reaction to flee) · <b>Blind Terror</b> (2 dice — Blinded until your next turn) · <b>Paralyzing Terror</b> (3 dice — Paralyzed until your next turn)."},
   {n:"Tireless Leader",k:"passive",req:"Wld 20",unlock:true,text:"Roll d4s instead of spending Leadership Dice for Rallying Mark, Urgent Orders, Helpful Word or Prepare for Battle."}
  ]},
  /* ================= WARLOCK · HEXBLADE (PLANNED) ================= */
  {id:"wlk",title:"Warlock — Hexblade (planned)",pane:"warlock",sub:"Hexblade unlocks at Warlock 3 — raise the Warlock level to bring it online",items:[
   {n:"Eldritch Invocations",k:"passive",req:"Wlk 1",unlock:true,text:"Learn invocations — 1 at Warlock 1, <b>3 at Warlock 2</b> (5 at 5, 6 at 7, 7 at 9, 8 at 12, 9 at 15, 10 at 18). Swap one per Warlock level gained. <b class='amber'>Which three does he have?</b>"},
   {n:"Pact Magic",k:"passive",req:"Wlk 1",unlock:true,text:"CHA casting (<b>DC 25 · +17</b>). Cantrips: <i>eldritch blast</i>, <i>toll the dead</i>. <b>2 Pact slots, 1st level</b> at Warlock 2 — all slots share one level and return on a short rest. <i>(Pact Slots in Resources.)</i>"},
   {n:"Magical Cunning",k:"free",req:"Wlk 2",unlock:true,cost:"1 minute",pay:{res:{cunning:1}},text:"A 1-minute rite to regain expended Pact slots, up to half your maximum (round up). Once per long rest."},
   {n:"Hexblade · Expanded Spells",k:"passive",req:"Wlk 3",unlock:true,text:"Add to your Warlock list: <b>1</b> shield, wrathful smite · <b>2</b> blur, branding smite · <b>3</b> blink, elemental weapon · <b>4</b> phantasmal killer, staggering smite · <b>5</b> banishing smite, cone of cold."},
   {n:"Hex Warrior",k:"passive",req:"Wlk 3",unlock:true,text:"Proficiency with medium armor, shields and martial weapons. After a long rest, touch one proficient weapon <b>without the two-handed property</b> — attack and damage with it use <b>CHA</b> until your next long rest. With Pact of the Blade, this extends to every pact weapon regardless of type."},
   {n:"Hexblade's Curse",k:"bonus",req:"Wlk 3",unlock:true,dmg:"5",pay:{res:{curse:1}},text:"Curse a creature you can see within 30 ft for 1 minute: <b>+PB (+5) damage</b> against it, you <b>crit on 19–20</b> against it, and when it dies you regain <b>Warlock level + CHA</b> HP. Once per short or long rest."},
   {n:"Ability Score Improvement (Warlock)",k:"passive",req:"Wlk 4",unlock:true,text:"An ASI or feat — again at Warlock 8, 12 and 16."},
   {n:"Accursed Specter",k:"free",req:"Wlk 6",unlock:true,text:"When you slay a humanoid, raise its spirit as a <b>specter</b> with temp HP = half your Warlock level. It acts on its own initiative, obeys you, adds your CHA to its attacks, and stays until your next long rest. Once per long rest."},
   {n:"Contact Patron",k:"action",req:"Wlk 9",unlock:true,text:"<i>Contact other plane</i> always prepared; once per long rest cast it free to reach your patron, auto-succeeding on its save."},
   {n:"Armor of Hexes",k:"reaction",req:"Wlk 10",unlock:true,text:"When your cursed target hits you, roll a d6 — on <b>4+</b> the attack misses instead."},
   {n:"Mystic Arcanum",k:"passive",req:"Wlk 11",unlock:true,text:"One 6th-level Warlock spell castable once per long rest without a slot; add 7th at 13, 8th at 15, 9th at 17."},
   {n:"Master of Hexes",k:"passive",req:"Wlk 14",unlock:true,text:"When your cursed target dies, move the curse to another creature you can see within 30 ft (you don't regain HP from that death)."},
   {n:"Epic Boon (Warlock)",k:"passive",req:"Wlk 19",unlock:true,text:"An Epic Boon feat (Boon of Fate recommended)."},
   {n:"Eldritch Master",k:"passive",req:"Wlk 20",unlock:true,text:"Magical Cunning restores <b>all</b> expended Pact slots."}
  ]},
  /* ================= FEATS & BACKGROUND (Kit tab) ================= */
  {id:"feats",title:"Feats & Background",sub:"from his character sheet",items:[
   {n:"Noble (Offspring) · Death Candidate",k:"passive",text:"+2 CHA and +2 INT. Miss Ambre's tutelage and Damas's service (see School → Servants)."},
   {n:"Polearm Master",k:"bonus",dmg:"1d4",text:"After the Attack action with only a glaive, halberd, quarterstaff or spear, make a bonus-action butt-end attack (d4 bludgeoning, same ability). Creatures entering your reach with those weapons provoke opportunity attacks. <i>(Whether Rayth counts is a DM call.)</i>"},
   {n:"Sentinel",k:"reaction",text:"Opportunity attack hits drop the target's speed to 0 for the turn. Disengage doesn't stop your opportunity attacks. When a creature within 5 ft attacks someone other than you, make a melee weapon attack against it as a reaction."},
   {n:"Shield Master",k:"bonus",text:"After the Attack action, shove a creature within 5 ft with your shield. Add the shield's AC bonus to DEX saves against effects that target only you. On a DEX save for half damage, use your reaction to take none on a success. <i>(Needs a shield — Elyse.)</i>"},
   {n:"Tough",k:"passive",text:"+2 HP per character level."}
  ]}

 kit:[
  /* ===== THE SCYTHE OF NECROLIEN — HOLLOW (Kit tab) ===== */
  {id:"hollowrules",title:"The Scythe of Necrolien · Hollow",sub:"Rayth's special damage type & status",items:[
   {n:"Hollow (Special Damage Type)",k:"passive",text:`Necrotic damage drains the body; <b>Hollow damage empties the soul of meaning.</b> Hollow is unique to Rayth, the Senseless God, and Hasani is its only bearer. Creatures <b>immune to necrotic have resistance</b> to Hollow instead, and creatures <b>resistant to necrotic take normal damage</b>. <b>Soulless</b> creatures take Hollow damage normally but never gain Hollow stacks. True resistance is very rare — only creatures with an absolute, unshakeable purpose (divine avatars, beings bound by a core oath). Separate from Soul Erosion: Soul Erosion breaks the soul, Hollow erases its will — Hollow damage does <b>not</b> bypass temp HP and never applies Soul Erosion. <b>Critical hit</b> with Hollow damage: +1 stack automatically, on top of the save. <b>Direct stacks:</b> abilities that say "applies X stacks" add them with no save.`},
   {n:"Emptying Save",k:"passive",text:`<b>Once per round</b>, when a creature takes Hollow damage from Hasani, he can force a <b>CHA save vs. his spell save DC (25)</b>, adjusted by its Morale and Rayth's Tithes. <b>Fail:</b> +1 Hollow stack · <b>fail by 10+:</b> +2. <b>Success:</b> no stack, and it can't be forced again until the next round. <b>Morale:</b> Heroic −4 · Driven −2 · Steady +0 · Shaken +2 · Broken +4. <b>Toll of the Tithe:</b> +2 per Tithe (max +6). Track it on the <b>Hollow Console</b> (Turn tab).`},
   {n:"Hollow (Status Effect)",k:"passive",text:`Stacks per target, max 6. <b>I · Meaning Lost</b> (up to 2): healing −30%, morale penalties an extra −5, no Inspiration, morale boosts or Rally effects. <b>II · Purpose Erased</b> (up to 4): healing −40%, −5 to saving throws, below 50% HP disadvantage on attack rolls. <b>III · Hollowed</b> (up to 6): healing −50%, can't gain temp HP, below 25% HP disadvantage on all rolls. <b>Decay:</b> a creature that <b>takes no Hollow damage</b> in a round loses 1 stack. <b>Hollowed Hold:</b> on reaching Tier III it stays Hollowed for 1 full round before decay resumes. <b>Removal:</b> a creature may use a <b>bonus action</b> to <b>Reclaim Purpose</b> within itself or an ally — CHA save vs. Hasani's spell save DC; success −1 stack (−2 on beating the DC by 5+ or a natural 20).`}
  ]},
  /* ===== GENERAL PASSIVES (Kit tab) ===== */
  {id:"passives",title:"General Passives",sub:"always on",items:[
   {n:"Connector (Defining Trait)",k:"passive",text:`Within 10 ft of a character he shares a relationship with, Hasani's weapon die increases proportionally to that relationship (0–5 / F–S). Applies to only one character — automatically the highest-tiered ally in range. Set party tiers on the Relationships tab.`},
   {n:"Peer into Orioul",k:"passive",cost:"D",text:`See the souls of living creatures; the colour shows their main stats. <b>Base:</b> Red STR&DEX · Blue WIS&INT · Green CON · Pink CHA. <b>Higher:</b> Purple = Red + Blue · Cyan = Blue + Green · Yellow = Red + Green · White = Red + Blue + Green (counts as any soul) · Black = Purple + Cyan + Yellow (enhances abilities twofold). <b>Show Me YOUR Legacy (5 TL):</b> peer deeper for alignment as a highlighted colour; DM may ask for an Insight check for more of the creature's past.`},
   {n:"Soul Arsenal",k:"passive",text:`Harvest souls of creatures he kills to power abilities at the cost of TL. Holds <b>4 temporary + 1 permanent</b> soul in his core; taking a soul with full slots forces a discard. <b>Temporary souls disappear after a long rest.</b> <b>Permanent slot bonuses</b> (applied to his scores automatically): base +2 to one stat of that colour (choose when slotted) · Pink +2 CHA · higher +2 to two stats from its two parent colours · White +1 to every stat · Black +2 to every stat. <i>(Interactive arsenal on the Turn and Angel of Death tabs.)</i>`},
   {n:"Harvesting",k:"passive",text:`Any creature echoed or killed can drop a <b>base or higher</b> soul, based on its strongest stats. Exception: a natural <b>White</b> soul only comes from the purest of beings, those with no status yet (e.g. children).`},
   {n:"Merging Souls",k:"free",cost:"once per turn",text:`Once per turn, merge two souls in the arsenal into one higher soul (Red + Blue → Purple, Blue + Green → Cyan, Red + Green → Yellow), freeing a temporary slot; it can be spent the same turn. <b>Merging two different higher souls returns 2 of their shared base</b> (Purple + Yellow → 2 Red). A merged soul can never be split — discarding it loses both. Outside combat or in planning, merge freely. The permanent core slot can hold a merged soul.`},
   {n:"Pink Soul (Identity)",k:"passive",text:`A Pink soul can stand in for <b>one base soul</b> (Red, Blue or Green) in a cost. It merges into either higher soul its partner belongs to (Pink + Red → Purple or Yellow · Pink + Blue → Purple or Cyan · Pink + Green → Cyan or Yellow); it can't merge with another Pink or a higher soul. <b>Pink enhancement:</b> the DC of the ability's effects and its Emptying Save increase by <b>PB</b>, and if Hasani's CHA mod beats the creature's by <b>10+</b>, the attack is <b>effective (×1.5)</b>.`},
   {n:"Carnage Feedback Loop",k:"passive",text:`Whenever any creature within 20 ft (incl. you/allies) takes damage from any source, gain a Carnage stack. At 5, your next attack explodes: bonus force + necrotic = CHA × creatures within 10 ft (incl. self); all stacks reset. <i>(Live tracker on the Turn tab.)</i>`},
   {n:"State of Existing",k:"passive",req:"Legend",text:`Half-affected by the rain — resistance to <b>Soak</b>.`},
   {n:"Necrotic Blood",k:"passive",text:`When kissing, bleeding, or any exchange of bodily fluid, deals <b>1d10 necrotic poisoning</b>.`},
   {n:"Wilting Breath",k:"passive",text:`With just his breath, Hasani keeps the emptiness from leaving: creatures within <b>10 ft</b> of him <b>don't lose Hollow stacks to decay</b>. <b>Contagion:</b> when a creature within Wilting Breath <b>becomes Hollowed</b>, every other enemy within 10 ft of that creature that can see it gains <b>1 Hollow stack</b>; if a Hollowed creature <b>dies</b> within Wilting Breath, they gain <b>2</b> instead. (The Hollow Console offers the Contagion stacks when it happens.)`},
   {n:"Hollowed Echoes",k:"passive",text:`Once per creature, when a creature becomes Hollowed, Hasani can take an <b>echo of its soul</b> without killing it — it goes into a temporary Soul Arsenal slot. Any soul colour can be echoed, including <b>Black</b> and <b>Pink</b>. Echoes <b>do not count</b> toward transformation progress — Rayth must taste the true soul, not a mere echo. Uses equal to <b>PB</b>, reset on a long rest.`},
   {n:"Primal Claws",k:"attack",dmg:"1d10",text:`Sharpen nails/teeth — melee spell attack within 5 ft, <b>1d10 acid</b>. If infused with blood it explodes for an extra <b>1d12 acid</b>, spreading within 5 ft. <i>(Sun Never Rises: 3d5, radius +5 ft.)</i>`},
   {n:"The Sun NEVER Rises",k:"passive",text:`When there is no sun, power rises at the cost of sanity: gain <b>75 temp HP</b> and <b>50 temp TL</b>; Primal Claws → 3d5 (radius +5 ft); Fugue attacks → 1d10, dealt as <b>Hollow damage</b>, no TL cost. Lose <b>3 MP</b> each round of combat.`},
   {n:"Pushing the Limits",k:"passive",cost:"C",text:`Twice per long rest, take an extra <b>bonus action</b>. Once per long rest, ignore all exhaustion for one round.`},
   {n:"The Emptiness that Follows",k:"passive",text:`Whenever a creature <b>becomes Hollowed (reaches Tier III)</b>, Hasani gains 1 <b>Emptiness</b>. <b>Lingering Emptiness:</b> at the start of his turn, +1 Emptiness for each Hollowed creature within his Paladin aura (10 ft). (Live tracker on the Turn tab.) <b>1</b> +1 dmg die / −3 MP&morale checks · <b>2</b> +2 damage reduction / no Disengage · <b>3</b> +10 ft move / must move toward nearest enemy · <b>4</b> the Emptying Save ignores a favorable Morale modifier / disadv. WIS saves · <b>5</b> enter <b>Senseless State</b>. Resets when Senseless ends.`},
   {n:"The Senseless State",k:"passive",text:`<b>1 round. POWER:</b> +CHA <b>Hollow</b> damage; every hit applies <b>1 Hollow stack directly</b> (no save), in addition to the Emptying Save; temp HP = CHA × creatures within 10 ft; +10 ft move; crits trigger Hellfire I. <b>But:</b> must move toward & attack the nearest creature; no Defensive/Dodge/Disengage. <b>After:</b> lose half remaining temp HP, −3 AC to start of next turn, <b>−PB MP</b>.`}
  ]},

  /* ===== ANGEL OF DEATH — FORM PASSIVES + SOUL ABILITIES ===== */
  {id:"soulforms",title:"Form Passives",pane:"angel",sub:"the transformation",items:[
   {n:"Consciousness of a Soul",k:"passive",cost:"5+ TL",pay:{tl:5},text:`Transfer a soul into an object (base 5 TL; may fail — spend extra TL beforehand to improve odds). A success gives the object consciousness: it moves and acts on its own, looking normal until it moves. Stats and abilities differ.`},
   {n:"Wings of Finality",k:"bonus",cost:"40 TL",pay:{tl:40},text:`Two black wings sprout from Hasani's back — <b>40 ft of flight</b>.`},
   {n:"Maddening Soul Enhancement",k:"passive",text:`After enhancing a soul ability, Hasani may add one additional soul for an extra effect (one soul per enhancement).`}
  ]},
  {id:"souls",title:"Soul Abilities",pane:"angel",blurb:"Soul-colour enhancements stack with the base TL enhancement; Maddening Soul Enhancement adds one extra soul (Red, Blue, Green or Pink) for its line.",items:[
   {n:"Soul Bomba",k:"action",cost:"30 TL · 2 Red",pay:{tl:30},dmg:"1d30",text:`20 ft blast; DEX save — fail <b>1d30 Hollow</b>, success half. <b>Enh (10 TL):</b> +10 ft range, +1d10. <b>Red</b> +1d10 · <b>Blue</b> +5 DC · <b>Green</b> +10 ft · <b>Pink</b> creatures that fail drop one Morale tier (Tier Lock applies).`},
   {n:"Weaken Mind",k:"action",cost:"30 TL · 2 Blue",pay:{tl:30},text:`Up to 3 creatures within 30 ft; WIS save — fail: −20 morale (or 5 MP), <b>vulnerable to Hollow damage and disadvantage on the Emptying Save</b>, no bonus action (2 rds); success: −10 morale (or 3 MP). <b>Enh (10 TL):</b> +1 target, +10 morale (still capped at 30 per round by the Swing Cap). <b>Red</b> −1 reaction · <b>Blue</b> +5 DC · <b>Green</b> +1 round · <b>Pink</b> creatures count their Morale one tier lower for the Emptying Save.`},
   {n:"Soul Invigoration",k:"action",cost:"30 TL · 2 Green",pay:{tl:30},text:`Resistant to all damage except Force; cleanse up to III tiers of status (cumulative; tiers don't decay until it ends). 2 rounds. <b>Enh (10 TL):</b> +1 rd, adv CON saves. <b>Red</b> adv STR/DEX · <b>Blue</b> restore ½ MP · <b>Green</b> +1 rd & +1 cleanse tier · <b>Pink</b> Tier I mental statuses (Frightened, Charmed, Rattled) don't count toward the cleanse limit.`},
   {n:"Soul Bind",k:"action",cost:"50 TL · 1 Purple",pay:{tl:50},text:`Target DEX save vs spell DC — fail: engulfed, <b>restrained</b>, and <b>invisible</b> to most (true/divine sight & undead see it); it sees out normally. Escape: action, STR save. Destroy: AC = spell DC, HP = spell mod ×3. <b>Enh (10 TL):</b> bubble HP = spell mod ×5. <b>Red</b> 1d8 Hollow/rd inside, and its stacks don't decay while trapped · <b>Blue</b> +1 bubble · <b>Green</b> +3 bubble AC · <b>Pink</b> the trapped creature makes the Emptying Save with disadvantage at the end of its turn, even without Hollow damage.`},
   {n:"Soul Haste",k:"action",cost:"50 TL · 1 Cyan",pay:{tl:50},text:`Haste: +2 AC, adv DEX saves, one extra action (Attack ×1 / Dash / Disengage / Hide / Use Object), +10 morale/rd. When it ends, can't move or act until after next turn. 2 rounds. <b>Enh (15 TL):</b> +1 rd, adv STR saves. <b>Red</b> +CHA dmg · <b>Blue</b> +1 rd · <b>Green</b> ignore end penalty · <b>Pink</b> Heroic Inspiration once per round (doesn't stack).`},
   {n:"Precision Compounded",k:"action",cost:"50 TL · 1 Yellow",pay:{tl:50},text:`+1 crit chance. Each consecutive hit → 1 <b>Ruthlessness</b> (max 3), +1d6 next attack each; resets on miss/no-attack. While active, cannot be forcibly Slowed. 2 rounds. <b>Enh (15 TL):</b> cap → 5. <b>Red</b> +1d10 · <b>Blue</b> crit → attack again · <b>Green</b> +1 rd · <b>Pink</b> each Ruthlessness stack adds +1 to the next Emptying Save DC against that target.`},
   {n:"Magnum Hollow",k:"action",cost:"75 TL · 2 Purple",pay:{tl:75},dmg:"3d30+CHA",text:`30 ft cone; CON save — fail <b>3d30 + CHA Hollow</b> & 2 Hollow stacks (a creature that already has Hollow stacks <b>increases to the next tier</b>), success half & 1 stack. If it triggers Senseless, form +2 rounds. <b>Enh (20 TL):</b> 40 ft, +1d30. <b>Red</b> +1d30 · <b>Blue</b> lose reactions (fail) · <b>Green</b> +1 Senseless rd · <b>Pink</b> failed creatures can't Reclaim Purpose until the end of their next turn.`},
   {n:"Mind Over Matter",k:"bonus",cost:"75 TL · 2 Cyan",pay:{tl:75},dmg:"1d20",text:`Up to 3 Large-or-smaller within 60 ft; STR save — fail: moved up to 20 ft; into an obstacle → <b>1d20</b> bludgeoning & <b>Restrained</b> to end of next turn. <b>Enh (20 TL):</b> +1 target, +10 ft. <b>Red</b> crash 2d15 · <b>Blue</b> −1 reaction & concentration · <b>Green</b> +1d20 temp HP per restrained · <b>Pink</b> each moved creature that hits an obstacle makes the Emptying Save at disadvantage.`},
   {n:"Undying Harvest",k:"action",cost:"75 TL · 2 Yellow",pay:{tl:75},text:`+1 crit; on crit, double damage a second time. Each consecutive hit → 1d10 temp HP; above 50 temp HP, sacrifice excess (≤50) → add to next damage as <b>Hollow</b> damage (1/turn). 1 round. <b>Enh (20 TL):</b> +1 rd, +CHA to temp HP. <b>Red</b> cap 80 · <b>Blue</b> adv above threshold · <b>Green</b> +1 rd, temp HP doubled · <b>Pink</b> consecutive hits give +3 MP (+6 above the threshold).`},
   {n:"Artificial White",k:"free",cost:"1 Red · 1 Blue · 1 Green",text:`Create a white orb that counts as any soul — free arsenal space or make souls you lack.`},
   {n:"Artificial Black",k:"free",cost:"1 Purple · 1 Cyan · 1 Yellow",text:`Black souls enhance abilities — some say twofold.`}
  ]},

  /* ===== LEGACY OF ANIʻANI — GRIEF (legacy pane) ===== */
  {id:"griefrules",title:"The Ecstasy Beyond Grief",pane:"legacy",blurb:"A cycle of emotions granting benefits at the cost of MP and TL. Once begun it can't stop until incapacitated or Acceptance. Extend a stage +1 rd for 1 MP; restart before Acceptance for 2 MP. 1/long rest or on an emotional trigger.",items:[
   {n:"① Denial",k:"passive",text:`Temporarily invulnerable to one instance of damage (chosen after being hit); you can't target that creature until the stage ends. Can't be healed; statuses can't be treated. <b>Enh (10 TL · 1 MP):</b> reaction — redirect a missed attack to another target within 10 ft. <b>Aura (Pale Blue Mist):</b> enemies WIS save or disadv on attacks; reduce their damage to you by CHA.`},
   {n:"② Anger",k:"passive",text:`All melee/ranged attacks gain damage = proficiency mod (e.g. 1d4 → 3d4 at +2). Lose 2 MP per attack made this way. <b>Enh (20 TL · 2 MP):</b> +10% crit; on a kill, move 15 ft & make an extra attack. <b>Aura (Violent Crimson Flame):</b> any enemy that deals or takes damage takes psychic = PB + CHA.`},
   {n:"③ Bargaining",k:"passive",text:`Choose one Promise (locked until next cycle): <b>God</b> — regain TL from damage dealt/taken, can't defy the domain (else early end + Breakdown); <b>Yourself</b> — adv WIS/CHA saves, +PB AC (fail/betray → disadv next turn); <b>Others</b> — 1/turn take an ally's damage & status (ally falls → early end + Breakdown); <b>Miracles</b> — 1/rd reroll a failed roll (nat 1 → next roll disadv). <b>Enh (30 TL · 1 MP):</b> hold two Promises. <b>Aura (Gold & Silver):</b> allies reroll 1 failed save/attack/rd; on a successful reroll, regain 1 MP.`},
   {n:"④ Depression",k:"passive",text:`Enemies within 10 ft drawn to you (WIS save vs DC); attacks against you have disadv; your damage & speed halved; no reactions; vulnerable to negative morale effects, which <b>can go past the Swing Cap</b>. Take no actions → recover 4 MP at end of turn. <b>Enh (40 TL · 2 MP):</b> radius 10 ft, enemies −speed. <b>Aura (Gray & Violet Fog):</b> enemies lose movement abilities & −10 ft in the aura.`},
   {n:"⑤ Acceptance",k:"passive",text:`Ends the cycle; morale resets to stable; all expended MP → temp HP ×10; removes all emotional statuses. <b>Enh (50 TL · 3 MP):</b> allies within 30 ft lose 1 emotional condition, +50 morale. <b>Aura (White Light, Prismatic):</b> allies regain temp HP = (CHA + WIS) × PB; enemies disadv on all saves vs your abilities/spells.`},
   {n:"Grief Chain Reaction",k:"passive",text:`Enhance two+ stages in one combat → unlock <b>Resonance Pulse</b>: spend 2 MP + 10 TL for a 30 ft psychic wave — enemies WIS save or disadv next roll; allies gain inspiration.`},
   {n:"MP Thresholds",k:"passive",text:`<b>5+</b> resist Charmed & Frightened · <b>10+</b> adv Insight · <b>15+</b> telepathy 30 ft (needs B relationship+) · <b>20+</b> unlocks Grief Aura. <b>MP costs:</b> enter cycle 2 · shift stage 1 · extend +1 rd 1 · reroll WIS/CHA save 2 (empowering uses each stage's own Enhanced cost).`}
  ]},
  {id:"madness",title:"Mental Breakdowns & Madness",pane:"legacy",blurb:"At 10 or less MP, each round make a WIS save (DC 20+, rising, no reset until long rest) or suffer a Breakdown. Three Breakdowns or MP 0 → Madness.",items:[
   {n:"Mental Breakdowns",k:"passive",text:`One of: <b>Whispers of Msiona</b> (can't tell friend from foe — targets closest) · <b>Emotional Echo</b> (repeat last action) · <b>Suicidal Thoughts</b> (attack self with equipped weapon) · <b>Lost in Thought</b> (lose an action) · <b>All Alone</b> (can't be within 10 ft of a creature; −1 MP).`},
   {n:"Madness — Stage 1: Fracture",k:"passive",cost:"3 MP to restabilize",text:`1 min or until 0 HP. Eyes glow; allies & enemies indistinguishable; MP regen disabled; advantage on attacks & saves vs charm/fright; takes <b>double psychic</b>. On each kill, WIS save (earlier DC): success regain 1 MP; failure → Stage 2.`},
   {n:"Madness — Stage 2: Revelation",k:"passive",cost:"5 MP to restabilize",text:`Restabilize or until 0 HP. 30 ft aura of whispers — all within WIS save each turn: fail 3d8 psychic & <b>Charmed by Msiona</b> (roll d4: Paranoia II / Delusion II / Berserk II / Delirium III) to end of next turn, half on success. Attacks deal psychic + <b>Hollow</b> = CHA but you can't choose targets; allies hit must make the <b>Emptying Save</b> at the end of Hasani's turn. Auto-fail Insight & Perception. On each charm, DC 20 WIS: success +1 MP, failure −1 MP.`}
  ]}
 ].concat(HZ_CLS.kit),

 items:[HZ_CLS.armor,
  {name:"Sovereign's Leash",cat:"head",loc:"head",rarity:"Legendary",desc:"Merged crown — the Circlet of Screaming Clarity fused with the Crown Shard of Kalsa Corkay and the expiration-god Orion; sands swirl into an hourglass at the brow. Retained (Circlet): keeps Hasani sane, activates his Grief Cycle, and still counts as one of the three Aniʻani artifacts, so the Legacy of Aniʻani and MP are unaffected. Full Integrity/Decay reference is on the Orion tab.",
   abilities:[
    {id:"a_decay",name:"Decay",kind:"bonus",cost:"25 TL + Sand",text:"Choose one creature with an active ability within 30 ft; spend Sand to knock it one rung down the Integrity ladder (see the Orion tab for per-target Sand costs)."},
    {id:"a_grains",name:"Grains Against the Glass",kind:"reaction",cost:"10 TL + Sand",text:"When a creature in Hasani's aura uses an ability, decay it as it resolves — an Instantaneous ability drops to Nothing and is negated."},
    {id:"a_sight",name:"Sandglass Sight",kind:"passive",text:"Hasani sees every active ability's current rung and remaining Sand — an effect's Integrity is never a guess."},
    {id:"a_fugue",name:"Fugue",kind:"passive",text:"His hair, Fugue. Reach 20 ft. Woven (default): full control, any length, prehensile limbs for reach/climb/hold; one Form per turn. Unbound (only during Senseless State): acts on its own, striking the nearest creature — stronger but not his to aim."},
    {id:"a_strands",name:"Sensory Strands",kind:"passive",text:"Tremorsense 5 ft around the hair; expands to 20 ft when Unbound."},
    {id:"a_puppet",name:"Puppet Recoil (Unbound)",kind:"passive",text:"Fugue automatically attacks whenever Hasani is hit or strikes, dealing 1d10 Hollow damage. No direct stacks, but a recoil can trigger the Emptying Save even if the creature already rolled one this round (once per round per creature)."},
    {id:"a_disc",name:"Form: Crownfall Disc",kind:"bonus",dmg:"1d10",text:"Sever part of the hair, centered within 10 ft. 1d10, lasts up to 2 rounds."},
    {id:"a_reign",name:"Form: Mighty Reign",kind:"bonus",dmg:"1d8",text:"Volley of hardened hair at up to 3 targets. 1d8 Hollow damage and 1 Hollow stack to each target."},
    {id:"a_weave",name:"Form: Holy Weave",kind:"bonus",text:"Hair shrouds the body: +5 AC (ignores cap) and incoming damage halved, but Hasani is blinded, −10 ft move, and cannot fly."},
    {id:"a_snare",name:"Snare Reflex",kind:"reaction",text:"Enemy enters within 20 ft — hair lashes to grapple and pull them in (competing Athletics; on failure, grappled). Free auto-attempt when Unbound."}
   ]},
  {name:"Rayth",cat:"weapon",loc:"w1",weaponType:"Scythe",atk:"+20",dmg:"2d12+12 slashing",rarity:"Legendary",twoSlot:false,desc:"Sentient scythe — acts on its own; narratively does not consume a normal weapon slot. While wielded: +1 attack with the Attack action (4 total instead of 3). Tithe of the Hollow (live tracker on the Turn tab): +2 die/−25% healing (1), +4/−50% (2), +6/−75% (3); resets on stun or Hollowed Cleave.",
   abilities:[
    {id:"r_false",name:"False Appearance",kind:"passive",text:"While motionless, indistinguishable from a normal weapon."},
    {id:"r_slash",name:"Slashing Heaven & Earth",kind:"passive",text:"Slashes through any non-reinforced object, ignoring AC but not ADR; ignores slashing resistance (resistant → normal, vulnerable → 2.5×). Every two consecutive strikes on a creature reduce its AC by 3 until the start of Hasani's next turn."},
    {id:"r_tithe",name:"Tithe of the Hollow",kind:"passive",text:"When a creature becomes Hollowed (Tier III), Rayth collects a Tithe (max 3). Only one Tithe per creature — reapplying Hollowed gives no new Tithe. Each Tithe: +2 damage die, −25% healing (cumulative). Tithes reset if Rayth is stunned or Hollowed Cleave is used. The Hollow Console adds them automatically."},
    {id:"r_first",name:"First Cut",kind:"passive",text:"The first hit Rayth makes each turn that deals Hollow damage automatically applies +1 Hollow stack (no save), on top of the Emptying Save. Use +1 direct on the Hollow Console."},
    {id:"r_toll",name:"Toll of the Tithe",kind:"passive",text:"While Hasani wields Rayth, each Tithe Rayth holds adds +2 to the Emptying Save DC (max +6 at 3 Tithes). Stacks with the Morale modifier."},
    {id:"r_hsmite",name:"Hollowed Smite",kind:"passive",dmg:"2d8",text:"While Hasani wields Rayth for an attack, Paladin's Smite (Divine Smite) becomes Hollowed Smite — same trigger, same slot cost. 2d8 Hollow damage, +1d8 per slot level above 1st; it can trigger the Emptying Save. Replaces +1d8 vs Fiends/Undead with +1d8 vs a Hollowed (Tier III) target. Attacks made without Rayth use Divine Smite or Necrotic Smite."},
    {id:"r_cleave",name:"Hollowed Cleave",kind:"action",dmg:"3d6+CHA",text:"1/turn, 15 ft line. DEX save or 3d6 slashing + CHA Hollow damage per Tithe. Creatures that already have Hollow stacks rise to the next tier's threshold. Resets Tithes to 0."},
    {id:"r_exec",name:"Executioner Blade",kind:"attack",dmg:"2d12",text:"+3 to hit, reach 10 ft. 2d12 slashing; if the target is Hollowed (Tier III), +CHA."},
    {id:"r_spin",name:"Spinning Blade",kind:"action",dmg:"3d7",text:"+3 to hit, range 30 ft. 3d7 slashing; chains to creatures within 10 ft (max = PB). Each chain after the first grants +2 to parry/deflect; if parried/deflected, Rayth is knocked to the last target and can't return until next turn (bonus action within 5 ft to free him)."},
    {id:"r_cursed",name:"Cursed Blow",kind:"free",text:"Before an attack, infuse necrotic: the attack becomes necrotic and the target is vulnerable to necrotic for 1 round. Uses = Rayth's WIS mod; resets on long rest."},
    {id:"r_cinder",name:"Cinder Reprisal",kind:"reaction",dmg:"1d10",text:"On a provoked opportunity attack, strike with Rayth, push 5 ft, and leave a Hellfire Ember (1d10 hellfire to adjacent, 3 rounds)."},
    {id:"r_astral",name:"Astral Reaping",kind:"reaction",cost:"Recharge d6",text:"Slice the air to create a small barrier that blocks one instance of an attack from that direction. Against an AoE it forces a save: failure halves the damage, success negates it."}
   ]},
  {name:"Elyse",cat:"weapon",loc:"w2",weaponType:"Shield",atk:"+4",dmg:"1d8 bludgeoning",rarity:"Legendary",desc:"Sentient shield — has her own turn economy when undonned (action, bonus, 3 dynamic reactions); narratively does not consume a normal weapon slot. Donned: +10 AC cap and +3 AC.",
   abilities:[
    {id:"e_false",name:"False Appearance",kind:"passive",text:"While motionless, indistinguishable from a normal weapon."},
    {id:"e_soul",name:"Consciousness of a Soul",kind:"passive",text:"Has her own feelings and emotions; soul/maker abilities shaped her stats."},
    {id:"e_free",name:"Free Dandelion (undonned)",kind:"passive",text:"When not donned, acts on her own — an action, a bonus action, and 3 dynamic reactions, autonomous from Hasani."},
    {id:"e_cross",name:"Shield of Cross (donned)",kind:"passive",text:"Raises Hasani's AC cap by +10 and grants +3 AC."},
    {id:"e_cmd",name:"Commands from Master",kind:"free",text:"1/turn: Uplift (carry a creature 30 ft) · Cover (half cover vs an AoE) · Position (hover within 30 ft) · Recall (return & don)."},
    {id:"e_guard",name:"Swirling Guard",kind:"reaction",text:"When a covered creature within 30 ft is targeted, intercept: +5 AC vs the attack; if it still hits, roll vs Elyse's AC and she takes the full damage instead."},
    {id:"e_bash",name:"Bash",kind:"action",dmg:"1d8",text:"+4 to hit, 1d8 bludgeoning. Donned: hit based on Hasani, +1d8 damage."},
    {id:"e_poly",name:"Polymerization",kind:"reaction",text:"1/combat, when attacked, absorb the source's damage type and polymerize — new attributes, vulnerabilities, and immunities."},
    {id:"e_wreath",name:"Barrier Wreath",kind:"action",text:"At the start of each fight, wreathed in 8 spectral dandelions. Grants Reckless Bloom: expend all at once — 10 ft line of wind & seeds, enemies CON save or blinded until next turn; heals allies 1d8 + CON + user CON as temp HP; you choose the direction."}
   ]},
  {name:"Whip of Twisting Providence",cat:"accessory",loc:"acc1",rarity:"Legendary",desc:"One of the three Aniʻani artifacts.",
   abilities:[
    {id:"w_coil",name:"Wrath Coil",kind:"attack",dmg:"1d10+12",text:"Melee weapon attack, +16 to hit, 1d10 + 12."},
    {id:"w_induced",name:"Induced Wrath",kind:"passive",text:"Causes the user to destroy everything in sight, including objects."},
    {id:"w_torment",name:"Wrathful Torment",kind:"passive",text:"After being hit, on their turn the creature makes a WIS save (spell DC) to resist harming themselves; each hit raises the DC by 3. If they attack themselves they use their held weapon; a prepared spell is turned on themselves."},
    {id:"w_movin",name:"Get to Movin'",kind:"reaction",text:"When an enemy enters reach, whip them 10 ft back."}
   ]},
  {name:"Echolocket of Endless Love",cat:"accessory",loc:"acc2",rarity:"Legendary",desc:"The third Aniʻani artifact. With the Circlet (in Sovereign's Leash) and the Whip, completes the set that contains Msiona and unlocks the Legacy of Aniʻani.",abilities:[]},

  {id:"orion",n:"Orion",eb:"The Hourglass · Integrity",c:"#e8b45a",bl:"Orion's Decay knocks an active ability one rung down the Integrity ladder; each Decay spends Sand (tracked in the top bar). Starting Sand 6, grows via the upgrade tree.",
   html:`<section id="o-ladder"><h2>Integrity ladder</h2><p class="note">Combat → <b>3-round counter</b> → Round → Turn → Instantaneous → <b style="color:var(--blood)">Nothing</b>. Decay moves a target one rung; multi-round effects deplete their counter before dropping a rung.</p></section>
<section id="o-live"><h2>Hourglass &amp; Decay <span class="sub2">tap to spend</span></h2><div id="hz-orion"></div><div class="flag"><b>Open:</b> whether Decay ignores Anti-Magic / Ghoulish Guard barriers or counts as an attack — current default: no to both.</div></section>
<section id="o-actions"><h2>How he spends it</h2><div class="card"><h3>Decay <span class="cost">25 TL · Bonus</span></h3><p>Choose one creature with an active ability within 30 ft; spend Sand to drop its Integrity a rung.</p></div>
<div class="card"><h3>Grains Against the Glass <span class="cost">10 TL · Reaction</span></h3><p>When a creature in his aura uses an ability, decay it as it resolves — an Instantaneous ability drops to Nothing and is negated.</p></div></section>`},
  {id:"legends",n:"Legends",eb:"ʻAnela i hoʻokuke ʻia · Exiled Angel",c:"#d9b154",bl:"With a Tome of Legends attuned, claiming a legend grants its defining trait plus one ability (1/long rest unless passive). Claiming lets you upgrade the legend.",
   html:`<section id="l-tiers"><h2>Tome of Legends — tiers</h2><table>

<tr><td>F · The Beginning</td><td class="n">5</td><td>Claim 3 total</td></tr>

<section id="l-lib"><h2>Legend Library</h2>
<div class="card"><h3>The Damp Man <span class="cost">F</span></h3><p><b>State of Existing:</b> you are half-affected by the rain — resistance to Soak.</p></div>
<div class="card"><h3>Swamp Roar <span class="cost">F</span></h3><p><b>Pulsing Swamp (Bonus Action):</b> 1/combat, place a "roar" in a muddy environment only you can see. A creature passing over the spot is instantly dragged downward and cannot move.</p></div></section>`},
  {id:"notes",n:"Notes",eb:"Lore & history",c:"#7d796d",bl:"History knowledge and campaign notes.",
   html:`<section id="n-hist"><h2>History Knowledge <span class="sub2">Nat 20</span></h2>
<div class="card"><h3>The 100-Year Pantheonic War</h3><p>Started over control of followers and world domination. The Pantheons are divided by their position on the war, not their faiths: <b>Dark</b> sought to grow followers and subvert humanity; <b>Light</b> declared war on the Dark's misdeeds; <b>Grey</b> stayed neutral, wanting to end the conflict.</p></div>
<div class="card"><h3>Necrolien — "Dr. Death"</h3><p>His family died and he ascended to godhood to revive them. It failed miserably.</p></div>
<div class="card"><h3>Feather Notes — Callisto's Theory</h3><p>There may be a relationship between god powers and offspring — why do followers differ in power, yet families share similarities? But it's just a theory.</p></div></section>`}

/* ---- Special-status core: shared by every sheet and by the DM Status Console ---- */
function spClone(o){return JSON.parse(JSON.stringify(o));}
function spNum(v,d){v=parseFloat(v);return isNaN(v)?(d||0):v;}
function spUid(){return "sp"+Math.random().toString(36).slice(2,9);}
function spStrip(d){d=spClone(d);delete d.pairDef;delete d.nextDef;return d;}
function spEmbed(def,findDef){var d=spStrip(def);
 if(def.pair&&findDef){var p=findDef(def.pair);if(p)d.pairDef=spStrip(p);}
