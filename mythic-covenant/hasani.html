<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Character · Covenant Sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com/">
<link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --void:#070608;--panel:#17131e;--line:#2e2638;--line2:#453a52;
  --bone:#ece6d8;--dim:#a9a0b2;--dimmer:#7a7288;
  --blood:#d8434f;--gold:#d9b154;--veil:#5fd2c0;--soul:#c2abff;--amber:#e8b04a;
  --ac:#c2abff;--ac-soft:#c2abff22;--ac-line:#c2abff66;--brand:#c2abff;
  --rib:linear-gradient(90deg,#5fd2c0,#c2abff,#d9b154,#e0506b);
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{background:radial-gradient(1100px 560px at 82% -12%,rgba(194,171,255,.08),transparent 60%),radial-gradient(900px 500px at -10% 108%,rgba(216,67,79,.07),transparent 60%),var(--void);
  color:var(--bone);font-family:'Cormorant Garamond',Georgia,serif;font-size:18px;line-height:1.55;padding:0 0 90px;}
.wrap{max-width:980px;margin:0 auto;padding:0 18px;position:relative;z-index:1;}
@media(min-width:1120px){.wrap{margin-left:288px;max-width:1090px;}}
h1,h2,h3,h4,.cz{font-family:'Cinzel',serif;font-weight:600;letter-spacing:.02em;}
.mono{font-family:'IBM Plex Mono',monospace;}
button{font:inherit;}

/* rail */
.rail{position:fixed;left:0;top:0;bottom:0;width:268px;z-index:70;overflow-y:auto;background:linear-gradient(180deg,#120f17,#08070a);border-right:1px solid var(--line);}
.rail-brand{padding:22px 18px 14px;border-bottom:1px solid var(--line);}
.rail-brand .eb{font-family:'Cinzel';font-size:10px;letter-spacing:.26em;color:var(--brand);text-transform:uppercase;}
.rail-brand .nm{font-family:'Cinzel Decorative';font-weight:900;font-size:30px;line-height:1.05;margin:8px 0 5px;color:#fff;}
.rail-brand .lv{font-family:'IBM Plex Mono';font-size:11px;color:var(--dim);}
.rail-search{margin:13px 14px 6px;display:flex;align-items:center;gap:9px;padding:9px 11px;cursor:pointer;background:#150f1c;border:1px solid var(--line);border-radius:9px;color:var(--dim);font-family:'Cinzel';font-size:12.5px;}
.rail-search:hover{border-color:var(--ac);}
.rail-search .kbd{margin-left:auto;font-family:'IBM Plex Mono';font-size:9.5px;color:var(--dimmer);border:1px solid var(--line);padding:1px 4px;border-radius:4px;}
.rail-nav{padding:8px 10px 26px;}
.rail-grp{font-family:'IBM Plex Mono';font-size:9.5px;letter-spacing:.2em;color:var(--dimmer);text-transform:uppercase;margin:14px 8px 6px;}
.rail-btn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 11px;margin-bottom:2px;background:none;border:1px solid transparent;border-radius:8px;color:var(--dim);cursor:pointer;font-family:'Cinzel';font-size:14px;font-weight:500;}
.rail-btn .gl{width:7px;height:7px;background:var(--c,var(--ac));flex:none;transform:rotate(45deg);opacity:.6;}
.rail-btn .ct{margin-left:auto;font-family:'IBM Plex Mono';font-size:10px;color:var(--dimmer);}
.rail-btn:hover{color:var(--bone);background:#17111f;}
.rail-btn.on{color:#fff;background:#1d1527;border-color:var(--line2);}
.rail-btn.on .gl{opacity:1;box-shadow:0 0 9px var(--c,var(--ac));}
@media(max-width:1119px){
  .rail{position:static;width:auto;display:flex;flex-wrap:wrap;gap:6px;padding:12px;border-right:none;border-bottom:1px solid var(--line);}
  .rail-brand{width:100%;padding:4px 6px 12px;border:none;}
  .rail-search{margin:0;flex:1 1 170px;}
  .rail-nav{display:flex;flex-wrap:wrap;gap:5px;padding:6px 0 0;width:100%;}
  .rail-grp{display:none;} .rail-btn{width:auto;padding:7px 12px;font-size:13px;border:1px solid var(--line);}
}

/* tracker bar */
.bar{position:sticky;top:0;z-index:60;display:flex;gap:10px;flex-wrap:wrap;background:linear-gradient(180deg,rgba(18,15,23,.97),rgba(8,7,10,.97));backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);border:1px solid var(--line);border-top:3px solid var(--ac);border-radius:0 0 14px 14px;padding:12px 14px;margin-bottom:12px;box-shadow:0 14px 30px #000a;}
.tk{background:linear-gradient(180deg,#1a1522,#141019);border:1px solid var(--line);border-radius:11px;padding:9px 11px;min-width:180px;flex:1 1 180px;}
.tk .num.w44{width:40px;}
.tk .sl{font-size:13px;}
.tk .row{gap:4px;}
.tk .big{width:58px!important;font-size:19px!important;color:#fff;}
.tk-h{font-family:'Cinzel';font-size:11px;letter-spacing:.1em;color:var(--ac);display:flex;align-items:center;gap:7px;margin-bottom:7px;text-transform:uppercase;}
.tk-h .d{width:7px;height:7px;background:currentColor;transform:rotate(45deg);flex:none;}
.tk-h .chipx{margin-left:auto;}
.row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.btn{font-family:'Cinzel';min-width:28px;height:28px;border-radius:7px;border:1px solid var(--line);background:#171120;color:var(--bone);font-size:14px;cursor:pointer;line-height:1;padding:0 8px;transition:.14s;}
.btn:hover{border-color:var(--ac);color:#fff;background:#1e1629;}
.btn:disabled{opacity:.35;cursor:not-allowed;}
.btn.sm{height:23px;font-size:11px;min-width:24px;padding:0 7px;}
.btn.lg{height:36px;padding:0 15px;font-size:14px;}
.btn.pri{border-color:var(--ac);color:#fff;background:var(--ac-soft);}
.btn.dgr:hover{border-color:var(--blood);color:#ffb3ba;}
.cur{font-family:'Cinzel';font-weight:700;font-size:22px;color:#fff;min-width:40px;text-align:center;}
.sl{color:var(--dimmer);}
.num{font-family:'Cinzel';font-weight:600;font-size:15px;width:62px;text-align:center;color:var(--gold);background:#100c15;border:1px solid var(--line);border-radius:6px;padding:3px 2px;-moz-appearance:textfield;}
.num.w44{width:44px;} .num.w80{width:80px;}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.meter{height:6px;background:#0d0a11;border-radius:3px;margin-top:7px;overflow:hidden;border:1px solid #241d2c;position:relative;}
.meter i{display:block;height:100%;transition:width .3s;}
.meter .mk{position:absolute;top:0;bottom:0;width:1px;background:#ffffff55;}
.sub{font-family:'IBM Plex Mono';font-size:10.5px;color:var(--dim);margin-top:6px;}
.bar-tools{display:flex;gap:8px;align-items:center;width:100%;padding-top:6px;border-top:1px solid var(--line);flex-wrap:wrap;}
.bar-tools button{font-family:'IBM Plex Mono';font-size:10.5px;color:var(--dim);background:#150f1c;border:1px solid var(--line);border-radius:6px;padding:5px 9px;cursor:pointer;}
.bar-tools button:hover{color:var(--ac);border-color:var(--ac);}
.savehint{font-family:'IBM Plex Mono';font-size:10px;color:var(--dimmer);margin-left:auto;}
.savehint.flash{color:var(--ac);}
.roundrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;width:100%;padding:8px 2px 2px;border-top:1px solid var(--line);}
.bar.fold .tk{display:none;}
.minibar{display:none;width:100%;gap:14px;flex-wrap:wrap;align-items:center;font-family:'IBM Plex Mono';font-size:12px;color:var(--dim);}
.minibar b{font-family:'Cinzel';font-size:16px;color:#fff;margin-left:5px;}
.bar.fold .minibar{display:flex;}

/* chips & tags */
.chip{font-family:'IBM Plex Mono';font-size:10.5px;letter-spacing:.05em;border:1px solid var(--line);border-radius:20px;padding:3px 10px;color:var(--dim);background:#150f1c;display:inline-block;white-space:nowrap;}
button.chip{cursor:pointer;}
.chip.on{color:#fff;border-color:var(--ac);background:var(--ac-soft);}
.chip.ok{color:#bff3ea;border-color:var(--veil);background:#5fd2c01c;}
.chip.warn{color:#ffd79a;border-color:var(--amber);background:#e8b04a1c;}
.chip.bad{color:#ffb3ba;border-color:var(--blood);background:#d8434f22;}
.tag{font-family:'IBM Plex Mono';font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ac);border:1px solid var(--ac-line);border-radius:4px;padding:1px 6px;font-weight:400;}
.tag.gold{color:var(--gold);border-color:#d9b15455;} .tag.blood{color:var(--blood);border-color:#d8434f55;} .tag.veil{color:var(--veil);border-color:#5fd2c055;}
.k-attack{color:#ff9aa4!important;border-color:#d8434f66!important;}
.k-action{color:#f2d58a!important;border-color:#d9b15466!important;}
.k-bonus{color:#9fe8dc!important;border-color:#5fd2c066!important;}
.k-reaction{color:#d3c3ff!important;border-color:#c2abff66!important;}
.k-free{color:#cfe6b0!important;border-color:#9fbf7866!important;}
.k-passive{color:var(--dim)!important;border-color:var(--line2)!important;}
.tbd{font-family:'Cinzel';font-size:9.5px;letter-spacing:.1em;background:#3a2c0c;color:var(--amber);border:1px solid var(--amber);padding:1px 7px;border-radius:10px;margin-left:5px;vertical-align:middle;font-weight:700;text-transform:uppercase;white-space:nowrap;}
.amber{color:var(--amber);}

/* panes */
.pane{display:none;} .pane.on{display:block;}
.pane-head{padding:24px 0 4px;}
.pane-head .eb{font-family:'Cinzel';font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--ac);}
.pane-head h1{font-family:'Cinzel Decorative';font-weight:900;font-size:clamp(28px,5.5vw,44px);color:#fff;line-height:1.05;margin-top:7px;}
.pane-head .bl{color:var(--dim);font-size:16px;max-width:66ch;margin-top:8px;}
section{margin:28px 0;scroll-margin-top:170px;}
section>h2{font-size:22px;color:#fff;display:flex;align-items:baseline;gap:11px;margin-bottom:6px;flex-wrap:wrap;}
section>h2 .sub2{font-family:'IBM Plex Mono';font-size:10.5px;letter-spacing:.12em;color:var(--dimmer);text-transform:uppercase;}
.note{color:var(--dim);font-size:15px;max-width:72ch;margin-top:8px;}
.gm{border-left:3px solid var(--blood);background:#1a0d11aa;padding:10px 14px;margin:12px 0;border-radius:0 8px 8px 0;font-size:15.5px;}
.gm b{font-family:'Cinzel';color:var(--blood);font-weight:600;}
.flag{border-left:3px solid var(--amber);background:#221a08aa;padding:10px 14px;margin:12px 0;border-radius:0 8px 8px 0;font-size:15px;}
.flag b{font-family:'Cinzel';color:var(--amber);font-weight:600;}
.card{background:linear-gradient(180deg,#1a1522,#141019);border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin:10px 0;}
.card h3{font-size:17px;color:#fff;margin-bottom:3px;display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;}
.card p{font-size:16px;} .card p+p{margin-top:6px;}
.cost{font-family:'IBM Plex Mono';font-size:11.5px;color:var(--dim);margin-bottom:5px;}
@media(max-width:700px){.bar{position:relative;}.tk{flex:1 1 100%;}}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(268px,1fr));gap:10px;}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;}
table{width:100%;border-collapse:collapse;margin:10px 0;font-size:15.5px;}
th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:top;}
th{font-family:'Cinzel';font-weight:600;font-size:12px;letter-spacing:.07em;color:var(--ac);}
td.n,th.n{font-family:'IBM Plex Mono';font-size:13px;white-space:nowrap;}
tr.hl td{background:var(--ac-soft);}
ul{margin:8px 0 8px 20px;} li{margin-bottom:4px;}
.dl{margin:10px 0;} .dl div{display:flex;gap:12px;padding:6px 0;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.dl dt{font-family:'Cinzel';font-size:14.5px;color:var(--gold);min-width:170px;flex:none;}
.dl dd{color:var(--bone);font-size:15.5px;flex:1;min-width:220px;}
input[type=text],textarea,select.sel{font-family:'Cormorant Garamond';background:#0f0b14;border:1px solid var(--line);color:var(--bone);border-radius:7px;padding:6px 9px;font-size:15.5px;}
input[type=text]{width:100%;}
select.sel{font-family:'Cinzel';font-size:13px;padding:5px 7px;}
textarea{width:100%;min-height:100px;resize:vertical;line-height:1.55;}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--ac);}
.empty{color:var(--dimmer);font-style:italic;font-size:15px;padding:8px 0;}
.lbl{font-family:'IBM Plex Mono';font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dimmer);display:block;margin-bottom:3px;}
.fld{display:flex;flex-direction:column;min-width:0;}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px;align-items:end;}
.form .wide{grid-column:1/-1;}

/* transformation console */
.tx{border:1px solid var(--line);border-top:3px solid var(--ac);border-radius:14px;padding:16px;background:linear-gradient(180deg,#1b1524,#100c16);}
.tx-top{display:flex;gap:14px;flex-wrap:wrap;align-items:center;justify-content:space-between;}
.tx-name{font-family:'Cinzel Decorative';font-weight:900;font-size:28px;color:var(--ac);line-height:1;}
.tx-sub{font-family:'IBM Plex Mono';font-size:11px;color:var(--dim);letter-spacing:.08em;margin-top:5px;}
.ladder{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:12px;}
.lad{background:#130f19;display:grid;grid-template-columns:130px 1fr;gap:12px;padding:9px 12px;}
.lad .nm{font-family:'Cinzel';font-size:14px;color:var(--dim);}
.lad .nm small{display:block;font-family:'IBM Plex Mono';font-size:10px;color:var(--dimmer);letter-spacing:.06em;}
.lad ul{margin:0 0 0 16px;font-size:15px;color:var(--dim);}
.lad.on{background:linear-gradient(90deg,#3a2a0c66,#130f19);} .lad.on .nm{color:var(--amber);} .lad.on ul{color:var(--bone);}
.lad.on.frac{background:linear-gradient(90deg,#4a121b77,#130f19);} .lad.on.frac .nm{color:#ff8f9a;}
.lad.on.col{background:linear-gradient(90deg,#5a0f1a,#130f19);} .lad.on.col .nm{color:#fff;}
.collapse{border:2px solid var(--blood);border-radius:12px;padding:14px;margin-top:12px;background:#210a0f;}
.collapse h3{color:#ffb3ba;}
.modes{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
.mode{flex:1 1 150px;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#140f1b;cursor:pointer;text-align:left;color:var(--bone);}
.mode .mn{font-family:'Cinzel';font-weight:700;font-size:16px;color:var(--fc);}
.mode .mi{font-family:'IBM Plex Mono';font-size:10.5px;color:var(--dim);}
.mode.on{border-color:var(--fc);box-shadow:inset 0 0 0 1px var(--fc),0 0 20px -8px var(--fc);}
.log{font-family:'IBM Plex Mono';font-size:11px;color:var(--dim);margin-top:10px;max-height:110px;overflow-y:auto;}
.log div{padding:2px 0;border-bottom:1px dotted #241d2c;}

/* resources, pips */
.res{background:#150f1c;border:1px solid var(--line);border-radius:10px;padding:9px 11px;}
.res .rn{font-family:'Cinzel';font-size:13px;color:#fff;display:flex;gap:6px;align-items:baseline;}
.res .rn small{font-family:'IBM Plex Mono';font-size:10px;color:var(--dimmer);margin-left:auto;}
.pips{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-top:6px;}
.pip{width:21px;height:21px;border-radius:6px;border:1.5px solid var(--line2);background:#100c15;cursor:pointer;padding:0;}
.pip.live{background:var(--ac);border-color:var(--ac);box-shadow:0 0 8px var(--ac-line);}

/* loadout */
.loadout{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;}
.lo-col{background:#130f19;border:1px solid var(--line);border-radius:11px;padding:9px 10px;}
.lo-col h4{font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px;}
.lo-col details{border-bottom:1px dotted #2a2233;padding:4px 0;}
.lo-col summary{cursor:pointer;font-size:15.5px;list-style:none;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;}
.lo-col summary::-webkit-details-marker{display:none;}
.lo-col summary .src{font-family:'IBM Plex Mono';font-size:9.5px;color:var(--dimmer);}
.lo-col details p{font-size:14.5px;color:var(--dim);margin:4px 0 2px;}

/* equipment */
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;}
.slot{border:1px solid var(--line);border-radius:11px;padding:11px 13px;background:#130f19;cursor:pointer;text-align:left;color:var(--bone);position:relative;min-height:78px;}
.slot:hover{border-color:var(--ac);}
.slot .sn{font-family:'IBM Plex Mono';font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dimmer);}
.slot .it{font-family:'Cinzel';font-size:16px;color:#fff;margin-top:3px;line-height:1.2;}
.slot .mt{font-family:'IBM Plex Mono';font-size:10px;color:var(--dim);margin-top:4px;}
.slot.empty .it{color:var(--dimmer);font-style:italic;font-family:'Cormorant Garamond';}
.slot.held{opacity:.6;border-style:dashed;}
.slot.open{border-color:var(--ac);box-shadow:inset 0 0 0 1px var(--ac);}
.detail{border:1px solid var(--ac-line);border-radius:12px;padding:14px;margin-top:10px;background:#120e18;}
.dur{display:flex;gap:3px;flex-wrap:wrap;margin-top:5px;}
.dur i{width:9px;height:14px;border-radius:2px;background:var(--gold);display:block;}
.dur i.x{background:#2a2233;}
.ab-row{border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin-top:7px;background:#140f1b;}
.islots{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:9px;}
.islot{border:1px dashed var(--line2);border-radius:10px;padding:9px 11px;background:#110d16;min-height:70px;}
.islot.full{border-style:solid;border-color:var(--line);}
.rank{font-family:'Cinzel';font-weight:900;font-size:20px;width:36px;height:36px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;background:#100c15;border:1px solid var(--line);}
.r-F{color:#d8434f;} .r-D{color:#c9a15a;} .r-C{color:#c2abff;} .r-B{color:#d9b154;} .r-A{color:#5fd2c0;} .r-S{color:#fff;background:#2a2233;}
.inf{border:1px solid var(--line);border-left:3px solid var(--line2);border-radius:10px;padding:9px 12px;margin-top:8px;background:#140f1b;}
.inf.eq{border-left-color:var(--ac);background:linear-gradient(90deg,var(--ac-soft),#140f1b);}

/* stats & skills */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:9px;margin:10px 0;}
.stat{background:#150f1c;border:1px solid var(--line);border-radius:10px;padding:9px;text-align:center;}
.stat .lb{font-family:'IBM Plex Mono';font-size:10px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;}
.stat .mo{font-family:'Cinzel';font-size:27px;font-weight:700;color:#fff;line-height:1.1;}
.stat .sv{font-family:'IBM Plex Mono';font-size:10.5px;color:var(--dim);margin-top:5px;cursor:pointer;}
.stat .sv.p{color:var(--ac);}
.vitals{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:9px;margin:10px 0;}
.vit{background:#150f1c;border:1px solid var(--line);border-radius:10px;padding:9px;text-align:center;}
.vit .lb{font-family:'IBM Plex Mono';font-size:9.5px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase;}
.vit .v{font-family:'Cinzel';font-size:23px;font-weight:700;color:#fff;}
.vit .s{font-family:'IBM Plex Mono';font-size:9.5px;color:var(--dimmer);}
.vit.hi{border-color:var(--ac-line);} .vit.hi .v{color:var(--ac);}
.skl{display:grid;grid-template-columns:repeat(auto-fit,minmax(238px,1fr));gap:1px 16px;}
.sk{display:flex;align-items:center;gap:9px;padding:5px 2px;border-bottom:1px solid #1f1927;font-size:15px;}
.sk .pp{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--line2);background:#0f0b14;cursor:pointer;flex:none;font-family:'IBM Plex Mono';font-size:8.5px;color:var(--void);text-align:center;line-height:12px;padding:0;}
.sk .pp.p{background:var(--ac);border-color:var(--ac);} .sk .pp.e{background:var(--gold);border-color:var(--gold);}
.sk .nm{flex:1;} .sk .ab{font-family:'IBM Plex Mono';font-size:10px;color:var(--dimmer);}
.sk .vl{font-family:'Cinzel';font-size:16px;color:#fff;min-width:38px;text-align:right;}

/* relationships */
.rel{display:grid;grid-template-columns:28px minmax(120px,1.2fr) 40px minmax(150px,1.6fr) auto;gap:10px;align-items:center;padding:8px 6px;border-bottom:1px solid #1f1927;}
.rel.party{background:linear-gradient(90deg,var(--ac-soft),transparent);border-radius:6px;}
.rel .rn{font-size:16.5px;}
.rel .rn small{display:block;font-family:'IBM Plex Mono';font-size:10px;color:var(--dimmer);}
.tierb{font-family:'Cinzel';font-weight:900;font-size:17px;width:34px;height:30px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:#100c15;}
.pipbar{display:flex;gap:2px;flex-wrap:wrap;}
.pipbar i{flex:1 1 6px;min-width:5px;max-width:14px;height:12px;border-radius:2px;background:#221b2b;display:block;}
.pipbar i.f{background:var(--ac);} .pipbar.full i.f{background:var(--gold);}
.pipmeta{font-family:'IBM Plex Mono';font-size:10.5px;color:var(--dim);margin-top:3px;}
.star{width:26px;height:26px;border-radius:6px;border:1px solid var(--line);background:#100c15;color:var(--dimmer);cursor:pointer;padding:0;}
.star.on{color:var(--gold);border-color:var(--gold);background:#d9b15418;}
@media(max-width:700px){.rel{grid-template-columns:28px 1fr 40px;}.rel .rp,.rel .ra{grid-column:1/-1;}}

/* storage */
.st-row{display:grid;grid-template-columns:minmax(140px,2fr) 100px 110px auto;gap:10px;align-items:center;padding:8px 6px;border-bottom:1px solid #1f1927;}
.st-row .nm{font-family:'Cinzel';font-size:15px;color:#fff;}
.st-row .nm small{display:block;font-family:'Cormorant Garamond';font-size:14px;color:var(--dim);}
@media(max-width:700px){.st-row{grid-template-columns:1fr auto;}}

/* palette */
.pal-back{position:fixed;inset:0;background:#000b;backdrop-filter:blur(3px);z-index:90;display:none;}
.pal-back.on{display:block;}
.pal{position:fixed;top:10vh;left:50%;transform:translateX(-50%);width:min(640px,94vw);z-index:91;display:none;background:#150f1c;border:1px solid var(--line2);border-radius:14px;box-shadow:0 30px 70px #000c;overflow:hidden;}
.pal.on{display:block;}
.pal input{border:none;border-bottom:1px solid var(--line);border-radius:0;font-family:'Cinzel';font-size:18px;padding:14px 18px;}
.pal-res{max-height:56vh;overflow-y:auto;}
.pal-res button{display:block;width:100%;text-align:left;padding:10px 18px;background:none;border:none;border-bottom:1px solid #1d1725;color:var(--bone);cursor:pointer;font-size:15.5px;}
.pal-res button:hover,.pal-res button.sel{background:#1d1627;}
.pal-res .k{font-family:'IBM Plex Mono';font-size:9.5px;letter-spacing:.12em;color:var(--ac);text-transform:uppercase;display:block;}
.hit{animation:hit 1.6s ease;}
@keyframes hit{0%,100%{background:transparent}20%{background:var(--ac-soft)}}
.syncpill{position:fixed;bottom:10px;right:12px;z-index:99;font:600 11px/1 'IBM Plex Mono',monospace;padding:5px 9px;border-radius:20px;background:rgba(0,0,0,.6);color:#bbb;pointer-events:none;}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px;}
.foot{color:var(--dimmer);font-size:13px;text-align:center;margin-top:40px;font-family:'IBM Plex Mono';}
</style>
</head>

window.CHAR={
 id:"hasani",name:"Hasani Eldesteen",epithet:"The Scythe of Necrolien",accent:"#5fe6b8",
 level:13,classes:[{name:"Champion of Necrolien (set HP)",level:13,die:8}],

 identity:{Race:"Human",Alignment:"Neutral Good",Pronouns:"He/Him",Deity:"Necrolien (Dr. Death)",Birthday:"November 11th",Heirloom:"Mother's Pendant"},
 levelNote:"<b>Placeholders pending Hasani's live sheet:</b> the six ability scores, class levels &amp; HP, and AC/armor. <b>Confirmed:</b> Level 13 (PB +5), Human, Neutral Good, patron Necrolien. <b>Max TL</b> now derives from the ported formula (CON+CHA mods ×10 +100); the doc states a max of <b>260</b>, which implies bonuses beyond the mods — set the real stats, or type 260 into the Max TL box (stored as an adjustment), to pin it.",
 economy:[{id:"rx",name:"Reactions",max:1}],

 kit:[
  /* ===== GENERAL PASSIVES (Kit tab) ===== */
  {id:"passives",title:"General Passives",sub:"always on",items:[
   {n:"Connector (Defining Trait)",k:"passive",text:`Within 10 ft of a character he shares a relationship with, Hasani's weapon die increases proportionally to that relationship (0–5 / F–S). Applies to only one character — automatically the highest-tiered ally in range. Set party tiers on the Relationships tab.`},
   {n:"Peer into Orioul",k:"passive",cost:"D",text:`See the souls of living creatures; the colour shows their main stats — <b>Red</b> STR&DEX · <b>Blue</b> WIS&INT · <b>Green</b> CON · <b>Pink</b> CHA · <b>Black</b> all. <b>Show Me YOUR Legacy (5 TL):</b> peer deeper for alignment as a highlighted colour; DM may ask for an Insight check for more of the creature's past.`},
   {n:"Soul Arsenal",k:"passive",text:`Harvest souls of creatures he kills to power abilities at the cost of TL. Holds <b>4 temporary + 1 permanent</b> soul in his core; taking a soul with full slots forces a discard.`},
   {n:"Carnage Feedback Loop",k:"passive",text:`Whenever any creature within 20 ft (incl. you/allies) takes damage from any source, gain a Carnage stack. At 5, your next attack explodes: bonus force + necrotic = CHA × creatures within 10 ft (incl. self); all stacks reset. <i>(Tracked in Resources.)</i>`},
   {n:"State of Existing",k:"passive",req:"Legend",text:`Half-affected by the rain — resistance to <b>Soak</b>.`},
   {n:"Necrotic Blood",k:"passive",text:`When kissing, bleeding, or any exchange of bodily fluid, deals <b>1d10 necrotic poisoning</b>.`},
   {n:"Wilting Breath",k:"passive",text:`With his breath, any creature within 5 ft is <b>Hollowed</b>. Cannot be removed until Hasani moves out of range.`},
   {n:"Primal Claws",k:"attack",dmg:"1d10",text:`Sharpen nails/teeth — melee spell attack within 5 ft, <b>1d10 acid</b>. If infused with blood it explodes for an extra <b>1d12 acid</b>, spreading within 5 ft. <i>(Sun Never Rises: 3d5, radius +5 ft.)</i>`},
   {n:"The Sun NEVER Rises",k:"passive",text:`When there is no sun, power rises at the cost of sanity: gain <b>75 temp HP</b> and <b>50 temp TL</b>; Primal Claws → 3d5 (radius +5 ft); Hair Entanglement → 1d10, no TL for hollowing. Lose <b>3 MP</b> each round of combat.`},
   {n:"Pushing the Limits",k:"passive",cost:"C",text:`Twice per long rest, take an extra <b>bonus action</b>. Once per long rest, ignore all exhaustion for one round.`},
   {n:"The Emptiness that Follows",k:"passive",text:`Each time Hasani applies Hollowed, gain a stack (tracked in Resources): <b>1</b> +1 dmg die / −3 MP&morale checks · <b>2</b> +2 damage reduction / no Disengage · <b>3</b> +10 ft move / must move toward nearest enemy · <b>4</b> crits apply 1 Hollow / disadv. WIS saves · <b>5</b> enter <b>Senseless State</b>. Resets when Senseless ends.`},
   {n:"The Senseless State",k:"passive",text:`<b>1 round. POWER:</b> +CHA hallow dmg; attacks auto-apply Hollow; temp HP = CHA × creatures within 10 ft; +10 ft move; crits trigger Hellfire I. <b>But:</b> must move toward & attack the nearest creature; no Defensive/Dodge/Disengage. <b>After:</b> lose half remaining temp HP, −3 AC to start of next turn, −3 MP.`}
  ]},

  /* ===== ANGEL OF DEATH — FORM PASSIVES + SOUL ABILITIES ===== */
  {id:"soulforms",title:"Form Passives",pane:"angel",sub:"the transformation",items:[
   {n:"Consciousness of a Soul",k:"passive",cost:"5+ TL",pay:{tl:5},text:`Transfer a soul into an object (base 5 TL; may fail — spend extra TL beforehand to improve odds). A success gives the object consciousness: it moves and acts on its own, looking normal until it moves. Stats and abilities differ.`},
   {n:"Wings of Finality",k:"bonus",cost:"40 TL",pay:{tl:40},text:`Two black wings sprout from Hasani's back — <b>40 ft of flight</b>.`},
   {n:"Maddening Soul Enhancement",k:"passive",text:`After enhancing a soul ability, Hasani may add one additional soul for an extra effect (one soul per enhancement).`}
  ]},
  {id:"souls",title:"Soul Abilities",pane:"angel",blurb:"Soul-colour enhancements stack with the base TL enhancement; Maddening Soul Enhancement allows one extra soul.",items:[
   {n:"Soul Bomba",k:"action",cost:"30 TL · 2 Red",pay:{tl:30},dmg:"1d30",text:`20 ft blast; DEX save — fail <b>1d30 Hallowing</b>, success half. <b>Enh (10 TL):</b> +10 ft range, +1d10. <b>Red</b> +1d10 · <b>Blue</b> +1d8 DC · <b>Green</b> +10 ft.`},
   {n:"Weaken Mind",k:"action",cost:"30 TL · 2 Blue",pay:{tl:30},text:`Up to 3 creatures within 30 ft; WIS save — fail: −20 morale (or 5 MP), vulnerable to Hollowed, no bonus action (2 rds); success: −10 morale (or 3 MP). <b>Enh (10 TL):</b> +1 target, +10 morale. <b>Red</b> −1 reaction · <b>Blue</b> +1d8 DC · <b>Green</b> +1 round.`},
   {n:"Soul Invigoration",k:"action",cost:"30 TL · 2 Green",pay:{tl:30},text:`Resistant to all damage except Force; cleanse up to III tiers of status (cumulative; tiers don't decay until it ends). 2 rounds. <b>Enh (10 TL):</b> +1 rd, adv CON saves. <b>Red</b> adv STR/DEX · <b>Blue</b> restore ½ MP · <b>Green</b> +1 rd & +1 cleanse tier.`},
   {n:"Soul Bind",k:"action",cost:"50 TL · 1 Purple",pay:{tl:50},text:`Target DEX save vs spell DC — fail: engulfed, <b>restrained</b>, and <b>invisible</b> to most (true/divine sight & undead see it); it sees out normally. Escape: action, STR save. Destroy: AC = spell DC, HP = spell mod ×3. <b>Enh (10 TL):</b> <b>Red</b> 1d8 hollowing/rd inside · <b>Blue</b> +1 bubble · <b>Green</b> +3 bubble AC.`},
   {n:"Soul Haste",k:"action",cost:"50 TL · 1 Cyan",pay:{tl:50},text:`Haste: +2 AC, adv DEX saves, one extra action (Attack ×1 / Dash / Disengage / Hide / Use Object), +10 morale/rd. When it ends, can't move or act until after next turn. 2 rounds. <b>Enh (15 TL):</b> +1 rd, adv STR saves. <b>Red</b> +CHA dmg · <b>Blue</b> +1 rd · <b>Green</b> ignore end penalty.`},
   {n:"Precision Compounded",k:"action",cost:"50 TL · 1 Yellow",pay:{tl:50},text:`+1 crit chance. Each consecutive hit → 1 <b>Ruthlessness</b> (max 3), +1d6 next attack each; resets on miss/no-attack. While active, cannot be forcibly Slowed. 2 rounds. <b>Enh (15 TL):</b> cap → 5. <b>Red</b> +1d10 · <b>Blue</b> crit → attack again · <b>Green</b> +1 rd.`},
   {n:"Magnum Hollow",k:"action",cost:"75 TL · 2 Purple",pay:{tl:75},dmg:"3d30+CHA",text:`30 ft cone; CON save — fail <b>3d30 + CHA</b> hollowing & 2 Hollow (lesser instantly Hollowed), success half & 1. If it triggers Senseless, form +2 rounds. <b>Enh (20 TL):</b> 40 ft, +1d30. <b>Red</b> +1d30 · <b>Blue</b> lose reactions (fail) · <b>Green</b> +1 Senseless rd.`},
   {n:"Mind Over Matter",k:"bonus",cost:"75 TL · 2 Cyan",pay:{tl:75},dmg:"1d20",text:`Up to 3 Large-or-smaller within 60 ft; STR save — fail: moved up to 20 ft; into an obstacle → <b>1d20</b> bludgeoning & <b>Restrained</b> to end of next turn. <b>Enh (20 TL):</b> +1 target, +10 ft. <b>Red</b> crash 2d15 · <b>Blue</b> −1 reaction & concentration · <b>Green</b> +1d20 temp HP per restrained.`},
   {n:"Undying Harvest",k:"action",cost:"75 TL · 2 Yellow",pay:{tl:75},text:`+1 crit; on crit, double damage a second time. Each consecutive hit → 1d10 temp HP; above 50 temp HP, sacrifice excess (≤50) → add to next damage as Hollowed (1/turn). 1 round. <b>Enh (20 TL):</b> +1 rd, +CHA to temp HP. <b>Red</b> cap 80 · <b>Blue</b> adv above threshold · <b>Green</b> +1 rd, temp HP doubled.`},
   {n:"Artificial White",k:"free",cost:"1 Red · 1 Blue · 1 Green",text:`Create a white orb that counts as any soul — free arsenal space or make souls you lack.`},
   {n:"Artificial Black",k:"free",cost:"1 Purple · 1 Cyan · 1 Yellow",text:`Black souls enhance abilities — some say twofold.`}
  ]},

  /* ===== LEGACY OF ANIʻANI — GRIEF (legacy pane) ===== */
  {id:"griefrules",title:"The Ecstasy Beyond Grief",pane:"legacy",blurb:"A cycle of emotions granting benefits at the cost of MP and TL. Once begun it can't stop until incapacitated or Acceptance. Extend a stage +1 rd for 1 MP; restart before Acceptance for 2 MP. 1/long rest or on an emotional trigger.",items:[
   {n:"① Denial",k:"passive",text:`Temporarily invulnerable to one instance of damage (chosen after being hit); you can't target that creature until the stage ends. Can't be healed; statuses can't be treated. <b>Enh (10 TL · 1 MP):</b> reaction — redirect a missed attack to another target within 10 ft. <b>Aura (Pale Blue Mist):</b> enemies WIS save or disadv on attacks; reduce their damage to you by CHA.`},
   {n:"② Anger",k:"passive",text:`All melee/ranged attacks gain damage = proficiency mod (e.g. 1d4 → 3d4 at +2). Lose 2 MP per attack made this way. <b>Enh (20 TL · 2 MP):</b> +10% crit; on a kill, move 15 ft & make an extra attack. <b>Aura (Violent Crimson Flame):</b> any enemy that deals or takes damage takes psychic = PB + CHA.`},
   {n:"③ Bargaining",k:"passive",text:`Choose one Promise (locked until next cycle): <b>God</b> — regain TL from damage dealt/taken, can't defy the domain (else early end + Breakdown); <b>Yourself</b> — adv WIS/CHA saves, +PB AC (fail/betray → disadv next turn); <b>Others</b> — 1/turn take an ally's damage & status (ally falls → early end + Breakdown); <b>Miracles</b> — 1/rd reroll a failed roll (nat 1 → next roll disadv). <b>Enh (30 TL · 1 MP):</b> hold two Promises. <b>Aura (Gold & Silver):</b> allies reroll 1 failed save/attack/rd; on a successful reroll, regain 1 MP.`},
   {n:"④ Depression",k:"passive",text:`Enemies within 10 ft drawn to you (WIS save vs DC); attacks against you have disadv; your damage & speed halved; no reactions; vulnerable to negative morale (doubled). Take no actions → recover 4 MP at end of turn. <b>Enh (40 TL · 2 MP):</b> radius 10 ft, enemies −speed. <b>Aura (Gray & Violet Fog):</b> enemies lose movement abilities & −10 ft in the aura.`},
   {n:"⑤ Acceptance",k:"passive",text:`Ends the cycle; morale resets to stable; all expended MP → temp HP ×10; removes all emotional statuses. <b>Enh (50 TL · 3 MP):</b> allies within 30 ft lose 1 emotional condition, +50 morale. <b>Aura (White Light, Prismatic):</b> allies regain temp HP = (CHA + WIS) × PB; enemies disadv on all saves vs your abilities/spells.`},
   {n:"Grief Chain Reaction",k:"passive",text:`Enhance two+ stages in one combat → unlock <b>Resonance Pulse</b>: spend 2 MP + 10 TL for a 30 ft psychic wave — enemies WIS save or disadv next roll; allies gain inspiration.`},
   {n:"MP Thresholds",k:"passive",text:`<b>5+</b> resist Charmed & Frightened · <b>10+</b> adv Insight · <b>15+</b> telepathy 30 ft (needs B relationship+) · <b>20+</b> unlocks Grief Aura. <b>MP costs:</b> enter cycle 2 · shift stage 1 · extend +1 rd 1 · empower 2 · reroll WIS/CHA save 2.`}
  ]},
  {id:"madness",title:"Mental Breakdowns & Madness",pane:"legacy",blurb:"At 10 or less MP, each round make a WIS save (DC 20+, rising, no reset until long rest) or suffer a Breakdown. Three Breakdowns or MP 0 → Madness.",items:[
   {n:"Mental Breakdowns",k:"passive",text:`One of: <b>Whispers of Msiona</b> (can't tell friend from foe — targets closest) · <b>Emotional Echo</b> (repeat last action) · <b>Suicidal Thoughts</b> (attack self with equipped weapon) · <b>Lost in Thought</b> (lose an action) · <b>All Alone</b> (can't be within 10 ft of a creature; −1 MP).`},
   {n:"Madness — Stage 1: Fracture",k:"passive",cost:"3 MP to restabilize",text:`1 min or until 0 HP. Eyes glow; allies & enemies indistinguishable; MP regen disabled; advantage on attacks & saves vs charm/fright; takes <b>double psychic</b>. On each kill, WIS save (earlier DC): success regain 1 MP; failure → Stage 2.`},
   {n:"Madness — Stage 2: Revelation",k:"passive",cost:"5 MP to restabilize",text:`Restabilize or until 0 HP. 30 ft aura of whispers — all within WIS save each turn: fail 3d8 psychic & <b>Charmed by Msiona</b> (roll d4: Paranoia II / Delusion II / Berserk II / Delirium III) to end of next turn, half on success. Attacks deal psychic + hollow = CHA but you can't choose targets. Auto-fail Insight & Perception. On each charm, DC 20 WIS: success +1 MP, failure −1 MP.`}
  ]}

    {id:"r_spin",name:"Spinning Blade",kind:"action",dmg:"3d7",text:"+3 to hit, range 30 ft. 3d7 slashing; chains to creatures within 10 ft (max = PB). Each chain after the first grants +2 to parry/deflect; if parried/deflected, Rayth is knocked to the last target and can't return until next turn (bonus action within 5 ft to free him)."},
    {id:"r_cursed",name:"Cursed Blow",kind:"free",text:"Before an attack, infuse necrotic: the attack becomes necrotic and the target is vulnerable to necrotic for 1 round. Uses = Rayth's WIS mod; resets on long rest."},

  {id:"orion",n:"Orion",eb:"The Hourglass · Integrity",c:"#e8b45a",bl:"Orion's Decay knocks an active ability one rung down the Integrity ladder; each Decay spends Sand (tracked in the top bar). Starting Sand 6, grows via the upgrade tree.",
   html:`<section id="o-ladder"><h2>Integrity ladder</h2><p class="note">Combat → <b>3-round counter</b> → Round → Turn → Instantaneous → <b style="color:var(--blood)">Nothing</b>. Decay moves a target one rung; multi-round effects deplete their counter before dropping a rung.</p></section>
<section id="o-costs"><h2>Decay costs <span class="sub2">Sand per rung</span></h2><table>
<tr><th>Target</th><th>What one Decay does</th><th class="n">Sand</th></tr>
<tr><td>Combat-long effect</td><td>Becomes a 3-round counter, then follows the multi-round rule down</td><td class="n">3</td></tr>
<tr><td>Multi-round effect</td><td>Depletes the counter (3→2→1); drops a rung only when it bottoms out</td><td class="n">1 / rd</td></tr>
<tr><td>Round-long effect</td><td>→ Turn</td><td class="n">2</td></tr>
<tr><td>Turn-long effect</td><td>→ Instantaneous</td><td class="n">1</td></tr>
<tr><td>Instantaneous</td><td>→ Nothing (negated)</td><td class="n">3</td></tr>
<tr><td>Barrier</td><td>One stage: Intact → Cracked → Broken</td><td class="n">2</td></tr>
<tr><td>Instinctual Reaction (e.g. Innate Counter)</td><td>Decays to Nothing — <b>only when Hasani is not its target</b></td><td class="n">2</td></tr>
<tr><td>Transformation</td><td>1/combat, knocks the creature out of the form; a reactivatable form may turn back on the creature's turn</td><td class="n">6</td></tr>
</table>
<div class="flag"><b>Open:</b> the exact Sand refill method (reap-the-expired + trickle) and whether Decay ignores Anti-Magic / Ghoulish Guard barriers or counts as an attack — current default: no to both.</div></section>
<section id="o-actions"><h2>How he spends it</h2><div class="card"><h3>Decay <span class="cost">25 TL · Bonus</span></h3><p>Choose one creature with an active ability within 30 ft; spend Sand to drop its Integrity a rung.</p></div>
<div class="card"><h3>Grains Against the Glass <span class="cost">10 TL · Reaction</span></h3><p>When a creature in his aura uses an ability, decay it as it resolves — an Instantaneous ability drops to Nothing and is negated.</p></div></section>`},

   html:`<section id="n-hist"><h2>History Knowledge <span class="sub2">Nat 20</span></h2>
<div class="card"><h3>The 100-Year Pantheonic War</h3><p>Started over control of followers and world domination. The Pantheons are divided by their position on the war, not their faiths: <b>Dark</b> sought to grow followers and subvert humanity; <b>Light</b> declared war on the Dark's misdeeds; <b>Grey</b> stayed neutral, wanting to end the conflict.</p></div>
<div class="card"><h3>Necrolien — "Dr. Death"</h3><p>His family died and he ascended to godhood to revive them. It failed miserably.</p></div>
<div class="card"><h3>Feather Notes — Callisto's Theory</h3><p>There may be a relationship between god powers and offspring — why do followers differ in power, yet families share similarities? But it's just a theory.</p></div></section>`}

function itemById(id){for(var i=0;i<S.items.length;i++)if(S.items[i].id===id)return S.items[i];return null;}
function splitOne(it){if(num(it.qty,1)<=1)return it;it.qty=num(it.qty)-1;var n=mkItem(clone(it));n.id=uid("i");n.qty=1;S.items.push(n);return n;}
function toStorage(it){if(!it)return;var same=S.items.filter(function(x){return x!==it&&x.loc==="storage"&&x.name===it.name&&x.cat===it.cat&&(x.cat==="consumable"||x.cat==="material"||x.cat==="resource");})[0];
 if(same){same.qty=num(same.qty,1)+num(it.qty,1);S.items.splice(S.items.indexOf(it),1);}else it.loc="storage";}
function equip(id,slot){var it=itemById(id);if(!it)return;var cat=it.cat;
 if(!slot){slot=SLOTS.filter(function(s){return s[2]===cat&&!slotItem(s[0]);}).map(function(s){return s[0];})[0]||SLOTS.filter(function(s){return s[2]===cat;}).map(function(s){return s[0];})[0];}
 if(!slot||SLOTCAT[slot]!==cat){flash("No "+(CATN[cat]||cat)+" slot for that item");return;}
 it=splitOne(it);
 if(it.twoSlot){slot="w1";["w1","w2"].forEach(function(k){var o=slotItem(k);if(o&&o!==it)toStorage(o);});}
 else{var o=slotItem(slot);if(o&&o!==it)toStorage(o);if(slot==="w2"){var w=slotItem("w1");if(w&&w.twoSlot)toStorage(w);}}
 it.loc=slot;logline("Equipped "+it.name);}
function toItemSlot(id){var it=itemById(id),d=compute();if(!it)return;
 for(var i=0;i<d.itemSlots;i++){if(!S.items.some(function(x){return x.loc==="is"+i;})){var one=num(it.qty,1)>1?splitOne(it):it;one.loc="is"+i;logline("Slotted "+one.name);return;}}
 flash("Item slots are full");}

/* ===================== WEALTH ===================== */
var COIN={cp:1,sp:10,gp:100,pp:1000},CDESC=["pp","gp","sp","cp"];
function parseCoins(t){var o={cp:0,sp:0,gp:0,pp:0},m,re=/(\d+(?:\.\d+)?)\s*(pp|gp|sp|cp)\b/gi,any=false;t=String(t||"");
 while((m=re.exec(t))){o[m[2].toLowerCase()]+=+m[1];any=true;}
 if(!any&&/^\s*\d+(\.\d+)?\s*$/.test(t)){o.gp=+t;any=true;}return any?o:null;}
function coinsCp(o){return Math.round(CDESC.reduce(function(a,k){return a+num(o[k])*COIN[k];},0));}
function fmtCoins(cp){cp=Math.round(cp);var neg=cp<0,p=[];cp=Math.abs(cp);CDESC.forEach(function(k){var n=Math.floor(cp/COIN[k]);cp-=n*COIN[k];if(n)p.push(n+" "+k);});return (neg?"−":"")+(p.join(" ")||"0 gp");}
/* Spend: pay in the entry's own coins first, then any coins that fit, then break the smallest larger coin and take change. */
function spendCoins(o){var W=S.wealth,need=coinsCp(o);if(need<=0)return true;var had=coinsCp(W)>=need;
 CDESC.filter(function(k){return num(o[k])>0;}).forEach(function(k){var u=Math.min(Math.max(0,num(W[k])),Math.floor(need/COIN[k]));W[k]=num(W[k])-u;need-=u*COIN[k];});
 CDESC.forEach(function(k){var u=Math.min(Math.max(0,num(W[k])),Math.floor(need/COIN[k]));W[k]=num(W[k])-u;need-=u*COIN[k];});
 if(need>0){for(var i=CDESC.length-1;i>=0;i--){var k=CDESC[i];if(num(W[k])>0&&COIN[k]>need){W[k]=num(W[k])-1;var ch=COIN[k]-need;need=0;
   CDESC.forEach(function(c){if(COIN[c]<COIN[k]){var n=Math.floor(ch/COIN[c]);W[c]=num(W[c])+n;ch-=n*COIN[c];}});break;}}}
 if(need>0){var pk=CDESC.filter(function(k){return num(o[k])>0;})[0]||"gp";W[pk]=num(W[pk])-Math.ceil(need/COIN[pk]);var over=Math.ceil(need/COIN[pk])*COIN[pk]-need;if(over)W.cp=num(W.cp)+over;}
 normDebt();return had;}
function normDebt(){var t=coinsCp(S.wealth);if(t>=0)return;t=-t;CDESC.forEach(function(k){var n=Math.floor(t/COIN[k]);S.wealth[k]=n?-n:0;t-=n*COIN[k];});}
function gainCoins(o){var W=S.wealth;if(coinsCp(W)<0){var t=coinsCp(W)+coinsCp(o);CDESC.forEach(function(k){W[k]=0;});if(t<0){W.cp=t;normDebt();}else{CDESC.forEach(function(k){var n=Math.floor(t/COIN[k]);W[k]=n;t-=n*COIN[k];});}return;}CDESC.forEach(function(k){if(num(o[k]))W[k]=num(W[k])+num(o[k]);});}
function wlog(t){S.wlog.push(t);if(S.wlog.length>30)S.wlog=S.wlog.slice(-30);logline(t);}
function applySub(sub){var o=parseCoins(sub.amt);if(!o){flash("Couldn't read the amount for "+sub.name);return false;}
 if(sub.type==="income"){gainCoins(o);wlog("+"+fmtCoins(coinsCp(o))+" "+sub.name);return true;}
 var ok=spendCoins(o);wlog("−"+fmtCoins(coinsCp(o))+" "+sub.name+(ok?"":" (went into debt)"));return true;}
function subNet(){var n=0;S.subs.forEach(function(x){if(!x.on)return;var o=parseCoins(x.amt);if(o)n+=(x.type==="income"?1:-1)*coinsCp(o);});return n;}

/* ===================== DAMAGE CALCULATOR =====================
   Max-damage system: every die resolves at its maximum. No rolling.
   Order per strike: weapon dice (+extra dice, doubled on a crit) + flat + riders
   → effective ×1.5 (round down) → vulnerable ×2 → half (round down) → − target ADR (attack rolls only). */
var STATTOK={STR:"str",DEX:"dex",CON:"con",INT:"int",WIS:"wis",CHA:"cha"};
function parseExpr(s,d){var out={dice:[],flat:0,ok:false};s=String(s||"").toUpperCase().replace(/\s+/g,"");if(!s)return out;
 var re=/([+\-]?)(\d*D\d+|\d+|STR|DEX|CON|INT|WIS|CHA|PB)/g,m,pos=0;
 while((m=re.exec(s))){if(m.index!==pos)return out;pos=re.lastIndex;var sg=m[1]==="-"?-1:1,t=m[2];
  if(t.indexOf("D")>-1){var p=t.split("D");out.dice.push({n:(p[0]===""?1:+p[0])*sg,m:+p[1]});}
  else if(/^\d+$/.test(t))out.flat+=sg*(+t);else if(t==="PB")out.flat+=sg*d.pb;else out.flat+=sg*d.mod[STATTOK[t]];}
 out.ok=pos===s.length;return out;}
function exprFrom(str){var m=/(\d+d\d+(?:\s*[+\-]\s*(?:\d+d\d+|\d+(?!d)|str|dex|con|int|wis|cha|pb)\b)*)/i.exec(String(str||""));return m?m[1].replace(/\s+/g,""):"";}
function dmgType(str){var m=/\b(slashing|piercing|bludgeoning|psychic|necrotic|radiant|cold|fire|lightning|thunder|acid|poison|force|true|soul erosion|vile)\b/i.exec(String(str||""));return m?m[1].toLowerCase():"";}
function dmgSources(){var out=[];
 equipped().forEach(function(it){if(it.cat==="weapon"&&exprFrom(it.dmg))out.push({g:"Weapons",n:it.name,e:exprFrom(it.dmg),t:dmgType(it.dmg)});
  (it.abilities||[]).forEach(function(a){var e=exprFrom(a.dmg)||exprFrom(a.cost);if(e)out.push({g:it.name,n:a.name,e:e,t:dmgType(a.dmg||a.text)});});});
 allKit().forEach(function(k){var e=exprFrom(k.a.dmg)||exprFrom(k.a.cost);if(e)out.push({g:"Kit · "+k.sec.title,n:k.a.n,e:e,t:dmgType(k.a.dmg||k.a.text)});});
 (S.comps||[]).forEach(function(c){(c.attacks||[]).forEach(function(a){var e=exprFrom(a.dmg);if(e)out.push({g:"Companion · "+c.name,n:c.name+": "+a.name,e:e,t:dmgType(a.dmg)});});});
 ((S.spells||{}).list||[]).forEach(function(x){var e=exprFrom(x.dmg);if(e)out.push({g:"Spells",n:x.name,e:e,t:dmgType(x.dmg)});});
 (S.bats||[]).forEach(function(b){(b.gambits||[]).forEach(function(g){var e=exprFrom(g.dmg);if(e)out.push({g:"Battalion · "+b.name,n:b.name+": "+g.name,e:e,t:dmgType(g.dmg)});});});
 return out;}
function riderDefs(){return (C.riders||[]).concat(S.dmg.custRiders||[]);}
function strike(d,o){var p=parseExpr(o.expr,d);
 if(!p.ok&&!(num(o.flat)||(o.riders||[]).length))return {ok:false,msg:"Couldn't read \""+o.expr+"\". Use dice and numbers, e.g. 3d11+18 or 2d8+WIS."};
 var how=[],dice=0,die0=p.dice.length?p.dice[0].m:0;
 p.dice.forEach(function(x){dice+=x.n*x.m;});
 var xd=num(o.xd);if(xd&&die0){dice+=xd*die0;}
 var dTxt=p.dice.map(function(x){return x.n+"d"+x.m;}).join("+")+(xd&&die0?"+"+xd+"d"+die0:"");
 if(o.crit){dice*=2;how.push(dTxt+" crit = "+dice);}else if(dTxt)how.push(dTxt+" = "+dice);
 var v=dice+p.flat+num(o.flat);if(p.flat)how.push(sgn(p.flat));if(num(o.flat))how.push(sgn(num(o.flat))+" bonus");
 (o.riders||[]).forEach(function(r){var rp=parseExpr(r.e,d),rv=rp.flat;rp.dice.forEach(function(x){rv+=x.n*x.m;});v+=rv;how.push("+"+rv+" "+r.n);});
 var line=how.join(" ")+" → "+v;
 if(o.eff){v=Math.floor(v*1.5);line+=" · effective ×1.5 → "+v;}
 if(o.vuln){v*=2;line+=" · vulnerable ×2 → "+v;}
 if(o.half){v=Math.floor(v/2);line+=" · half → "+v;}
 if(o.atk&&num(o.adr)>0){var adr=Math.max(0,num(o.adr)-(o.sunder?d.pb:0));v=Math.max(0,v-adr);line+=" · −"+adr+" ADR"+(o.sunder?" (Sundering −PB)":"")+" → "+v;}
 return {ok:true,each:v,how:line};}
function dmgOpts(){var D=S.dmg;return {expr:D.expr,crit:D.crit,eff:D.eff,vuln:D.vuln,half:D.half,xd:D.xd,flat:D.flat,atk:D.atk,adr:D.adr,sunder:D.sunder,
 riders:riderDefs().filter(function(r,i){return D.riders[r.n];})};}
function renderDmg(d){var D=S.dmg,src=dmgSources(),h='<section id="damage"><h2>Damage calculator <span class="sub2">max dice · no rolling</span></h2><div class="card">';
 h+='<div class="form"><div class="fld" style="grid-column:span 2"><span class="lbl">Attack</span><select class="sel" data-a2="dmgsrc"><option value="">choose, or type below…</option>';
 var g="";src.forEach(function(s,i){if(s.g!==g){if(g)h+='</optgroup>';g=s.g;h+='<optgroup label="'+esc(g)+'">';}h+='<option value="'+i+'"'+(D.label===s.n&&D.expr===s.e?' selected':'')+'>'+esc(s.n)+' · '+esc(s.e)+'</option>';});
 if(g)h+='</optgroup>';
 h+='</select></div><div class="fld"><span class="lbl">Damage</span><input type="text" data-b="dmg.expr" value="'+esc(D.expr)+'" placeholder="3d11+18"></div><div class="fld"><span class="lbl">Label</span><input type="text" data-b="dmg.label" value="'+esc(D.label)+'"></div>'+
  '<div class="fld"><span class="lbl">Target</span><input type="text" data-b="dmg.target" value="'+esc(D.target)+'" placeholder="optional"></div><div class="fld"><span class="lbl">Hits</span><input class="num" type="number" data-b="dmg.n" value="'+D.n+'" min="1"></div></div>';

function palSearch(q){q=q.trim().toLowerCase();palHits=[];
 IDX.forEach(function(e){if(palHits.length>=40)return;if(!q||e.t.toLowerCase().indexOf(q)>-1)palHits.push(e);});
 if(q)IDX.forEach(function(e){if(palHits.length>=40||palHits.indexOf(e)>-1)return;if(e.x.toLowerCase().indexOf(q)>-1)palHits.push(e);});
 palSel=0;drawPal();}
function drawPal(){var res=$("palRes");res.innerHTML="";if(!palHits.length){res.innerHTML='<button disabled style="color:var(--dimmer)">Nothing on the sheet matches that.</button>';return;}
 palHits.forEach(function(e,i){var b=document.createElement("button");if(i===palSel)b.className="sel";
  b.innerHTML='<span class="k">'+esc(e.pn)+'</span><b>'+esc(e.t)+'</b><br><span style="color:var(--dim);font-size:13px">'+esc(e.x.slice(0,110))+'</span>';
  b.addEventListener("click",function(){jump(e);});res.appendChild(b);});}
function jump(e){palClose();showPane(e.p);S.ui.pane=e.p;save();setTimeout(function(){if(e.el.tagName==="DETAILS")e.el.open=true;e.el.scrollIntoView({behavior:"smooth",block:"center"});e.el.classList.remove("hit");void e.el.offsetWidth;e.el.classList.add("hit");},40);}
function wirePal(){$("palBack").addEventListener("click",palClose);$("palIn").addEventListener("input",function(){palSearch(this.value);});
 $("palIn").addEventListener("keydown",function(e){if(e.key==="ArrowDown"){e.preventDefault();palSel=Math.min(palHits.length-1,palSel+1);drawPal();}
  else if(e.key==="ArrowUp"){e.preventDefault();palSel=Math.max(0,palSel-1);drawPal();}else if(e.key==="Enter"&&palHits[palSel]){e.preventDefault();jump(palHits[palSel]);}});}

/* ===================== CLOUD SYNC ===================== */
function initSync(){var CFG=window.FIREBASE_CONFIG||{},pill=$("syncPill");
 function setPill(t,c){pill.textContent=t;pill.style.color=c;}
 var ok=CFG&&CFG.apiKey&&String(CFG.apiKey).indexOf("PASTE")!==0&&window.firebase;
 if(!ok){setPill("○ local only","#bbb");return;}
 var docRef,applying=false,pushT=null;
 try{if(!firebase.apps.length)firebase.initializeApp(CFG);var db=firebase.firestore();db.enablePersistence({synchronizeTabs:true}).catch(function(){});
  docRef=db.collection("campaigns").doc(window.CAMPAIGN_ID||"astrology-club").collection("characters").doc(C.id);}catch(e){setPill("○ sync error","#e08");return;}
 function push(){docRef.set(JSON.parse(JSON.stringify(S))).then(function(){setPill("● synced","#7c7");}).catch(function(){setPill("○ offline","#c96");});}
 remoteSave=function(){if(applying)return;clearTimeout(pushT);pushT=setTimeout(push,400);};
 docRef.onSnapshot(function(snap){if(snap.metadata.hasPendingWrites)return;
  if(!snap.exists){push();return;}var data=snap.data();if(!data)return;
  applying=true;try{if(data.schema===3){var ui=S.ui;S=defaults();deep(S,data);S.ui=ui;}
   else if(C.migrate&&!S.migratedRemote){C.migrate(data,S,api);S.migratedRemote=true;logline("Imported the v2 cloud save");}
   sanitize();store.set(KEY,JSON.stringify(S));renderAll();}catch(e){}applying=false;
  if(data.schema!==3)push();setPill("● synced","#7c7");},function(){setPill("○ offline","#c96");});}

/* ===================== BOOT ===================== */
function boot(){panes();renderRail();buildPanes();wirePal();load();
 if(C.hooks&&C.hooks.init)C.hooks.init(api);renderAll();
 $("foot").textContent=(C.name||"")+" · sheet engine v3 · saves to this device"+(C.footNote?" · "+C.footNote:"");initSync();}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot);else boot();
window.__sheet={get S(){return S;},compute:compute,endTurn:endTurn,act:act,renderAll:renderAll,takeDamage:takeDamage,moraleChange:moraleChange,equip:equip,declareInf:declareInf};
})();
