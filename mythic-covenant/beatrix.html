<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beatrix Callie · The Harvesting Princess</title>
<link rel="preconnect" href="https://fonts.googleapis.com/">
<link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --void:#060806;--panel:#141e13;--line:#243c22;--line2:#453a52;
  --bone:#ece6d8;--dim:#9eb69c;--dimmer:#6d906a;
  --blood:#d8434f;--gold:#d9b154;--veil:#5fd2c0;--soul:#c2abff;--amber:#e8b04a;
  --ac:#c2abff;--ac-soft:#c2abff22;--ac-line:#c2abff66;--brand:#c2abff;
  --rib:linear-gradient(90deg,#5fd2c0,#c2abff,#d9b154,#e0506b);
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{background:radial-gradient(1100px 560px at 82% -12%,rgba(194,171,255,.08),transparent 60%),radial-gradient(900px 500px at -10% 108%,rgba(216,67,79,.07),transparent 60%),var(--void);
  color:var(--bone);font-family:'Cormorant Garamond',Georgia,serif;font-size:18px;line-height:1.55;padding:0 0 90px;}
.wrap{max-width:980px;margin:0 auto;padding:0 18px;position:relative;z-index:1;}
@media(min-width:1120px){.wrap{margin-left:288px;max-width:1090px;}}
h1,h2,h3,h4,.cz{font-family:'Cinzel',serif;font-weight:600;letter-spacing:.02em;}
.mono{font-family:'IBM Plex Mono',monospace;}
button{font:inherit;}

/* rail */
.rail{position:fixed;left:0;top:0;bottom:0;width:268px;z-index:70;overflow-y:auto;background:linear-gradient(180deg,#10170f,#070a07);border-right:1px solid var(--line);}
.rail-brand{padding:22px 18px 14px;border-bottom:1px solid var(--line);}
.rail-brand .eb{font-family:'Cinzel';font-size:10px;letter-spacing:.26em;color:var(--brand);text-transform:uppercase;}
.rail-brand .nm{font-family:'Cinzel Decorative';font-weight:900;font-size:30px;line-height:1.05;margin:8px 0 5px;color:#fff;}
.rail-brand .lv{font-family:'IBM Plex Mono';font-size:11px;color:var(--dim);}
.rail-search{margin:13px 14px 6px;display:flex;align-items:center;gap:9px;padding:9px 11px;cursor:pointer;background:#121a11;border:1px solid var(--line);border-radius:9px;color:var(--dim);font-family:'Cinzel';font-size:12.5px;}
.rail-search:hover{border-color:var(--ac);}
.rail-search .kbd{margin-left:auto;font-family:'IBM Plex Mono';font-size:9.5px;color:var(--dimmer);border:1px solid var(--line);padding:1px 4px;border-radius:4px;}
.rail-nav{padding:8px 10px 26px;}
.rail-grp{font-family:'IBM Plex Mono';font-size:9.5px;letter-spacing:.2em;color:var(--dimmer);text-transform:uppercase;margin:14px 8px 6px;}
.rail-btn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 11px;margin-bottom:2px;background:none;border:1px solid transparent;border-radius:8px;color:var(--dim);cursor:pointer;font-family:'Cinzel';font-size:14px;font-weight:500;}
.rail-btn .gl{width:7px;height:7px;background:var(--c,var(--ac));flex:none;transform:rotate(45deg);opacity:.6;}
.rail-btn .ct{margin-left:auto;font-family:'IBM Plex Mono';font-size:10px;color:var(--dimmer);}
.rail-btn:hover{color:var(--bone);background:#141d13;}
.rail-btn.on{color:#fff;background:#182517;border-color:var(--line2);}
.rail-btn.on .gl{opacity:1;box-shadow:0 0 9px var(--c,var(--ac));}
@media(max-width:1119px){
  .rail{position:static;width:auto;display:flex;flex-wrap:wrap;gap:6px;padding:12px;border-right:none;border-bottom:1px solid var(--line);}
  .rail-brand{width:100%;padding:4px 6px 12px;border:none;}
  .rail-search{margin:0;flex:1 1 170px;}
  .rail-nav{display:flex;flex-wrap:wrap;gap:5px;padding:6px 0 0;width:100%;}
  .rail-grp{display:none;} .rail-btn{width:auto;padding:7px 12px;font-size:13px;border:1px solid var(--line);}
}

/* tracker bar */
.bar{position:sticky;top:0;z-index:60;display:flex;gap:10px;flex-wrap:wrap;background:linear-gradient(180deg,rgba(16,23,15,.97),rgba(7,10,7,.97));backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);border:1px solid var(--line);border-top:3px solid var(--ac);border-radius:0 0 14px 14px;padding:12px 14px;margin-bottom:12px;box-shadow:0 14px 30px #000a;}
.tk{background:linear-gradient(180deg,#162215,#111910);border:1px solid var(--line);border-radius:11px;padding:9px 11px;min-width:180px;flex:1 1 180px;}
.tk .num.w44{width:40px;}
.tk .sl{font-size:13px;}
.tk .row{gap:4px;}
.tk .big{width:58px!important;font-size:19px!important;color:#fff;}
.tk-h{font-family:'Cinzel';font-size:11px;letter-spacing:.1em;color:var(--ac);display:flex;align-items:center;gap:7px;margin-bottom:7px;text-transform:uppercase;}
.tk-h .d{width:7px;height:7px;background:currentColor;transform:rotate(45deg);flex:none;}
.tk-h .chipx{margin-left:auto;}
.row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.btn{font-family:'Cinzel';min-width:28px;height:28px;border-radius:7px;border:1px solid var(--line);background:#141e13;color:var(--bone);font-size:14px;cursor:pointer;line-height:1;padding:0 8px;transition:.14s;}
.btn:hover{border-color:var(--ac);color:#fff;background:#192718;}
.btn:disabled{opacity:.35;cursor:not-allowed;}
.btn.sm{height:23px;font-size:11px;min-width:24px;padding:0 7px;}
.btn.lg{height:36px;padding:0 15px;font-size:14px;}
.btn.pri{border-color:var(--ac);color:#fff;background:var(--ac-soft);}
.btn.dgr:hover{border-color:var(--blood);color:#ffb3ba;}
.cur{font-family:'Cinzel';font-weight:700;font-size:22px;color:#fff;min-width:40px;text-align:center;}
.sl{color:var(--dimmer);}
.num{font-family:'Cinzel';font-weight:600;font-size:15px;width:62px;text-align:center;color:var(--gold);background:#0e140d;border:1px solid var(--line);border-radius:6px;padding:3px 2px;-moz-appearance:textfield;}
.num.w44{width:44px;} .num.w80{width:80px;}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.meter{height:6px;background:#0b100b;border-radius:3px;margin-top:7px;overflow:hidden;border:1px solid #1d2e1b;position:relative;}
.meter i{display:block;height:100%;transition:width .3s;}
.meter .mk{position:absolute;top:0;bottom:0;width:1px;background:#ffffff55;}
.sub{font-family:'IBM Plex Mono';font-size:10.5px;color:var(--dim);margin-top:6px;}
.bar-tools{display:flex;gap:8px;align-items:center;width:100%;padding-top:6px;border-top:1px solid var(--line);flex-wrap:wrap;}
.bar-tools button{font-family:'IBM Plex Mono';font-size:10.5px;color:var(--dim);background:#121a11;border:1px solid var(--line);border-radius:6px;padding:5px 9px;cursor:pointer;}
.bar-tools button:hover{color:var(--ac);border-color:var(--ac);}
.savehint{font-family:'IBM Plex Mono';font-size:10px;color:var(--dimmer);margin-left:auto;}
.savehint.flash{color:var(--ac);}
.roundrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;width:100%;padding:8px 2px 2px;border-top:1px solid var(--line);}
.bar.fold .tk{display:none;}
.minibar{display:none;width:100%;gap:14px;flex-wrap:wrap;align-items:center;font-family:'IBM Plex Mono';font-size:12px;color:var(--dim);}
.minibar b{font-family:'Cinzel';font-size:16px;color:#fff;margin-left:5px;}
.bar.fold .minibar{display:flex;}

/* chips & tags */
.chip{font-family:'IBM Plex Mono';font-size:10.5px;letter-spacing:.05em;border:1px solid var(--line);border-radius:20px;padding:3px 10px;color:var(--dim);background:#121a11;display:inline-block;white-space:nowrap;}
button.chip{cursor:pointer;}
.chip.on{color:#fff;border-color:var(--ac);background:var(--ac-soft);}
.chip.ok{color:#bff3ea;border-color:var(--veil);background:#5fd2c01c;}
.chip.warn{color:#ffd79a;border-color:var(--amber);background:#e8b04a1c;}
.chip.bad{color:#ffb3ba;border-color:var(--blood);background:#d8434f22;}
.tag{font-family:'IBM Plex Mono';font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ac);border:1px solid var(--ac-line);border-radius:4px;padding:1px 6px;font-weight:400;}
.tag.gold{color:var(--gold);border-color:#d9b15455;} .tag.blood{color:var(--blood);border-color:#d8434f55;} .tag.veil{color:var(--veil);border-color:#5fd2c055;}
.k-attack{color:#ff9aa4!important;border-color:#d8434f66!important;}
.k-action{color:#f2d58a!important;border-color:#d9b15466!important;}
.k-bonus{color:#9fe8dc!important;border-color:#5fd2c066!important;}
.k-reaction{color:#d3c3ff!important;border-color:#c2abff66!important;}
.k-free{color:#cfe6b0!important;border-color:#9fbf7866!important;}
.k-passive{color:var(--dim)!important;border-color:var(--line2)!important;}
.tbd{font-family:'Cinzel';font-size:9.5px;letter-spacing:.1em;background:#3a2c0c;color:var(--amber);border:1px solid var(--amber);padding:1px 7px;border-radius:10px;margin-left:5px;vertical-align:middle;font-weight:700;text-transform:uppercase;white-space:nowrap;}
.amber{color:var(--amber);}

/* panes */
.pane{display:none;} .pane.on{display:block;}
.pane-head{padding:24px 0 4px;}
.pane-head .eb{font-family:'Cinzel';font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--ac);}
.pane-head h1{font-family:'Cinzel Decorative';font-weight:900;font-size:clamp(28px,5.5vw,44px);color:#fff;line-height:1.05;margin-top:7px;}
.pane-head .bl{color:var(--dim);font-size:16px;max-width:66ch;margin-top:8px;}
section{margin:28px 0;scroll-margin-top:170px;}
section>h2{font-size:22px;color:#fff;display:flex;align-items:baseline;gap:11px;margin-bottom:6px;flex-wrap:wrap;}
section>h2 .sub2{font-family:'IBM Plex Mono';font-size:10.5px;letter-spacing:.12em;color:var(--dimmer);text-transform:uppercase;}
.note{color:var(--dim);font-size:15px;max-width:72ch;margin-top:8px;}
.gm{border-left:3px solid var(--blood);background:#1a0d11aa;padding:10px 14px;margin:12px 0;border-radius:0 8px 8px 0;font-size:15.5px;}
.gm b{font-family:'Cinzel';color:var(--blood);font-weight:600;}
.flag{border-left:3px solid var(--amber);background:#221a08aa;padding:10px 14px;margin:12px 0;border-radius:0 8px 8px 0;font-size:15px;}
.flag b{font-family:'Cinzel';color:var(--amber);font-weight:600;}
.card{background:linear-gradient(180deg,#162215,#111910);border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin:10px 0;}
.card h3{font-size:17px;color:#fff;margin-bottom:3px;display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;}
.card p{font-size:16px;} .card p+p{margin-top:6px;}
.cost{font-family:'IBM Plex Mono';font-size:11.5px;color:var(--dim);margin-bottom:5px;}
@media(max-width:700px){.bar{position:relative;}.tk{flex:1 1 100%;}}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(268px,1fr));gap:10px;}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;}
table{width:100%;border-collapse:collapse;margin:10px 0;font-size:15.5px;}
th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:top;}
th{font-family:'Cinzel';font-weight:600;font-size:12px;letter-spacing:.07em;color:var(--ac);}
td.n,th.n{font-family:'IBM Plex Mono';font-size:13px;white-space:nowrap;}
tr.hl td{background:var(--ac-soft);}
ul{margin:8px 0 8px 20px;} li{margin-bottom:4px;}
.dl{margin:10px 0;} .dl div{display:flex;gap:12px;padding:6px 0;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.dl dt{font-family:'Cinzel';font-size:14.5px;color:var(--gold);min-width:170px;flex:none;}
.dl dd{color:var(--bone);font-size:15.5px;flex:1;min-width:220px;}
input[type=text],textarea,select.sel{font-family:'Cormorant Garamond';background:#0d130c;border:1px solid var(--line);color:var(--bone);border-radius:7px;padding:6px 9px;font-size:15.5px;}
input[type=text]{width:100%;}
select.sel{font-family:'Cinzel';font-size:13px;padding:5px 7px;}
textarea{width:100%;min-height:100px;resize:vertical;line-height:1.55;}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--ac);}
.empty{color:var(--dimmer);font-style:italic;font-size:15px;padding:8px 0;}
.lbl{font-family:'IBM Plex Mono';font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dimmer);display:block;margin-bottom:3px;}
.fld{display:flex;flex-direction:column;min-width:0;}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px;align-items:end;}
.form .wide{grid-column:1/-1;}

/* transformation console */
.tx{border:1px solid var(--line);border-top:3px solid var(--ac);border-radius:14px;padding:16px;background:linear-gradient(180deg,#172316,#0e140e);}
.tx-top{display:flex;gap:14px;flex-wrap:wrap;align-items:center;justify-content:space-between;}
.tx-name{font-family:'Cinzel Decorative';font-weight:900;font-size:28px;color:var(--ac);line-height:1;}
.tx-sub{font-family:'IBM Plex Mono';font-size:11px;color:var(--dim);letter-spacing:.08em;margin-top:5px;}
.ladder{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:12px;}
.lad{background:#101810;display:grid;grid-template-columns:130px 1fr;gap:12px;padding:9px 12px;}
.lad .nm{font-family:'Cinzel';font-size:14px;color:var(--dim);}
.lad .nm small{display:block;font-family:'IBM Plex Mono';font-size:10px;color:var(--dimmer);letter-spacing:.06em;}
.lad ul{margin:0 0 0 16px;font-size:15px;color:var(--dim);}
.lad.on{background:linear-gradient(90deg,#3a2a0c66,#101810);} .lad.on .nm{color:var(--amber);} .lad.on ul{color:var(--bone);}
.lad.on.frac{background:linear-gradient(90deg,#4a121b77,#101810);} .lad.on.frac .nm{color:#ff8f9a;}
.lad.on.col{background:linear-gradient(90deg,#5a0f1a,#101810);} .lad.on.col .nm{color:#fff;}
.collapse{border:2px solid var(--blood);border-radius:12px;padding:14px;margin-top:12px;background:#210a0f;}
.collapse h3{color:#ffb3ba;}
.modes{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
.mode{flex:1 1 150px;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#111911;cursor:pointer;text-align:left;color:var(--bone);}
.mode .mn{font-family:'Cinzel';font-weight:700;font-size:16px;color:var(--fc);}
.mode .mi{font-family:'IBM Plex Mono';font-size:10.5px;color:var(--dim);}
.mode.on{border-color:var(--fc);box-shadow:inset 0 0 0 1px var(--fc),0 0 20px -8px var(--fc);}
.log{font-family:'IBM Plex Mono';font-size:11px;color:var(--dim);margin-top:10px;max-height:110px;overflow-y:auto;}
.log div{padding:2px 0;border-bottom:1px dotted #1d2e1b;}

/* resources, pips */
.res{background:#121a11;border:1px solid var(--line);border-radius:10px;padding:9px 11px;}
.res .rn{font-family:'Cinzel';font-size:13px;color:#fff;display:flex;gap:6px;align-items:baseline;}
.res .rn small{font-family:'IBM Plex Mono';font-size:10px;color:var(--dimmer);margin-left:auto;}
.pips{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-top:6px;}
.pip{width:21px;height:21px;border-radius:6px;border:1.5px solid var(--line2);background:#0e140d;cursor:pointer;padding:0;}
.pip.live{background:var(--ac);border-color:var(--ac);box-shadow:0 0 8px var(--ac-line);}

/* loadout */
.loadout{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;}
.lo-col{background:#101810;border:1px solid var(--line);border-radius:11px;padding:9px 10px;}
.lo-col h4{font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px;}
.lo-col details{border-bottom:1px dotted #21361f;padding:4px 0;}
.lo-col summary{cursor:pointer;font-size:15.5px;list-style:none;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;}
.lo-col summary::-webkit-details-marker{display:none;}
.lo-col summary .src{font-family:'IBM Plex Mono';font-size:9.5px;color:var(--dimmer);}
.lo-col details p{font-size:14.5px;color:var(--dim);margin:4px 0 2px;}

/* equipment */
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;}
.slot{border:1px solid var(--line);border-radius:11px;padding:11px 13px;background:#101810;cursor:pointer;text-align:left;color:var(--bone);position:relative;min-height:78px;}
.slot:hover{border-color:var(--ac);}
.slot .sn{font-family:'IBM Plex Mono';font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dimmer);}
.slot .it{font-family:'Cinzel';font-size:16px;color:#fff;margin-top:3px;line-height:1.2;}
.slot .mt{font-family:'IBM Plex Mono';font-size:10px;color:var(--dim);margin-top:4px;}
.slot.empty .it{color:var(--dimmer);font-style:italic;font-family:'Cormorant Garamond';}
.slot.held{opacity:.6;border-style:dashed;}
.slot.open{border-color:var(--ac);box-shadow:inset 0 0 0 1px var(--ac);}
.detail{border:1px solid var(--ac-line);border-radius:12px;padding:14px;margin-top:10px;background:#10170f;}
.dur{display:flex;gap:3px;flex-wrap:wrap;margin-top:5px;}
.dur i{width:9px;height:14px;border-radius:2px;background:var(--gold);display:block;}
.dur i.x{background:#21361f;}
.ab-row{border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin-top:7px;background:#111911;}
.islots{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:9px;}
.islot{border:1px dashed var(--line2);border-radius:10px;padding:9px 11px;background:#0e150e;min-height:70px;}
.islot.full{border-style:solid;border-color:var(--line);}
.rank{font-family:'Cinzel';font-weight:900;font-size:20px;width:36px;height:36px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;background:#0e140d;border:1px solid var(--line);}
.r-F{color:#d8434f;} .r-D{color:#c9a15a;} .r-C{color:#c2abff;} .r-B{color:#d9b154;} .r-A{color:#5fd2c0;} .r-S{color:#fff;background:#21361f;}
.inf{border:1px solid var(--line);border-left:3px solid var(--line2);border-radius:10px;padding:9px 12px;margin-top:8px;background:#111911;}
.inf.eq{border-left-color:var(--ac);background:linear-gradient(90deg,var(--ac-soft),#111911);}

/* stats & skills */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:9px;margin:10px 0;}
.stat{background:#121a11;border:1px solid var(--line);border-radius:10px;padding:9px;text-align:center;}
.stat .lb{font-family:'IBM Plex Mono';font-size:10px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;}
.stat .mo{font-family:'Cinzel';font-size:27px;font-weight:700;color:#fff;line-height:1.1;}
.stat .sv{font-family:'IBM Plex Mono';font-size:10.5px;color:var(--dim);margin-top:5px;cursor:pointer;}
.stat .sv.p{color:var(--ac);}
.vitals{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:9px;margin:10px 0;}
.vit{background:#121a11;border:1px solid var(--line);border-radius:10px;padding:9px;text-align:center;}
.vit .lb{font-family:'IBM Plex Mono';font-size:9.5px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase;}
.vit .v{font-family:'Cinzel';font-size:23px;font-weight:700;color:#fff;}
.vit .s{font-family:'IBM Plex Mono';font-size:9.5px;color:var(--dimmer);}
.vit.hi{border-color:var(--ac-line);} .vit.hi .v{color:var(--ac);}
.skl{display:grid;grid-template-columns:repeat(auto-fit,minmax(238px,1fr));gap:1px 16px;}
.sk{display:flex;align-items:center;gap:9px;padding:5px 2px;border-bottom:1px solid #1a2818;font-size:15px;}
.sk .pp{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--line2);background:#0d130c;cursor:pointer;flex:none;font-family:'IBM Plex Mono';font-size:8.5px;color:var(--void);text-align:center;line-height:12px;padding:0;}
.sk .pp.p{background:var(--ac);border-color:var(--ac);} .sk .pp.e{background:var(--gold);border-color:var(--gold);}
.sk .nm{flex:1;} .sk .ab{font-family:'IBM Plex Mono';font-size:10px;color:var(--dimmer);}
.sk .vl{font-family:'Cinzel';font-size:16px;color:#fff;min-width:38px;text-align:right;}

/* relationships */
.rel{display:grid;grid-template-columns:28px minmax(120px,1.2fr) 40px minmax(150px,1.6fr) auto;gap:10px;align-items:center;padding:8px 6px;border-bottom:1px solid #1a2818;}
.rel.party{background:linear-gradient(90deg,var(--ac-soft),transparent);border-radius:6px;}
.rel .rn{font-size:16.5px;}
.rel .rn small{display:block;font-family:'IBM Plex Mono';font-size:10px;color:var(--dimmer);}
.tierb{font-family:'Cinzel';font-weight:900;font-size:17px;width:34px;height:30px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:#0e140d;}
.pipbar{display:flex;gap:2px;flex-wrap:wrap;}
.pipbar i{flex:1 1 6px;min-width:5px;max-width:14px;height:12px;border-radius:2px;background:#1c2c1a;display:block;}
.pipbar i.f{background:var(--ac);} .pipbar.full i.f{background:var(--gold);}
.pipmeta{font-family:'IBM Plex Mono';font-size:10.5px;color:var(--dim);margin-top:3px;}
.star{width:26px;height:26px;border-radius:6px;border:1px solid var(--line);background:#0e140d;color:var(--dimmer);cursor:pointer;padding:0;}
.star.on{color:var(--gold);border-color:var(--gold);background:#d9b15418;}
@media(max-width:700px){.rel{grid-template-columns:28px 1fr 40px;}.rel .rp,.rel .ra{grid-column:1/-1;}}

/* storage */
.st-row{display:grid;grid-template-columns:minmax(140px,2fr) 100px 110px auto;gap:10px;align-items:center;padding:8px 6px;border-bottom:1px solid #1a2818;}
.st-row .nm{font-family:'Cinzel';font-size:15px;color:#fff;}
.st-row .nm small{display:block;font-family:'Cormorant Garamond';font-size:14px;color:var(--dim);}
@media(max-width:700px){.st-row{grid-template-columns:1fr auto;}}

/* palette */
.pal-back{position:fixed;inset:0;background:#000b;backdrop-filter:blur(3px);z-index:90;display:none;}
.pal-back.on{display:block;}
.pal{position:fixed;top:10vh;left:50%;transform:translateX(-50%);width:min(640px,94vw);z-index:91;display:none;background:#121a11;border:1px solid var(--line2);border-radius:14px;box-shadow:0 30px 70px #000c;overflow:hidden;}
.pal.on{display:block;}
.pal input{border:none;border-bottom:1px solid var(--line);border-radius:0;font-family:'Cinzel';font-size:18px;padding:14px 18px;}
.pal-res{max-height:56vh;overflow-y:auto;}
.pal-res button{display:block;width:100%;text-align:left;padding:10px 18px;background:none;border:none;border-bottom:1px solid #182517;color:var(--bone);cursor:pointer;font-size:15.5px;}
.pal-res button:hover,.pal-res button.sel{background:#192617;}
.pal-res .k{font-family:'IBM Plex Mono';font-size:9.5px;letter-spacing:.12em;color:var(--ac);text-transform:uppercase;display:block;}
.hit{animation:hit 1.6s ease;}
@keyframes hit{0%,100%{background:transparent}20%{background:var(--ac-soft)}}
.syncpill{position:fixed;bottom:10px;right:12px;z-index:99;font:600 11px/1 'IBM Plex Mono',monospace;padding:5px 9px;border-radius:20px;background:rgba(0,0,0,.6);color:#bbb;pointer-events:none;}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px;}
.foot{color:var(--dimmer);font-size:13px;text-align:center;margin-top:40px;font-family:'IBM Plex Mono';}
</style>

body{background:radial-gradient(1100px 560px at 82% -12%,rgba(108,192,112,.10),transparent 60%),radial-gradient(900px 500px at -10% 108%,rgba(227,194,122,.08),transparent 60%),var(--void)!important}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:-1;background:radial-gradient(circle at 20% 30%,rgba(108,192,112,.05) 0 2px,transparent 3px) 0 0/46px 46px}
.rail-brand .nm,.pane-head h1,.tx-name{font-family:'Playfair Display SC','Cinzel Decorative',serif!important;letter-spacing:.01em}
.pane-head h1{background:linear-gradient(100deg,var(--bone) 15%,#6cc070 70%,#e3c27a);-webkit-background-clip:text;background-clip:text;color:transparent}
</style>

/* ---- Special-status core: shared by every sheet and by the DM Status Console ---- */
function spClone(o){return JSON.parse(JSON.stringify(o));}
function spNum(v,d){v=parseFloat(v);return isNaN(v)?(d||0):v;}
function spUid(){return "sp"+Math.random().toString(36).slice(2,9);}
function spStrip(d){d=spClone(d);delete d.pairDef;delete d.nextDef;return d;}
function spEmbed(def,findDef){var d=spStrip(def);
 if(def.pair&&findDef){var p=findDef(def.pair);if(p)d.pairDef=spStrip(p);}

function stAll(){return (S.status||[]).concat(DMS);}
function stDef(k){for(var i=0;i<STATUS_DB.length;i++)if(STATUS_DB[i].k===k)return STATUS_DB[i];return null;}
function spFind(k){var L=(SPDB||[]).concat(CLASS_DB,CATDB);for(var i=0;i<L.length;i++)if(L[i].k===k)return L[i];return null;}
function stDefOf(x){return x.def||stDef(x.k);}
function stNorm(x){if(!x||typeof x!=="object")return null;if(!x.id)x.id=uid("st");if(!x.m||typeof x.m!=="object")x.m={};if(!x.pct||typeof x.pct!=="object")x.pct={};
 x.stacks=Math.max(1,num(x.stacks,1));var m=x.m;
 if(m.hpPct!=null&&m.hp==null){m.hp=-num(m.hpPct);x.pct.hp=true;}delete m.hpPct;
 if(m.dmgOut!=null&&m.dmg==null&&num(m.dmgOut)>0&&num(m.dmgOut)!==1){m.dmg=Math.round((num(m.dmgOut)-1)*100);x.pct.dmg=true;}delete m.dmgOut;
 if(x.sp&&x.def)spSync(x,x.dm&&DMS.indexOf(x)>=0?DMS:(S.status||[]),null);
 return x;}
function stFx(x){var d=stDefOf(x)||{},fx=(d.fx||[]).slice();if(d.tiers&&x.ti>=0&&d.tiers[x.ti])fx=d.tiers[x.ti].fx.concat(fx);return fx;}
function stCan(x,w){if(!x.dm)return true;if(DMU)return true;return !!(x.perm||{})[w];}
function stTouch(x){if(DMS.indexOf(x)>=0){clearTimeout(dmT);dmT=setTimeout(function(){if(dmPush)dmPush();},300);}save();}
function stCap(x){var d=stDefOf(x)||{};return x.sp?num(x.cap):num((x.m||{}).maxStacks);}
function maxOfExpr(s){var t=0;String(s||"").replace(/(\d+)d(\d+)/g,function(_,a,b){t+=(+a)*(+b);return "";});var fl=String(s||"").replace(/\d+d\d+/g,"").match(/[+-]\s*\d+/g);(fl||[]).forEach(function(x){t+=parseInt(x.replace(/\s/g,""),10);});return t;}
function stDot(x,hpMax){var m=x.m||{},d=stDefOf(x)||{};
 if(m.pct)return {v:Math.floor(hpMax*num(m.pct)/100),txt:m.pct+"% max HP"+(m.dotType?" "+m.dotType:"")};
 if(m.dot)return {v:maxOfExpr(m.dot),txt:m.dot};
 if(d.dotPer)return {v:maxOfExpr(d.dotPer)*num(x.stacks,1),txt:d.dotPer+" × "+x.stacks};return null;}
function stPerHit(x,hpMax){var d=stDefOf(x)||{};if(!d.perHitPct)return null;var p=d.perHitPct*num(x.stacks,1);return {v:Math.floor(hpMax*p/100),p:p};}
function stVal(x,k,per){var m=x.m||{},ex=Math.max(0,num(x.stacks,1)-1);return num(m[k])+(per?num(m[per])*ex:0);}
function statusAgg(){var g={sets:{ac:null,spd:null},spdHalf:false,spd0:false,noRx:false,noBonus:false,hits:[],dots:[],per:[]};
 ST_NUMK.forEach(function(k){g[k]={f:0,p:0};});if(ST_OFF)return g;
 stAll().forEach(function(x){var m=x.m||{},P=x.pct||{};
  ST_F.forEach(function(f){if(g[f.k]==null)return;var v=stVal(x,f.k,f.per);if(!v)return;if(P[f.k]&&!f.np)g[f.k].p+=v;else g[f.k].f+=v;});
  if(m.acSet!=null&&m.acSet!=="")g.sets.ac=g.sets.ac==null?num(m.acSet):Math.min(g.sets.ac,num(m.acSet));
  if(m.spdSet!=null&&m.spdSet!=="")g.sets.spd=g.sets.spd==null?num(m.spdSet):Math.min(g.sets.spd,num(m.spdSet));
  if(m.spdHalf)g.spdHalf=true;if(m.spd0)g.spd0=true;if(m.noRx)g.noRx=true;if(m.noBonus)g.noBonus=true;
  var h=stVal(x,"hit","hitPer");if(h)g.hits.push({v:h,n:x.n,note:m.hitNote||"attack rolls"});
  if(m.dot||m.pct||(stDefOf(x)||{}).dotPer)g.dots.push(x);if((stDefOf(x)||{}).perHitPct)g.per.push(x);});
 g.hp.p=Math.max(-90,g.hp.p);return g;}
function stApply(base,k,G){var e=G[k];if(!e)return base;return base+(e.p?Math.trunc(base*e.p/100):0)+e.f;}
function statusSummary(g){var p=[];
 function pc(k,l,u){var e=g[k];if(e.p)p.push(l+" "+sgn(e.p)+"%");if(e.f)p.push(l+" "+sgn(e.f)+(u||""));}
 pc("ac","AC");if(g.sets.ac!=null)p.push("AC ≤ "+g.sets.ac);
 if(g.spd0)p.push("speed 0");else{pc("spd","speed"," ft");if(g.sets.spd!=null)p.push("speed ≤ "+g.sets.spd+" ft");if(g.spdHalf)p.push("speed halved");}
 pc("sv","saves");[["svStr","STR"],["svDex","DEX"],["svCon","CON"],["svInt","INT"],["svWis","WIS"],["svCha","CHA"]].forEach(function(s){pc(s[0],s[1]+" saves");});
 pc("init","init");if(g.noRx)p.push("no reactions");else pc("dr","Dynamic Reactions");if(g.noBonus)p.push("no bonus actions");
 g.hits.forEach(function(h){p.push(sgn(h.v)+" "+h.note);});pc("hp","max HP");pc("dmg","damage dealt");
 return p;}
function stChip(x){var c=STATUS_COLORS[x.cat]||"#9eb69c",d=stDefOf(x)||{},cap=stCap(x);
 return '<button class="stchip'+(x.dm?' dm':'')+(d.buff?' buff':'')+'" style="--sc:'+c+'" data-a="stopen" data-id="'+x.id+'" title="'+esc((x.fam||"")+(x.dm?" · applied by the DM":"")+" · tap for details")+'">'+(x.dm?'<span class="stdm">DM</span>':'')+'<b>'+esc(x.n)+'</b>'+(x.t?' <span class="stpips">'+stPips(x.t)+'</span>':'')+
  (num(x.stacks,1)>1||cap>1?' <span class="stx">×'+x.stacks+(cap>1?'/'+cap:'')+'</span>':'')+(num(x.rounds)?' <span class="stx">'+x.rounds+'r</span>':'')+(x.hold>0?' <span class="stx">hold</span>':'')+'</button>';}
function stPips(t){var h="";for(var i=1;i<=4;i++)h+='<i class="'+(i<=t?'f':'')+'"></i>';return h;}
function renderStatusRow(d){var L=stAll(),g=d.stat,h='<div class="strow"><span class="cz strow-l">STATUS</span>';
 if(!L.length)h+='<span class="sub" style="margin:0">None</span>';
 L.forEach(function(x){h+=stChip(x);});
 h+='<button class="btn sm pri" data-a="stpick">+ status</button>';
 var sum=statusSummary(g);if(sum.length)h+='<span class="stsum">'+esc(sum.join(" · "))+'</span>';
 g.dots.forEach(function(x){var dt=stDot(x,d.hpMax);if(!dt)return;h+='<span class="stdot">'+esc(x.n)+': '+dt.v+' <span class="sl">('+esc(dt.txt)+')</span> <button class="btn sm" data-a="stdot" data-id="'+x.id+'" title="Take this start-of-turn damage">take</button></span>';});
 g.per.forEach(function(x){var ph=stPerHit(x,d.hpMax);if(!ph)return;h+='<span class="stdot">'+esc(x.n)+': '+ph.v+' per attack <span class="sl">('+ph.p+'% max HP)</span> <button class="btn sm" data-a="stphit" data-id="'+x.id+'" title="Take it for one attack">take</button></span>';});
 return h+'</div>';}
function stRecent(k){var r=(S.ui.stRecent||[]).filter(function(z){return z!==k;});r.unshift(k);S.ui.stRecent=r.slice(0,5);}
function stAdd(k){var df=stDef(k),x;
 if(df){var same=(S.status||[]).filter(function(y){return y.k===k;})[0];stRecent(k);
  if(same){var mx=num(same.m.maxStacks)||99;same.stacks=Math.min(mx,num(same.stacks,1)+1);logline(same.n+" stacks to "+same.stacks);return same;}
  x=stNorm({id:uid("st"),k:k,n:df.n,fam:df.fam,cat:df.cat,t:df.t,stacks:1,rounds:0,m:clone(df.m||{}),pct:{},note:""});}
 else x={id:uid("st"),k:"custom",n:"Custom status",fam:"Custom",cat:(STATUS_COLORS[S.ui.stCat]?S.ui.stCat:"physical"),t:1,stacks:1,rounds:0,m:{},pct:{},note:""};
 S.status.push(x);logline("Status: "+x.n+(x.t?" ("+ROMAN[x.t]+")":""));return x;}
function stAddSpecial(k){var df=spFind(k);if(!df)return null;var list=dmPush?DMS:S.status;
 var same=list.filter(function(y){return y.k===k;})[0];
 if(same){var cap=num(same.cap);same.stacks=cap>0?Math.min(cap,same.stacks+1):same.stacks+1;same.ap=true;spSync(same,list,logline);logline(same.n+" ×"+same.stacks+" (DM)");return same;}
 var x=spMake(df,{},spFind);spSync(x,list,logline);list.push(x);logline("DM applied "+x.n);return x;}
function stById(id){return stAll().filter(function(x){return x.id===id;})[0];}
function stRemove(x){if(DMS.indexOf(x)>=0){DMS.splice(DMS.indexOf(x),1);if(dmPush)dmPush();}else S.status=S.status.filter(function(y){return y!==x;});}

 switch(k){case "ac":case "acSet":return [d0.acNow,d.acNow];case "dr":return [d0.drMax,d.drMax];case "spd":case "spdSet":return [d0.speedNow+" ft",d.speedNow+" ft"];

 h+='<div class="packgrid">';
 p.slots.slice(0,p.size).forEach(function(it,i){h+='<div class="pslot'+(it?'':' empty')+'"><span class="lbl" style="margin:0">'+(i+1)+'</span>'+(it?'<div class="pit">'+packItemLabel(it)+'</div><button class="btn sm" data-a="packtake" data-n="'+i+'"'+(canUse?'':' disabled')+'>take</button>'+(me&&live&&!sealed?'<button class="btn sm" data-a="packresup" data-n="'+i+'" title="Resupply gambit: send to an ally within 30 ft">resupply</button>':''):'<div class="pit sub">empty</div>')+'</div>';});

 if(p.dropped.length){h+='<div class="card" style="margin:8px 0;border-color:#d8434f88"><b class="cz" style="color:#ffb3ba">On the ground</b>';

 /* trading */

  if(!others.length)h+='<p class="sub">Allies appear here once their sheet has been opened with sync on.</p>';}
 var w1=slotItem("w1"),w2=slotItem("w2");
 h+='<div class="row" style="margin-top:8px"><button class="btn sm" data-a="wswap"'+((w1||w2)&&!(w1&&w1.twoSlot)?'':' disabled')+'>⇄ Weapon swap</button><span class="sub" style="margin:0">free object interaction · swaps your two weapon slots'+(w1&&w1.twoSlot?' (a two-slot weapon fills both)':(w1||w2?' ('+esc(w1?w1.name:'empty')+' ⇄ '+esc(w2?w2.name:'empty')+')':''))+'</span></div>';
 h+='<details class="note" style="margin-top:8px"><summary>Rules</summary><ul style="font-size:15px">'+

  '<li><b>Trade</b> (everyone, Bonus Action): give, take, or swap 1 item with an adjacent, willing ally; the receiver spends nothing. <b>Weapon Swap:</b> free object interaction between your own 2 weapon slots.</li>'+
  '<li>Each item can change hands only once per round. Using an item still costs its normal action. Reactions are never used for trading.</li></ul></details></section>';
 return h;}
function packAct(a,el,d){var n=num(el.getAttribute("data-n")),p=packGet(),me=isCommander(),load=!!S.ui.packLoad;
 S.porterUse=S.porterUse||{};
 function access(){if(p.sealed){flash("The Pack is sealed");return null;}if(load)return "loading";
  if(me){if(!porterLive()){flash("Your Porter can't reach the Pack right now");return null;}if(S.porterUse.convoy){flash("Convoy Access already used this turn");return null;}S.porterUse.convoy=true;return "Convoy Access";}
  if(!p.commander){flash("No Porter is deployed");return null;}if(!S.ui.packAdj){flash("You need to be adjacent to "+p.commander.name);return null;}
  if(!packSpend("bon"))return null;return "Supply Hub, bonus action";}
 switch(a){
 case "packload":S.ui.packLoad=!S.ui.packLoad;return true;
 case "packtake":if(!p.slots[n])return false;var how=access();if(!how)return false;packTake(n,how);return true;
 case "packstow":var it=itemById(val("packStowSel"));if(!it){flash("Pick an item to stow");return false;}if(!packCanStow(it)){flash("Armor can't go in the Pack");return false;}
  if(it.hand&&!load&&!window.confirm(it.name+" already changed hands this round. Stow it anyway?"))return false;
  if(p.slots.indexOf(null)<0){flash("The Pack is full");return false;}var how2=access();if(!how2)return false;packStow(it,how2);S.ui.pkStow="";return true;
 case "packsize":if(!me)return false;packWrite(function(q){q.size=Math.max(6,num(q.size,6)+n);if(q.slots.length>q.size&&!q.slots.slice(q.size).some(Boolean))q.slots.length=q.size;});return true;
 case "packcrit":if(!me)return false;var full=[];p.slots.forEach(function(x,i){if(x)full.push(i);});if(!full.length)return false;var k=full[Math.floor(Math.random()*full.length)],nm=p.slots[k].name;
  packWrite(function(q){q.dropped.push(q.slots[k]);q.slots[k]=null;});logline("Critical hit: "+nm+" fell from the Pack next to you");return true;
 case "packunseal":if(!me||!porterLive())return false;packWrite(function(q){q.sealed=false;});logline("The Pack is unsealed");return true;
 case "packpick":var dr=p.dropped[n];if(!dr)return false;if(!packSpend("rx"))return false;var mine=mkItem(clone(dr));mine.id=uid("i");mine.loc="storage";mine.qty=1;mine.hand=true;
  packWrite(function(q){q.dropped.splice(n,1);});S.items.push(mine);logline("Picked up "+mine.name+" (reaction)");return true;
 case "packlost":var dl=p.dropped[n];if(!dl||!window.confirm("Mark "+dl.name+" as taken by an enemy? It leaves the Pack for good."))return false;packWrite(function(q){q.dropped.splice(n,1);});logline(dl.name+" was taken by an enemy");return true;
 case "packresup":if(!me||!porterLive()||p.sealed)return false;var pb=porterBat(),src=p.slots[n];if(!src)return false;
  if(num(pb.ch)<1&&!window.confirm("No gambit charges left. Resupply anyway?"))return false;var others=packOthers();
  if(!others.length){flash("No allies on the roster yet");return false;}
  var tid=val("packTo"),oi=-1;others.forEach(function(o,i){if(o.id===tid)oi=i;});if(oi<0){flash("Choose who to resupply first");return false;}
  if(!packSpend("bon"))return false;pb.ch=Math.max(0,num(pb.ch)-1);
  packWrite(function(q){var x=q.slots[n];q.slots[n]=null;(q.inbox[others[oi].id]=q.inbox[others[oi].id]||[]).push({item:x,from:(C.name||"")+"'s Porter",why:"Resupply",charge:false});});
  logline(pb.name+": Resupply sent "+src.name+" to "+others[oi].name);return true;
 case "trgive":var ti=itemById(val("trItem")),to=val("trTo"),cost=val("trCost")||"me";if(!ti||!to){flash("Pick an item and an ally");return false;}
  if(ti.hand&&!window.confirm(ti.name+" already changed hands this round. Trade it anyway?"))return false;
  if(cost==="me"&&!packSpend("bon"))return false;var one=num(ti.qty,1)>1?splitOne(ti):ti;var nmT=one.name,whoN=(packGet().roster[to]||{}).name||to;
  packSend(one,to,C.name||"",{why:"Trade",charge:cost==="them"});S.items.splice(S.items.indexOf(one),1);S.ui.pkTrItem="";logline("Traded "+nmT+" to "+whoN+(cost==="me"?" (your bonus action)":cost==="them"?" (their bonus action)":" (completes a swap)"));return true;
 case "wswap":var a1=slotItem("w1"),a2=slotItem("w2");if(a1&&a1.twoSlot)return false;if(a1)a1.loc="w2";if(a2)a2.loc="w1";logline("Weapon swap: "+(a2?a2.name:"empty")+" ⇄ "+(a1?a1.name:"empty"));return true;
 case "porteradd":if(porterBat()){flash("You already have a Porter");return false;}
  S.bats.push(mkBat({id:uid("bt"),name:"The Porter",tier:"Bronze",porter:true,dep:{hit:0,ac:0,save:"wis",sv:0},gambits:[{id:uid("g"),name:"Resupply",type:"support",cost:0,range:"30 ft of the commander",area:"",dmg:"",desc:"The Porter sends 1 Pack item to an ally within 30 ft of the Commander. Use the resupply button on a Pack slot (Turn tab)."}]}));logline("Added the Porter");return true;
 }return null;}
function packDeployHook(b){if(!b||!b.porter)return true;var p=packGet();
 if(b.on){if(p.commander&&p.commander.id!==C.id&&!window.confirm(p.commander.name+" already has the Porter deployed. Only one Porter per combat. Deploy anyway?")){b.on=false;return false;}
  packWrite(function(q){q.commander={id:C.id,name:C.name||C.id};});}
 else if(p.commander&&p.commander.id===C.id)packWrite(function(q){q.commander=null;});return true;}

/* ===================== LINKED RELATIONSHIPS (shared between sheets) =====================
   A relationship between two characters who both have sheets is one record in campaigns/{id}/shared/rels.
   Tier and pips are mutual; the max-tier cap (story lock) is DM-only. Unlinked entries stay local. */
var RLD=null,relsRef=null;
function relKey(a,b){return [a,b].sort().join("|");}
function relPairs(){return (RLD&&RLD.pairs)||{};}
function relOther(p){return p.a===C.id?{id:p.b,name:p.bn}:{id:p.a,name:p.an};}
function relWrite(fn){var d=clone(RLD||{pairs:{}});d.pairs=d.pairs||{};fn(d);RLD=d;if(relsRef)relsRef.set(JSON.parse(JSON.stringify(d))).catch(function(){flash("Couldn't reach the shared relationships");});}
function relNameMatch(a,b){a=String(a||"").toLowerCase().trim();b=String(b||"").toLowerCase().trim();if(!a||!b)return false;return a===b||a.split(/\s+/)[0]===b.split(/\s+/)[0];}
var REL_PARTY={beatrix:"Beatrix Callie",dylan:"Dylan",hasani:"Hasani Eldesteen",loryana:"Loryana",magnolia:"Magnolia DuBois",melissa:"Melissa",sika:"Sika Carmichael",yohan:"Yohan"};
function relRoster(){var r=(typeof PK!=="undefined"&&PK&&PK.roster)||{},all={};Object.keys(REL_PARTY).forEach(function(k){all[k]=REL_PARTY[k];});Object.keys(r).forEach(function(k){all[k]=r[k].name||all[k]||k;});
 return Object.keys(all).filter(function(k){return k!==C.id;}).map(function(k){return {id:k,name:all[k]};});}
function relPullIn(){if(!RLD)return false;var P=relPairs(),ch=false;
 Object.keys(P).forEach(function(k){var p=P[k];if(p.a!==C.id&&p.b!==C.id)return;var o=relOther(p),r=S.rels.filter(function(x){return x.link===k;})[0];
  if(!r){var m=S.rels.filter(function(x){return !x.link&&relNameMatch(x.name,o.name);})[0];
   if(m){if(p.pending===C.id&&(m.tier!==p.tier||m.pips!==p.pips)){if(m.linkOffer!==k){m.linkOffer=k;ch=true;}return;}m.link=k;m.with=o.id;delete m.linkOffer;r=m;ch=true;}
   else{r={id:uid("r"),name:o.name,tier:p.tier,pips:p.pips,cap:p.cap,party:false,note:"",link:k,with:o.id};S.rels.push(r);ch=true;logline("Linked relationship added: "+o.name);}}
  if(p.pending===C.id&&!r.linkOffer)relWrite(function(d){delete d.pairs[k].pending;});
  if(r.tier!==p.tier||r.pips!==p.pips||num(r.cap)!==num(p.cap)){r.tier=p.tier;r.pips=p.pips;r.cap=p.cap;ch=true;}});
 S.rels.forEach(function(r){if(r.link&&!P[r.link]){delete r.link;delete r.with;ch=true;}if(r.linkOffer&&!P[r.linkOffer]){delete r.linkOffer;ch=true;}});
 return ch;}
function relPushOut(){if(!RLD||!relsRef)return;var P=relPairs(),w=[];
 S.rels.forEach(function(r){if(!r.link||!P[r.link])return;var p=P[r.link];if(p.pending===C.id)return;
  if(num(r.cap)!==num(p.cap)){if(DMU)w.push(r);else r.cap=p.cap;}
  if(r.tier!==p.tier||r.pips!==p.pips)w.push(r);});
 if(w.length)relWrite(function(d){w.forEach(function(r){var p=d.pairs[r.link];if(!p)return;p.tier=r.tier;p.pips=r.pips;if(DMU)p.cap=num(r.cap);p.at=Date.now();});});}
function relSConflict(r){var P=relPairs(),ids=[C.id];if(r.link&&P[r.link])ids.push(relOther(P[r.link]).id);
 var hit=null;Object.keys(P).forEach(function(k){var p=P[k];if(k===r.link||p.tier!==5)return;if(ids.indexOf(p.a)>=0||ids.indexOf(p.b)>=0)hit=p;});
 if(hit)return hit.an+" & "+hit.bn;var o=S.rels.filter(function(x){return x.tier===5&&x!==r;})[0];return o?o.name:"";}
function relRowExtra(r){var P=relPairs(),h="";if(!relsRef)return "";
 if(r.link&&P[r.link]){var o=relOther(P[r.link]);h+='<span class="chip ok" title="Shared with '+esc(o.name)+'\'s sheet: tier and pips sync both ways">🔗 '+esc(o.name)+'</span>';
  if(P[r.link].by!=="dm"||DMU)h+='<button class="btn sm" data-a="relunlink" data-id="'+r.id+'" title="Stop sharing; both sheets keep the current values">unlink</button>';}
 else if(r.linkOffer&&P[r.linkOffer]){var q=P[r.linkOffer],oo=relOther(q);h+='<div class="card" style="margin:6px 0 0;flex-basis:100%;border-color:var(--gold)"><b>'+esc(oo.name)+' linked this relationship.</b> Shared: <b>'+TIERS[q.tier]+'</b> ('+q.pips+' pips) · yours: <b>'+TIERS[r.tier]+'</b> ('+r.pips+' pips). <button class="btn sm pri" data-a="relpick" data-id="'+r.id+'" data-k="theirs">keep shared</button><button class="btn sm" data-a="relpick" data-id="'+r.id+'" data-k="mine">keep mine</button></div>';}
 else{var ro=relRoster(),m=ro.filter(function(x){return relNameMatch(r.name,x.name);})[0];
  if(m)h+='<button class="btn sm" data-a="rellink" data-id="'+r.id+'" data-k="'+esc(m.id)+'" title="Share this relationship with '+esc(m.name)+'\'s sheet">🔗 link</button>';}
 return h;}
function relAct(a,el){var id=el.getAttribute("data-id"),r=id?relById(id):null,k=el.getAttribute("data-k");
 switch(a){

/* ===================== TRANSFORMATION ===================== */
function togOn(){return (C.tx&&C.tx.toggles||[]).filter(function(t){return S.tx.tog[t.id];});}

function tlCostFor(cost,isAb){var d=compute();return Math.max(0,num(cost)-(isAb?abCut():0))+(isAb&&d.st?d.st.sur:0);}
function upkeep(d){if(!C.tx)return {cost:0,gain:0,base:0};
 var m=S.tx.mode&&C.tx.modes?C.tx.modes.filter(function(x){return x.id===S.tx.mode;})[0]:null;
 var base=m?num(m.upkeep):num(C.tx.upkeep),cut=0,gain=0,add=0;
 togOn().forEach(function(t){cut+=num(t.cut);gain+=num(t.gain);add+=num(t.add);});if(C.hooks&&C.hooks.txGain)gain+=num(C.hooks.txGain(d,S));
 return {base:base,cut:cut,gain:gain,add:add,cost:Math.max(0,base-cut)+add,mode:m};}
function spendTL(cost,isAb,what){var c=tlCostFor(cost,isAb);
 if(num(S.tl.cur)<c){flash("Not enough TL ("+c+" needed)");return false;}
 S.tl.cur=num(S.tl.cur)-c;if(what)logline(what+", "+c+" TL");afterTL();return true;}

 if(!S.tx.on)return;var p=S.tl.cur/d.tlMax;
 if(!S.tx.fractured&&p<0.25&&!(C.tx.tier2&&C.tx.tier2.noScar)){var amt=Math.floor(d.hpMax*0.2);S.hp.scar=num(S.hp.scar)+amt;S.hp.cur=Math.max(0,num(S.hp.cur)-amt);
  S.tx.fractured=true;S.tx.fracAmt=amt;logline("Fractured: "+amt+" non-regenerable damage (20% of max HP)");}
 if(S.tl.cur<=0&&!S.tx.burning&&!S.tx.collapse){S.tx.collapse="pending";logline("TL hit 0. Collapse: choose Revert or Burn");}
 if(C.hooks&&C.hooks.afterTL)C.hooks.afterTL(api,p);}
function txStart(){if(S.tx.locked){flash("Collapsed earlier. No transforming until a long rest");return;}

 case "sdel":if(!window.confirm("Remove "+(Sc[id][n]||{}).name+"?"))return false;Sc[id].splice(n,1);return true;
 case "clsopen":S.ui.cls=S.ui.cls===id?"":id;return true;
 case "ooc":c=Sc.classes[n];c.ooc=num(c.ooc)+v;logline(c.name+" out-of-class XP "+sgn(v)+" → "+c.ooc);return true;

 case "skdel":Sc.classes[n].skills.splice(v,1);return true;

 case "chp":c=S.comps[n];c.hp=clamp(num(c.hp)+v,0,num(c.hpMax));return true;
 case "chpfull":c=S.comps[n];c.hp=num(c.hpMax);return true;
 case "cattadd":(S.comps[n].attacks=S.comps[n].attacks||[]).push({name:"Attack",hit:"+0",dmg:"1d6"});return true;
 case "cattdel":S.comps[n].attacks.splice(v,1);return true;
 case "cadd":var nm=val("compN").trim();if(!nm)return false;S.comps.push({id:uid("cp"),name:nm,kind:"",hp:10,hpMax:10,ac:10,speed:"30 ft",init:"",stats:{str:10,dex:10,con:10,int:10,wis:10,cha:10},attacks:[],abilities:"",notes:""});return true;
 case "cdel":if(!window.confirm("Remove "+S.comps[n].name+"?"))return false;S.comps.splice(n,1);return true;

 }return null;}

var COIN={cp:1,sp:10,gp:100,pp:1000},CDESC=["pp","gp","sp","cp"];
function parseCoins(t){var o={cp:0,sp:0,gp:0,pp:0},m,re=/(\d+(?:\.\d+)?)\s*(pp|gp|sp|cp)\b/gi,any=false;t=String(t||"");
 while((m=re.exec(t))){o[m[2].toLowerCase()]+=+m[1];any=true;}
 if(!any&&/^\s*\d+(\.\d+)?\s*$/.test(t)){o.gp=+t;any=true;}return any?o:null;}
function coinsCp(o){return Math.round(CDESC.reduce(function(a,k){return a+num(o[k])*COIN[k];},0));}
function fmtCoins(cp){cp=Math.round(cp);var neg=cp<0,p=[];cp=Math.abs(cp);CDESC.forEach(function(k){var n=Math.floor(cp/COIN[k]);cp-=n*COIN[k];if(n)p.push(n+" "+k);});return (neg?"−":"")+(p.join(" ")||"0 gp");}
/* Spend: pay in the entry's own coins first, then any coins that fit, then break the smallest larger coin and take change. */
function spendCoins(o){var W=S.wealth,need=coinsCp(o);if(need<=0)return true;var had=coinsCp(W)>=need;
 CDESC.filter(function(k){return num(o[k])>0;}).forEach(function(k){var u=Math.min(Math.max(0,num(W[k])),Math.floor(need/COIN[k]));W[k]=num(W[k])-u;need-=u*COIN[k];});
 CDESC.forEach(function(k){var u=Math.min(Math.max(0,num(W[k])),Math.floor(need/COIN[k]));W[k]=num(W[k])-u;need-=u*COIN[k];});
 if(need>0){for(var i=CDESC.length-1;i>=0;i--){var k=CDESC[i];if(num(W[k])>0&&COIN[k]>need){W[k]=num(W[k])-1;var ch=COIN[k]-need;need=0;
   CDESC.forEach(function(c){if(COIN[c]<COIN[k]){var n=Math.floor(ch/COIN[c]);W[c]=num(W[c])+n;ch-=n*COIN[c];}});break;}}}
 if(need>0){var pk=CDESC.filter(function(k){return num(o[k])>0;})[0]||"gp";W[pk]=num(W[pk])-Math.ceil(need/COIN[pk]);var over=Math.ceil(need/COIN[pk])*COIN[pk]-need;if(over)W.cp=num(W.cp)+over;}
 normDebt();return had;}
function normDebt(){var t=coinsCp(S.wealth);if(t>=0)return;t=-t;CDESC.forEach(function(k){var n=Math.floor(t/COIN[k]);S.wealth[k]=n?-n:0;t-=n*COIN[k];});}
function gainCoins(o){var W=S.wealth;if(coinsCp(W)<0){var t=coinsCp(W)+coinsCp(o);CDESC.forEach(function(k){W[k]=0;});if(t<0){W.cp=t;normDebt();}else{CDESC.forEach(function(k){var n=Math.floor(t/COIN[k]);W[k]=n;t-=n*COIN[k];});}return;}CDESC.forEach(function(k){if(num(o[k]))W[k]=num(W[k])+num(o[k]);});}
function wlog(t){S.wlog.push(t);if(S.wlog.length>30)S.wlog=S.wlog.slice(-30);logline(t);}
function applySub(sub){var o=parseCoins(sub.amt);if(!o){flash("Couldn't read the amount for "+sub.name);return false;}
 if(sub.type==="income"){gainCoins(o);wlog("+"+fmtCoins(coinsCp(o))+" "+sub.name);return true;}
 var ok=spendCoins(o);wlog("−"+fmtCoins(coinsCp(o))+" "+sub.name+(ok?"":" (went into debt)"));return true;}
function subNet(){var n=0;S.subs.forEach(function(x){if(!x.on)return;var o=parseCoins(x.amt);if(o)n+=(x.type==="income"?1:-1)*coinsCp(o);});return n;}

 if(S.wlog.length)h+='<div class="log">'+S.wlog.slice(-10).reverse().map(function(t){return '<div>'+esc(t)+'</div>';}).join("")+'</div>';
 return h+'<p class="note">Amounts take any mix of coins ("49 pp 6 gp"); a bare number is gold. Paying uses the listed coins first, then whatever fits, then breaks a larger coin and keeps the change. Unticked lines are skipped when processing.</p></div></section>';}

/* ===================== TURN STRUCTURE: start combat · start turn · end turn · end round ===================== */
/* Start turn: Dynamic Reactions refresh (Guide), TL generation, status start-of-turn damage and save reminders, sheet start-of-turn triggers.
   End turn: once-per-turn resets and the sheet's end-of-turn effects.
   End round: action, bonus action and attacks refill, transformation upkeep, effect and status durations, morale drift, Linked Support refresh, round +1. */
function phase(){if(!S.ph||num(S.ph.r)!==num(S.round))S.ph={r:S.round,st:false,en:false};return S.ph;}
function stStartTurn(parts,d){var mine=(S.status||[]).concat(DMS||[]),tot=0,rem=[];
 mine.forEach(function(x){if(x.frz)return;var dt=null;try{dt=stDot(x,d.hpMax);}catch(e){}if(dt&&num(dt.v)>0){tot+=num(dt.v);parts.push(x.n+" "+dt.v+" ("+dt.txt+")");}
  var df=stDefOf(x)||{};(df.fx||[]).forEach(function(f){if(/start of (each|your|its|his|her) turn/i.test(f)&&!/damage at the start/i.test(f))rem.push(x.n+": "+String(f).replace(/<[^>]+>/g,""));});});
 if(tot>0)takeDamage(tot,false);
 if(moraleTier(S.mor.cur)===0)rem.push("Broken morale: WIS save, or spend movement moving away from enemies");
 return rem;}
function startTurn(auto){var P=phase();if(P.st&&!auto){flash("This turn already started. End turn, then End round.");return false;}
 var parts=[],d=compute();P.st=true;P.en=false;
 syncEco(d);if(S.eco.rx)S.eco.rx.left=S.eco.rx.max;
 if(S.monk){S.monk.fl=0;S.monk.flMax=0;}if(S.eco.fl&&monkLevel()>0)S.eco.fl.left=0;
 if(C.tx&&S.tx.on&&!S.tx.burning){var u=upkeep(d);if(u.gain){S.tl.cur=Math.min(d.tlMax,num(S.tl.cur)+u.gain);parts.push("+"+u.gain+" TL");afterTL();}}
 var rem=stStartTurn(parts,d);
 if(C.hooks&&C.hooks.startTurn)try{C.hooks.startTurn(api,parts);}catch(e){if(window.console)console.error(e);}
 logline("Start of turn"+(auto?" (auto)":"")+(parts.length?": "+parts.join(", "):""));
 if(rem.length){logline("Start-of-turn checks: "+rem.join(" · "));S.ui.turnRem=rem;}else S.ui.turnRem=[];
 if(!auto)flash(parts.length||rem.length?"Start of turn: "+parts.concat(rem.map(function(r){return r.split(":")[0]+" check";})).join(" · "):"Turn started · reactions refreshed");return true;}
function endTurn(){var P=phase();if(P.en){flash("Turn already ended. Press End round when the round is over.");return false;}if(!P.st)startTurn(true);
 var parts=[];P.en=true;S.ui.turnRem=[];
 if(C.hooks&&C.hooks.endTurn)C.hooks.endTurn(api,parts);
 try{uiTurnEnd(parts);}catch(e){}
 S.infUsed=0;S.porterUse={};S.items.forEach(function(it){delete it.hand;});
 logline("End of turn"+(parts.length?": "+parts.join(", "):""));return true;}
function endRound(){var P=phase(),parts=[],d=compute();if(P.st&&!P.en)endTurn();
 if(C.tx&&S.tx.on){var u=upkeep(d);
  if(S.tx.burning){S.hp.burn=num(S.hp.burn)+u.cost;parts.push(u.cost+" max HP burned");var d2=compute();S.hp.cur=Math.min(num(S.hp.cur),d2.hpCeil);
   if(d2.hpMax<=0){S.dead=true;parts.push("max HP reached 0. She dies");}}
  else if(u.cost){S.tl.cur=Math.max(0,num(S.tl.cur)-u.cost);parts.push("−"+u.cost+" TL upkeep");}
  afterTL();}
 if(C.hooks&&C.hooks.endRound)try{C.hooks.endRound(api,parts);}catch(e){if(window.console)console.error(e);}
 var keep=[];S.effects.forEach(function(e){if(num(e.rounds)>0){e.rounds--;if(e.rounds<=0){parts.push(e.name+(e.target&&e.target!=="self"?" on "+e.target:"")+" ended");return;}}keep.push(e);});S.effects=keep;statusTick(parts);
 moraleEndRound(parts);
 syncEco(compute());for(var k in S.eco){if(k==="rx"||k==="fl")continue;S.eco[k].left=S.eco[k].max;}
 linkRefresh("");
 if(!P.st)parts.unshift("no turn taken");
 S.round++;S.ph={r:S.round,st:false,en:false};logline("End of round"+(parts.length?": "+parts.join(", "):""));return true;}

function dmCmd(c){var v=num(c.v),src=c.note?" ("+c.note+")":"",d=compute();
 if(c.kind==="dmg"){if(v>0){logline("DM: "+v+" damage"+src+(c.half?" · half":""));takeDamage(v,false);}}
 else if(c.kind==="adr"){if(v>0){logline("DM: "+v+" damage from an attack"+src+(c.half?" · half":""));uiIncoming(v,true);}}
 else if(c.kind==="pct"){var n=Math.floor(num(d.hpMax)*v/100);if(n>0){logline("DM: "+v+"% max HP = "+n+src);takeDamage(n,false);}}
 else if(c.kind==="heal"){if(v>0){heal(v);logline("DM: healed "+v+src);}}
 else if(c.kind==="temp"){if(v>num(S.hp.temp)){S.hp.temp=v;logline("DM: temp HP "+v+src);}}
 else if(c.kind==="mor"){moraleChange(v,!!c.cap);logline("DM: morale "+sgn(v)+src);}
 flash("DM: "+(c.kind==="mor"?"morale "+sgn(v):c.kind==="heal"?"heal "+v:c.kind==="temp"?"temp HP "+v:c.kind==="pct"?v+"% max HP":v+" damage")+src);}
