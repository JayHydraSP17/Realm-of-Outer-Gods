<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loryana · The Hand of Necrolien</title>
<link rel="preconnect" href="https://fonts.googleapis.com/">
<link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --void:#080706;--panel:#1c1715;--line:#362b28;--line2:#453a52;
  --bone:#ece6d8;--dim:#b1a4a1;--dimmer:#887672;
  --blood:#d8434f;--gold:#d9b154;--veil:#5fd2c0;--soul:#c2abff;--amber:#e8b04a;
  --ac:#c2abff;--ac-soft:#c2abff22;--ac-line:#c2abff66;--brand:#c2abff;
  --rib:linear-gradient(90deg,#5fd2c0,#c2abff,#d9b154,#e0506b);
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{background:radial-gradient(1100px 560px at 82% -12%,rgba(194,171,255,.08),transparent 60%),radial-gradient(900px 500px at -10% 108%,rgba(216,67,79,.07),transparent 60%),var(--void);
  color:var(--bone);font-family:'Cormorant Garamond',Georgia,serif;font-size:18px;line-height:1.55;padding:0 0 90px;}
.wrap{max-width:980px;margin:0 auto;padding:0 18px;position:relative;z-index:1;}
@media(min-width:1120px){.wrap{margin-left:288px;max-width:1090px;}}
h1,h2,h3,h4,.cz{font-family:'Cinzel',serif;font-weight:600;letter-spacing:.02em;}
.mono{font-family:'IBM Plex Mono',monospace;}
button{font:inherit;}

/* rail */
.rail{position:fixed;left:0;top:0;bottom:0;width:268px;z-index:70;overflow-y:auto;background:linear-gradient(180deg,#151211,#090808);border-right:1px solid var(--line);}
.rail-brand{padding:22px 18px 14px;border-bottom:1px solid var(--line);}
.rail-brand .eb{font-family:'Cinzel';font-size:10px;letter-spacing:.26em;color:var(--brand);text-transform:uppercase;}
.rail-brand .nm{font-family:'Cinzel Decorative';font-weight:900;font-size:30px;line-height:1.05;margin:8px 0 5px;color:#fff;}
.rail-brand .lv{font-family:'IBM Plex Mono';font-size:11px;color:var(--dim);}
.rail-search{margin:13px 14px 6px;display:flex;align-items:center;gap:9px;padding:9px 11px;cursor:pointer;background:#181413;border:1px solid var(--line);border-radius:9px;color:var(--dim);font-family:'Cinzel';font-size:12.5px;}
.rail-search:hover{border-color:var(--ac);}
.rail-search .kbd{margin-left:auto;font-family:'IBM Plex Mono';font-size:9.5px;color:var(--dimmer);border:1px solid var(--line);padding:1px 4px;border-radius:4px;}
.rail-nav{padding:8px 10px 26px;}
.rail-grp{font-family:'IBM Plex Mono';font-size:9.5px;letter-spacing:.2em;color:var(--dimmer);text-transform:uppercase;margin:14px 8px 6px;}
.rail-btn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 11px;margin-bottom:2px;background:none;border:1px solid transparent;border-radius:8px;color:var(--dim);cursor:pointer;font-family:'Cinzel';font-size:14px;font-weight:500;}
.rail-btn .gl{width:7px;height:7px;background:var(--c,var(--ac));flex:none;transform:rotate(45deg);opacity:.6;}
.rail-btn .ct{margin-left:auto;font-family:'IBM Plex Mono';font-size:10px;color:var(--dimmer);}
.rail-btn:hover{color:var(--bone);background:#1b1615;}
.rail-btn.on{color:#fff;background:#221c1a;border-color:var(--line2);}
.rail-btn.on .gl{opacity:1;box-shadow:0 0 9px var(--c,var(--ac));}
@media(max-width:1119px){
  .rail{position:static;width:auto;display:flex;flex-wrap:wrap;gap:6px;padding:12px;border-right:none;border-bottom:1px solid var(--line);}
  .rail-brand{width:100%;padding:4px 6px 12px;border:none;}
  .rail-search{margin:0;flex:1 1 170px;}
  .rail-nav{display:flex;flex-wrap:wrap;gap:5px;padding:6px 0 0;width:100%;}
  .rail-grp{display:none;} .rail-btn{width:auto;padding:7px 12px;font-size:13px;border:1px solid var(--line);}
}

/* tracker bar */
.bar{position:sticky;top:0;z-index:60;display:flex;gap:10px;flex-wrap:wrap;background:linear-gradient(180deg,rgba(21,18,17,.97),rgba(9,8,8,.97));backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);border:1px solid var(--line);border-top:3px solid var(--ac);border-radius:0 0 14px 14px;padding:12px 14px;margin-bottom:12px;box-shadow:0 14px 30px #000a;}
.tk{background:linear-gradient(180deg,#1f1918,#171312);border:1px solid var(--line);border-radius:11px;padding:9px 11px;min-width:180px;flex:1 1 180px;}
.tk .num.w44{width:40px;}
.tk .sl{font-size:13px;}
.tk .row{gap:4px;}
.tk .big{width:58px!important;font-size:19px!important;color:#fff;}
.tk-h{font-family:'Cinzel';font-size:11px;letter-spacing:.1em;color:var(--ac);display:flex;align-items:center;gap:7px;margin-bottom:7px;text-transform:uppercase;}
.tk-h .d{width:7px;height:7px;background:currentColor;transform:rotate(45deg);flex:none;}
.tk-h .chipx{margin-left:auto;}
.row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.btn{font-family:'Cinzel';min-width:28px;height:28px;border-radius:7px;border:1px solid var(--line);background:#1c1715;color:var(--bone);font-size:14px;cursor:pointer;line-height:1;padding:0 8px;transition:.14s;}
.btn:hover{border-color:var(--ac);color:#fff;background:#241d1b;}
.btn:disabled{opacity:.35;cursor:not-allowed;}
.btn.sm{height:23px;font-size:11px;min-width:24px;padding:0 7px;}
.btn.lg{height:36px;padding:0 15px;font-size:14px;}
.btn.pri{border-color:var(--ac);color:#fff;background:var(--ac-soft);}
.btn.dgr:hover{border-color:var(--blood);color:#ffb3ba;}
.cur{font-family:'Cinzel';font-weight:700;font-size:22px;color:#fff;min-width:40px;text-align:center;}
.sl{color:var(--dimmer);}
.num{font-family:'Cinzel';font-weight:600;font-size:15px;width:62px;text-align:center;color:var(--gold);background:#120f0f;border:1px solid var(--line);border-radius:6px;padding:3px 2px;-moz-appearance:textfield;}
.num.w44{width:44px;} .num.w80{width:80px;}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.meter{height:6px;background:#0f0d0c;border-radius:3px;margin-top:7px;overflow:hidden;border:1px solid #2a211f;position:relative;}
.meter i{display:block;height:100%;transition:width .3s;}
.meter .mk{position:absolute;top:0;bottom:0;width:1px;background:#ffffff55;}
.sub{font-family:'IBM Plex Mono';font-size:10.5px;color:var(--dim);margin-top:6px;}
.bar-tools{display:flex;gap:8px;align-items:center;width:100%;padding-top:6px;border-top:1px solid var(--line);flex-wrap:wrap;}
.bar-tools button{font-family:'IBM Plex Mono';font-size:10.5px;color:var(--dim);background:#181413;border:1px solid var(--line);border-radius:6px;padding:5px 9px;cursor:pointer;}
.bar-tools button:hover{color:var(--ac);border-color:var(--ac);}
.savehint{font-family:'IBM Plex Mono';font-size:10px;color:var(--dimmer);margin-left:auto;}
.savehint.flash{color:var(--ac);}
.roundrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;width:100%;padding:8px 2px 2px;border-top:1px solid var(--line);}
.bar.fold .tk{display:none;}
.minibar{display:none;width:100%;gap:14px;flex-wrap:wrap;align-items:center;font-family:'IBM Plex Mono';font-size:12px;color:var(--dim);}
.minibar b{font-family:'Cinzel';font-size:16px;color:#fff;margin-left:5px;}
.bar.fold .minibar{display:flex;}

/* chips & tags */
.chip{font-family:'IBM Plex Mono';font-size:10.5px;letter-spacing:.05em;border:1px solid var(--line);border-radius:20px;padding:3px 10px;color:var(--dim);background:#181413;display:inline-block;white-space:nowrap;}
button.chip{cursor:pointer;}
.chip.on{color:#fff;border-color:var(--ac);background:var(--ac-soft);}
.chip.ok{color:#bff3ea;border-color:var(--veil);background:#5fd2c01c;}
.chip.warn{color:#ffd79a;border-color:var(--amber);background:#e8b04a1c;}
.chip.bad{color:#ffb3ba;border-color:var(--blood);background:#d8434f22;}
.tag{font-family:'IBM Plex Mono';font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ac);border:1px solid var(--ac-line);border-radius:4px;padding:1px 6px;font-weight:400;}
.tag.gold{color:var(--gold);border-color:#d9b15455;} .tag.blood{color:var(--blood);border-color:#d8434f55;} .tag.veil{color:var(--veil);border-color:#5fd2c055;}
.k-attack{color:#ff9aa4!important;border-color:#d8434f66!important;}
.k-action{color:#f2d58a!important;border-color:#d9b15466!important;}
.k-bonus{color:#9fe8dc!important;border-color:#5fd2c066!important;}
.k-reaction{color:#d3c3ff!important;border-color:#c2abff66!important;}
.k-free{color:#cfe6b0!important;border-color:#9fbf7866!important;}
.k-passive{color:var(--dim)!important;border-color:var(--line2)!important;}
.tbd{font-family:'Cinzel';font-size:9.5px;letter-spacing:.1em;background:#3a2c0c;color:var(--amber);border:1px solid var(--amber);padding:1px 7px;border-radius:10px;margin-left:5px;vertical-align:middle;font-weight:700;text-transform:uppercase;white-space:nowrap;}
.amber{color:var(--amber);}

/* panes */
.pane{display:none;} .pane.on{display:block;}
.pane-head{padding:24px 0 4px;}
.pane-head .eb{font-family:'Cinzel';font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--ac);}
.pane-head h1{font-family:'Cinzel Decorative';font-weight:900;font-size:clamp(28px,5.5vw,44px);color:#fff;line-height:1.05;margin-top:7px;}
.pane-head .bl{color:var(--dim);font-size:16px;max-width:66ch;margin-top:8px;}
section{margin:28px 0;scroll-margin-top:170px;}
section>h2{font-size:22px;color:#fff;display:flex;align-items:baseline;gap:11px;margin-bottom:6px;flex-wrap:wrap;}
section>h2 .sub2{font-family:'IBM Plex Mono';font-size:10.5px;letter-spacing:.12em;color:var(--dimmer);text-transform:uppercase;}
.note{color:var(--dim);font-size:15px;max-width:72ch;margin-top:8px;}
.gm{border-left:3px solid var(--blood);background:#1a0d11aa;padding:10px 14px;margin:12px 0;border-radius:0 8px 8px 0;font-size:15.5px;}
.gm b{font-family:'Cinzel';color:var(--blood);font-weight:600;}
.flag{border-left:3px solid var(--amber);background:#221a08aa;padding:10px 14px;margin:12px 0;border-radius:0 8px 8px 0;font-size:15px;}
.flag b{font-family:'Cinzel';color:var(--amber);font-weight:600;}
.card{background:linear-gradient(180deg,#1f1918,#171312);border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin:10px 0;}
.card h3{font-size:17px;color:#fff;margin-bottom:3px;display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;}
.card p{font-size:16px;} .card p+p{margin-top:6px;}
.cost{font-family:'IBM Plex Mono';font-size:11.5px;color:var(--dim);margin-bottom:5px;}
@media(max-width:700px){.bar{position:relative;}.tk{flex:1 1 100%;}}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(268px,1fr));gap:10px;}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;}
table{width:100%;border-collapse:collapse;margin:10px 0;font-size:15.5px;}
th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:top;}
th{font-family:'Cinzel';font-weight:600;font-size:12px;letter-spacing:.07em;color:var(--ac);}
td.n,th.n{font-family:'IBM Plex Mono';font-size:13px;white-space:nowrap;}
tr.hl td{background:var(--ac-soft);}
ul{margin:8px 0 8px 20px;} li{margin-bottom:4px;}
.dl{margin:10px 0;} .dl div{display:flex;gap:12px;padding:6px 0;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.dl dt{font-family:'Cinzel';font-size:14.5px;color:var(--gold);min-width:170px;flex:none;}
.dl dd{color:var(--bone);font-size:15.5px;flex:1;min-width:220px;}
input[type=text],textarea,select.sel{font-family:'Cormorant Garamond';background:#110e0e;border:1px solid var(--line);color:var(--bone);border-radius:7px;padding:6px 9px;font-size:15.5px;}
input[type=text]{width:100%;}
select.sel{font-family:'Cinzel';font-size:13px;padding:5px 7px;}
textarea{width:100%;min-height:100px;resize:vertical;line-height:1.55;}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--ac);}
.empty{color:var(--dimmer);font-style:italic;font-size:15px;padding:8px 0;}
.lbl{font-family:'IBM Plex Mono';font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dimmer);display:block;margin-bottom:3px;}
.fld{display:flex;flex-direction:column;min-width:0;}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px;align-items:end;}
.form .wide{grid-column:1/-1;}

/* transformation console */
.tx{border:1px solid var(--line);border-top:3px solid var(--ac);border-radius:14px;padding:16px;background:linear-gradient(180deg,#201a19,#13100f);}
.tx-top{display:flex;gap:14px;flex-wrap:wrap;align-items:center;justify-content:space-between;}
.tx-name{font-family:'Cinzel Decorative';font-weight:900;font-size:28px;color:var(--ac);line-height:1;}
.tx-sub{font-family:'IBM Plex Mono';font-size:11px;color:var(--dim);letter-spacing:.08em;margin-top:5px;}
.ladder{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:12px;}
.lad{background:#161312;display:grid;grid-template-columns:130px 1fr;gap:12px;padding:9px 12px;}
.lad .nm{font-family:'Cinzel';font-size:14px;color:var(--dim);}
.lad .nm small{display:block;font-family:'IBM Plex Mono';font-size:10px;color:var(--dimmer);letter-spacing:.06em;}
.lad ul{margin:0 0 0 16px;font-size:15px;color:var(--dim);}
.lad.on{background:linear-gradient(90deg,#3a2a0c66,#161312);} .lad.on .nm{color:var(--amber);} .lad.on ul{color:var(--bone);}
.lad.on.frac{background:linear-gradient(90deg,#4a121b77,#161312);} .lad.on.frac .nm{color:#ff8f9a;}
.lad.on.col{background:linear-gradient(90deg,#5a0f1a,#161312);} .lad.on.col .nm{color:#fff;}
.collapse{border:2px solid var(--blood);border-radius:12px;padding:14px;margin-top:12px;background:#210a0f;}
.collapse h3{color:#ffb3ba;}
.modes{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
.mode{flex:1 1 150px;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#181312;cursor:pointer;text-align:left;color:var(--bone);}
.mode .mn{font-family:'Cinzel';font-weight:700;font-size:16px;color:var(--fc);}
.mode .mi{font-family:'IBM Plex Mono';font-size:10.5px;color:var(--dim);}
.mode.on{border-color:var(--fc);box-shadow:inset 0 0 0 1px var(--fc),0 0 20px -8px var(--fc);}
.log{font-family:'IBM Plex Mono';font-size:11px;color:var(--dim);margin-top:10px;max-height:110px;overflow-y:auto;}
.log div{padding:2px 0;border-bottom:1px dotted #2a211f;}

/* resources, pips */
.res{background:#181413;border:1px solid var(--line);border-radius:10px;padding:9px 11px;}
.res .rn{font-family:'Cinzel';font-size:13px;color:#fff;display:flex;gap:6px;align-items:baseline;}
.res .rn small{font-family:'IBM Plex Mono';font-size:10px;color:var(--dimmer);margin-left:auto;}
.pips{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-top:6px;}
.pip{width:21px;height:21px;border-radius:6px;border:1.5px solid var(--line2);background:#120f0f;cursor:pointer;padding:0;}
.pip.live{background:var(--ac);border-color:var(--ac);box-shadow:0 0 8px var(--ac-line);}

/* loadout */
.loadout{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;}
.lo-col{background:#161312;border:1px solid var(--line);border-radius:11px;padding:9px 10px;}
.lo-col h4{font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px;}
.lo-col details{border-bottom:1px dotted #312724;padding:4px 0;}
.lo-col summary{cursor:pointer;font-size:15.5px;list-style:none;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;}
.lo-col summary::-webkit-details-marker{display:none;}
.lo-col summary .src{font-family:'IBM Plex Mono';font-size:9.5px;color:var(--dimmer);}
.lo-col details p{font-size:14.5px;color:var(--dim);margin:4px 0 2px;}

/* equipment */
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;}
.slot{border:1px solid var(--line);border-radius:11px;padding:11px 13px;background:#161312;cursor:pointer;text-align:left;color:var(--bone);position:relative;min-height:78px;}
.slot:hover{border-color:var(--ac);}
.slot .sn{font-family:'IBM Plex Mono';font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dimmer);}
.slot .it{font-family:'Cinzel';font-size:16px;color:#fff;margin-top:3px;line-height:1.2;}
.slot .mt{font-family:'IBM Plex Mono';font-size:10px;color:var(--dim);margin-top:4px;}
.slot.empty .it{color:var(--dimmer);font-style:italic;font-family:'Cormorant Garamond';}
.slot.held{opacity:.6;border-style:dashed;}
.slot.open{border-color:var(--ac);box-shadow:inset 0 0 0 1px var(--ac);}
.detail{border:1px solid var(--ac-line);border-radius:12px;padding:14px;margin-top:10px;background:#151211;}
.dur{display:flex;gap:3px;flex-wrap:wrap;margin-top:5px;}
.dur i{width:9px;height:14px;border-radius:2px;background:var(--gold);display:block;}
.dur i.x{background:#312724;}
.ab-row{border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin-top:7px;background:#181312;}
.islots{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:9px;}
.islot{border:1px dashed var(--line2);border-radius:10px;padding:9px 11px;background:#14100f;min-height:70px;}
.islot.full{border-style:solid;border-color:var(--line);}
.rank{font-family:'Cinzel';font-weight:900;font-size:20px;width:36px;height:36px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;background:#120f0f;border:1px solid var(--line);}
.r-F{color:#d8434f;} .r-D{color:#c9a15a;} .r-C{color:#c2abff;} .r-B{color:#d9b154;} .r-A{color:#5fd2c0;} .r-S{color:#fff;background:#312724;}
.inf{border:1px solid var(--line);border-left:3px solid var(--line2);border-radius:10px;padding:9px 12px;margin-top:8px;background:#181312;}
.inf.eq{border-left-color:var(--ac);background:linear-gradient(90deg,var(--ac-soft),#181312);}

/* stats & skills */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:9px;margin:10px 0;}
.stat{background:#181413;border:1px solid var(--line);border-radius:10px;padding:9px;text-align:center;}
.stat .lb{font-family:'IBM Plex Mono';font-size:10px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;}
.stat .mo{font-family:'Cinzel';font-size:27px;font-weight:700;color:#fff;line-height:1.1;}
.stat .sv{font-family:'IBM Plex Mono';font-size:10.5px;color:var(--dim);margin-top:5px;cursor:pointer;}
.stat .sv.p{color:var(--ac);}
.vitals{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:9px;margin:10px 0;}
.vit{background:#181413;border:1px solid var(--line);border-radius:10px;padding:9px;text-align:center;}
.vit .lb{font-family:'IBM Plex Mono';font-size:9.5px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase;}
.vit .v{font-family:'Cinzel';font-size:23px;font-weight:700;color:#fff;}
.vit .s{font-family:'IBM Plex Mono';font-size:9.5px;color:var(--dimmer);}
.vit.hi{border-color:var(--ac-line);} .vit.hi .v{color:var(--ac);}
.skl{display:grid;grid-template-columns:repeat(auto-fit,minmax(238px,1fr));gap:1px 16px;}
.sk{display:flex;align-items:center;gap:9px;padding:5px 2px;border-bottom:1px solid #241d1c;font-size:15px;}
.sk .pp{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--line2);background:#110e0e;cursor:pointer;flex:none;font-family:'IBM Plex Mono';font-size:8.5px;color:var(--void);text-align:center;line-height:12px;padding:0;}
.sk .pp.p{background:var(--ac);border-color:var(--ac);} .sk .pp.e{background:var(--gold);border-color:var(--gold);}
.sk .nm{flex:1;} .sk .ab{font-family:'IBM Plex Mono';font-size:10px;color:var(--dimmer);}
.sk .vl{font-family:'Cinzel';font-size:16px;color:#fff;min-width:38px;text-align:right;}

/* relationships */
.rel{display:grid;grid-template-columns:28px minmax(120px,1.2fr) 40px minmax(150px,1.6fr) auto;gap:10px;align-items:center;padding:8px 6px;border-bottom:1px solid #241d1c;}
.rel.party{background:linear-gradient(90deg,var(--ac-soft),transparent);border-radius:6px;}
.rel .rn{font-size:16.5px;}
.rel .rn small{display:block;font-family:'IBM Plex Mono';font-size:10px;color:var(--dimmer);}
.tierb{font-family:'Cinzel';font-weight:900;font-size:17px;width:34px;height:30px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:#120f0f;}
.pipbar{display:flex;gap:2px;flex-wrap:wrap;}
.pipbar i{flex:1 1 6px;min-width:5px;max-width:14px;height:12px;border-radius:2px;background:#28201e;display:block;}
.pipbar i.f{background:var(--ac);} .pipbar.full i.f{background:var(--gold);}
.pipmeta{font-family:'IBM Plex Mono';font-size:10.5px;color:var(--dim);margin-top:3px;}
.star{width:26px;height:26px;border-radius:6px;border:1px solid var(--line);background:#120f0f;color:var(--dimmer);cursor:pointer;padding:0;}
.star.on{color:var(--gold);border-color:var(--gold);background:#d9b15418;}
@media(max-width:700px){.rel{grid-template-columns:28px 1fr 40px;}.rel .rp,.rel .ra{grid-column:1/-1;}}

/* storage */
.st-row{display:grid;grid-template-columns:minmax(140px,2fr) 100px 110px auto;gap:10px;align-items:center;padding:8px 6px;border-bottom:1px solid #241d1c;}
.st-row .nm{font-family:'Cinzel';font-size:15px;color:#fff;}
.st-row .nm small{display:block;font-family:'Cormorant Garamond';font-size:14px;color:var(--dim);}
@media(max-width:700px){.st-row{grid-template-columns:1fr auto;}}

/* palette */
.pal-back{position:fixed;inset:0;background:#000b;backdrop-filter:blur(3px);z-index:90;display:none;}
.pal-back.on{display:block;}
.pal{position:fixed;top:10vh;left:50%;transform:translateX(-50%);width:min(640px,94vw);z-index:91;display:none;background:#181413;border:1px solid var(--line2);border-radius:14px;box-shadow:0 30px 70px #000c;overflow:hidden;}
.pal.on{display:block;}
.pal input{border:none;border-bottom:1px solid var(--line);border-radius:0;font-family:'Cinzel';font-size:18px;padding:14px 18px;}
.pal-res{max-height:56vh;overflow-y:auto;}
.pal-res button{display:block;width:100%;text-align:left;padding:10px 18px;background:none;border:none;border-bottom:1px solid #221c1a;color:var(--bone);cursor:pointer;font-size:15.5px;}
.pal-res button:hover,.pal-res button.sel{background:#231c1a;}
.pal-res .k{font-family:'IBM Plex Mono';font-size:9.5px;letter-spacing:.12em;color:var(--ac);text-transform:uppercase;display:block;}
.hit{animation:hit 1.6s ease;}
@keyframes hit{0%,100%{background:transparent}20%{background:var(--ac-soft)}}
.syncpill{position:fixed;bottom:10px;right:12px;z-index:99;font:600 11px/1 'IBM Plex Mono',monospace;padding:5px 9px;border-radius:20px;background:rgba(0,0,0,.6);color:#bbb;pointer-events:none;}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px;}
.foot{color:var(--dimmer);font-size:13px;text-align:center;margin-top:40px;font-family:'IBM Plex Mono';}

/* ===== Iron Maiden console (Balance of Power) ===== */
#ironConsole{margin:14px 0 6px}
#ironConsole h2{font-family:'Cinzel',serif;font-size:20px;color:var(--bone);margin:20px 0 8px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
#ironConsole .sub2{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--dimmer);letter-spacing:.06em;font-weight:400}
#ironConsole .fac{border:1px solid var(--line);border-left:3px solid var(--fc);border-radius:12px;padding:12px 14px;background:#181312;margin-bottom:9px;transition:.2s}
#ironConsole .fac.active{box-shadow:inset 0 0 0 1px var(--fc),0 0 22px -10px var(--fc)}
#ironConsole .fac-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#ironConsole .fac-h .nm{font-family:'Cinzel',serif;font-size:19px;color:var(--fc);font-weight:700}
#ironConsole .fac-h .role{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dimmer)}
#ironConsole .fac-h .state{margin-left:auto;font-family:'Cinzel',serif;font-size:14px;color:#fff}
#ironConsole .track{display:flex;gap:3px;margin:10px 0 8px}
#ironConsole .track button{flex:1;height:24px;border-radius:4px;border:1px solid var(--line);background:#100e0d;cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--dimmer);padding:0;transition:.12s}
#ironConsole .track button.neg{background:#2a1016}
#ironConsole .track button.zero{border-color:var(--line2)}
#ironConsole .track button.fill{background:var(--fc);border-color:var(--fc);color:#120f0f;font-weight:700}
#ironConsole .fac-btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
#ironConsole .fac-btns .mi{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--dim);margin-left:auto}
#ironConsole .asc{font-size:14.5px;color:var(--dim);margin:2px 0 0;font-style:italic}
#ironConsole .mzone{border-top:1px dashed var(--line);margin-top:10px;padding-top:9px}
#ironConsole .mlab{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dimmer);margin-bottom:5px}
#ironConsole .mtext{font-size:15px;color:var(--bone)}
#ironConsole .mtext.none{color:var(--dimmer);font-style:italic}
#ironConsole .mtext.done{color:var(--fc);text-decoration:line-through}
#ironConsole .mbtns{display:flex;gap:7px;margin-top:7px;flex-wrap:wrap}
#ironConsole .demlist{margin:2px 0 10px}
#ironConsole .dem{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:9px 11px;background:#181413;border:1px solid var(--line);border-left:3px solid var(--fc);border-radius:10px;margin-bottom:7px}
#ironConsole .dem.done{opacity:.6}
#ironConsole .dem.done .dtext{text-decoration:line-through}
#ironConsole .dem .box{width:18px;height:18px;border:1.5px solid var(--line2);border-radius:4px;background:#110e0e;cursor:pointer;flex:none;color:#120f0f;font-size:12px;line-height:15px;text-align:center;font-weight:700}
#ironConsole .dem .box.on{background:var(--fc);border-color:var(--fc)}
#ironConsole .dem .dfac{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--fc)}
#ironConsole .dem .dtext{flex:1;min-width:150px;font-size:15.5px;color:var(--bone)}
#ironConsole .dem .dpts{font-family:'Cinzel',serif;font-size:14px;color:var(--gold)}
#ironConsole .demadd{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
#ironConsole .demadd input[type=text]{flex:1;min-width:180px;background:#110e0e;border:1px solid var(--line);color:var(--bone);border-radius:7px;padding:8px 10px;font-family:'Cormorant Garamond',serif;font-size:15.5px}
#ironConsole .demadd .num{background:#110e0e;border:1px solid var(--line);color:var(--bone);border-radius:7px;padding:8px;font-family:'IBM Plex Mono',monospace}
#ironConsole .sel{font-family:'Cinzel',serif;font-size:13px;background:#110e0e;border:1px solid var(--line);color:var(--bone);border-radius:7px;padding:8px 9px}
#ironConsole .empty{color:var(--dimmer);font-style:italic;font-size:15px;padding:6px 0}
#ironConsole .uprow{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:2px 0 10px}
#ironConsole .uprow .mono{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--dim)}
#ironConsole .uprow .upc{font-family:'Cinzel',serif;font-size:22px;color:var(--gold);min-width:30px;text-align:center}
#ironConsole .note2{color:var(--dimmer);font-size:11px;margin-left:auto;font-family:'IBM Plex Mono',monospace}
#ironConsole .treetabs{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}
#ironConsole .ttab{font-family:'Cinzel',serif;font-size:13px;background:#181413;border:1px solid var(--line2);color:var(--dim);padding:7px 15px;border-radius:8px;cursor:pointer}
#ironConsole .ttab.on{border-color:var(--fc);color:var(--fc);background:#231c1a}
#ironConsole .treegrid{display:grid;grid-template-columns:100px repeat(3,1fr);gap:6px}
#ironConsole .treegrid .hd{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dimmer);padding:4px 2px}
#ironConsole .modrow{font-family:'Cinzel',serif;font-size:14px;color:var(--gold);align-self:center}
#ironConsole .node{background:#181413;border:1px solid var(--line);border-radius:9px;padding:9px 10px;cursor:pointer;text-align:left;color:var(--dim);font-family:'Cormorant Garamond',serif;font-size:13.5px;line-height:1.35;transition:.14s}
#ironConsole .node b{font-family:'Cinzel',serif;display:block;font-size:13px;color:var(--bone);margin-bottom:3px}
#ironConsole .node.locked{opacity:.35;cursor:not-allowed}
#ironConsole .node.own{border-color:var(--fc);background:#231c1a;color:var(--bone);box-shadow:inset 0 0 0 1px var(--fc)}
#ironConsole .node.own b{color:var(--fc)}
@media(max-width:640px){#ironConsole .treegrid{grid-template-columns:1fr}#ironConsole .treegrid .hd{display:none}#ironConsole .modrow{margin-top:10px;color:var(--bone)}}
#ironConsole .spk{border:1px solid var(--line);border-left:3px solid var(--soul);border-radius:12px;padding:12px 14px;background:#181312;margin-bottom:9px}
#ironConsole .spk.ob{border-left-color:var(--blood);box-shadow:inset 0 0 0 1px #d8434f55,0 0 22px -10px var(--blood)}
#ironConsole .spk-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
#ironConsole .spk-pips{display:flex;gap:7px}
#ironConsole .spk .pip{width:26px;height:26px;border-radius:50%;border:2px solid var(--line2);background:#100e0d;cursor:pointer;padding:0;position:relative}
#ironConsole .spk .pip::after{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--line2)}
#ironConsole .spk .pip.on{border-color:var(--soul);box-shadow:0 0 12px #c2abff66}
#ironConsole .spk .pip.on::after{background:var(--soul);animation:spkspin 2.2s linear infinite}
#ironConsole .spk.ob .pip.on{border-color:var(--blood);box-shadow:0 0 12px #d8434f88}
#ironConsole .spk.ob .pip.on::after{background:var(--blood);animation-duration:.9s}
@keyframes spkspin{0%{transform:translateX(-3px)}25%{transform:translateY(-3px)}50%{transform:translateX(3px)}75%{transform:translateY(3px)}100%{transform:translateX(-3px)}}
#ironConsole .spk-read{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--dim)}
#ironConsole .spk-read b{color:var(--soul);font-weight:500}
#ironConsole .spk-modes{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0 4px}
#ironConsole .spk-desc{font-size:14.5px;color:var(--dim);margin:6px 0 0}
#ironConsole .spk-note{font-size:13.5px;color:var(--dimmer);font-style:italic;margin:8px 0 0}
#ironConsole .spk-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:9px}
#ironConsole .spk-dent{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--dim);display:flex;align-items:center;gap:6px}
#ironConsole .spk-ob{margin-top:10px;padding:9px 11px;border-radius:9px;background:#d8434f1a;border:1px solid #d8434f66;color:#f0b8bd;font-size:14.5px}
@media(prefers-reduced-motion:reduce){#ironConsole .spk .pip.on::after{animation:none}}

 panes:[{id:"classes",n:"Classes",c:"#d8434f",eb:"Four stacks, thirteen levels",bl:"Extra Attack stacks in this system. Each subclass sits under its class.",html:"<section id=\"monk\">\n    <h2>Monk 10 <span class=\"sub\">J.T.&rsquo;s revised monk, d8 hit die<\/span><\/h2>\n    <div class=\"dl\">\n      <div><dt>Martial arts<\/dt><dd>Fist 1d6 bludgeoning. Elbow 1d8 piercing, ignores temp HP. Knee 1d8 piercing, five feet of knockback. Kick 1d10 bludgeoning, five foot reach, ten more feet of knockback, vulnerable on a miss. The die steps up at 5, 10 and 17.<\/dd><\/div>\n      <div><dt>Ki Surge<\/dt><dd>Double the baseline pool, plus five more at 10, 20, 30, 40 and 50.<\/dd><\/div>\n      <div><dt>Athletic Flow<\/dt><dd>After any successful attack in a chain she can grapple or shove for free, and she can use Acrobatics in place of Athletics for it.<\/dd><\/div>\n      <div><dt>Unarmored Defense<\/dt><dd>10 + Dexterity + Wisdom, which is where the 35 comes from.<\/dd><\/div>\n      <div><dt>Focus<\/dt><dd>Flurry of Blows, Patient Defense and Step of the Wind. At 10 the flurry is three strikes, Patient Defense grants temp HP, and Step of the Wind can carry an ally.<\/dd><\/div>\n      <div><dt>Stillness of Mind<\/dt><dd>Proficiency in every saving throw and resistance to psychic damage.<\/dd><\/div>\n      <div><dt>Deflect Attacks<\/dt><dd>Reaction to cut an attack&rsquo;s damage, and redirect it if the damage reaches zero.<\/dd><\/div>\n      <div><dt>Soul Knives<\/dt><dd>Unarmed strikes deal psychic, piercing, slashing or bludgeoning, her choice on every hit, and a bonus action adds thirty feet of reach until end of turn.<\/dd><\/div>\n      <div><dt>Psychic Slash<\/dt><dd>On any flurry hit that deals psychic: life drain, invoke terror, invoke wrath, astral slide, or synaptic overload.<\/dd><\/div>\n    <\/div>\n  <\/section>\n<section id=\"soulknife\">\n    <h2>Way of the Soul Knife <span class=\"sub\">monk 10 of 20<\/span><\/h2>\n    <p>Assassins and bounty hunters who manifest psionic blades that cut through bodies and auras alike. Their reach extends past combat, because seeing an aura means seeing through a lie.<\/p>\n\n    <div class=\"card\"><h3>Soul Knives <span class=\"tag veil\">3rd &middot; online<\/span><\/h3>\n      <p>Her unarmed strikes deal psychic, piercing, slashing or bludgeoning damage, chosen fresh on every hit.<\/p>\n      <p style=\"margin-top:6px;\">As a bonus action she extends the reach of her unarmed strikes by thirty feet until the end of her turn.<\/p><\/div>\n\n    <div class=\"card\"><h3>Psychic Slash <span class=\"tag veil\">3rd &middot; online<\/span><\/h3>\n      <p>Whenever an attack granted by Flurry of Blows hits and deals psychic damage, she imposes one of these on the target:<\/p>\n      <ul>\n        <li><b>Life Drain.<\/b> She gains temporary hit points equal to half the damage the attack dealt.<\/li>\n        <li><b>Invoke Terror.<\/b> Wisdom save or frightened of her until the end of her next turn.<\/li>\n        <li><b>Invoke Wrath.<\/b> Disadvantage on every attack roll against anyone but her until the end of its next turn.<\/li>\n        <li><b>Astral Slide.<\/b> She teleports the target up to ten feet to a spot she can see.<\/li>\n        <li><b>Synaptic Overload.<\/b> Vulnerable to psychic damage until the end of her next turn.<\/li>\n      <\/ul><\/div>\n\n    <div class=\"card\"><h3>Aura Sight <span class=\"tag gold\">6th &middot; replaced<\/span><\/h3>\n      <p>The printed feature reads auras on a failed Wisdom save, learning shared alignment, current hit points, and attitude toward her or toward something she names, then tracking distance and direction for a day. On her sheet this slot is taken by <b>Ghastly Visages<\/b> instead, which shows her the faces of everyone the target has killed or is haunted by, and those faces speak. Both versions lock her out of a creature that saves until she finishes a long rest.<\/p><\/div>\n\n    <div class=\"card\"><h3>Spectral Blades <span class=\"tag blood\">11th &middot; not yet<\/span><\/h3>\n      <p>The blades phase through cover and armor. Once on her turn she gives up one unarmed strike and instead forces a creature within that attack's reach to make a Dexterity save against her ki DC. Failure deals psychic damage equal to her unarmed strike, success halves it.<\/p><\/div>\n\n    <div class=\"card\"><h3>Psychic Form <span class=\"tag blood\">17th &middot; not yet<\/span><\/h3>\n      <p>Bonus action to turn her body into the same psychic energy her blades are made of, for one minute, once per long rest. Resistance to all damage, a flying speed of thirty feet, and she moves through creatures and objects as though they were difficult terrain, taking 5 force damage if she ends her turn inside something.<\/p><\/div>\n\n    <div class=\"gm\"><b>Where it stacks.<\/b> Psychic Slash triggers on flurry hits that deal psychic, and Soul Knives lets her choose psychic on every strike, so the rider is always available. Blooded Edge under Croqur and Dreadful Strikes from the ranger side both ride the same hits.<\/div>\n  <\/section>\n<section id=\"duskworn\">\n    <h2>Duskworn 11 <span class=\"sub\">the largest stack<\/span><\/h2>\n    <div class=\"dl\">\n      <div><dt>Ruinous Touch<\/dt><dd>A pool of ruin dice, 9d6 at this level, spent as an action to deal necrotic on a touch.<\/dd><\/div>\n      <div><dt>Shadowed Weapon<\/dt><dd>One bonded melee weapon she cannot be disarmed of and can summon to her hand as a bonus action from anywhere on the plane.<\/dd><\/div>\n      <div><dt>Sundering Shadow<\/dt><dd>+3 necrotic on every hit with the bonded weapon, and darkvision out to sixty feet.<\/dd><\/div>\n      <div><dt>Dark Inheritance<\/dt><dd>One of dusk-infused magic, mantle of the wicked, shadow-cursed resilience or vile tenacity. Each of them keys off the Shadow Damage number.<\/dd><\/div>\n      <div><dt>Spellcasting<\/dt><dd>Charisma by the book, Wisdom on her sheet. DC 28, attack +17, slots 2 and 1.<\/dd><\/div>\n      <div><dt>Invoke Malice<\/dt><dd>Twice between rests at this level. Aura of Darkness turns the light around her down, which is also how she sets up an epic boon in one round.<\/dd><\/div>\n      <div><dt>Aura of the Dark Scion<\/dt><dd>Contempt, Despair, Hopelessness or Infirmity, twenty feet at 13th. Despair is the one that matters: every save inside her reach is worse.<\/dd><\/div>\n      <div><dt>Improved Extra Attack and Shadow Knight&rsquo;s Aura<\/dt><dd>A second aura on top of the first, and spells folded into her attack sequence.<\/dd><\/div>\n    <\/div>\n  <\/section>\n<section id=\"mindscourge\">\n    <h2>Mindscourge <span class=\"sub\">duskworn 11 of 20<\/span><\/h2>\n    <p>Dusksworn who carry dark magic and psionics at once, laying waste to bodies and minds together and doing whatever it takes to reach the end of another day.<\/p>\n\n    <div class=\"card\"><h3>Mindwrack <span class=\"tag veil\">3rd &middot; online<\/span><\/h3>\n      <p>All necrotic damage from Ruinous Touch can be converted to psychic whenever she deals it.<\/p>\n      <p style=\"margin-top:6px;\">On top of that, any creature subjected to Ruinous Touch must succeed on an Intelligence save or be stunned until the end of her next turn. Anything with an Intelligence of 4 or lower is unaffected.<\/p><\/div>\n\n    <div class=\"card\"><h3>Invoke Malice: Mindburst <span class=\"tag veil\">3rd &middot; online<\/span><\/h3>\n      <p>Action. A creature she can see or is aware of within ninety feet takes a blast of psychic energy. Intelligence save or it falls unconscious for a minute as its mind is overwhelmed. It wakes early if it takes damage, or if somebody spends an action and beats her spell save DC on a Strength check to shake it awake.<\/p><\/div>\n\n    <div class=\"card\"><h3>Invoke Malice: Stunning Blast <span class=\"tag veil\">3rd &middot; online<\/span><\/h3>\n      <p>On the Attack action she replaces one attack with a fifteen foot cone of psychic energy. Every creature inside makes an Intelligence save or is stunned for a minute, repeating the save at the end of each of its turns.<\/p><\/div>\n\n    <div class=\"card\"><h3>Mindscourge spells <span class=\"tag\">pledge list<\/span><\/h3>\n      <p>Always memorised, and they do not count against her spells known.<\/p>\n      <table style=\"margin-top:8px;\">\n        <tr><th class=\"n\">Level<\/th><th>Spells<\/th><\/tr>\n        <tr><td class=\"n\">3rd<\/td><td>sleep, Tasha's hideous laughter<\/td><\/tr>\n        <tr><td class=\"n\">5th<\/td><td>detect thoughts, mind spike<\/td><\/tr>\n        <tr><td class=\"n\">9th<\/td><td>hypnotic pattern, major image<\/td><\/tr>\n        <tr><td class=\"n\">13th<\/td><td>hallucinatory terrain, Raulothim's psychic lance<\/td><\/tr>\n        <tr><td class=\"n\">17th<\/td><td>synaptic static, telekinesis<\/td><\/tr>\n      <\/table><\/div>\n\n    <div class=\"card\"><h3>Aura of Blanking <span class=\"tag veil\">7th &middot; online<\/span><\/h3>\n      <p>A psychic field that interferes with thought. When a hostile creature within five feet takes a reaction, it makes an Intelligence save or the reaction is wasted doing nothing while its mind lapses and it forgets what it was doing. She has to be conscious for the save to happen at all. The range grows to ten feet at 13th and fifteen at 18th.<\/p><\/div>\n\n    <div class=\"card\"><h3>Tormenting Shadow <span class=\"tag veil\">11th &middot; online<\/span><\/h3>\n      <p>Hitting a creature with her shadowed weapon or using Ruinous Touch on it deals an extra 1d4 psychic and forces an Intelligence save.<\/p>\n      <p style=\"margin-top:6px;\"><b>Failure:<\/b> no reactions until the end of its next turn, and on that turn it picks one of a move, an action or a bonus action and gets only that one.<\/p>\n      <p style=\"margin-top:6px;\"><b>Success:<\/b> none of the above until the start of her next turn, but the extra psychic still lands.<\/p><\/div>\n\n    <div class=\"card\"><h3>Mindstorm <span class=\"tag blood\">15th &middot; not yet<\/span><\/h3>\n      <p>Resistance to psychic damage, and every short rest returns half her ruin dice, never more than she has actually spent.<\/p>\n      <p style=\"margin-top:6px;\">She can also spend two extra ruin dice when Mindwrack fires off Ruinous Touch. Any number of creatures she can see or is aware of within twenty feet must then save against Intelligence or be stunned until the end of her next turn. Intelligence 4 or lower is still immune.<\/p><\/div>\n\n    <div class=\"card\"><h3>Psionic Mastery <span class=\"tag blood\">20th &middot; not yet<\/span><\/h3>\n      <p>Psychic resistance stops applying to her, and immunity only halves her damage instead of stopping it.<\/p>\n      <p style=\"margin-top:6px;\">On the Attack action she can replace an attack with a use of Mindwrack that spends no ruin dice. It deals no damage and cannot be paired with Mindstorm, and she still has to be able to touch the target.<\/p>\n      <p style=\"margin-top:6px;\">At the end of each of her turns, one stunned creature she can see or is aware of within thirty feet makes an Intelligence save or takes 3d10 psychic.<\/p><\/div>\n\n    <div class=\"card\"><h3>Base duskworn milestones still ahead <span class=\"tag gold\">12 to 20<\/span><\/h3>\n      <p>Aura Improvements at 13 and again at 18 widen every aura she has. Blasphemous Aegis at 14 makes her immune to disease and poison, unable to be charmed, and resistant to nonmagical bludgeoning, piercing and slashing. Invoke Malice gains a second option at 13 and a third at 17.<\/p><\/div>\n\n    <div class=\"gm\"><b>Where it stacks.<\/b> Aura of Blanking and the Aura of Despair overlap on the same ten to twenty feet, so anything standing next to her saves at a penalty and risks losing its reaction for trying to do anything about it. Tormenting Shadow choking a turn down to one of three options pairs with Hex of Binding halving movement.<\/div>\n  <\/section>\n<section id=\"rangerjaeger\">\n    <h2>Ranger 3 and Jaeger 2<\/h2>\n    <div class=\"dl\">\n      <div><dt>Ranger 3<\/dt><dd>Three d12 hit dice, a fighting style, and the archetype features at 3rd. The smallest stack and mostly there for the chassis.<\/dd><\/div>\n      <div><dt>Alacrity<\/dt><dd>Proficiency bonus added to initiative, which is most of the +21.<\/dd><\/div>\n      <div><dt>Improved Two-Weapon Fighting<\/dt><dd>Offhand only needs the light property, and she can draw, stow and reload without a free hand.<\/dd><\/div>\n      <div><dt>Slayer&rsquo;s Initiative<\/dt><dd>No action required, lasts until end of turn, and grants a second bonus action. Two uses, half back on a short rest. It also comes free whenever she crits, drops a creature to zero, or rolls an unmodified 20 on initiative.<\/dd><\/div>\n      <div><dt>Lissom<\/dt><dd>Shove or Disengage as bonus actions, and she can shove with Acrobatics.<\/dd><\/div>\n    <\/div>\n    <div class=\"gm\"><b>Where the stack is going.<\/b> Eleven more levels to character level 24 and proficiency 8, adding Jaeger 13 for Ordo Luna and Sword Saint 14 for the Way of the Grim Passenger. Roughly sixteen attacks a round at that point, since the Attack action, a Dragon Surge action and two flurries all stack. Ki and Sword Saint focus share one pool.<\/div>\n  <\/section>\n<section id=\"feywanderer\">\n    <h2>Fey Wanderer <span class=\"sub\">ranger 3 of 20<\/span><\/h2>\n    <p>A fey mystique from an archfey's boon, fruit off a talking tree, a magic spring, or some other auspicious accident. A ranger who stands for the mortal and the fey realms at once, whose laughter lifts the downtrodden and whose fury is dreadful, because great is the mirth of the fey.<\/p>\n\n    <div class=\"card\"><h3>Dreadful Strikes <span class=\"tag veil\">3rd &middot; online<\/span><\/h3>\n      <p>Mind-scarring magic out of the murky hollows of the Feywild, laid over her weapon. When she hits a creature with a weapon she can deal an extra 1d4 psychic, and any one creature can only take that extra damage once a turn. It rises to 1d6 at 11th level.<\/p><\/div>\n\n    <div class=\"card\"><h3>Otherworldly Glamour <span class=\"tag veil\">3rd &middot; online<\/span><\/h3>\n      <p>She adds her Wisdom modifier, minimum one, to every Charisma check she makes, and gains proficiency in one of Deception, Performance or Persuasion. At Wisdom 34 that is +12 on top of her Charisma, which is why her Deception, Intimidation, Performance and Persuasion all sit far above her ability score.<\/p><\/div>\n\n    <div class=\"card\"><h3>Fey Wanderer Magic <span class=\"tag\">3rd &middot; online<\/span><\/h3>\n      <p>One spell at each listed level, always prepared and not counted against her prepared total.<\/p>\n      <table style=\"margin-top:8px;\">\n        <tr><th class=\"n\">Level<\/th><th>Spell<\/th><\/tr>\n        <tr><td class=\"n\">3rd<\/td><td>charm person<\/td><\/tr>\n        <tr><td class=\"n\">5th<\/td><td>misty step<\/td><\/tr>\n        <tr><td class=\"n\">9th<\/td><td>dispel magic<\/td><\/tr>\n        <tr><td class=\"n\">13th<\/td><td>dimension door<\/td><\/tr>\n        <tr><td class=\"n\">17th<\/td><td>mislead<\/td><\/tr>\n      <\/table><\/div>\n\n    <div class=\"card\"><h3>Beguiling Twist <span class=\"tag blood\">7th &middot; not yet<\/span><\/h3>\n      <p>Advantage on every saving throw against being charmed or frightened.<\/p>\n      <p style=\"margin-top:6px;\">On top of that, whenever she or a creature she can see within 120 feet succeeds on a save against being charmed or frightened, she can spend a reaction to force another creature she can see within that range to make a Wisdom save against her spell save DC. Failure means charmed or frightened, her choice, for one minute, with a save at the end of each of its turns.<\/p><\/div>\n\n    <div class=\"card\"><h3>Fey Reinforcements <span class=\"tag blood\">11th &middot; not yet<\/span><\/h3>\n      <p>Summon fey is always prepared and does not count against her prepared spells. She can cast it once without a spell slot and without the material component, and gets that use back on a long rest.<\/p>\n      <p style=\"margin-top:6px;\">Whenever she casts it with a slot, she can choose to drop concentration entirely, and the spirit lasts one minute instead.<\/p><\/div>\n\n    <div class=\"card\"><h3>Misty Wanderer <span class=\"tag blood\">15th &middot; not yet<\/span><\/h3>\n      <p>She can cast misty step without a spell slot a number of times equal to her Wisdom modifier, all of them back on a long rest. Each casting can bring one willing creature within five feet along, dropping them in an unoccupied space within five feet of where she lands.<\/p><\/div>\n\n    <div class=\"gm\"><b>Where it stacks.<\/b> Dreadful Strikes is once per turn per creature rather than once per turn, so with her attack count it pays out across a crowd. Beguiling Twist redirects a failed charm or fear onto a second target, which is the same shape as the Mark spreading under Croqur's ascension: hit one, land on another.<\/div>\n  <\/section>"},
        {id:"lore",n:"Lore",c:"#887672",eb:"What the world says",bl:"Witches, the trials, and effacement.",html:"<section id=\"lore\">\n    <h2>What the world says about witches<\/h2>\n    <p>Witches are older than the witches of Msiona, derived from the fae. Their power runs on hexes closer to ruin than to spellcraft, their potions are greater elixirs, and they were said to control mana the way dragons do. After the ancient species were driven out and the dragons dispelled, the gods held the Greater Atlas, and the gap between mana and divinity widened until mana itself read as a disgrace. The trials followed, and the world executed mana users at scale for fear that magic would outrun the gods. The gods did not stop their followers. Witches disappeared into rumour, and their reappearance is always singular: one at a time, and nobody agrees where the power comes from.<\/p>\n    <div class=\"gm\"><b>Effacement.<\/b> Western Arcadia, the Pale March, punishes by erasure: every record cut, the pages removed from the Atlas of Names.<\/div>\n  <\/section>"}],

function spClone(o){return JSON.parse(JSON.stringify(o));}
function spNum(v,d){v=parseFloat(v);return isNaN(v)?(d||0):v;}
function spUid(){return "sp"+Math.random().toString(36).slice(2,9);}
function spStrip(d){d=spClone(d);delete d.pairDef;delete d.nextDef;return d;}
function spEmbed(def,findDef){var d=spStrip(def);
 if(def.pair&&findDef){var p=findDef(def.pair);if(p)d.pairDef=spStrip(p);}
 if(def.next&&findDef){var n=findDef(def.next.to);if(n)d.nextDef=spEmbed(n,findDef);}
 return d;}
function spMake(def,o,findDef){o=o||{};var d=def.pairDef||def.nextDef?spClone(def):spEmbed(def,findDef);
 var x={id:spUid(),k:d.k,n:d.n,fam:d.fam,cat:d.cat,t:d.t||1,stacks:Math.max(1,spNum(o.stacks,1)),rounds:spNum(o.rounds,d.rounds||0),
  m:spClone(d.m||{}),pct:spClone(d.pct||{}),note:o.note||"",sp:true,dm:true,def:d,cap:o.cap!=null&&o.cap!==""?spNum(o.cap):spNum(d.cap),
  perm:spClone(o.perm||d.perm||{}),ap:true,hold:0,ti:-1,ctr:d.counter?spNum(d.counter.start):0,ctrAlt:null,frz:false,owner:d.owner||""};
 return x;}
function spTierIdx(x){var T=(x.def||{}).tiers;if(!T)return -1;var i=-1;T.forEach(function(t,j){if(x.stacks>=t.at)i=j;});return i;}
function spSync(x,list,log){var d=x.def;if(!d)return false;var changed=false,cap=spNum(x.cap);
 if(cap>0&&x.stacks>cap){x.stacks=cap;changed=true;}
 if(d.tiers){var i=spTierIdx(x);if(i<0)i=0;
  if(i!==x.ti){var prev=x.ti,T=d.tiers[i],m=spClone(d.m||{});for(var k in T.m)m[k]=T.m[k];
   x.ti=i;x.n=T.n;x.t=T.t;x.m=m;changed=true;
   if(prev>=0&&log)log((d.n||x.fam)+": "+T.n+" (Tier "+["","I","II","III","IV"][T.t]+")");
   if(d.hold&&i===d.tiers.length-1&&prev<i)x.hold=d.hold;}}
 if(d.next&&d.nextDef&&x.stacks>=d.next.at&&!list.some(function(y){return y.k===d.next.to;})){
  var nx=spMake(d.nextDef,{perm:d.nextDef.perm},null);nx.dm=x.dm;list.push(nx);changed=true;if(log)log(x.n+" → "+nx.n);}
 return changed;}
function spSwap(x){var d=x.def;if(!d||!d.pairDef)return false;var nd=spClone(d.pairDef);nd.pairDef=spStrip(d);
 var t=x.ctr;x.ctr=x.ctrAlt!=null?x.ctrAlt:(nd.counter?spNum(nd.counter.start):0);x.ctrAlt=t;
 x.k=nd.k;x.n=nd.n;x.fam=nd.fam;x.cat=nd.cat;x.t=nd.t||1;x.m=spClone(nd.m||{});x.rounds=nd.rounds||0;x.def=nd;x.ti=-1;return true;}
/* end-of-round bookkeeping for one special; returns "remove" when it should drop off */
function spTick(x,parts){var d=x.def||{};
 if(d.decay&&!x.frz&&!x.ap){if(x.hold>0){x.hold--;}else{x.stacks--;parts.push(x.n+" decays to "+x.stacks);if(x.stacks<=0){parts.push(x.n+" faded");x.ap=false;return "remove";}}}
 x.ap=false;return "";}

  if(!rv||(rv==="_custom"&&!nm.trim())){flash("Pick an ally from Relationships or type a name");return false;}

  it.hit=sd?hitFromSeed(sd,{}):{stat:it.hitStat||"",prof:it.hitProf==null?null:!!it.hitProf,bonuses:num(it.hitItem)?[{n:"Item",v:num(it.hitItem)}]:[],adj:num(it.hitAdj)};}

function hitClassStat(){var cl=(S.classes||[]).map(function(c){return String(c.name||"").toLowerCase();}).join(" | ");

 if(C.hooks&&C.hooks.absorb&&n>0){var b=C.hooks.absorb(n,api,parts);if(typeof b==="number")n=b;}

function itemById(id){for(var i=0;i<S.items.length;i++)if(S.items[i].id===id)return S.items[i];return null;}
function splitOne(it){if(num(it.qty,1)<=1)return it;it.qty=num(it.qty)-1;var n=mkItem(clone(it));n.id=uid("i");n.qty=1;S.items.push(n);return n;}
function toStorage(it){if(!it)return;var same=S.items.filter(function(x){return x!==it&&x.loc==="storage"&&x.name===it.name&&x.cat===it.cat&&(x.cat==="consumable"||x.cat==="material"||x.cat==="resource");})[0];
 if(same){same.qty=num(same.qty,1)+num(it.qty,1);S.items.splice(S.items.indexOf(it),1);}else it.loc="storage";}
function equip(id,slot){var it=itemById(id);if(!it)return;var cat=it.cat;
 if(!slot){slot=SLOTS.filter(function(s){return s[2]===cat&&!slotItem(s[0]);}).map(function(s){return s[0];})[0]||SLOTS.filter(function(s){return s[2]===cat;}).map(function(s){return s[0];})[0];}
 if(!slot||SLOTCAT[slot]!==cat){flash("No "+(CATN[cat]||cat)+" slot for that item");return;}
 it=splitOne(it);
 if(it.twoSlot){slot="w1";["w1","w2"].forEach(function(k){var o=slotItem(k);if(o&&o!==it)toStorage(o);});}
 else{var o=slotItem(slot);if(o&&o!==it)toStorage(o);if(slot==="w2"){var w=slotItem("w1");if(w&&w.twoSlot)toStorage(w);}}
 it.loc=slot;logline("Equipped "+it.name);}
function toItemSlot(id){var it=itemById(id),d=compute();if(!it)return;
 for(var i=0;i<d.itemSlots;i++){if(!S.items.some(function(x){return x.loc==="is"+i;})){var one=num(it.qty,1)>1?splitOne(it):it;one.loc="is"+i;logline("Slotted "+one.name);return;}}
 flash("Item slots are full");}

var COIN={cp:1,sp:10,gp:100,pp:1000},CDESC=["pp","gp","sp","cp"];
function parseCoins(t){var o={cp:0,sp:0,gp:0,pp:0},m,re=/(\d+(?:\.\d+)?)\s*(pp|gp|sp|cp)\b/gi,any=false;t=String(t||"");
 while((m=re.exec(t))){o[m[2].toLowerCase()]+=+m[1];any=true;}
 if(!any&&/^\s*\d+(\.\d+)?\s*$/.test(t)){o.gp=+t;any=true;}return any?o:null;}
function coinsCp(o){return Math.round(CDESC.reduce(function(a,k){return a+num(o[k])*COIN[k];},0));}
function fmtCoins(cp){cp=Math.round(cp);var neg=cp<0,p=[];cp=Math.abs(cp);CDESC.forEach(function(k){var n=Math.floor(cp/COIN[k]);cp-=n*COIN[k];if(n)p.push(n+" "+k);});return (neg?"−":"")+(p.join(" ")||"0 gp");}
/* Spend: pay in the entry's own coins first, then any coins that fit, then break the smallest larger coin and take change. */
function spendCoins(o){var W=S.wealth,need=coinsCp(o);if(need<=0)return true;var had=coinsCp(W)>=need;
 CDESC.filter(function(k){return num(o[k])>0;}).forEach(function(k){var u=Math.min(Math.max(0,num(W[k])),Math.floor(need/COIN[k]));W[k]=num(W[k])-u;need-=u*COIN[k];});
 CDESC.forEach(function(k){var u=Math.min(Math.max(0,num(W[k])),Math.floor(need/COIN[k]));W[k]=num(W[k])-u;need-=u*COIN[k];});
 if(need>0){for(var i=CDESC.length-1;i>=0;i--){var k=CDESC[i];if(num(W[k])>0&&COIN[k]>need){W[k]=num(W[k])-1;var ch=COIN[k]-need;need=0;
   CDESC.forEach(function(c){if(COIN[c]<COIN[k]){var n=Math.floor(ch/COIN[c]);W[c]=num(W[c])+n;ch-=n*COIN[c];}});break;}}}
 if(need>0){var pk=CDESC.filter(function(k){return num(o[k])>0;})[0]||"gp";W[pk]=num(W[pk])-Math.ceil(need/COIN[pk]);var over=Math.ceil(need/COIN[pk])*COIN[pk]-need;if(over)W.cp=num(W.cp)+over;}
 normDebt();return had;}
function normDebt(){var t=coinsCp(S.wealth);if(t>=0)return;t=-t;CDESC.forEach(function(k){var n=Math.floor(t/COIN[k]);S.wealth[k]=n?-n:0;t-=n*COIN[k];});}
function gainCoins(o){var W=S.wealth;if(coinsCp(W)<0){var t=coinsCp(W)+coinsCp(o);CDESC.forEach(function(k){W[k]=0;});if(t<0){W.cp=t;normDebt();}else{CDESC.forEach(function(k){var n=Math.floor(t/COIN[k]);W[k]=n;t-=n*COIN[k];});}return;}CDESC.forEach(function(k){if(num(o[k]))W[k]=num(W[k])+num(o[k]);});}
